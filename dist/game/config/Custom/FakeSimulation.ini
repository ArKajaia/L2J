# ---------------------------------------------------------------------------
# Fake player party-vs-party simulations
# ---------------------------------------------------------------------------
# A testing and debugging tool for the fake player AI. An admin saves spawn
# points (//SetSimulationPoint 1, //SetSimulationPoint 2...), then
# //Simulate <size 1-9> spawns one balanced party of fake players at every
# point, and the parties fight until one team is left (or the time limit).
# //JoinParty <team> puts the admin in a team in place of one fake player.
# Every run writes a detailed log (events, AI decisions, positions, anomalies
# and a summary) to SimulationLogDir. See docs/fake-player-ai-plan.md, section
# 10, and //SimulationHelp in game.
# Requires EnableFakePlayers = True in FakePlayers.ini and FakePvpEnabled =
# True in FakePlayerPvp.ini.

# How long a run may last, in seconds. At the limit the team with the most
# HP and CP left wins ("timeout").
# Default: 300
SimulationTimeLimit = 300

# Seconds after the spawn before the teams march: supports buff, everyone
# puts up its buffs and toggles, necromancers summon.
# Default: 10
SimulationPrepTime = 10

# Seconds the bodies stay after a run ends, before they are removed.
# Default: 10
SimulationCleanupDelay = 10

# Milliseconds between two position snapshots (and anomaly checks).
# Default: 500
SimulationPositionInterval = 500

# An AI decision that doesn't change is written again every this many
# milliseconds (a change is always written).
# Default: 2000
SimulationDecisionHeartbeat = 2000

# A fake player of a run engages an enemy it sees within this range.
# Default: 1200
SimulationSightRange = 1200

# The members of a team appear within this distance of their point.
# Default: 120
SimulationSpawnRadius = 120

# //Simulate warns about monsters and players this close to a point.
# Default: 1500
SimulationCrowdWarningRange = 1500

# Where the run folders go, relative to the game server folder.
# Default: log/simulation
SimulationLogDir = log/simulation

# Only the newest run folders are kept.
# Default: 50
SimulationKeepRuns = 50

# When no fake player hurt another team's for this many seconds during the
# fight (the teams stand apart: a tank holding by its backline, the others
# following it), everyone is sent at its closest enemy. 0 turns it off.
# Default: 20
SimulationStandstillTime = 20

# When every living fake player of a team runs away and is at least this far
# from the closest enemy, the team is routed: once all teams but one are, the
# round ends and that one wins ("rout"). 0 turns it off.
# Default: 1500
SimulationRoutDistance = 1500

# Lets anyone who can reach the web page (//SimulationWeb, served on
# PassiveTreeWebPort) see, start and stop simulations without a GM's link.
# For a test server only: the port is open to whoever can reach it.
# Drawing the points in game still needs a GM's link.
# Default: False
SimulationWebOpenAccess = False

# Class matrix (//SimulationMatrix): only the newest this many finished
# battles keep their log folder (battles/ in the matrix folder, about 0.7 MB
# each); results.csv always has every battle. 0 keeps none.
# Default: 300
SimulationMatrixKeepLogs = 300
