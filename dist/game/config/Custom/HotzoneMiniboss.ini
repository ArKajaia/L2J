# =============================================================
# Hotzone Miniboss
# =============================================================
# Once this many monsters die inside the same Hotzone (see the Hotzone
# rotation system), a buffed clone of whichever monster type died LAST
# spawns on the spot as a miniboss: tough, but meant to be killable by
# about 2 players - not a full raid.

# Enable/disable the whole feature.
HotzoneMinibossEnabled = True

# Kills required inside one hotzone before a miniboss spawns there.
# The counter resets to 0 every time a miniboss spawns.
HotzoneMinibossKillsRequired = 100

# Applied identically to Max HP, P.Atk, M.Atk, P.Def and M.Def, so the
# fight stays a straightforward "hits harder, tanks more" encounter
# instead of one stat spiking out of proportion with the others.
# Tune this against your own 2-player DPS/survivability baseline.
HotzoneMinibossStatMultiplier = 6.0

# Multiplies the miniboss's XP/SP reward on top of your normal rates.
HotzoneMinibossXpSpMultiplier = 10.0

# Multiplies the miniboss's drop chance/amount on top of your normal rates.
HotzoneMinibossDropMultiplier = 10.0

# Prefix shown in the miniboss's name plate.
HotzoneMinibossTitleTag = [Hotzone Menace]
