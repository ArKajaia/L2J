# =============================================================
# Treasure Chests
# =============================================================
# Retail-like treasure chests. Every treasure chest spawn point holds
# one real chest (NPC 18265-18286) and one mimic (NPC 21801-21822).
#
#  - Real chests are shown with the mimic's model, so the two look
#    exactly the same (no more fire around the real one).
#  - Hitting a real chest makes it vanish (no reward). It respawns on
#    its normal respawn timer.
#  - Trying to open a mimic with a key (Deluxe Chest Key, Box Key,
#    Unlock, ...) makes it attack you. Mimics can still be killed for
#    their normal drops.
#  - Hitting a mimic curses you with 5 random debuffs (never cancel).
#  - Opening a real chest with a key gives crafting materials from one
#    of three tiers (Common / Rare / Epic).
#
# Set to False to go back to the old behaviour (real chests keep their
# own look, fight back when hit, and any key opens any chest).
TreasureChestEnabled = True

# Keep the retail key level rule: the key only works on a chest within
# 6 levels of the player (5 levels from level 78 upwards). It is checked
# before the mimic check, so a failed key does not tell real chests and
# mimics apart.
TreasureChestLevelCheck = True

# Send chat messages when a chest vanishes, a mimic wakes up, or a chest
# is opened.
TreasureChestMessages = True

# -------------------------------------------------------------
# Rewards
# -------------------------------------------------------------
# Chance (%) of each reward tier when a real chest is opened. They are
# relative weights, so they don't have to add up to 100.
TreasureChestCommonChance = 70
TreasureChestRareChance = 20
TreasureChestEpicChance = 10

# Materials for each tier, as itemId,min,max separated by ";".
# Every opening picks a random number of different materials from the
# tier's list (between MinItems and MaxItems), each with an equal chance.

# Common: basic materials.
# Stem, Varnish, Suede, Animal Skin, Thread, Iron Ore, Coal, Charcoal,
# Animal Bone, Silver Nugget
TreasureChestCommonMaterials = 1864,10,30;1865,10,30;1866,10,30;1867,10,30;1868,10,30;1869,10,30;1870,10,30;1871,10,30;1872,10,30;1873,5,15
TreasureChestCommonMinItems = 2
TreasureChestCommonMaxItems = 3

# Rare: crafted materials and ores.
# Braided Hemp, Cokes, Steel, Coarse Bone Powder, Leather, Steel Mold,
# Cord, High-Grade Suede, Silver Mold, Varnish of Purity,
# Oriharukon Ore, Stone of Purity, Mithril Ore, Adamantite Nugget
TreasureChestRareMaterials = 1878,3,8;1879,3,8;1880,3,8;1881,3,8;1882,3,8;1883,3,8;1884,3,8;1885,3,8;1886,3,8;1887,3,8;1874,2,5;1875,2,5;1876,2,5;1877,2,5
TreasureChestRareMinItems = 2
TreasureChestRareMaxItems = 3

# Epic: advanced and key materials.
# Synthetic Cokes, Compound Braid, Mithril Alloy, Artisan's Frame,
# Blacksmith's Frame, Oriharukon, Crafted Leather, Metallic Fiber,
# Mold Glue, Mold Lubricant, Mold Hardener, Enria, Asofe, Thons,
# Metallic Thread, Durable Metal Plate
TreasureChestEpicMaterials = 1888,1,3;1889,1,3;1890,1,3;1891,1,3;1892,1,3;1893,1,3;1894,1,3;1895,1,3;4039,1,2;4040,1,2;4041,1,2;4042,1,2;4043,1,2;4044,1,2;5549,1,2;5550,1,2
TreasureChestEpicMinItems = 2
TreasureChestEpicMaxItems = 3

# -------------------------------------------------------------
# Mimic curse
# -------------------------------------------------------------
# A player who hits a mimic is cursed with random debuffs from the list
# below. It happens once per player per mimic spawn (the first hit), so
# the debuffs don't stack up on every attack.
MimicDebuffEnabled = True

# How many different debuffs the curse puts on the player.
MimicDebuffCount = 5

# Also curse a player who tries to open a mimic with a key.
MimicDebuffOnKey = True

# The debuffs always land (ignoring the normal resist roll). Players with
# debuff immunity or invulnerability are still safe.
# Set to False to use the normal debuff land rate for each skill.
MimicDebuffIgnoreResist = True

# Skill ids to pick the debuffs from (each one is picked at most once).
# The skill level follows the mimic's level. Cancel / dispel skills are
# always skipped, even if listed here.
# Keep one skill per effect type (one poison, one hold, ...) - two skills
# of the same type overwrite each other, so the player would end up with
# fewer debuffs.
# 4182 Poison, 4188 Bleed, 4183 Decrease P. Atk., 4184 Decrease Atk. Spd.,
# 4187 Decrease Speed, 4190 Decrease MP (MP drain over time),
# 4054 Decrease P. Def., 4119 Decrease Accuracy, 4098 Silence, 4186 Hold,
# 4185 Sleep, 4189 Paralysis, 4208 Stun
MimicDebuffSkills = 4182,4188,4183,4184,4187,4190,4054,4119,4098,4186,4185,4189,4208
