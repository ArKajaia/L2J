# =============================================================
# Dynamic Quests
# =============================================================
# Procedurally generated quests built from data/DynamicQuests.xml:
# bounties, caravans, kidnappings, requests from the townsfolk,
# outbreaks, monster nests... Every quest is rolled for the party
# that takes it: its monsters, places, counts and rewards follow
# the party's level and size and the difficulty chosen.
#
# Quests are offered by the Notice Board in every town (next to
# the gatekeeper), on the Community Board (_bbsquests), with .quests,
# and by heralds who find players in the world.

# Enable/disable the whole feature.
EnableDynamicQuests = True

# Minimum character level to take a dynamic quest.
DynamicQuestMinLevel = 10

# Server hour (0-23) at which the daily board is rolled again.
DynamicQuestBoardResetHour = 6

# Board offers per town every day (1-12). Each account can take each offer once a day.
DynamicQuestBoardOffers = 5

# Requests (blacksmith, townsfolk, courier) per town every day (0-8).
DynamicQuestRequestOffers = 3

# Dynamic quests a character can have running at the same time.
DynamicQuestMaxActive = 3

# Dynamic quests an account can complete per day (all characters together).
DynamicQuestAccountDailyLimit = 15

# Each repeat of the same quest on the same day pays this many percent less,
# down to DynamicQuestMinRepeatPercent of the full reward.
DynamicQuestRepeatPenaltyPercent = 25
DynamicQuestMinRepeatPercent = 50

# Party members more than this many levels above the quest's level get a
# smaller share, and nothing at twice the gap. Members further apart than
# this from the party's average level don't count for the quest's level.
DynamicQuestMaxLevelGap = 5

# Kills of world monsters only count when the monster is at most this many
# levels below the quest's level (no grey-monster farming).
DynamicQuestKillLevelGap = 8

# Party members within this range of the quest's owner take part.
DynamicQuestPartyRange = 1500

# A party member must have been within range for this share of the quest
# (percent) to be rewarded.
DynamicQuestMinPresencePercent = 40

# Only one character per computer (hardware id, else IP) is rewarded in a party.
DynamicQuestOneRewardPerComputer = True

# Cap on the product of all reward multipliers (difficulty, optional
# objectives, follow-up chain).
DynamicQuestMaxRewardMultiplier = 2.5

# Rates of the EXP and adena dynamic quests pay, multiplying what the quest's
# reward in data/DynamicQuests.xml gives (EXP as a share of the quest level's
# EXP, adena per level). SP follows the quest's EXP before this rate.
# Items in reward tables are not affected.
# Default: 1
DynamicQuestExpRate = 10
DynamicQuestAdenaRate = 4

# Reward bonus per optional objective done, and per link of a follow-up chain (percent).
DynamicQuestOptionalBonusPercent = 30
DynamicQuestChainBonusPercent = 20

# Seconds between two rolls of the world-event director (TIMER and
# WORLD_STATE triggers, heralds).
DynamicQuestEventInterval = 300

# Seconds a herald waits next to a player before leaving.
DynamicQuestHeraldWaitTime = 120

# Seconds before a herald may visit the same player again after an offer.
DynamicQuestOfferRetryDelay = 1800

# Seconds over which kills in an area are counted for WORLD_STATE triggers.
DynamicQuestAreaKillWindow = 900

# Players within this range of a world event (Outbreak) are told about it.
DynamicQuestWorldEventRange = 3000

# Announce world events (outbreaks) and their outcome to the whole server.
DynamicQuestAnnounceWorldEvents = True

# Spawn a Notice Board next to the gatekeeper of every town listed in data/DynamicQuests.xml.
DynamicQuestNoticeBoards = True

# Log starts, completions and failures.
DynamicQuestLogging = True
