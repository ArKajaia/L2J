# ---------------------------------------------------------------------------
# PvP Combat Log
# ---------------------------------------------------------------------------
# While a player is in a PvP fight (hit by, or hitting, a player, a summon or a
# fake player), the fight is logged: every hit with its skill, CP/HP damage and
# crits, evaded attacks, resisted and landed debuffs, cancelled buffs, heals, and
# the damage the player dealt. When the player dies in that fight, the log is
# shown: who killed them and how, the attackers, the skills that hurt the most,
# the debuffs on them, and a timeline of the last seconds.
# ".combatlog" (or ".deathlog") opens the log of the last PvP death again.
#
# Nothing is kept for players who are not in a PvP fight, and nothing is built
# until the player dies.
# ---------------------------------------------------------------------------

# Enable the combat log.
# Default: True
CombatLogEnabled = True

# A fight is over when there has been no PvP for this many seconds; the next
# PvP hit starts a new log.
# Default: 30
CombatLogFightSeconds = 30

# How many events the timeline keeps (the oldest are dropped, the totals still
# count them) (10-100).
# Default: 60
CombatLogTimelineSize = 60

# Also put the damage the player dealt, and their missed attacks, in the timeline.
# They are always counted in the totals.
# Default: True
CombatLogTimelineOwnHits = True

# Open the log window when the player dies in a PvP fight.
# Default: True
CombatLogShowOnDeath = True

# Tell the player in chat who killed them and how, when they die in a PvP fight.
# Default: True
CombatLogChatSummary = True

# ---------------------------------------------------------------------------
# Raid Log
# ---------------------------------------------------------------------------
# While players fight a raid boss or a grand boss, what each of them does is
# logged: damage to the boss and its minions (summons included), hits, crits,
# misses, skills, heals, debuffs landed and resisted, damage taken and deaths.
# When the boss dies, everyone who took part gets the ranking: the top damage,
# their own rank and share, the healers and tanks, the parties, and their own
# skills. ".raidlog" opens the last one again.
# ---------------------------------------------------------------------------

# Enable the raid log.
# Default: True
RaidLogEnabled = True

# A fight is forgotten when nothing has happened to the boss for this many
# minutes (the boss went back home, everyone died...); the next hit starts a new
# one.
# Default: 5
RaidLogIdleMinutes = 5

# Open the log window for everyone who took part when the boss dies.
# Default: True
RaidLogShowOnKill = True

# Tell everyone who took part, in chat, their damage, share and rank, and the top 3.
# Default: True
RaidLogChatSummary = True

# ---------------------------------------------------------------------------
# Combat block of the damage messages
# ---------------------------------------------------------------------------
# The damage system messages ("$c1 has done $s3 points of damage to $c2.",
# "$c1 has received $s3 damage from $c2.", missed, evaded, blocked...) carry a
# small block after their params: the attacker's and the target's object ids,
# the skill, normal attack or skill, the attacker's weapon type and the crit,
# shot, shield and over-hit flags. The custom client's combat log window reads
# it (client/CombatLog/PROTOCOL.txt). Turn it off for clients that do not.
# ---------------------------------------------------------------------------

# Append the combat block to the damage messages.
# Default: True
CombatLogPacketExtension = True
