# ---------------------------------------------------------------------------
# PvP Combat Log
# ---------------------------------------------------------------------------
# While a player is in a PvP fight (hit by, or hitting, a player, a summon or a
# fake player), the fight is logged: every hit with its skill, CP/HP damage and
# crits, evaded attacks, resisted and landed debuffs, cancelled buffs, heals, and
# the damage the player dealt. When the player dies in that fight, the log is
# shown: who killed them and how, the attackers, the skills that hurt the most,
# the debuffs on them, and a timeline of the last seconds.
# ".combatlog" (or ".deathlog") opens the log of the last PvP death again.
#
# Nothing is kept for players who are not in a PvP fight, and nothing is built
# until the player dies.
# ---------------------------------------------------------------------------

# Enable the combat log.
# Default: True
CombatLogEnabled = True

# A fight is over when there has been no PvP for this many seconds; the next
# PvP hit starts a new log.
# Default: 30
CombatLogFightSeconds = 30

# How many events the timeline keeps (the oldest are dropped, the totals still
# count them) (10-100).
# Default: 60
CombatLogTimelineSize = 60

# Also put the damage the player dealt, and their missed attacks, in the timeline.
# They are always counted in the totals.
# Default: True
CombatLogTimelineOwnHits = True

# Open the log window when the player dies in a PvP fight.
# Default: True
CombatLogShowOnDeath = True

# Tell the player in chat who killed them and how, when they die in a PvP fight.
# Default: True
CombatLogChatSummary = True
