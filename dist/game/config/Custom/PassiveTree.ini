# =============================================================
# Passive Tree
# =============================================================
# Path-of-Exile-style node graph on top of class progression.
# Nodes live in data/passivetree/*.xml; the skills that ACTIVE_SKILL
# nodes grant live in data/stats/skills/PassiveTreeActives.xml.

# Enable/disable the whole feature. When disabled nobody earns points.
PassiveTreeEnabled = True

# First level that earns a point. A character earns one point per level
# from here on. A subclass earns from level 40 (or from this level, if it
# is higher), since subclasses start at level 40.
PassiveTreeStartLevel = 2

# Most points a character can earn in total.
PassiveTreeMaxPoints = 150

# False: the base class and all subclasses share one allocation, and the
# points each of them earns add up.
# True: every class slot has its own allocation and earns its own points.
# Changing this does not move existing allocations between slots.
PassiveTreeSeparateSubclassPoints = False

# Most the tree can add to each base stat (STR, DEX, CON, INT, WIT, MEN),
# however many points are spent on it. The planner shows a total that has
# reached it in red with "(Capped)". -1 = no cap.
PassiveTreeBaseStatCap = 10

# Share of the tree's bonuses a player keeps while in a combat transformation
# (transformation scrolls and sealbooks). Class passives still apply in full,
# as in retail. Keystone drawbacks are never reduced. Cursed weapon, Kamael
# mode change, flying and riding forms keep the whole tree.
# 1.0 = full tree, 0 = no tree bonuses while transformed.
PassiveTreeTransformRate = 0.5

# -------------------------------------------------------------
# Stat caps
# -------------------------------------------------------------
# Most the tree can add to each effect, however many points are spent on
# it. Only bonuses are capped; keystone drawbacks (negative values) always
# apply in full. A conditional bonus such as PDEF_PCT@HEAVY counts against
# the cap of its base key. The planner shows a total that has reached its
# cap in red with "(Capped)".
# -1 = no cap. Any other effect key from data/passivetree/*.xml can be
# capped by adding its own PassiveTreeCap.<KEY> line. The base stats use
# PassiveTreeBaseStatCap above.

# Offense
PassiveTreeCap.CRIT_DMG_PCT = 100
# Critical rate is on the 1000 scale: 150 = +15% critical rate.
PassiveTreeCap.CRIT_RATE_ADD = 300
PassiveTreeCap.MCRIT_DMG_PCT = 100
PassiveTreeCap.ACCURACY_ADD = 50
PassiveTreeCap.BLOW_RATE_PCT = 50
PassiveTreeCap.PHYS_SKILL_POWER_PCT = 50
PassiveTreeCap.PVE_PDMG_PCT = 100
PassiveTreeCap.PVE_MDMG_PCT = 100
PassiveTreeCap.PVE_BOW_DMG_PCT = 100
PassiveTreeCap.LIFESTEAL_PCT = 12
PassiveTreeCap.MANA_LEECH_PCT = 12

# Defense
PassiveTreeCap.EVASION_ADD = 20
PassiveTreeCap.SHIELD_RATE_PCT = 50
PassiveTreeCap.REFLECT_PCT = 50
PassiveTreeCap.SKILL_DODGE_PCT = 20
PassiveTreeCap.MAGIC_REFLECT_PCT = 20
PassiveTreeCap.SKILL_REFLECT_PCT = 20
PassiveTreeCap.HEALING_RECEIVED_PCT = 100
PassiveTreeCap.CRIT_DMG_TAKEN_RED_PCT = 50
PassiveTreeCap.INTERRUPT_RES_PCT = 50
PassiveTreeCap.DEBUFF_RES_PCT = 50

# Cooldowns and MP cost
PassiveTreeCap.SKILL_CDR_PCT = 30
PassiveTreeCap.SPELL_CDR_PCT = 30
PassiveTreeCap.SPELL_MP_COST_RED_PCT = 100

# Keystones
PassiveTreeCap.SERVITOR_SHARE_PCT = 50
PassiveTreeCap.SHIELD_RATE_MUL_PCT = 50
PassiveTreeCap.MAXHP_PCT = 100

# Utility
PassiveTreeCap.INVENTORY_SLOTS_ADD = 100
PassiveTreeCap.WEIGHT_LIMIT_PCT = 100
PassiveTreeCap.EXP_RATE_PCT = 100
PassiveTreeCap.SP_RATE_PCT = 100
# Attribute attack / defence (a weapon attribute stone adds 5, an armour one 6; weapons cap at 300).
PassiveTreeCap.FIRE_ATK = 150
PassiveTreeCap.WATER_ATK = 150
PassiveTreeCap.WIND_ATK = 150
PassiveTreeCap.EARTH_ATK = 150
PassiveTreeCap.HOLY_ATK = 150
PassiveTreeCap.DARK_ATK = 150
PassiveTreeCap.FIRE_RES = 150
PassiveTreeCap.WATER_RES = 150
PassiveTreeCap.WIND_RES = 150
PassiveTreeCap.EARTH_RES = 150
PassiveTreeCap.HOLY_RES = 150
PassiveTreeCap.DARK_RES = 150
PassiveTreeCap.ALL_ELEM_RES = 60
# Summon (pet and servitor) bonuses from the owner's tree, in %.
PassiveTreeCap.SUMMON_PATK_PCT = 40
PassiveTreeCap.SUMMON_MATK_PCT = 40
PassiveTreeCap.SUMMON_PDEF_PCT = 40
PassiveTreeCap.SUMMON_MDEF_PCT = 40
PassiveTreeCap.SUMMON_HP_PCT = 40
PassiveTreeCap.SUMMON_ATK_SPD_PCT = 40
PassiveTreeCap.SUMMON_CAST_SPD_PCT = 40

# Full tree reset price (item id and count). 57 = Adena. 0 = free.
PassiveTreeResetItemId = 57
PassiveTreeResetItemCount = 100000

# Refunding a single node on the web planner costs this much Adena per
# point the node cost. 0 = free.
PassiveTreeRefundAdenaPerPoint = 1000

# Every character has this many passive tree templates (1-9). Each one is
# its own allocation; the active one is what gives you stats and skills.
PassiveTreeTemplateCount = 5

# True: templates can only be switched while standing in a peace zone.
PassiveTreeTemplatePeaceZoneOnly = True

# Seconds to wait after a template switch before switching again.
# 0 = no wait. The wait survives relogging.
PassiveTreeTemplateSwitchDelay = 60

# -------------------------------------------------------------
# Web planner
# -------------------------------------------------------------
# Port the planner and its API listen on.
PassiveTreeWebPort = 8788

# Secret the links are signed with. Anyone who knows it can make a link for
# any character, so use a long random string and keep it private.
# Empty = a random secret is made every time the server starts (links then
# stop working at a restart, which is harmless: they only last minutes).
PassiveTreeWebSecret =

# Where players reach the planner page, as .treelink and .gear send it.
# Use the address players can actually open (not 127.0.0.1 on a live server).
PassiveTreeWebBaseUrl = http://10.8.0.6:8788/passive-tree.html

# Seconds a .treelink link stays valid, and seconds a typed PIN stays valid.
PassiveTreeWebTokenLifetime = 900
PassiveTreeWebPinLifetime = 600

# Seconds a //passivetree admin editor link stays valid. The editor also
# stops working when the GM who opened it logs off or loses the right to
# use //passivetree (see AdminCommands.xml).
PassiveTreeWebAdminTokenLifetime = 7200

# Requests one address may make per minute to the API, and PIN entries per
# minute. After PassiveTreeWebPinMaxFailures wrong PINs the address cannot
# enter a PIN for PassiveTreeWebPinLockout seconds.
PassiveTreeWebRateLimitPerMinute = 120
PassiveTreeWebPinRateLimitPerMinute = 10
PassiveTreeWebPinMaxFailures = 5
PassiveTreeWebPinLockout = 600
