# =============================================================
# Passive Tree
# =============================================================
# Path-of-Exile-style node graph on top of class progression.
# Nodes live in data/passivetree/*.xml; the skills that ACTIVE_SKILL
# nodes grant live in data/stats/skills/PassiveTreeActives.xml.

# Enable/disable the whole feature. When disabled nobody earns points.
PassiveTreeEnabled = True

# First level that earns a point. A character earns one point per level
# from here on. A subclass earns from level 40 (or from this level, if it
# is higher), since subclasses start at level 40.
PassiveTreeStartLevel = 2

# Most points a character can earn in total.
PassiveTreeMaxPoints = 150

# False: the base class and all subclasses share one allocation, and the
# points each of them earns add up.
# True: every class slot has its own allocation and earns its own points.
# Changing this does not move existing allocations between slots.
PassiveTreeSeparateSubclassPoints = False

# Most the tree can add to each base stat (STR, DEX, CON, INT, WIT, MEN),
# however many points are spent on it. The planner shows a total that has
# reached it in red with "(Capped)". -1 = no cap.
PassiveTreeBaseStatCap = 10

# -------------------------------------------------------------
# Stat caps
# -------------------------------------------------------------
# Most the tree can add to each effect, however many points are spent on
# it. Only bonuses are capped; keystone drawbacks (negative values) always
# apply in full. A conditional bonus such as PDEF_PCT@HEAVY counts against
# the cap of its base key. The planner shows a total that has reached its
# cap in red with "(Capped)".
# -1 = no cap. Any other effect key from data/passivetree/*.xml can be
# capped by adding its own PassiveTreeCap.<KEY> line. The base stats use
# PassiveTreeBaseStatCap above.

# Offense
PassiveTreeCap.CRIT_DMG_PCT = 60
# Critical rate is on the 1000 scale: 150 = +15% critical rate.
PassiveTreeCap.CRIT_RATE_ADD = 150
PassiveTreeCap.MCRIT_DMG_PCT = 40
PassiveTreeCap.ACCURACY_ADD = 12
PassiveTreeCap.BLOW_RATE_PCT = 20
PassiveTreeCap.PHYS_SKILL_POWER_PCT = 20
PassiveTreeCap.PVE_PDMG_PCT = 25
PassiveTreeCap.PVE_MDMG_PCT = 25
PassiveTreeCap.PVE_BOW_DMG_PCT = 25
PassiveTreeCap.LIFESTEAL_PCT = 8
PassiveTreeCap.MANA_LEECH_PCT = 6

# Defense
PassiveTreeCap.EVASION_ADD = 12
PassiveTreeCap.SHIELD_RATE_PCT = 25
PassiveTreeCap.REFLECT_PCT = 30
PassiveTreeCap.SKILL_DODGE_PCT = 12
PassiveTreeCap.MAGIC_REFLECT_PCT = 10
PassiveTreeCap.SKILL_REFLECT_PCT = 10
PassiveTreeCap.HEALING_RECEIVED_PCT = 40
PassiveTreeCap.CRIT_DMG_TAKEN_RED_PCT = 30
PassiveTreeCap.INTERRUPT_RES_PCT = 50
PassiveTreeCap.DEBUFF_RES_PCT = 30

# Cooldowns and MP cost
PassiveTreeCap.SKILL_CDR_PCT = 20
PassiveTreeCap.SPELL_CDR_PCT = 20
PassiveTreeCap.SPELL_MP_COST_RED_PCT = 30

# Keystones
PassiveTreeCap.SERVITOR_SHARE_PCT = 50
PassiveTreeCap.SHIELD_RATE_MUL_PCT = 50
PassiveTreeCap.MAXHP_PCT = 60

# Utility
PassiveTreeCap.INVENTORY_SLOTS_ADD = 40
PassiveTreeCap.WEIGHT_LIMIT_PCT = 100
PassiveTreeCap.EXP_RATE_PCT = 25
PassiveTreeCap.SP_RATE_PCT = 25

# Full tree reset price (item id and count). 57 = Adena. 0 = free.
PassiveTreeResetItemId = 57
PassiveTreeResetItemCount = 100000

# Refunding a single node on the web planner costs this much Adena per
# point the node cost. 0 = free.
PassiveTreeRefundAdenaPerPoint = 1000

# Every character has this many passive tree templates (1-9). Each one is
# its own allocation; the active one is what gives you stats and skills.
PassiveTreeTemplateCount = 5

# True: templates can only be switched while standing in a peace zone.
PassiveTreeTemplatePeaceZoneOnly = True

# Seconds to wait after a template switch before switching again.
# 0 = no wait. The wait survives relogging.
PassiveTreeTemplateSwitchDelay = 60
