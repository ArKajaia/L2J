# =============================================================
# Passive Tree
# =============================================================
# Path-of-Exile-style node graph on top of class progression.
# Nodes live in data/passivetree/*.xml; the skills that ACTIVE_SKILL
# nodes grant live in data/stats/skills/PassiveTreeActives.xml.

# Enable/disable the whole feature. When disabled nobody earns points.
PassiveTreeEnabled = True

# First level that earns a point. A character earns one point per level
# from here on. A subclass earns from level 40 (or from this level, if it
# is higher), since subclasses start at level 40.
PassiveTreeStartLevel = 2

# Most points a character can earn in total.
PassiveTreeMaxPoints = 120

# False: the base class and all subclasses share one allocation, and the
# points each of them earns add up.
# True: every class slot has its own allocation and earns its own points.
# Changing this does not move existing allocations between slots.
PassiveTreeSeparateSubclassPoints = False

# Full tree reset price (item id and count). 57 = Adena. 0 = free.
PassiveTreeResetItemId = 57
PassiveTreeResetItemCount = 100000

# Refunding a single node on the web planner costs this much Adena per
# point the node cost. 0 = free.
PassiveTreeRefundAdenaPerPoint = 1000
