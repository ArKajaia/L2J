# ---------------------------------------------------------------------------
# Event rotation: Team vs Team, Conquest and Deathmatch take turns
# ---------------------------------------------------------------------------
# Every EventRotationSchedule (every hour by default) the next event of
# EventRotationOrder opens its registration, and so on in a circle:
# Team vs Team, then Conquest, then Deathmatch, then Team vs Team again...
#  - The events never overlap. If the one of the last turn still goes on
#    when the next turn comes (its registration is open, or a match with
#    players in it runs), the turn is skipped and the same event opens at
#    the turn after. A GM opening an event by hand (//tvt open, //tvt dm open,
#    //conquest register, //event) is refused too while another goes on.
#    Matches of fake players only that a GM starts to try an event out
#    (//tvt simulate, //conquest <map> start) don't count.
#  - An event that can't open (disabled in its own config, no map to play
#    on, no fake players for Conquest) gives its turn to the next one.
#  - With the rotation on, the events' own schedules (TvTSchedule in
#    TeamVsTeam.ini, ConquestSchedule in Conquest.ini) are not used.
# GMs see the rotation with //tvt rotation, and pick the next event with
# //tvt rotation next <tvt|conquest|deathmatch>.

# Enable the rotation. False: each event follows its own schedule.
# Default: True
EventRotationEnabled = True

# When a turn comes, as a schedule pattern: minutes hours day-of-month month
# day-of-week. Keep it at least as long apart as an event lasts
# (registration, preparation and fight: about 35 minutes with the defaults,
# Conquest up to its ConquestTimeLimit).
# Default: 0 * * * *
EventRotationSchedule = 0 * * * *

# The events in turn, separated by , : TvT, Conquest, Deathmatch. An event
# left out never opens by itself; one named twice gets two turns a circle.
# Default: TvT,Conquest,Deathmatch
EventRotationOrder = TvT,Conquest,Deathmatch
