# ---------------------------------------------------------------------------
# PvP spots
# ---------------------------------------------------------------------------
# Open-world areas made for fighting (zones of type PvpSpotZone, see
# data/zones/pvp_spots.xml): Plains of Dion (levels 20-51), Ancient
# Battleground (52-75) and Dragon Valley Entrance (76-85) by default.
#  - Everyone inside is flagged (purple, attacked without Ctrl) from the moment
#    they step in until they leave; the flag then runs out like after any fight.
#  - A kill inside is a PvP kill (PvP count, PvP rewards and announcements),
#    never a PK: nobody gets karma there.
#  - Players teleport there with the .pvp command (or the "PvP Spots" button of
#    the Community Board gatekeeper page), which also shows who fights there.
#  - Fake players of the spot's levels come there only to fight (see below).
# Fake players need EnableFakePlayers = True (FakePlayers.ini) and
# FakePvpEnabled = True (FakePlayerPvp.ini).

# Enable the PvP spots (flagging, no karma, teleports and fake players).
PvpSpotsEnabled = True

# Dying in a PvP spot costs no exp and gives no death penalty, like in an arena.
PvpSpotNoDeathPenalty = True

# ---------------------------------------------------------------------------
# Teleport (.pvp)
# ---------------------------------------------------------------------------
# Enable the .pvp command: a list of the spots (levels, how many fight there,
# their leader) with a teleport button for each. Not while fighting, dead, in
# the Olympiad, a duel, an event, a siege, an instance or jail.
PvpSpotTeleportEnabled = True

# Adena it costs (0 = free).
PvpSpotTeleportPrice = 0

# Only from a peace zone (town).
PvpSpotTeleportPeaceZoneOnly = False

# Players with karma can teleport too (gatekeepers refuse them).
PvpSpotTeleportWithKarma = False

# ---------------------------------------------------------------------------
# Fake players
# ---------------------------------------------------------------------------
# Fake players come to the spots only to fight: no monsters, no hunting, no
# talks or taunts, no healers or buffers (support builds never come). They
# arrive like players, by teleport, fight anyone of another clan (players and
# fake players), sometimes as a group of the same clan that fights together,
# come back after dying (a moment later, fully buffed, looking for their
# killer) and leave after a while, while newcomers arrive.
PvpSpotFakePlayers = True

# How many fake players fight in each spot: the number drifts between these,
# counting the ones on their way back after dying. Newcomers keep at least the
# minimum alive while the dead are away.
PvpSpotFightersMin = 10
PvpSpotFightersMax = 16

# Seconds between two arrivals while a spot has fewer fighters than it wants: min-max.
PvpSpotArrivalDelay = 4-15

# Seconds a fake player stays before it leaves (never in the middle of a fight): min-max.
PvpSpotStayTime = 900-2700

# Chance (in %) that a fake player killed in a spot comes back, like a player
# that restarts in town and teleports back: same name, looks and gear, fully
# buffed, after PvpSpotReturnDelay seconds (min-max). It goes after its killer
# first.
PvpSpotReturnChance = 75
PvpSpotReturnDelay = 20-60

# Chance (in %) that an arrival is a group of 2 to PvpSpotGroupMaxSize fake
# players of the same clan (needs FakeClanEnabled), that fight side by side.
PvpSpotGroupChance = 25
PvpSpotGroupMaxSize = 3

# Fake players come at a level of the spot (spotMinLevel-spotMaxLevel of its
# zone). With this chance (in %) the level is close to a player's that is in
# the spot (within PvpSpotMatchPlayerLevelRange levels), so players find
# opponents of their level; otherwise it is any level of the spot.
PvpSpotMatchPlayerLevelChance = 60
PvpSpotMatchPlayerLevelRange = 3

# Chance (in %) to drop one piece of equipment when a player kills a fake
# player in a spot (FakePvpEquipmentDropChance doesn't apply there). Fake
# players of a spot give no exp nor monster loot.
PvpSpotEquipmentDropChance = 0

# ---------------------------------------------------------------------------
# The strong one and the PvP leader
# ---------------------------------------------------------------------------
# Now and then a stronger fake player comes: the best gear of its level, highly
# enchanted (PvpSpotEliteEnchantBonus above the usual roll), every subclass in
# its passive tree, a skilled and aggressive player that never runs away.
# Chance (in %) per arrival, and how many of them a spot has at most.
PvpSpotEliteChance = 20
PvpSpotMaxElites = 1
PvpSpotEliteEnchantBonus = 3

# The PvP leader of a spot is whoever (fake player or player) has the longest
# kill streak there, from PvpSpotLeaderMinStreak kills without dying. The strong
# one often becomes it, but anyone can. When a new leader emerges, and when
# someone ends its reign, the players in the spot are told.
PvpSpotLeaderMinStreak = 3
PvpSpotLeaderAnnounce = True

# A fake player leader shows this title (in this RGB color) and the hero aura.
PvpSpotLeaderTitle = PvP Leader
PvpSpotLeaderTitleColor = 00CCFF
PvpSpotLeaderHeroAura = True

# Chance (in %) that an aggressive fake player goes for the leader when it
# sees it (the cautious ones keep away from it until it attacks them).
PvpSpotLeaderFocusChance = 50

# ---------------------------------------------------------------------------
# Combat
# ---------------------------------------------------------------------------
# In a fight, fake players drink CP potions like players, once every
# PvpSpotCpPotionReuse milliseconds: 200 CP from level 52 (Greater CP Potion),
# 50 below. A fake player's CP is the top part of its HP bar
# (FakePvpIncludeCpInHp), so a potion only heals that part.
PvpSpotCpPotions = True
PvpSpotCpPotionReuse = 1000

# How far outside a spot a fake player chases someone before it turns back.
PvpSpotChaseOutside = 600

# How far a fake player looks for someone to fight.
PvpSpotTargetRange = 1200
