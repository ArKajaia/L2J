# ---------------------------------------------------------------------------
# Roaming fake players (PvP-like encounters)
# ---------------------------------------------------------------------------
# Every time a regular monster spawns or respawns it has a small chance to be
# replaced by a fake player of the same level. The fake player looks like a
# real character (class, gear and skills for its level, see
# data/FakePlayerPvp.xml), hunts monsters around the spawn point and:
#  - cannot be pushed below FakePvpMonsterDamageFloor % HP by monsters, only
#    players (and their summons) can finish it off;
#  - attacks a player who kills the monster it was fighting (kill steal);
#  - drops whatever it is doing and fights a player who attacks it.
# When the fake player dies (or despawns) the replaced monster respawns after
# its normal respawn delay.
# Requires EnableFakePlayers = True in FakePlayers.ini.

# Enable roaming fake players.
FakePvpEnabled = True

# Chance (in %) that a spawning monster is replaced by a fake player.
FakePvpSpawnChance = 2.0

# After producing a fake player, a spawn point skips the roll this many times.
FakePvpRespawnCooldown = 3

# Only monsters within this level range can be replaced.
FakePvpMinLevel = 1
FakePvpMaxLevel = 85

# The fake player level is the monster level +/- up to this many levels.
FakePvpLevelVariance = 0

# Allow replacing monsters inside instances.
FakePvpAllowInInstances = False

# Comma separated monster ids that are never replaced.
FakePvpExcludedNpcIds =

# Maximum amount of roaming fake players alive at the same time (0 = no limit).
FakePvpMaxAlive = 500

# A monster is not replaced if another roaming fake player is closer than this.
FakePvpMinDistance = 1500

# Seconds a fake player lives before it logs off (only while out of combat),
# giving the spawn back to the monster. 0 = until killed.
FakePvpLifetime = 3600

# ---------------------------------------------------------------------------
# Strength
# ---------------------------------------------------------------------------
# Stats are calculated exactly like a real character of the same class and
# level wearing the gear from data/FakePlayerPvp.xml: class base stats and
# HP/MP tables, weapon/armor/jewel stats, armor set bonuses, class passive
# skills (masteries etc.) and the active skills learned at that level.

# Real characters have CP on top of HP. Add the class CP to max HP.
FakePvpIncludeCpInHp = True

# Random enchant of the fake player gear, rising with its level.
# Format: minLevel:minEnchant-maxEnchant;... (the highest row the level reaches is used).
# The armor enchant is used for every armor piece and jewel (+6 armor enables
# the armor set's +6 bonus).
FakePvpWeaponEnchant = 1:0-3;20:0-4;40:1-5;52:2-6;61:3-8;76:4-10;80:5-12;84:6-16
FakePvpArmorEnchant = 1:0-2;20:0-3;40:1-4;52:2-4;61:3-5;76:3-6;80:4-7;84:4-8

# Extra base stats, like dyes/passive tree points: each main stat (STR, DEX, CON
# for fighters; INT, WIT, MEN for mages) gets a random 1..N bonus, where N grows
# with the level up to this value at level 85 (level 40 -> 1..5, level 85 -> 1..10).
# 0 = no bonus.
FakePvpBonusStatMax = 10

# Buffs a fake player keeps on itself, like a buffed player. The lists are in
# data/FakePlayerPvp.xml and grow with the level (songs and dances from 40,
# prophet buffs from 61, chants from 76, improved buffs from 80).
FakePvpBuffsEnabled = True

# Potion use: below this HP % the fake player heals FakePvpPotionHealPercent % of
# its max HP every FakePvpPotionReuse milliseconds (0 heal = no potions).
FakePvpPotionHpPercent = 50
FakePvpPotionHealPercent = 6
FakePvpPotionReuse = 10000

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
# Monsters cannot bring a fake player below this HP percentage.
FakePvpMonsterDamageFloor = 70

# Distance to look for monsters to hunt.
FakePvpHuntRange = 900

# Max distance from the spawn point while fighting monsters.
FakePvpLeashRange = 2500

# Max distance from the spawn point while chasing a player.
FakePvpChaseRange = 4000

# Do not start fighting monsters that a real player is already fighting.
FakePvpAvoidPlayerMonsters = True

# Attack the player that kills the monster the fake player was fighting.
FakePvpRevengeOnKillSteal = True

# Range at which fake players notice a stolen kill.
FakePvpRevengeRange = 1500

# Chance (in %) per combat tick to use a ready skill instead of a normal attack,
# against monsters and against players. Mages always cast and never melee.
FakePvpSkillChance = 65
FakePvpPvpSkillChance = 90

# Chance (in %) per combat tick to open with a stun/root/debuff against a player.
FakePvpPvpDebuffChance = 35

# Skills and buffs with at least this reuse (in milliseconds) are saved for
# players, like a real player saves its big skills for PvP (0 = use on anything).
FakePvpPvpOnlyReuse = 30000

# Archers and mages step back when the target gets closer than this.
FakePvpKiteDistance = 250
FakePvpKiteStep = 300

# Chance (in %) that a fake player says something in general chat when a PvP
# starts or ends ("ks?", "gg"...). 0 = silent.
FakePvpTauntChance = 50

# ---------------------------------------------------------------------------
# Rewards for killing a fake player
# ---------------------------------------------------------------------------
# Exp/Sp of the replaced monster multiplied by this value (0 = none).
FakePvpRewardExpSpMultiplier = 1.0

# Drop the loot of the replaced monster.
FakePvpRewardDrops = True

# Chance (in %) to drop one random piece of its equipment (with its enchant).
FakePvpEquipmentDropChance = 0.5
