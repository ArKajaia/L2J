# ---------------------------------------------------------------------------
# Roaming fake players (PvP-like encounters)
# ---------------------------------------------------------------------------
# Every time a regular monster spawns or respawns it has a small chance to be
# replaced by a fake player of the same level. The fake player looks like a
# real character (class, gear and skills for its level, see
# data/FakePlayerPvp.xml), hunts monsters around the spawn point and:
#  - cannot be pushed below FakePvpMonsterDamageFloor % HP by monsters, only
#    players (and their summons) can finish it off;
#  - attacks a player who kills the monster it was fighting (kill steal);
#  - drops whatever it is doing and fights a player who attacks it.
# When the fake player dies (or despawns) the replaced monster respawns after
# its normal respawn delay.
# Requires EnableFakePlayers = True in FakePlayers.ini.

# Enable roaming fake players.
FakePvpEnabled = True

# Chance (in %) that a spawning monster is replaced by a fake player.
FakePvpSpawnChance = 3.0

# The spawn chance is multiplied by this inside hotzones (zones of type HotZone,
# see data/zones/custom_hotzones.xml) that the hourly rotation currently has
# active (hotzones that rotated out get no bonus). 1.0 = no bonus.
FakePvpHotzoneSpawnMultiplier = 2.0

# After producing a fake player, a spawn point skips the roll this many times.
FakePvpRespawnCooldown = 3

# Only monsters within this level range can be replaced.
FakePvpMinLevel = 1
FakePvpMaxLevel = 85

# The fake player level is the monster level +/- up to this many levels.
FakePvpLevelVariance = 5

# Allow replacing monsters inside instances.
FakePvpAllowInInstances = False

# Comma separated monster ids that are never replaced.
FakePvpExcludedNpcIds =

# Maximum amount of roaming fake players alive at the same time (0 = no limit).
FakePvpMaxAlive = 1800

# A monster is not replaced if another roaming fake player is closer than this.
FakePvpMinDistance = 1500

# Seconds a fake player lives on average before it logs off (never in the
# middle of a fight with a player), giving the spawn back to the monster. Each
# fake player gets a random 50% - 150% of this, so they don't all leave at once.
# 0 = until killed.
FakePvpLifetime = 2000

# Keep the population steady. Server start rolls every monster at once, but
# afterwards only respawning monsters roll, so once the first fake players log
# off they would only come back where players kill monsters. With this on,
# every 30 seconds idle monsters no player is near roll a small share of
# FakePvpSpawnChance (spread over FakePvpLifetime), which replaces the fake
# players that log off. Has no effect when FakePvpLifetime = 0.
FakePvpKeepPopulation = True

# ---------------------------------------------------------------------------
# Strength
# ---------------------------------------------------------------------------
# Stats are calculated exactly like a real character of the same class and
# level wearing the gear from data/FakePlayerPvp.xml: class base stats and
# HP/MP tables, weapon/armor/jewel stats, armor set bonuses, class passive
# skills (masteries etc.) and the active skills learned at that level.

# Fake players never run out of MP: their skills, bow shots and toggles cost
# no MP (MP drain against them does nothing).

# Real characters have CP on top of HP. Add the class CP to max HP.
FakePvpIncludeCpInHp = True

# Enchant of the fake player gear. Like players, a fake player enchants every
# piece on its own (weapon, shield, each armor piece, each earring and ring,
# necklace, shirt and belt), so a +7 weapon may come with +0 boots and a +3
# helmet. No-grade gear and cloaks can't be enchanted.
#
# FakePvp*EnchantOdds, format minLevel:enchantChance-stepChance;... (the highest
# row the level reaches is used):
# - enchantChance: chance (in %) a piece was enchanted at all. Otherwise it is
#   +0 (just bought, crafted or dropped).
# - an enchanted piece is at its safe level (what normal scrolls enchant without
#   risk, from data/EnchantItemGroups.xml: +3, +4 for a full body armor), now and
#   then a step or two below it (out of scrolls);
# - stepChance: chance (in %) it went one step further past the safe level,
#   rolled again for every step. Each step is rarer than the one before, like
#   over-enchanting at 66% a step where most players stop early. Weapons are
#   pushed the furthest, jewels next and armor the least (the set bonus counts
#   more than a few points of P. Def.).
# Armor odds are used for armor pieces, shields, shirts and belts.
FakePvpWeaponEnchantOdds = 1:0-0;20:40-35;40:55-40;52:65-45;61:75-50;76:85-55;80:85-60;84:90-65
FakePvpArmorEnchantOdds = 1:0-0;20:25-10;40:40-10;52:50-15;61:60-15;76:70-20;80:80-20;84:85-25
FakePvpJewelEnchantOdds = 1:0-0;20:25-20;40:40-25;52:50-30;61:60-35;76:70-40;80:80-45;84:85-50

# Chance (in %) a fake player went for a +6 armor set: every piece of its full
# set is +6 or more, which gives the set's +6 bonus. Format: minLevel:chance;...
FakePvpArmorSetEnchantChance = 1:0;61:3;76:8;80:15;84:25

# Every fake player has its own wealth, picked between these two: it works like
# that many tries at its enchant, step, +6 set, shirt, belt and cloak chances
# (with 0.6 tries a 50% chance is about 34%, with 1.4 tries about 62%). A poor
# one wears +0 gear more often, a rich one enchants nearly everything and
# further. The strong fake players of the PvP spots have the highest wealth,
# keep the better of two enchant rolls and add PvpSpotEliteEnchantBonus
# (config/Custom/PvpSpots.ini).
FakePvpGearWealthMin = 0.6
FakePvpGearWealthMax = 1.4

# The lowest and highest enchant a piece can have, by level.
# Format: minLevel:minEnchant-maxEnchant;... The weapon range is for weapons,
# the armor range for everything else. Raise the minimum for a stronger
# population (e.g. 84:6-16 makes every level 84 weapon +6 or more).
FakePvpWeaponEnchant = 1:0-0;20:0-8;40:0-10;52:0-12;61:0-14;76:0-16
FakePvpArmorEnchant = 1:0-0;20:0-6;40:0-8;52:0-10;61:0-10;76:0-12

# Extra base stats, like dyes: each main stat (STR, DEX, CON for fighters;
# INT, WIT, MEN for mages) gets a random 1..N bonus, where N grows with the
# level up to this value at level 85 (level 40 -> 1..5, level 85 -> 1..10).
# 0 = no bonus.
FakePvpBonusStatMax = 5

# Passive tree: every fake player gets an allocated passive tree, grown from
# the starting point of its class (data/passivetree, see PassiveTreeArchetypes)
# for the nodes its role uses (P.Atk for fighters, M.Atk for mages, shield
# nodes for tanks...) with the gear it wears (a @HEAVY bonus only counts in
# heavy armour, a @SHIELD one with a shield). Each tree also has a style of
# its own: some lean on critical hits, some leave them for P.Atk and attack
# speed, some take HP and defence first, some go all in on damage. It plans
# like a player: it weighs every bonus by its size (a notable giving five
# times a small node is worth five of them), stops wanting a stat once the
# tree has reached its cap (PassiveTreeCap.* in PassiveTree.ini), and takes
# the cheapest path to whatever is worth the most per point, so it heads for
# the good notables and never builds a second path to where it already is.
# Paths are taken whole: a fake player never stops halfway to a notable. It
# spends
#   subclasses * FakePvpPassiveTreeNodesPerSubclass + level
# points, but never more than a player can earn (PassiveTreeMaxPoints in
# PassiveTree.ini). Skill nodes are left out (they only work for players);
# keystones only come from the FakePvpKeystones.* lists below. Has no effect
# while the passive tree itself is disabled.
FakePvpPassiveTreeEnabled = True

# Subclass roll: below FakePvpPassiveTreeSubclassMinLevel a fake player has no
# subclass. From that level each of FakePvpPassiveTreeMaxSubclasses subclasses
# is rolled on its own, with a chance growing from ChanceMin % at the min level
# to ChanceMax % at level 85.
FakePvpPassiveTreeMaxSubclasses = 3
FakePvpPassiveTreeNodesPerSubclass = 76
FakePvpPassiveTreeSubclassMinLevel = 40
FakePvpPassiveTreeSubclassChanceMin = 10
FakePvpPassiveTreeSubclassChanceMax = 40

# The fake players that come to a PvP spot to fight are the dedicated ones:
# from FakePvpPassiveTreeSpotSubclassLevel, FakePvpPassiveTreeSpotSubclassChance
# % of them took every subclass (and so have every point of the tree); the
# others roll their subclasses as above. The strong ones of the spots
# (PvpSpotMaxElites in PvpSpots.ini) always took every subclass.
FakePvpPassiveTreeSpotSubclassLevel = 76
FakePvpPassiveTreeSpotSubclassChance = 80

# How many different trees (each with its own style) are prepared per class
# starting point, role and gear, the first time a fake player of them is made.
# Later spawns pick one and only add up its first steps, so they cost next to
# nothing.
FakePvpPassiveTreeVariants = 16

# Keystones: once a fake player's tree has spent each of these points, it heads
# for a keystone of its role by the cheapest path (the nearer keystones more
# often), if one is still in reach of the points left. One entry per keystone,
# comma separated. Empty = no keystones.
FakePvpKeystonePoints = 30,90
# Below this level a fake player leaves its keystones out (keeping the rest of
# its tree), like a player too young to have reached one.
FakePvpKeystoneMinLevel = 40

# The keystones each role may take, by node name, separated by ";". Name@TOKEN
# only lets a fake player take it when its gear meets the condition (HEAVY,
# LIGHT, ROBE, SHIELD, BOW, DAGGER, DUAL, SWORD, BLUNT, POLE, FIST). Keystones
# built on MP, CP, servitors or parties don't fit fake players (they never run
# out of MP, keep their CP in their HP and have no servitor) and are left out
# on purpose: Mind Over Matter, Martyr's Vow, Eldritch Battery, Blood Stance,
# Arcane Overload, Overflowing Grace, Soul Harvest, Soul Link, Guardian's Oath,
# Phoenix Heart and Scavenger's Creed. A build can list its own keystones
# instead (keystones in data/FakePlayerPvp.xml, e.g. the Battle Oracle's
# Battlemage), headed for in its order.
FakePvpKeystones.FIGHTER = Unending Fury;Relentless Assault;Whirling Steel;Berserk Pact;Bloodletter;Glass Cannon
FakePvpKeystones.TANK = Unwavering Stance;Deflection@SHIELD;Arcane Plating;Riposte@SHIELD;Living Fortress;Purity of Flesh
FakePvpKeystones.DAGGER = Unwavering Stance;Purity of Flesh;Nocturne;Child of Night
FakePvpKeystones.ARCHER = Far Shot@BOW;Relentless Assault;Glass Cannon
FakePvpKeystones.MAGE = Chaos Weave;Spell Echo;Arc Conduit;Vampiric Sorcery;Ley Anchor;Unshaken Mind

# Buffs a fake player keeps on itself, like a buffed player. The lists are in
# data/FakePlayerPvp.xml and grow with the level (songs and dances from 40,
# prophet buffs from 61, chants from 76, improved buffs from 80).
FakePvpBuffsEnabled = True

# Potion use: below this HP % the fake player heals FakePvpPotionHealPercent % of
# its max HP every FakePvpPotionReuse milliseconds (0 heal = no potions).
FakePvpPotionHpPercent = 90
FakePvpPotionHealPercent = 10
FakePvpPotionReuse = 10000

# Not everyone wears the best gear for their level: the weapon, the armor set and
# the jewels (and a spare bow or polearm) are each picked for a level up to this
# many levels below the fake player's own, chosen at random for each of them.
# E.g. a level 78 dagger may wear its A grade armor with its S grade dagger.
# Above level 80 the gear lags up to FakePvpGearLevelDropAbove80 levels, from level
# 52 to 80 up to FakePvpGearLevelDropAbove51 levels, and below 52 not at all.
# 0 = always the best gear for the level.
FakePvpGearLevelDropAbove80 = 6
FakePvpGearLevelDropAbove51 = 15

# Besides its weapon, armor and jewels a fake player may wear a shirt and a belt
# (the ACCESSORIES kit of data/FakePlayerPvp.xml), and a cloak once its full
# armor set opens the cloak slot (Dynasty, Moirai, Vesper Noble..., like
# players, see the cloak list in data/FakePlayerPvp.xml). Chance (in %) of each,
# grown by its wealth. Format: minLevel:chance;...
FakePvpShirtChance = 1:0;20:10;40:25;52:35;61:50;76:65;80:75;84:80
FakePvpBeltChance = 1:0;40:10;52:25;61:40;76:55;80:70;84:80
FakePvpCloakChance = 1:0;80:50;82:60;84:70

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
# Monsters cannot bring a fake player below this HP percentage.
FakePvpMonsterDamageFloor = 90

# Distance to look for monsters to hunt.
FakePvpHuntRange = 1900

# Max distance from the spawn point while fighting monsters.
FakePvpLeashRange = 4500

# Max distance from the spawn point while chasing a player.
FakePvpChaseRange = 4000

# Do not start fighting monsters that a real player is already fighting.
FakePvpAvoidPlayerMonsters = True

# Attack the player that kills the monster the fake player was fighting.
FakePvpRevengeOnKillSteal = True

# Range at which fake players notice a stolen kill.
FakePvpRevengeRange = 1500

# Chance (in %) that a fake player goes after the player who stole its kill (only
# a monster it had already hit counts). Otherwise it only complains, and it never
# picks that fight when hurt or against a player 6 or more levels above it.
FakePvpRevengeChance = 50

# Chance (in %) that a hunting fake player goes after a flagged (purple) player,
# or a player with karma (red), passing by, like PvPers do. Only when healthy, only
# players at most 3 levels above it, and each player is considered once in a few
# minutes. 0 = never.
FakePvpAttackFlaggedChance = 30
FakePvpAttackKarmaChance = 80

# Chance (in %) that a fake player is the kind of player who runs away from a PvP
# it is losing (low HP while its enemy is still healthy, or outnumbered): it uses
# its emergency and speed skills, stops a pursuer on its heels (root, stun,
# Trick...), drinks potions and runs. The others fight to the death. Held in place,
# cornered, or caught after 45 seconds of running, a fake player turns around and
# fights to the end.
FakePvpFleeChance = 15

# A player this many levels (or more) above a fake player gets no drops for killing
# it (no monster loot, no equipment piece; exp/sp as usual), and every fake player
# runs away from such a player right away. 0 = off.
FakePvpOutleveledDifference = 8

# A fake player that got away (900+ from its pursuer, and out of every player's
# sight, see FakePvpUnseenRange) reads a Scroll of Escape: 20 seconds, stopped by
# stuns and the like, and cancelled when a player comes into sight. When it
# finishes the fake player teleports away and its monster respawns. False = it
# just stops running and rests.
FakePvpEscapeScroll = True

# Some high level fake players carry Blessed Scrolls of Escape (0.2 second cast):
# from FakePvpBlessedEscapeMinLevel, FakePvpBlessedEscapeChance % of them. When
# they run from a fight they read it once FakePvpBlessedEscapeDistance away from
# their pursuer, seen or not, instead of running out of sight for a normal one.
FakePvpBlessedEscapeMinLevel = 76
FakePvpBlessedEscapeChance = 20
FakePvpBlessedEscapeDistance = 300

# Fake players that spawned in an active hotzone leave once the rotation moves
# on: after a random delay (seconds, min-max) they stop what they are doing
# (not in the middle of a fight), read a Scroll of Escape (the blessed one if
# they carry it) in front of whoever watches, like a player going to town, and
# log off. Their monsters respawn, and new fake players spawn more in the new
# hotzones (FakePvpHotzoneSpawnMultiplier). If the zone becomes hot again
# before they leave, they stay.
FakePvpHotzoneLeave = True
FakePvpHotzoneLeaveDelay = 60-600

# A fake player never teleports while a player can see it: it reads its Scroll of
# Escape, logs off at the end of its lifetime, or its dead body goes to town, only
# once no player within this range has a line of sight on it (a player closer than
# 800 always counts, walls or not). The same goes for appearing: a fake player
# takes a monster's place only where no player sees it, and one coming back from
# town for round two arrives out of sight and walks back in. 0 = no check.
FakePvpUnseenRange = 2500

# Fake players notice a player's Ultimate Defense (or Vengeance), Guts, Zealot,
# Angelic Icon and magic mirror (Magical Mirror, Shield Deflect Magic) only after
# hitting through it:
# chance (in %) per attack or skill on that player to notice it. Guts is only
# noticed by physical hits and a magic mirror by magic skills. Once noticed:
#  - Ultimate Defense: nothing gets through, it stops attacking and waits it out;
#  - Guts: physical damage doesn't get through, fighters stop attacking and wait
#    it out, mages go on casting;
#  - Zealot, Angelic Icon: debuffs don't land and the player hits hard, it stops
#    debuffing and stays away (archers, mages and tanks with their bow keep
#    shooting);
#  - magic mirror: it stops using magic skills on that player (mages wait it out).
# Against several players it goes for another one meanwhile. 0 = never noticed.
FakePvpDefenseDetectChance = 25

# The distance it tries to keep from a player whose Ultimate Defense, Guts,
# Zealot or Angelic Icon it noticed (or whose magic mirror, for a mage). A player
# that catches up anyway gets fought back until it can step away again.
FakePvpDefenseKeepDistance = 200

# Chance (in %) per combat tick to use a ready skill instead of a normal attack,
# against monsters and against players, for the classes that deal their damage with
# skills (Gladiator/Duelist, Tyrant, daggers: skillFighter in data/FakePlayerPvp.xml).
# Mages always cast and never melee.
FakePvpSkillChance = 50
FakePvpPvpSkillChance = 65

# The same for the classes whose damage is their normal attack (tanks, archers, most
# warriors): they auto attack and use a skill now and then, and play their combos
# less often.
FakePvpAutoAttackSkillChance = 10
FakePvpAutoAttackPvpSkillChance = 20

# Chance (in %) per combat tick to open with a stun/root/debuff against a player
# (half of it for the classes that fight with their normal attack).
FakePvpPvpDebuffChance = 30

# Skills and buffs with at least this reuse (in milliseconds) are saved for
# players, like a real player saves its big skills for PvP (0 = use on anything).
FakePvpPvpOnlyReuse = 30000

# Archers and mages step back when the target gets closer than this.
FakePvpKiteDistance = 280
FakePvpKiteStep = 320

# Tanks and tyrants carry a bow (the "bow" kit of their build in
# data/FakePlayerPvp.xml) and take it out against a player they can't catch,
# then switch back to their weapon (and shield) when the player comes close.
FakePvpWeaponSwapEnabled = True
# Minimum fake player level to carry a bow.
FakePvpWeaponSwapMinLevel = 40
# How long (in milliseconds) it chases a player out of melee reach before it
# takes out the bow. It does so right away when it can't move (rooted...) or
# there is no way to reach the player.
FakePvpWeaponSwapChaseTime = 4000
# It puts the bow away when the player comes this close.
FakePvpWeaponSwapMeleeDistance = 150
# Minimum time (in milliseconds) between two weapon swaps.
FakePvpWeaponSwapInterval = 3000

# Warriors carry a polearm (the "polearm" kit of their build in
# data/FakePlayerPvp.xml) and take it out when monsters surround them, so their
# normal attacks hit several monsters at once, like a player swapping to a
# polearm for a big pull. They switch back to their weapon once most of the
# monsters are dead, or when a player attacks them. A polearm only hits the
# monsters fighting the fake player, never the ones other players fight.
FakePvpPolearmSwapEnabled = True
# Minimum fake player level to carry a polearm.
FakePvpPolearmSwapMinLevel = 20
# It takes out the polearm when more than this many monsters fight it.
FakePvpPolearmSwapMonsters = 4
# It puts the polearm away when this many monsters, or fewer, still fight it.
FakePvpPolearmPutAwayMonsters = 2
# Monsters fighting it within this range count as surrounding it.
FakePvpPolearmSurroundRange = 300

# Chance (in %) that a fake player says something in general chat when a PvP
# starts or ends, when it runs away or dies, or when a player hits the monster
# it is fighting ("ks?", "gg", "lag", "my mob"...). A fake
# player says at most one thing every 20 seconds. 0 = silent.
FakePvpTauntChance = 30

# Chance (in %) that a fake player says hello in general chat the first time it
# sees a player ("hi", "yo", "gl hf"...). Each player gets one roll per fake
# player, and the 20 seconds between two lines still apply. 0 = never.
FakePvpGreetChance = 5

# Chance (in %) that a fake player killed by a player comes back to where it died,
# like a player that walks back from town for round two: same name, looks and
# gear, fully buffed. For FakePvpReturnRevengeTime seconds it goes after its
# killer as soon as it sees them (not when it is hurt, nor against a player
# FakePvpOutleveledDifference or more levels above it), then it just hunts. It
# comes back only once, and it gives no monster loot or exp the second time it
# dies (only the equipment drop chance), so it can't be farmed. 0 = never.
FakePvpReturnChance = 33

# Seconds between the dead body going to town and the fake player coming back: min-max.
FakePvpReturnDelay = 10-60

# Seconds a returned fake player looks for its killer.
FakePvpReturnRevengeTime = 300

# Seconds the dead body of a fake player stays before it goes to town: min-max.
FakePvpCorpseTime = 3-15

# ---------------------------------------------------------------------------
# PvP taunt
# ---------------------------------------------------------------------------
# A fake player higher in level than a player (or another fake player) near it
# may walk up to them, stand there a few seconds, hit them once with its normal
# attack (which flags it) and go back to hunting, to invite a PvP. Hitting it
# back starts the fight. Fake players taunted this way can fight each other,
# to the death.
# Chance (in %) to do it to someone it sees, at 1 level above them, growing to
# FakePvpPokeChanceMax at FakePvpPokeMaxChanceLevelDiff levels above them and more.
# Each one is considered once in a while. 0 = never.
FakePvpPokeChanceMin = 5
FakePvpPokeChanceMax = 30
FakePvpPokeMaxChanceLevelDiff = 8

# Also taunt other fake players (and so let fake players fight each other).
FakePvpPokeFakePlayers = True

# Milliseconds it stands next to them before it hits: min and max.
FakePvpPokeLoiterMin = 1000
FakePvpPokeLoiterMax = 10000

# A fake player that is not flagged may not hit back a player (or fake player)
# of a higher level that attacks it, like a player that doesn't want to fight:
# it goes on hunting and, if it dies, the killer gets the karma.
# Chance (in %) at 1 level below the attacker, growing to FakePvpRefuseChanceMax
# at FakePvpRefuseMaxChanceLevelDiff levels below and more. 0 = always hits back.
FakePvpRefuseChanceMin = 5
FakePvpRefuseChanceMax = 60
FakePvpRefuseMaxChanceLevelDiff = 8

# ---------------------------------------------------------------------------
# Fake players among themselves
# ---------------------------------------------------------------------------
# At the hunting grounds fake players meet each other like players do: they
# say hello (FakePvpGreetChance) and the other one often says hello back, walk
# over to talk, steal each other's monsters, fight over the spot and jump into
# the fights of others.

# Chance (in %) that an idle fake player walks over to another fake player it
# sees within FakePvpMeetRange (not fighting a player, not resting), like a
# player checking out who else farms the spot. Each one is considered once in
# 10 minutes. Once there it waits for them to finish their monster, they wave
# and talk a bit in general chat (exp, drops, the spot, pks...), then go back
# to hunting. A fight (a monster, a player) ends the talk. 0 = never.
FakePvpMeetChance = 20
FakePvpMeetRange = 2500

# Chance (in %) that such a talk is about the spot instead ("this is my spot",
# "says who?") and ends with the one that walked over hitting the other once,
# whatever their level up to FakePvpRivalryMaxLevelAbove levels above it.
# Hitting back starts the fight, to the death.
FakePvpRivalryChance = 20
FakePvpRivalryMaxLevelAbove = 5

# Chance (in %) that a hunting fake player takes a monster another fake player
# is already fighting (decided once per monster for a minute; players' monsters
# are still left alone with FakePvpAvoidPlayerMonsters). The other one
# complains ("my mob", "ks?"), and when the thief takes the kill of a monster
# it did most of the damage to, it goes after the thief like after a player
# (FakePvpRevengeChance, FakePvpRevengeOnKillSteal).
FakePvpFakeKillStealChance = 15

# Chance (in %) that a fake player joins in when it sees another fake player
# in a fight (flagged), like players that can't resist a purple name. Fake
# players with karma use FakePvpAttackKarmaChance. Only healthy, against fake
# players at most 3 levels above it, each one considered once in a few minutes.
FakePvpJoinFightChance = 30

# The PvP taunt chance (FakePvpPokeChance*) against other fake players, in %
# of the chance against players: 200 = twice as often. Needs
# FakePvpPokeFakePlayers = True.
FakePvpFakePokeScale = 200

# The refusal chance (FakePvpRefuseChance*) against other fake players, in % of
# the chance against players: 50 = half as often, so fake players hit each
# other back more readily. 0 = they always hit back.
FakePvpFakeRefuseScale = 50

# ---------------------------------------------------------------------------
# Personality
# ---------------------------------------------------------------------------
# No two fake players play exactly alike: each one rolls its own temper when it
# is created (and keeps it when it comes back for round two), and the behaviour
# values above are shifted up or down for it, around the configured figure.
# The shifts are not independent, they follow four traits, like a real player's
# habits:
#  - aggression: FakePvpRevengeChance, FakePvpAttackFlaggedChance,
#    FakePvpAttackKarmaChance, FakePvpReturnChance, the taunt chances
#    (FakePvpPokeChance*), FakePvpRivalryChance, FakePvpFakeKillStealChance,
#    FakePvpJoinFightChance, FakePvpChaseRange and FakePvpReturnRevengeTime go up
#    together, while FakePvpFleeChance, the refusal chances (FakePvpRefuseChance*)
#    and FakePvpPotionHpPercent go down (and the other way around for a cautious one);
#  - skill: FakePvpSkillChance, FakePvpPvpSkillChance,
#    FakePvpAutoAttackSkillChance, FakePvpAutoAttackPvpSkillChance,
#    FakePvpPvpDebuffChance, FakePvpDefenseDetectChance, FakePvpKiteDistance,
#    FakePvpKiteStep and FakePvpDefenseKeepDistance go up, and
#    FakePvpWeaponSwapChaseTime goes down (it takes out the bow sooner);
#  - chattiness: FakePvpTauntChance, FakePvpGreetChance and FakePvpMeetChance;
#  - roaming: FakePvpHuntRange and FakePvpLeashRange.
# A value set to 0 above stays 0 (off), and chances never go above 100.

# How much (in %) a fake player's chances may differ from the configured ones,
# up or down: 30 = FakePvpSkillChance 65 becomes anything from 45 to 85 for a
# given fake player. 0 = every fake player uses the configured chances.
FakePvpPersonalityVariance = 50

# The same for distances, times and thresholds (hunt, leash and chase ranges,
# kiting, weapon swap chase time, revenge time, potion HP %). 0 = no difference.
FakePvpPersonalityRangeVariance = 30

# ---------------------------------------------------------------------------
# Rewards for killing a fake player
# ---------------------------------------------------------------------------
# Exp/Sp of the replaced monster multiplied by this value (0 = none).
FakePvpRewardExpSpMultiplier = 10.0

# Drop the loot of the replaced monster.
FakePvpRewardDrops = False

# Chance (in %) to drop one random piece of its equipment (with its enchant).
FakePvpEquipmentDropChance = 0.5
