# =============================================================
# Thief Monsters
# =============================================================
# A regular open-world monster has a small chance on spawn to become a
# Thief. While it is alive it "steals" from every monster that players
# kill near it: each kill within ThiefDetectionRadius fills its loot bag
# by 100 / ThiefKillsForMax percent, shown in its name plate as
# [Thief: 0%] ... [Thief: 100%].
#
# When the Thief itself is killed, its adena drop is multiplied by a
# value that grows with the bag, from ThiefMinAdenaMultiplier at 0% to
# ThiefMaxAdenaMultiplier at 100%. With the defaults:
#     0% = 1x, 50% = 10.5x, 100% = 20x adena
#
# Only kills that would normally give XP/SP count, so NPC-on-NPC kills,
# fake players etc. can't fill the bag. The bag empties when the Thief
# respawns.

# Enable/disable the whole feature.
ThiefEnabled = True

# Chance (%) for an eligible monster to become a Thief, rolled every
# time it spawns or respawns - the same way champions are rolled.
# Decimals are allowed (0.5 = one in 200 spawns).
ThiefSpawnChance = 2.0

# After a spawn point produces a Thief, its next this-many spawns can't
# become a Thief, so a killed Thief never comes straight back as one.
# 0 = no cooldown.
ThiefRespawnCooldown = 1

# Only monsters within this (real) level range can become a Thief.
ThiefMinLevel = 20
ThiefMaxLevel = 99

# Allow Thieves to roll inside instances.
ThiefAllowInInstances = False

# Allow champion monsters to also become Thieves.
ThiefAllowChampions = False

# Monster IDs that can never become a Thief (comma-separated).
ThiefExcludedNpcIds = 

# Monsters killed within this range of a Thief fill its bag.
ThiefDetectionRadius = 1000

# Kills needed to fill the bag to 100%.
ThiefKillsForMax = 10

# Adena multiplier at an empty (0%) and a full (100%) bag. The
# multiplier grows linearly in between.
ThiefMinAdenaMultiplier = 1.0
ThiefMaxAdenaMultiplier = 20.0

# Prefix shown in the monster's name plate. %d is replaced by the bag
# percentage (0-100), %% prints a literal percent sign.
ThiefTitleTag = [Thief: %d%%]
