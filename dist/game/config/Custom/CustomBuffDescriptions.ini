# Champion Medal (Skill Master) buff descriptions, shown under each buff in the medal window.
# Format: <skill id> = <text>. A buff without a line here is listed without a description.
# The texts are the client's own (High Five) descriptions of the level a medal teaches, taken from the comments
# in data/stats/skills. The songs and dances leave out their shared "increases MP consumption when singing/dancing
# while song/dance effect lasts" sentence (the window says it once above the list), and the dances their "Requires a
# dualsword": that condition is off on this server.

