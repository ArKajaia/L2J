# ---------------------------------------------------------------------------
# Fake party members
# ---------------------------------------------------------------------------
# A player who writes "lf <class>" in chat (for example "lf spellsinger",
# "lf bishop and ee", "lfm healer") gets an answer from a fake player of that
# class and of the player's level. It whispers back, walks over, and joins
# the party when the player invites it (party invite button, /invite name, or
# the target's invite). In the party it:
#  - shows in the party window and follows the party leader;
#  - fights the monsters the party fights (the leader's target, or whatever
#    attacks a party member);
#  - support classes (healers, buffers, songs and dances, see "support" builds
#    in data/FakePlayerPvp.xml) heal, buffs, recharge and resurrect the party;
#  - its kills and damage count for the party (exp, sp, drops and quests).
# Kick it from the party (Dismiss) or leave the party to let it go.
# Classes without a build in data/FakePlayerPvp.xml (summoners, dwarves) can't
# be asked for. Short names players use are understood (ss, sps, bp, ee, se,
# pp, wc, ol, bd, sws, th, pw, aw, he, sr, pr, tk, sk, da, glad, wl, destro...)
# and so are roles: healer, buffer, tank, nuker, archer, dagger, dd.
# Requires EnableFakePlayers = True in FakePlayers.ini and FakePvpEnabled =
# True in FakePlayerPvp.ini.

# Enable fake party members.
FakePartyEnabled = True

# Chat channels where "lf <class>" is heard: GENERAL, SHOUT, TRADE,
# PARTYROOM_ALL (comma separated).
FakePartyLfChannels = GENERAL,SHOUT,TRADE

# Seconds before a fake player answers (typing takes a while).
FakePartyLfDelayMin = 3
FakePartyLfDelayMax = 8

# Seconds a player waits between two requests that get an answer.
FakePartyLfCooldown = 10

# How many classes one message can ask for ("lf ss bp ee").
FakePartyLfMaxPerMessage = 3

# Seconds an answering fake player waits for the invite before it goes hunting.
FakePartyLfWaitTime = 180

# Level of an answering fake player: the player's level +/- up to this many.
# 0 = the same level.
FakePartyLfLevelSpread = 0

# A free fake player of the asked class hunting within this range answers
# instead of a new one coming over. 0 = always a new one.
FakePartyLfNearbyRange = 1500

# Chance (in %) that any other fake player accepts an invite it didn't ask for
# (one hunting nearby), and the most levels it may be away from the inviter.
FakePartyInviteAcceptChance = 50
FakePartyInviteMaxLevelDifference = 5

# Most fake players in one party (a party holds 9 members in all).
FakePartyMaxFakes = 8

# Party fake players can be killed by monsters like players. False keeps them at
# FakePvpMonsterDamageFloor % HP like roaming fake players.
FakePartyCanDie = True

# Seconds after its body is gone that a dead party fake player comes back to
# the party (from town). A party healer or a player can resurrect it before.
FakePartyReturnDelay = 60

# Party fake players take their share of the party exp/sp like a member: the
# party bonus grows with them, and they take a share by level like players do.
# False: the players keep all of it.
FakePartyExpShare = True

# Distance it keeps to the party leader while following.
FakePartyFollowDistance = 200

# It doesn't chase a monster further than this from the party leader.
FakePartyLeashRange = 1500

# The party leader went somewhere far (teleport, gatekeeper, scroll): after this
# many seconds the fake player gets there too.
FakePartyTeleportDelay = 10

# Party fake players start fights on their own when the party leader stands
# around (they pull the monsters around). False: they only fight what the
# party fights.
FakePartyHuntWhenIdle = False

# Party fake players talk in party chat (thanks for the invite, brb, gl...).
FakePartyChat = True

# Roaming fake players sometimes hunt in a party of 2-3 (a fake player with
# friends): chance (in %) that a roaming fake player comes with friends, the
# largest such party, and the chance (in %) that one of the friends is a
# support class (healer, buffer...).
FakePartyRoamingChance = 15
FakePartyRoamingMaxSize = 3
FakePartyRoamingSupportChance = 60
