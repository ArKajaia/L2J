# =============================================================
# Hidden Quests
# =============================================================
# When a character secretly meets a condition (a number of PKs, PvP kills,
# orcs slain, deaths, towns visited...), a unique messenger NPC walks up to
# the player with a quest mark and offers a one-off quest.
#
# The conditions, the tasks and the rewards are defined in
# data/HiddenQuests.xml. They are never shown to players.

# Enable/disable the whole feature.
EnableHiddenQuests = True

# Minimum character level for a messenger to visit.
HiddenQuestMinLevel = 20

# Seconds between the checks that send messengers and test the
# "state" conditions (PK count, PvP count, fame, adena, towns).
HiddenQuestCheckInterval = 15

# The messenger comes a random number of seconds after the condition is met,
# so the visit doesn't point at the moment that caused it.
HiddenQuestMessengerDelayMin = 60
HiddenQuestMessengerDelayMax = 300

# Seconds the messenger waits next to the player before leaving.
HiddenQuestMessengerWaitTime = 180

# Seconds before an ignored or postponed messenger comes back.
HiddenQuestMessengerRetryDelay = 1800

# Seconds before the messenger comes back after a failed or abandoned task.
HiddenQuestFailRetryDelay = 1800

# Default task time limit in seconds (a quest can set its own).
HiddenQuestTaskTimeLimit = 2700

# Kills only count for the kill conditions when the monster is at most
# this many levels below the player (no grey-monster farming).
HiddenQuestKillLevelGap = 9

# Visual effect on the messenger, shown with the "[ ! ]" title.
# Any AbnormalVisualEffect name, NONE to disable.
HiddenQuestMessengerVisualEffect = REAL_TARGET

# Allow the player to refuse a quest forever ("Never" button).
HiddenQuestAllowForfeit = True

# Log triggers, visits, starts, completions and failures.
HiddenQuestLogging = True
