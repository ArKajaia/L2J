# ---------------------------------------------------------------------------
# Crafting Goals
# ---------------------------------------------------------------------------
# A player picks an item to craft (.craft or the Community Board, _bbscraft)
# and it becomes a goal they track like a quest: every resource of the recipe
# shows how many they have and how many are needed in total. Each resource
# collected is celebrated with a small firework, and a Large Firework goes off
# when everything is ready. Crafting the item completes the goal.
# The bestiary shows where to farm what a goal still misses (Bestiary.ini,
# BestiaryFarmingEnabled).
# ---------------------------------------------------------------------------

# Enable the crafting goals.
# Default: True
CraftingGoalsEnabled = True

# How many goals a character can track at once.
# Default: 3
CraftingGoalsMax = 3

# The most items one goal can ask for.
# Default: 1000
CraftingGoalsMaxAmount = 5000

# Break the parts that can themselves be crafted (Crafted Leather, Mithril
# Alloy, Leather...) down into their own materials, for the parts still missing.
# Default: True
CraftingGoalsBreakdown = True

# How many recipe levels the breakdown goes down (1 = only the materials of the
# parts, 3 = Crafted Leather -> Leather -> Animal Skin).
# Default: 3
CraftingGoalsBreakdownDepth = 3

# Show "Animal Skin 34/240" on screen when a tracked resource is gathered.
# Default: True
CraftingGoalsProgressMessages = True

# Celebrate each resource collected with a small firework (seen by the players
# around), and the whole goal with a Large Firework.
# Default: True
CraftingGoalsFireworks = True

# Raise the tutorial question mark when a resource is collected. Clicking it
# opens the goal tracker.
# Default: True
CraftingGoalsQuestionMark = True
