# =============================================================
# Oracles and Totem Warchiefs
# =============================================================
# Buff templates, buff shops, the scheme buffer and the books
# that teach every buff left the buffer classes with nothing of
# their own, so two buffer lines are no longer buffers:
#
#  - Prophet / Hierophant are ORACLES. They fight in the future
#    tense: their spells are prophecies that do nothing when cast
#    and come true when their time runs out.
#      Prophecy of Doom       enemy: holy damage when it comes
#                             true, more if the target didn't run
#      Prophecy of Salvation  party member: heals back the damage
#                             taken while it was on
#      Prophecy of Ruin       enemy: stun if it cast a skill while
#                             the prophecy was on, else silence
#      Prophecy of Reckoning  enemy: part of the damage it deals
#                             while the prophecy is on comes back
#                             to it as holy damage
#    Each prophecy that comes true gives the Oracle a Foresight
#    (up to 5, M. Atk. up). Hierophant: Fulfilment spends 5 to
#    make every prophecy it cast come true at once and stronger,
#    Glimpse (toggle) dodges a big hit by stepping back, the
#    finale Unwritten puts Doom on every enemy and Salvation on
#    every party member around, and the passive Inevitable Doom
#    makes Doom come back sooner, stack up to 5 times and spread
#    (1 stack) to a few enemies close to its target.
#
#  - Warcryer / Doomcryer are TOTEM WARCHIEFS: they plant totems
#    that pulse every 2 seconds, and smash them for burst.
#      Totem of Blood         party: part of the damage dealt
#                             comes back as HP
#      Totem of the Horde     monsters fighting the party turn on
#                             the totem
#      Totem of Frost-Teeth   enemies: slower runs and attacks
#      Totem of Ancestors     (Doomcryer) brings back the first
#                             party member who dies near it
#      Totem of Flames        every pulse burns the enemies close
#                             to it with magic damage (8 levels:
#                             weak and 4 enemies at level 1)
#      War Drums (stance)     every hit takes time off the reuse
#                             of the skills that plant a totem
#      Shatter                every totem explodes (3 needed)
#      Spirit Walk            (Doomcryer) swap places with a totem
#      Ancestral Bond         (Doomcryer) Max HP up, P./M. Def.
#                             up near a totem
#      Spirit Trance          the Warchief turns to ice for 5
#                             seconds (P./M. Def. +300%, a part of
#                             its max HP back every second) while
#                             its totems fight
#      Great Totem of the Horde-Father (finale): raises a Totem of
#                             Blood, of the Horde and of Frost-Teeth
#                             around it, wider, can't be broken
#      Warchief's Restraint   (passive) Steal Essence absorbs 40%
#                             of the damage as HP instead of 80%
#                             (the Overlord line keeps 80%)
#    Totems can be attacked and broken. One of each kind (up to
#    FlameTotemMaxCount Totems of Flames), up to TotemMaxCount;
#    another one replaces the oldest.
#
# The skills are in data/stats/skills/custom/oracle_skills.xml and
# warchief_skills.xml and in the class skill trees, learned from
# the Grand Masters. The client needs the rows in
# client/OraclesWarchiefs. The Dominator line is unchanged.
# =============================================================

# -------------------------------------------------------------
# Oracles (Prophet, Hierophant)
# -------------------------------------------------------------

# Prophecy of Doom deals this much more damage when the target
# is still within DoomStillRange of where it stood when the
# prophecy was cast ("fate can't be outrun... unless you run").
# Default: 1.5, 300
DoomStillBonus = 1.5
DoomStillRange = 300

# Prophecy of Salvation heals this part of the damage taken while
# it was on (1.0 = all of it; Fulfilment multiplies it, 0.6 x 1.5 =
# 0.9).
# Default: 0.6
SalvationReturn = 1

# Fulfilment makes the Oracle's prophecies come true at once, and
# this much stronger (Doom and Reckoning damage, Salvation heal).
# Default: 1.5
FulfilmentMultiplier = 1.5

# Prophecy of Reckoning gives the enemy back part of the damage it
# dealt while the prophecy was on (30%, 40% at level 2: the power
# of skill 27563), but never more than this part of its max HP
# (0.25 = a quarter).
# Default: 0.25
ReckoningMaxShare = 0.25

# Glimpse: a single hit taking at least this part of the Oracle's
# max HP makes it step back GlimpseDistance away from the attacker,
# once every GlimpseCooldown seconds.
# Default: 0.3, 300, 60
GlimpseHpThreshold = 0.2
GlimpseDistance = 300
GlimpseCooldown = 60

# Prophecy of Doom always lands on the target it is cast on (no
# resist roll).
# Inevitable Doom (Hierophant passive). Prophecy of Doom cast again
# on the same target by the same Hierophant before it comes true
# adds a stack (up to DoomMaxStacks) and starts its time again;
# once full, its time runs on (casting it again doesn't make it
# last longer). Each stack adds the damage once more. Every Doom
# it casts also spreads to up to DoomSpreadMaxTargets of its
# enemies within DoomSpreadRange of the target, the nearest first
# (0 = never), who can resist it like any debuff (MEN). The spread
# Doom has 1 stack and as much time left, never spreads again,
# gives no Foresight when it comes true, and skips an enemy that
# already has a Doom on it. Unwritten's Dooms don't spread (an
# enemy that has a Doom already gets a stack). Its reuse is
# multiplied by DoomHierophantReuse.
# Default: 5, 400, 4, 0.5
DoomMaxStacks = 5
DoomSpreadRange = 400
DoomSpreadMaxTargets = 5
DoomHierophantReuse = 0.5

# -------------------------------------------------------------
# Totem Warchiefs (Warcryer, Doomcryer)
# -------------------------------------------------------------

# Totems a Warchief can have up at once (one of each kind, but
# up to FlameTotemMaxCount Totems of Flames), another one replaces
# the oldest. The Great Totem and the totems it raises don't count. Shatter needs 3 up.
# Default: 3
TotemMaxCount = 3

# How long a totem stands (seconds).
# Default: 30, 20
TotemLifetime = 30
GreatTotemLifetime = 20

# Milliseconds between two pulses of a totem.
# Default: 2000
TotemPulse = 2000

# How far a totem's pulse reaches.
# Default: 600, 900
TotemRange = 600
GreatTotemRange = 900

# A totem falls when its Warchief is farther than this, dead or
# gone.
# Default: 2500
TotemLeash = 2500

# HP of the party member the Totem of Ancestors brings back.
# Default: 0.3
AncestorsReviveHp = 0.5

# How far around each totem Shatter's explosion reaches.
# Default: 300
ShatterRange = 400

# Milliseconds War Drums takes off the reuse of the skills that
# plant a totem (Blood, Horde, Frost-Teeth, Flames; not Ancestors,
# Shatter or Spirit Walk) with each hit, critical or not.
# Default: 1000
WarDrumsReuseCut = 1000

# Totem of Flames: every pulse burns the enemies within
# FlameTotemRange of the totem, the nearest first: as many as the
# totem's level allows (4 at level 1 up to 10, the affectLimit of
# skill 27560), never more than FlameTotemMaxTargets.
# Default: 400, 10
FlameTotemRange = 350
FlameTotemMaxTargets = 10

# Totem of Flames: milliseconds between two pulses (TotemPulse is
# for the other totems; 1667 burns 20% more often than 2000).
# Default: 1667
FlameTotemPulse = 2000

# Totems of Flames a Warchief can have up at once (they count
# towards TotemMaxCount). Another one replaces its oldest Totem of
# Flames.
# Default: 3
FlameTotemMaxCount = 3

# Totem of Flames: an enemy burned by more than one Totem of Flames
# of the same Warchief takes the full burn from one of them and
# this part of it from the others (0.5 = half, 1.0 = full from
# each).
# Default: 0.5
FlameTotemOverlapDamage = 0.5

# A totem is as high level as its Warchief, and its max HP is this
# part of the Warchief's max HP when it is planted (Totem of the
# Horde: HordeTotemHpShare; the Great Totem and the totems it raises:
# GreatTotemHpShare, they can't be hurt anyway). Its P. Def. and M. Def. go with its level
# (those of its NPC template at level 80).
# Default: 0.75, 1.1, 2.0
TotemHpShare = 0.75
HordeTotemHpShare = 1.1
GreatTotemHpShare = 2.0

# Life taken from a totem: vampiric hits (HP and MP), drain skills
# (Steal Essence, Vampiric Claw...), cubic drains and the passive
# tree's Spell Leech give this part of what they would from anything
# else (0 = nothing, 1 = in full). Breaking a totem is no safe way
# to heal.
# Default: 0.25
TotemLeechRate = 0.25

# Totem pulses (Flames, Frost-Teeth) and Shatter hit monsters and
# the players and fake players with PvP status (flagged, PK, clan
# war). Planted (or Shatter cast) with Ctrl held, they also hit the
# white players and fake players around that the Warchief could
# force-attack. A hit on a player or fake player flags the Warchief
# like a hit of its own.

# -------------------------------------------------------------
# Retired buffs
# -------------------------------------------------------------

# The buffs these lines no longer learn. A character who learned
# one from its class tree before loses it when it logs in, quietly
# (no illegal skill report). A buff the Champion Medals or buff
# books also teach (CustomBuffSystem.ini) is kept: the character
# may have learned it from a book.
# Default: True
RetiredSkillsRemove = True

