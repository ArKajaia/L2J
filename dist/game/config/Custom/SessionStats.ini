# ---------------------------------------------------------------------------
# Session Log
# ---------------------------------------------------------------------------
# Every login is a session: the experience, levels, monsters, adena, quests...
# a character gets between logging in and logging out are counted. The
# Community Board's "Session Log" page (_bbssession) shows the session in
# progress next to the previous one, and a history of the last sessions.
# ---------------------------------------------------------------------------

# Enable the session log.
# Default: True
SessionStatsEnabled = True

# How many finished sessions a character keeps in its history (1-10).
# Default: 5
SessionStatsHistory = 5

# A session in which nothing was achieved (no experience, kills, adena, quests...)
# is only kept if it lasted at least this many minutes, so a quick relog doesn't
# push a real session out of the history.
# Default: 10
SessionStatsMinMinutes = 10

# On login, tell the player in chat what they achieved in their previous session.
# Default: True
SessionStatsLoginSummary = True
