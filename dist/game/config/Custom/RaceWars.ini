# ---------------------------------------------------------------------------
# Race Wars: race against race, until the last one standing
# ---------------------------------------------------------------------------
# Players register at the TvT Event Manager in Giran. Each level bracket with
# players gets its own tournament of the six races (Human, Elf, Dark Elf, Orc,
# Dwarf, Kamael), each race an army of RaceWarsArmySize: its registered
# players (the race of the class they play when registration closes, a
# subclass included) and fake players of that race. The races are drawn into
# three pairs; the three race-vs-race matches run at once, each in its own
# copy of the map. There is no coming back: a race is out once its last
# fighter dies, and a dead fighter can't be resurrected. The three winners
# meet in a final, all against all; the race left standing wins and each of
# its players gets RaceWarsWinReward.
# A match with no winner after RaceWarsMonsterTime minutes gets
# RaceWarsMonsterCount monsters of the bracket's level (champions of
# RaceWarsMonsterTier) that go for every fighter within
# RaceWarsMonsterAggroRange, through Silent Move and Hide. If they kill
# everyone, the race whose last fighter died last wins; RaceWarsHardLimit
# minutes after they come, the race with the most fighters alive wins.
# With the event rotation on (EventRotation.ini), Race Wars opens in its turn
# (RaceWars in EventRotationOrder); //racewars open starts it by hand.

# Enable the event.
# Default: True
RaceWarsEnabled = True

# The map (data/maps) its matches are played on. The race-vs-race matches
# start at the map's first Team vs Team bases (blue and red).
# Default: ruins_of_despair
RaceWarsMap = ruins_of_despair

# Where the three races of the final start: x,y,z;x,y,z;x,y,z (the first
# three are used; a final of fewer races uses the first ones).
# Default: -19800,146600,-3736;-20200,138700,-3896;-12652,141858,-3688
RaceWarsFinalSpawns = -19800,146600,-3736;-20200,138700,-3896;-12652,141858,-3688

# Minutes of registration.
# Default: 10
RaceWarsRegistrationTime = 10

# Seconds at the start points before each match, to buff. Nobody leaves
# them meanwhile.
# Default: 60
RaceWarsPrepTime = 60

# The fighters of each race's army: its players, the rest fake players.
# Default: 20
RaceWarsArmySize = 20

# Players and fake players fight in parties of up to this many.
# Default: 7
RaceWarsPartySize = 7

# Registered players a bracket needs for its tournament.
# Default: 1
RaceWarsMinPlayers = 1

# Level brackets, separated by ; (each its own tournament and winner).
# Default: 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85
RaceWarsBrackets = 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85

# Minutes of fighting before the monsters come.
# Default: 10
RaceWarsMonsterTime = 10

# How many monsters come, of how many kinds (monsters of the bracket's
# level that live in the world, picked by chance), and their champion tier
# (0 to 3; 3 is Legendary, see ChampionMonsters.ini, which needs
# ChampionEnable).
# Default: 100, 4, 3
RaceWarsMonsterCount = 100
RaceWarsMonsterKinds = 4
RaceWarsMonsterTier = 3

# How far the monsters see a fighter (Silent Move and Hide don't hide them).
# Default: 3000
RaceWarsMonsterAggroRange = 3000

# Minutes after the monsters come: the race with the most fighters alive
# wins (then the most HP and CP left).
# Default: 5
RaceWarsHardLimit = 5

# Seconds between the last race-vs-race match's end and the final.
# Default: 30
RaceWarsFinalDelay = 30

# Each player of the winning race gets this, id,count;id,count.
# Default: 10 Sealed Cache (Epic)
RaceWarsWinReward = 6509,10

# How far around its start point each fighter appears, and how far from it
# nobody may go before the fight.
# Default: 150, 700
RaceWarsSpawnRadius = 150
RaceWarsBaseRadius = 700
