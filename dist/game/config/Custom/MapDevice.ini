# =============================================================
# Maps and the Map Device
# =============================================================
# Monsters of level 78 and up may drop a "Map (Tier N)". The tier
# follows the monster's level, and stronger monsters (champions, Mages,
# Thieves, Infused, Resonant and wave challenge monsters, raid bosses)
# drop higher tiers. The tiers, their monsters and the fields a map can
# open in are in data/MapDevice.xml.
#
# .hideout (in a town or another peaceful place) takes a player to
# their own hideout: a private instance with a Map Device in it.
# The owner puts a map in the device and feeds it up to MaxMedals
# Champion Medals. Each medal rolls one map modifier (out of 50, never
# twice the same) and adds XpBonusPerMedal % experience and
# DropBonusPerMedal % drop rate. The map also rolls one hot zone effect
# for its whole field. The device then opens PortalCount portals round
# itself.
#
# Each portal takes one player into the map - a fenced field with
# MonsterCount monsters of the tier's levels - and is gone. Nothing
# respawns. A player who dies inside wakes up in the hideout and may
# take another portal. Slaying every monster completes the map.
#
# Commands: .hideout          go to your hideout (or open the device there)
#           .hideout party    visit the hideout of your party (its leader's first)
#           .hideout back     from a map, back to the hideout
#           .hideout leave    from the hideout, back to where you came from

# Enable/disable the whole feature (map drops, hideouts, maps).
MapDeviceEnabled = True

# -------------------------------------------------------------
# Hideout
# -------------------------------------------------------------
# .hideout only works in a peace zone (towns, villages...).
HideoutPeaceZoneOnly = True

# Lowest level that can have a hideout.
HideoutMinLevel = 76

# Party members may visit a hideout (.hideout party) and take its portals.
HideoutAllowParty = True

# A hideout nobody is in, with no map open, is closed after this many minutes.
# It is made again the next time its owner types .hideout.
HideoutEmptyMinutes = 10

# NPCs (data/stats/npcs/custom/MapDevice.xml).
MapDeviceNpcId = 900700
MapPortalNpcId = 900701
MapReturnPortalNpcId = 900702
# The Dealer of the unique map The Gambler's Den (double-or-half bets on its Pot).
MapDealerNpcId = 900703

# -------------------------------------------------------------
# Opening a map
# -------------------------------------------------------------
# The item fed to the device to add modifiers (Champion Medal, also the
# Survival Arena entry fee), and how many a map takes at most.
MedalItemId = 6393
MaxMedals = 8

# Experience/SP and drop rate bonus (%) of a map per medal fed to it.
XpBonusPerMedal = 20
DropBonusPerMedal = 20

# Monsters in a map (the Horde and Titans modifiers change it), and how
# many different kinds of monster a map picks them from (its theme).
MonsterCount = 100
MonsterTypesPerMap = 6

# Portals the device opens (the Fragile Portals modifier makes it 4), and
# how far from the device they stand.
PortalCount = 8
PortalRadius = 150

# A map collapses after this many minutes (the Hourglass modifier makes
# it 15), and this many seconds after it is completed. Everyone inside
# is sent back to the hideout.
MapDurationMinutes = 60
CompletedMapCloseSeconds = 120

# A map is complete once this % of its monsters are slain (rounded so that
# a map of fewer than 100 monsters still needs all of them; 100 = every one).
# Unique maps always need every monster (their waves and final encounter).
CompletionPercent = 99

# No monster stands closer than this to where the players come in.
EntrySafeRadius = 900

# How close two monsters of a map may stand. Each monster is placed at
# least this far from the others while the field has room (if it is too
# full, it takes the free-est spot it finds). 0 places them anywhere.
# The packs of the Pack Hunters modifier stand closer, but the packs
# themselves keep apart.
MonsterSpacing = 500

# Map monsters roll the server's random passive skills like any other
# monster (more HP, drops and experience per passive).
MapMonsterRandomPassives = True

# Hot zone effects a map never rolls. These need a world hot zone
# (bounties, Heat, the miniboss) or respawning monsters to do anything.
ExcludedHotzoneEffects = BOUNTY_HUNT,RISING_HEAT,MINIBOSS_FRENZY,BLOOD_MOON,CONTESTED_GROUND

# -------------------------------------------------------------
# Dying in a map
# -------------------------------------------------------------
# Seconds before a player who died in a map wakes up in the hideout
# (unless someone resurrects them first). The normal death penalty applies.
DeathReturnDelay = 3

# They wake up with full HP, MP and CP (False: with the little a
# resurrection leaves).
DeathReviveFull = True

# Players lose experience when they die in a map (False: no experience
# loss in maps; the Death Penalty debuff still applies as anywhere).
DeathExpLoss = False

# A player who left (or was removed from) the map owner's party may farm
# on in the map; when they die or leave it, they go to a hideout of their
# own (made for them if needed), not to the owner's.

# -------------------------------------------------------------
# Map drops
# -------------------------------------------------------------
# Chance (%) a monster of level 78 and up (see dropLevel in
# data/MapDevice.xml) drops a map, plus this much per champion tier.
# Raid bosses use their own chance. The monster's drop rate bonuses
# (random passives, hot zones) raise these too.
MapDropChance = 0.3
MapDropChancePerChampionTier = 1.0
MapDropChanceRaid = 20.0

# Maps inside a map: its monsters drop this many maps on average over a
# full clear (each monster 1 in MonsterCount / this), whatever the
# medals and drop bonuses. With the completion map below, a cleared map
# gives about 1.5 maps. Their tier is the map's own, or one
# (InMapTierUpChance %) or two (InMapTierUpTwoChance %) higher.
MapDropsInMapAverage = 0.5
InMapTierUpChance = 25
InMapTierUpTwoChance = 5

# No map drops from monsters more than this many levels below the
# player (-1 = no limit).
MapDropMaxLevelDifference = 9

# The last kill of a map drops one more map (a tier rolled like above).
CompletionMapReward = True

# Maps the Map Guardian (the Map Guardian modifier) drops on top.
GuardianExtraMaps = 1

# The most maps one map drops in all: its monsters' drops, the
# completion map, the Map Guardian's, Speedrun's and unique maps.
MapDropsPerMapMax = 3

# The guaranteed first map: the first monster a character kills once it
# is FirstMapLevelPercent % into level FirstMapLevel (or higher) drops a
# Map (Tier 1). Once per character.
FirstMapEnabled = True
FirstMapLevel = 75
FirstMapLevelPercent = 50

# -------------------------------------------------------------
# Unique maps
# -------------------------------------------------------------
# The unique maps of data/MapDevice.xml (<uniqueMap>): The Crimson
# Coliseum, The Gilded Vault, The Ossuary of Echoes, The Gambler's Den,
# The Primal Crucible, The Ketra-Varka Front, The Tomb Raiders. Each always
# opens the same map with its own modifiers, twist, final encounter and drops.
UniqueMapsEnabled = True

# Unique maps only drop inside maps, within MapDropsPerMapMax, and they
# are rare: about one map in 100.
# Completing a map may drop a unique map (one of those that drop at its
# tier, at random): this chance (%), plus this much per medal fed to it.
# A unique map drops from the tiers dropMinTier-dropMaxTier of its
# <uniqueMap>; without dropMinTier, from this tier and up (the Front and
# the Tomb Raiders drop from tiers 1-4, the others from 5 and up).
UniqueMapMinTier = 5
UniqueMapCompletionChance = 1.0
UniqueMapChancePerMedal = 0.0

# Chance (%) the boss of a unique map drops another unique map.
UniqueMapBossChance = 1.0

# How densely the monsters of a unique map stand, against a normal map's
# (MonsterCount monsters on the whole field). A unique map holds fewer
# monsters (30-80), so it opens on a smaller copy of its arena: the fence
# is pulled in round the middle (the entry, the twist's totems,
# reliquaries and phylacteries with it) until its monsters stand this
# many times as densely as a normal map's. 2.0 = twice as dense; 1.0 = as
# dense as a normal map; 0 = the whole arena, as a normal map. The field
# never shrinks past UniqueMapMinRadius, nor grows past the arena's own.
# Arenas of the event map page (the Primal Crucible's primeval_isle) keep
# the fence and packs placed by hand.
UniqueMapDensity = 2.0
UniqueMapMinRadius = 3000

# The Gambler's Den: the most Adena one run of it pays out in all, its own drops together (monsters, Jackpot
# Chest, Bluffs and the House, after the server rates and the Pot). Past it the Den drops no more Adena.
# Its drop amounts in data/MapDevice.xml are set so that even the luckiest run (Pot x4 and Hot Table) stays
# about at this. 0 = no limit.
GamblersDenMaxAdena = 150000000

# -------------------------------------------------------------
# The quest "A Map of Your Own"
# -------------------------------------------------------------
# The first time a character gets a map, a quest pops up (the blinking
# tutorial question mark, see client/TutorialQuestionMark) and walks them
# through the Map Device: go to the hideout, open the map, take a portal,
# clear the map. Each character does it once. .hideout quest opens it.
MapQuestEnabled = True

# Champion Medals (MedalItemId) paid for clearing the map.
MapQuestRewardMedals = 5
