# =============================================================
# Monster Rage
# =============================================================
# Monsters that keep getting stunned or held eventually fight back.
# Every stun and hold (root or paralyze) a player or their summon lands
# on a monster is counted. Once a monster has been disabled
# RageDisablesRequired times, every further stun/hold has RageChance% to
# make it rage.
#
# A raging monster, for RageDurationSeconds:
#   - grows larger,
#   - gains RageAttackBonus% P.Atk and M.Atk,
#   - gains RageSpeedBonus% attack speed and casting speed,
#   - resists negative effects (stuns, holds, slows, poisons ...).
#
# The count is shared by everyone fighting the monster and resets when
# it respawns. It is not reset by a rage, so after the threshold every
# stun/hold keeps rolling the chance again.

# Enable/disable the whole feature.
RageEnabled = True

# Stuns/holds a monster must take before the next ones can make it rage.
# With 10, the 11th stun/hold is the first one that rolls.
RageDisablesRequired = 10

# Chance (%) for each stun/hold past the threshold to trigger a rage.
# Decimals are allowed.
RageChance = 20.0

# How long a rage lasts, in seconds.
RageDurationSeconds = 10

# P.Atk and M.Atk bonus (%) while raging.
RageAttackBonus = 20

# Attack speed and casting speed bonus (%) while raging.
RageSpeedBonus = 20

# Chance (%) to resist each negative effect while raging.
# 100 = immune to all negative effects.
RageDebuffResistance = 100

# Break out of the stun/hold that triggered the rage (and any other
# stuns/holds currently on the monster) the moment it starts raging.
RageBreaksDisables = True

# Let raid bosses, grand bosses and arena challengers rage too.
RageAllowRaids = False

# Monster IDs that can never rage (comma-separated).
RageExcludedNpcIds =

# Prefix shown in the monster's name plate while it rages.
RageTitleTag = [RAGE]

# Message sent to everyone fighting the monster when it starts raging.
# %s is replaced by the monster's name. Leave empty to send nothing.
RageMessage = %s flies into a rage!
