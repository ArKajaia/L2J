# =============================================================
# Infused Monsters
# =============================================================
# A regular open-world monster has a small chance on spawn to be
# infused with an element: Fire, Water, Wind, Earth, Holy or Dark.
# Its name plate shows the element, e.g. [Fire], and it glows with it.
#
# An Infused monster:
#  - attacks with its element (InfusedAttackPower is added to it),
#  - resists its element (InfusedOwnResist) and is weak to the
#    opposite one (InfusedOppositeResist): Fire <-> Water,
#    Wind <-> Earth, Holy <-> Dark. Damage compares the attacker's
#    element with the target's resistance to that same element, so a
#    Water weapon hits a Fire monster hard and a Fire weapon barely
#    scratches it. Armor with the right attribute stones protects
#    against its element as usual.
#  - has InfusedHpMultiplier x max HP and InfusedAttackMultiplier x
#    P.Atk/M.Atk,
#  - casts its element's nova every InfusedNovaInterval ms while an
#    enemy stands close: a slow (5 second) spell that hits everyone
#    around it, so players can step away while it casts,
#  - drops attribute stones of its element (InfusedStoneAmounts), and
#    from level 80 on may drop an attribute crystal of it too
#    (InfusedCrystalChances). Its normal drops stay the same.
#
# Retail High Five: attribute stones raise an item's attribute up to
# level 3 (150 on a weapon, 60 on armor), attribute crystals up to
# level 6 (300 / 120). Only S grade and higher items take attributes,
# so the stones and crystals matter most from level 76 on.
#
# Infused monsters never overlap with Thieves, Mages, Resonant
# monsters, wave challenges, arena challengers or hotzone minibosses.
# The hot zone modifier ELEMENTAL_STORM makes them 5 times as common
# and adds one stone to each drop.

# Enable/disable the whole feature.
InfusedEnabled = True

# Chance (%) for an eligible monster to be infused, rolled every time it
# spawns or respawns - the same way champions are rolled.
# Decimals are allowed (0.5 = one in 200 spawns).
InfusedSpawnChance = 1.5

# After a spawn point produces an Infused monster, its next this-many
# spawns can't be infused, so a killed one never comes straight back.
# 0 = no cooldown.
InfusedRespawnCooldown = 1

# Only monsters within this (real) level range can be infused.
InfusedMinLevel = 61
InfusedMaxLevel = 99

# Allow Infused monsters to roll inside instances.
InfusedAllowInInstances = False

# Allow champion monsters to also be infused.
InfusedAllowChampions = False

# Monster IDs that can never be infused (comma-separated).
InfusedExcludedNpcIds =

# How often each element is picked (ELEMENT:weight, comma-separated).
# 0 = never.
InfusedElementWeights = FIRE:1,WATER:1,WIND:1,EARTH:1,HOLY:1,DARK:1

# A monster that already attacks with an element keeps it this often
# (%), so an earth golem is usually infused with Earth.
InfusedKeepTemplateElementChance = 70

# Attack attribute added to the element (on top of what the monster
# already has, so it becomes its strongest element).
InfusedAttackPower = 150

# Resistance added to its own element, and to the opposite element
# (negative = weaker).
InfusedOwnResist = 150
InfusedOppositeResist = -100

# Max HP and P.Atk/M.Atk multipliers.
InfusedHpMultiplier = 2.0
InfusedAttackMultiplier = 1.2

# Minimum time (milliseconds) between two novas. 0 = no nova.
InfusedNovaInterval = 12000

# Nova skill of each element (ELEMENT:skill id). The highest skill
# level whose magic level isn't above the monster's level is used.
# Default: the retail area spells Prominence, Hydro Blast, Hurricane,
# Stone, Solar Flare and Shadow Flare.
InfusedNovaSkills = FIRE:3180,WATER:3181,WIND:3182,EARTH:3183,HOLY:3184,DARK:3185

# Visual effect of each element (ELEMENT:AbnormalVisualEffect name, see
# model/skill/AbnormalVisualEffect.java). Pick effects that follow the
# monster (not MAGIC_SQUARE, a ground effect that stays where it
# started), and not VP_UP, NAVIT_ADVENT or INVINCIBILITY, which mark
# monsters with many random passives. Holy and Dark have no DOT_ effect
# of their own: Holy shows the Ultimate Defense glow, Dark the Stigma of
# Shilen. Change them if they don't look right in game.
InfusedVisualEffects = FIRE:DOT_FIRE,WATER:DOT_WATER,WIND:DOT_WIND,EARTH:DOT_SOIL,HOLY:ULTIMATE_DEFENCE,DARK:STIGMA_OF_SILEN

# Attribute stones dropped, by monster level: level:min-max,...
# Each entry applies from its level up to the next entry.
InfusedStoneAmounts = 61:1-1,76:1-2,80:2-3

# Chance (%) of one attribute crystal, by monster level: level:chance,...
# Each entry applies from its level up to the next entry.
InfusedCrystalChances = 80:3,84:6

# No stones or crystal if the killer is more than this many levels above
# the monster. -1 = no limit.
InfusedMaxLevelDifference = 8

# Tell the killer what the Infused monster left behind.
InfusedMessage = True

# Prefix shown in the monster's name plate. %s is replaced by the
# element name (Fire, Water, Wind, Earth, Holy, Dark).
InfusedTitleTag = [%s]
