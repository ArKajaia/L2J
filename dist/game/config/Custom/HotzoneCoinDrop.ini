# =============================================================
# Hotzone Coin Drop
# =============================================================
# Killing a monster inside a hotzone drops the same currency item the
# Survival Arena pays out (see ArenaCurrencyItemId in Rates.ini),
# scaled by the victim's level.

# Enable/disable the whole feature.
HotzoneCoinDropEnabled = True

# Percent chance per kill that coins drop at all.
HotzoneCoinDropChance = 100.0

# Coins dropped at level 1.
HotzoneCoinDropMinAmount = 1

# Coins dropped at HotzoneCoinDropLevelForMaxAmount and above.
HotzoneCoinDropMaxAmount = 20

# The monster level at which the drop amount reaches its max. Scales
# linearly between level 1 (MinAmount) and this level (MaxAmount).
HotzoneCoinDropLevelForMaxAmount = 85
