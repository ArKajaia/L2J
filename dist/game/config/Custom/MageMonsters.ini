# =============================================================
# Mage Monsters
# =============================================================
# A regular open-world monster that knows at least one magic damage
# spell has a small chance on spawn to become a Mage, shown in its
# name plate as [Mage].
#
# A Mage:
#  - casts its magic damage spells back to back (the template's normal
#    skill chance is ignored) and only falls back to auto-attacks once
#    its MP drops to MageLowManaPercent of its max MP,
#  - backs away (kites) when a target gets close, while it still has
#    mana,
#  - has MageMpMultiplier x max MP and MageCastSpeedBonus % more cast
#    speed,
#  - drops/spoils MageDropAmountMultiplier / MageSpoilAmountMultiplier
#    times the normal item amounts,
#  - always drops one Sealed Cache when killed (see LuckyLoot.ini for
#    the tiers). The normal random cache roll still happens on top.
#
# Mages never overlap with Thieves, wave challenges, arena challengers
# or hotzone minibosses.

# Enable/disable the whole feature.
MageEnabled = True

# Chance (%) for an eligible monster to become a Mage, rolled every time
# it spawns or respawns - the same way champions are rolled.
# Decimals are allowed (0.5 = one in 200 spawns).
MageSpawnChance = 2.0

# After a spawn point produces a Mage, its next this-many spawns can't
# become a Mage, so a killed Mage never comes straight back as one.
# 0 = no cooldown.
MageRespawnCooldown = 1

# Only monsters within this (real) level range can become a Mage.
MageMinLevel = 20
MageMaxLevel = 99

# Allow Mages to roll inside instances.
MageAllowInInstances = False

# Allow champion monsters to also become Mages.
MageAllowChampions = False

# Monster IDs that can never become a Mage (comma-separated).
MageExcludedNpcIds =

# Max MP multiplier.
MageMpMultiplier = 3.0

# Extra cast speed in percent (30 = +30%).
MageCastSpeedBonus = 30

# Item amount multipliers for the Mage's kill drops (adena included)
# and for its spoil.
MageDropAmountMultiplier = 2.0
MageSpoilAmountMultiplier = 2.0

# Once the Mage's MP is at or below this percent of its max MP it counts
# as out of mana: it stops casting and kiting and closes in to melee.
# When its MP regenerates above this again, it goes back to casting.
MageLowManaPercent = 10

# The Mage steps back when its target comes closer than this.
MageKiteDistance = 300

# How far the Mage moves away per kite step.
MageKiteStep = 350

# Minimum time (milliseconds) between two kite steps while it has a
# spell ready, so it alternates between stepping back and casting.
# While all its spells are on cooldown it kites without waiting.
MageKiteInterval = 4000

# Drop one Sealed Cache when a Mage is killed. Follows the Sealed Cache
# level rule: no cache if the killer is more than
# SealedCacheMaxLevelDifference levels above the Mage.
MageCacheOnDeath = True

# Prefix shown in the monster's name plate.
MageTitleTag = [Mage]
