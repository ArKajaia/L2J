# ---------------------------------------------------------------------------
# Conquest
# ---------------------------------------------------------------------------
# A large Blue against Red battle over the capture points of a map (the event
# maps of data/maps ticked for Conquest, shared with TvT and Deathmatch,
# edited on the GM page //conquest or //tvt map). A match runs in its
# own copy of the map's place, without monsters: the doors the map names are
# opened or shut, and nobody leaves the map's area (whoever does is put back).
#  - Each team starts with ConquestStartScore. Every second each team loses
#    max(1, capture points the other team holds - capture points it holds).
#    A team at 0 loses; after ConquestTimeLimit minutes the higher score wins.
#  - A capture point goes over to a team when enough of its fighters stand on
#    it (see the Capture settings), passing through neutral first.
#  - The dead come back in waves at one of their team's spawn points.
# Players register at the Conquest Event Manager (see Registration below);
# the free places of each team are fake players. A GM can also start a match
# of fake players only with //conquest <map> start [players per team]
# [levels], in 5 member parties.

# Score each team starts with.
# Default: 1000
ConquestStartScore = 1000

# Seconds the teams get ready (buffs, servitors) before the fight.
# Default: 30
ConquestPrepTime = 30

# Minutes the fight lasts at most. When it runs out the higher score wins.
# Default: 30
ConquestTimeLimit = 30

# Levels of the fake players when the start command names none, as min-max
# (each fake player gets a level in it; both teams get the same levels).
# A match players registered for uses its bracket instead (ConquestBrackets).
# Default: 80-85
ConquestLevelRange = 80-85

# Seconds between the waves of the dead coming back. One that dies joins the
# wave due within half this time, else a new wave this long after its death.
# Default: 20
ConquestRespawnWave = 20

# Seconds of spawn protection after coming back (it ends sooner when the
# fighter hurts someone).
# Default: 5
ConquestSpawnProtection = 5

# The bases: around each spawn point, its spread radius plus this much. Inside
# its own base nobody hurts anyone or can be hurt; whoever walks into an enemy
# base is sent to its own.
# Default: 100
ConquestBaseRadius = 100

# Capture progress goes from neutral (0) to 100 for a team, in % per second:
# ConquestCaptureBaseRate with one fighter more than the other team on the
# point, ConquestCaptureRatePerExtra more for each further one, at most
# ConquestCaptureMaxRate. A point held by the other team goes down to neutral
# first.
# Default: 5, 2.5, 15
ConquestCaptureBaseRate = 5
ConquestCaptureRatePerExtra = 2.5
ConquestCaptureMaxRate = 15

# Progress only moves while the team ahead on the point has more than this
# share more fighters on it than the other (25: 6 against 4 moves it, 5
# against 4 doesn't).
# Default: 25
ConquestCaptureMajorityPercent = 25

# With at least this many fighters of each team on a point, it doesn't move.
# Default: 10
ConquestCaptureStalemateCount = 10

# A fighter counts on a point within its radius and this far above or below
# it (maps with floors over each other).
# Default: 300
ConquestCaptureHeight = 300

# Seconds between the orders of each team's commander (which party goes to
# which point or enemy).
# Default: 3
ConquestCommanderInterval = 3

# ---------------------------------------------------------------------------
# Brains (A/B): which commander leads each team.
#   generic - the plain commander (brain A).
#   jev     - JEV, TypeSafe's decision model (https://typesafe.ai), says every
#             5 seconds, and when something happens, how much of the force each
#             point (and the hunt) should get and which enemy groups to hunt,
#             and the parties are shared out by its probabilities;
#             the plain commander's plan (worked out every
#             ConquestCommanderInterval) is its hint and its fallback (brain B).
# //conquest brain <blue> <red> changes them for the next matches.
# Default: generic, generic
# ---------------------------------------------------------------------------
ConquestBlueBrain = generic
ConquestRedBrain = jev

# The brain of both teams in the matches the registration starts (players
# signed up through the manager NPC), on every map: ConquestBlueBrain,
# ConquestRedBrain and //conquest brain then lead only the matches a GM starts.
# Empty: the registration's matches use those too.
# Default: jev
ConquestRegistrationBrain = jev

# The TypeSafe API key (https://console.typesafe.ai/keys). Empty: the
# TYPESAFE_API_KEY environment variable. Without one, a jev team is led by the
# plain commander.
ConquestJevApiKey =

# Default: https://api.typesafe.ai/v1/systemone
ConquestJevUrl = https://api.typesafe.ai/v1/systemone

# Default: jev-latest
ConquestJevModel = jev-latest

# Milliseconds between JEV's turns when nothing happens. It is also asked as
# soon as something that matters happens (a point starts to move toward a
# team, a point changes hands), at most once a second. A wave coming back is
# not news: it seldom changed anything.
# Default: 5000
ConquestJevInterval = 5000

# The most requests a second to TypeSafe, for every jev team together. The
# account allows 40; when a turn would go over, or TypeSafe answers 429 or 529,
# the plain commander leads until JEV can be asked again.
# Default: 30
ConquestJevMaxRequestsPerSecond = 30

# Milliseconds to wait for JEV's answer before the plain commander leads.
# Default: 2000
ConquestJevTimeout = 2000

# JEV is asked, for each capture point and for hunting the enemy groups, how
# much of the force should go there (most, much, little, none: worth 1, 0.6,
# 0.25, 0). Its probabilities for these make the option's weight, and the
# parties are shared out by the weights. An option with less weight than this
# (0 to 1) gets no parties; when none has this much, the plain commander leads.
# Parties already on their way to take a point keep going until it is ours,
# while its weight stays above three quarters of this (0.15 at 0.2).
# Default: 0.2
ConquestJevMinConfidence = 0.2

# Write every JEV turn to log/conquest/match-<id>-<team>-jev.jsonl, one JSON
# line a turn: the request as sent (state and questions), TypeSafe's reply,
# each option's weight from this answer and smoothed, the parties on each
# option before and after, and the parties moved. A few KB a turn.
# Default: True
ConquestJevLog = True

# Seconds the result is shown before the fake players leave and the copy of
# the map closes.
# Default: 15
ConquestEndDelay = 15

# Name colors of the teams, as BBGGRR (like the name colors of players).
# Default: FF9F7F, 5F5FFF
ConquestBlueNameColor = FF9F7F
ConquestRedNameColor = 5F5FFF

# ---------------------------------------------------------------------------
# Registration
# ---------------------------------------------------------------------------
# Every ConquestSchedule the Conquest Event Manager opens registration (in
# Giran, see ConquestManagerLocations) for ConquestRegistrationTime minutes,
# like the TvT Event Manager. Then every level bracket with registered
# players gets its own match, in its own copy of a map of ConquestMaps (the
# same map for all), its fake players of the bracket's levels.
#  - A party always plays in one team, its leader leading it in the match. A
#    party whose members are in different brackets is broken up: each member
#    plays in the match of their own bracket (members of the same bracket stay
#    together, the first of them in the party leading them).
#    Real players are spread evenly between the teams.
#  - A party of players smaller than 5 gets fake players up to 5, in the roles
#    it lacks (a bigger one stays as it is); a lone player leads 4 fake
#    players. The rest of each team are parties of 5 fake players led by the
#    team's commander (ConquestBlueBrain, ConquestRedBrain). Whenever the
#    player leading a party is dead or in its base, its fake players go where
#    the commander sends the party; the leader hears the commander's orders.
#  - The other team is attacked without Ctrl, the own team can't be hurt, no
#    kill gives karma. The dead come back in waves (ConquestRespawnWave).
#    Players get their TvT Event buff template (Community Board) when they
#    come in and every time they come back at a spawn point.
#  - A player that leaves (logs off, leaves the instance) gets its state back
#    and a fake player of its role takes its place. When every player has
#    left, the match ends without a result.
# Needs the fake players: EnableFakePlayers = True in FakePlayers.ini and
# FakePvpEnabled = True in FakePlayerPvp.ini.

# Open registration by itself on the schedule (//conquest register opens it
# any time).
# Default: True
ConquestRegistrationEnabled = True

# When registration opens, as a schedule pattern: minutes hours day-of-month
# month day-of-week. Default: every 2 hours at half past (TvT opens on the
# hour).
# Not used while the event rotation is on (EventRotation.ini): the events
# take turns there.
# Default: 30 */2 * * *
ConquestSchedule = 30 */12 * * *

# Minutes registration stays open.
# Default: 10
ConquestRegistrationTime = 5

# The maps a registration picks from, by id (data/maps), separated by ,
# One is picked by chance. Empty: any map ticked for Conquest with spawn
# points for both teams and a capture point.
# Default: (empty)
ConquestMaps =

# Places per team (players and fake players), rounded down to whole parties
# of 5, at most the map's maxPlayers. 0: the map's maxPlayers.
# Default: 0
ConquestPlayersPerTeam = 0

# Fewest players registered in a bracket for its match to start.
# Default: 1
ConquestMinPlayers = 1

# The level brackets, lowest level-highest level, separated by ;
# A player of a level outside every bracket can't register. Each bracket
# with players runs a full match: mind the load of big maps (see
# ConquestPlayersPerTeam).
# Default: 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85
ConquestBrackets = 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85

# Where the Conquest Event Manager stands during registration:
# x,y,z,heading;... Default: Giran, next to the TvT Event Manager.
# Default: 83480,148320,-3406,32938
ConquestManagerLocations = 83480,148320,-3406,32938

# Reward of the killer for each kill (players only): one item, picked by
# chance. itemId,count,chance;itemId,count,chance... (chances add up to 100).
# Default: Sealed Cache Common 80%, Rare 17%, Epic 3%.
# Default: 6492,1,80;6499,1,17;6509,1,3
ConquestKillRewards = 6492,1,80;6499,1,17;6509,1,3

# Reward of every player of the winning team still in the match:
# itemId,count;itemId,count... A draw rewards nobody.
# Default: 10 Champion Medals
# Default: 6393,10
ConquestWinReward = 6393,10

# Contribution of a player to its team: points for each kill, and for being
# on a capture point (alive) at the moment its team captures it.
# Default: 1 point a kill, 1 point a capture.
ConquestContributionKill = 1
ConquestContributionCapture = 1

# Extra reward of the players of the whole winning team, Blue or Red, with
# the most contribution (real players only, most points first, more kills
# then fewer deaths on a tie, at least one point): Crystal Scrolls of the
# grade they compete in (their expertise: D, C, B, A, or S for S, S80 and
# S84). One entry per place, first place first: weapon,count;armor,count;...
# Empty for none. A draw rewards nobody.
# Default: 1st place 1 Crystal Scroll: Enchant Weapon, 2nd place 2 Crystal
# Scroll: Enchant Armor, 3rd place 1 Crystal Scroll: Enchant Armor.
# Default: weapon,1;armor,2;armor,1
ConquestTopRewards = weapon,1;armor,2;armor,1
