# ---------------------------------------------------------------------------
# Conquest
# ---------------------------------------------------------------------------
# A large Blue against Red battle over the capture points of a map (the maps
# are in data/conquest, edited on the GM page //conquest). A match runs in its
# own copy of the map's place, without monsters: the doors the map names are
# opened or shut, and nobody leaves the map's area (whoever does is put back).
#  - Each team starts with ConquestStartScore. Every second each team loses
#    max(1, capture points the other team holds - capture points it holds).
#    A team at 0 loses; after ConquestTimeLimit minutes the higher score wins.
#  - A capture point goes over to a team when enough of its fighters stand on
#    it (see the Capture settings), passing through neutral first.
#  - The dead come back in waves at one of their team's spawn points.
# For now only fake players fight: a GM starts a match with
# //conquest <map> start [players per team] [levels], in 5 member parties.

# Score each team starts with.
# Default: 1000
ConquestStartScore = 1000

# Seconds the teams get ready (buffs, servitors) before the fight.
# Default: 30
ConquestPrepTime = 30

# Minutes the fight lasts at most. When it runs out the higher score wins.
# Default: 30
ConquestTimeLimit = 30

# Levels of the fake players when the start command names none, as min-max
# (each fake player gets a level in it; both teams get the same levels).
# Default: 80-85
ConquestLevelRange = 80-85

# Seconds between the waves of the dead coming back. One that dies joins the
# wave due within half this time, else a new wave this long after its death.
# Default: 20
ConquestRespawnWave = 20

# Seconds of spawn protection after coming back (it ends sooner when the
# fighter hurts someone).
# Default: 5
ConquestSpawnProtection = 5

# The bases: around each spawn point, its spread radius plus this much. Inside
# its own base nobody hurts anyone or can be hurt; whoever walks into an enemy
# base is sent to its own.
# Default: 100
ConquestBaseRadius = 100

# Capture progress goes from neutral (0) to 100 for a team, in % per second:
# ConquestCaptureBaseRate with one fighter more than the other team on the
# point, ConquestCaptureRatePerExtra more for each further one, at most
# ConquestCaptureMaxRate. A point held by the other team goes down to neutral
# first.
# Default: 5, 2.5, 15
ConquestCaptureBaseRate = 5
ConquestCaptureRatePerExtra = 2.5
ConquestCaptureMaxRate = 15

# Progress only moves while the team ahead on the point has more than this
# share more fighters on it than the other (25: 6 against 4 moves it, 5
# against 4 doesn't).
# Default: 25
ConquestCaptureMajorityPercent = 25

# With at least this many fighters of each team on a point, it doesn't move.
# Default: 10
ConquestCaptureStalemateCount = 10

# A fighter counts on a point within its radius and this far above or below
# it (maps with floors over each other).
# Default: 300
ConquestCaptureHeight = 300

# Seconds between the orders of each team's commander (which party goes to
# which point or enemy).
# Default: 3
ConquestCommanderInterval = 3

# Seconds the result is shown before the fake players leave and the copy of
# the map closes.
# Default: 15
ConquestEndDelay = 15

# Name colors of the teams, as BBGGRR (like the name colors of players).
# Default: FF9F7F, 5F5FFF
ConquestBlueNameColor = FF9F7F
ConquestRedNameColor = 5F5FFF
