# =============================================================
# Night Cycle
# =============================================================
# Makes the day/night cycle something players notice. The game clock is
# unchanged (retail): one game day lasts 4 real hours, and night is game
# hours 0:00-5:59, about 1 real hour starting at 00:00, 04:00, 08:00,
# 12:00, 16:00 and 20:00 server time. 1 game minute = 10 real seconds.
#
# The night goes through phases, each announced on screen and in chat:
#   Dusk          - the last game minutes before midnight: tonight's Omen is told.
#   Night         - the Omen lies over the open world and Nightlords rise.
#   Witching Hour - the last game minutes of the night: the dead walk.
#   Dawn          - the first game minutes of the day: the Night Watch is rewarded.
#
# Players see the night with .night or on the Community Board (_bbsnight).
# GMs step through the phases with //night.

# Enable/disable the whole feature.
NightCycleEnabled = True

# Phase lengths, in game minutes (60 game minutes = 10 real minutes).
NightCycleDuskMinutes = 60
NightCycleWitchingHourMinutes = 60
NightCycleDawnMinutes = 60

# Show each phase on screen and in the announcement chat.
NightCycleAnnounce = True

# Red sky for players outside towns during a red Omen and the Witching Hour.
NightCycleRedSky = True

# =============================================================
# Night Omens
# =============================================================
# Each night rolls one Omen from this pool: a Hot Zone modifier laid over
# the whole open world (not towns, instances, sieges, arenas, PvP spots,
# jail, or raid bosses) from nightfall until the Witching Hour. An active
# hot zone keeps its own modifier. Hot zone coins, minibosses and the flat
# hot zone champion bonus stay in hot zones.
#
# Night-only Omens: NEW_MOON, FULL_MOON, STARFALL.
# Modifiers that need a hot zone (player buffs, bounties, Heat, HP drain,
# Kinship, Contested Ground) are left out even if listed.
NightOmensEnabled = True
NightOmenPool = BLOOD_MOON,RESTLESS_DEAD,HORNETS_NEST,COVEN,THIEVES_DEN,METAMORPHOSIS,LUCKY_STARS,SPLITTING_GROUND,CHAMPION_SURGE,NEW_MOON,FULL_MOON,STARFALL

# Omens that turn the sky red.
NightOmenRedSky = BLOOD_MOON

# =============================================================
# Witching Hour
# =============================================================
# In the last minutes of the night the Omen gives way to the WITCHING_HOUR
# modifier: slain monsters may rise again, undead hit harder, wave
# challenges are more common, and XP/SP is higher.
WitchingHourEnabled = True

# Chance (%) that a kill in the open world calls a wave challenger: a
# monster nearby starts a wave challenge.
WitchingHourWaveChance = 3.0

# How far (game units) from the kill the challenger is picked.
WitchingHourWaveRadius = 1200

# Waves of a Witching Hour challenger.
WitchingHourWaveCount = 3

# At dawn the sun burns the undead still fighting a player: they lose this
# percent of their current HP. 0 = off.
WitchingHourDawnBurnPercent = 30

# =============================================================
# Nightlords
# =============================================================
# Soon after nightfall one monster in each level bracket's hot zones (one
# not active in the rotation right now) is crowned Nightlord: a champion
# that must be beaten in several waves. Everyone who fought it gets a
# Sealed Cache on top of the wave challenge coins, and its killer is
# announced. At dawn the Nightlords still alive flee.
NightlordEnabled = True

# Real seconds after nightfall before the Nightlords rise.
NightlordSpawnDelay = 60

# Champion tier (0-3) and waves of a Nightlord.
NightlordChampionTier = 3
NightlordWaves = 4

# Combat archetype a Nightlord fights with (BALANCED, AGGRESSIVE, COWARD,
# SKILLFUL, MAGE, FIGHTER, SUPPORTER, RAGER). Empty = keep its own.
# The monster gets its own back when the Nightlord dies or flees.
NightlordArchetype = RAGER

# Tag shown first in a Nightlord's name plate.
NightlordTitleTag = [Nightlord]

# =============================================================
# Night Watch (ledger)
# =============================================================
# Counts each player's kills in the open world during the night. At dawn
# the best online players are announced and rewarded.
NightWatchEnabled = True

# Monsters more than this many levels below the player don't count.
NightWatchKillLevelGap = 9

# Points for a kill, and for helping slay a Nightlord.
NightWatchKillPoints = 1
NightWatchNightlordPoints = 100

# Points a player needs to be rewarded.
NightWatchMinPoints = 50

# Rewards of the 1st, 2nd and 3rd place: hot zone coins and Sealed Caches.
NightWatchCoinRewards = 500,250,100
NightWatchCacheRewards = 2,1,1

# A player who spends the night hunting outside towns (at least this many
# Night Watch kills), doesn't die, and is still out there at dawn has
# survived the night (a secret condition of the Midnight hidden quests).
NightWatchSurvivorMinKills = 20

# =============================================================
# Night Market and Thieves' Night
# =============================================================
# At nightfall Varro the Moonmonger (NPC 900360) opens his stalls in
# Giran, next to the Master Blacksmith, and packs up at dawn. He sells
# Sealed Caches, the low and high grade luminous (night) lures that
# fishermen don't stock, and other night wares for hot zone coins
# (multisells 900360 and 900361). He also changes hot zone coins into
# Ancient Adena (multisell 900362), 22 per coin: a little less than the
# standard way (a coin sells to a shop for 100 Adena, and the Black
# Marketeer of Mammon sells Ancient Adena at 4 Adena each, 25 per coin),
# but with no daily limit, level or hour requirement.
NightMarketEnabled = True

# Town fake players at night, in percent of FakeTownPlayersPerTown: the
# ones who leave are not replaced until the town is down to this.
NightMarketTownPopulation = 50

# Extra town fake player stores that open in each town at night. These
# sellers fence goods for adena - a rare find below its usual price,
# Sealed Caches, night lures - and pack up at dawn.
NightMarketBlackMarketStores = 2

# Thieves' Night: in the open world at night Thief monsters are this much
# more common, and a Thief with a full bag runs off into the dark (as in a
# Thieves' Den hot zone). Players this close see it on their radar.
NightThiefSpawnMultiplier = 2.0
NightThievesFlee = True
NightThiefRadarRange = 3000

# =============================================================
# Shadow Raids
# =============================================================
# At night, warbands of a fake clan (one at war with another fake clan if
# there is one) raid the open world near a player who hunts there. The
# raiders attack every player and roaming fake player nearby who isn't of
# their clan or alliance. Killing a raider is never a PK, pays hot zone
# coins and a Sealed Cache, and counts for the Night Watch. A raid ends
# when its warband falls, after NightRaidDuration, or at dawn.
# Needs the roaming fake players (config/Custom/FakePlayerPvp.ini).
NightRaidEnabled = True

# Raids per night. The first comes a few minutes after nightfall, the
# others at random times before the Witching Hour.
NightRaidCount = 2

# Raiders per warband (min-max). They land 800-1500 units from the player.
NightRaidSizeMin = 4
NightRaidSizeMax = 8

# Real minutes a raid lasts at most.
NightRaidDuration = 20

# How far (game units) a raider looks for someone to attack, and how many
# levels above and below its own a target may be.
NightRaidAggroRange = 900
NightRaidLevelsAbove = 8
NightRaidLevelsBelow = 10

# Hot zone coins for killing a raider, and the Night Watch points.
NightRaidKillCoins = 300
NightWatchRaiderPoints = 20

# =============================================================
# Moonlit Melee
# =============================================================
# At night the PvP spots want this many times their usual fighters
# (PvpSpotFightersMin/Max in PvpSpots.ini). At dawn the leader of each spot
# (the longest kill streak) is announced as its Night King; a player
# Night King gets hot zone coins and a Sealed Cache.
NightPvpSpotFighterMultiplier = 1.5
NightKingCoins = 1000

# =============================================================
# Children of the Night
# =============================================================
# Each race feels the night (Dark Elves keep the retail Shadow Sense):
#   Human  - Watchfire:       HP regeneration and Accuracy
#   Elf    - Starlight:       MP regeneration and Casting speed
#   Orc    - Blood Moon Fury: P.Atk
#   Dwarf  - Forgelight:      P.Def and Accuracy
#   Kamael - Dusk Wings:      Speed
# The bonuses only apply at night (a GM-forced night too).
NightRaceTraitsEnabled = True

# Percent bonuses, and flat ones for Accuracy and Speed.
NightTraitHumanHpRegen = 20
NightTraitHumanAccuracy = 3
NightTraitElfMpRegen = 25
NightTraitElfCastSpeed = 5
NightTraitOrcPAtk = 6
NightTraitDwarfPDef = 8
NightTraitDwarfAccuracy = 3
NightTraitKamaelSpeed = 8
