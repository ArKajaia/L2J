# ---------------------------------------------------------------------------
# Fake players
# ---------------------------------------------------------------------------
# Our fake player system uses the existing NPC system, allowing fake players
# to function seamlessly like NPCs with minimal impact on server performance.

# Enable fake players.
EnableFakePlayers = True

# Enable chatting with fake players.
FakePlayerChat = True

# Enable shots usage for fake players.
FakePlayerUseShots = True

# Reward PvP kills by killing fake players.
FakePlayerKillsRewardPvP = True

# Fake player kills apply karma rules.
FakePlayerUnflaggedKillsKarma = True

# Fake players can be attacked without PvP flagging.
FakePlayerAutoAttackable = False

# Aggressive AI fake players attack nearby monsters.
FakePlayerAggroMonsters = True

# Aggressive AI fake players attack nearby players.
FakePlayerAggroPlayers = False

# Aggressive AI fake players attack nearby fake players.
FakePlayerAggroFPC = False

# Fake players can drop items when killing monsters.
FakePlayerCanDropItems = False

# Fake players can pickup dropped items.
FakePlayerCanPickup = True

# ---------------------------------------------------------------------------
# Town fake players
# ---------------------------------------------------------------------------
# Peaceful fake players that walk around the towns: they wander between the
# town respawn points, sometimes run, stop or sit down for a while. They look
# like characters of a level that fits the town (class, gear and enchant from
# data/FakePlayerPvp.xml), can be whispered (FakePlayerChat) and can't be
# attacked. Requires EnableFakePlayers = True.

# Enable town fake players.
FakeTownPlayersEnabled = True

# How many fake players walk around each town.
FakeTownPlayersPerTown = 12

# Towns, as map region names (data/mapregion) with the level range of their
# fake players and, optionally, the race most of them are (starting villages).
# Format: region:minLevel-maxLevel[:RACE],...
FakeTownPlayersTowns = talking_island_town:1-20:HUMAN,elf_town:1-20:ELF,darkelf_town:1-20:DARK_ELF,orc_town:1-20:ORC,dwarf_town:1-20:DWARF,kamael_town:1-20:KAMAEL,gludin_town:10-30,gludio_castle_town:15-40,dion_castle_town:20-45,floran_town:20-45,giran_castle_town:30-65,heiness_town:40-70,oren_castle_town:40-70,hunter_town:45-75,aden_town:55-85,godard_town:60-85,rune_town:60-85,town_of_schuttgart:60-85

# How far (in game units) a fake player strolls from where it stands in one go.
# Now and then it walks over to another respawn point of the town instead.
FakeTownPlayersWanderRange = 500

# Chance (in %) that a fake player of a town with a race is of that race.
FakeTownPlayersRaceChance = 60
