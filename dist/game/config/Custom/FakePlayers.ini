# ---------------------------------------------------------------------------
# Fake players
# ---------------------------------------------------------------------------
# Our fake player system uses the existing NPC system, allowing fake players
# to function seamlessly like NPCs with minimal impact on server performance.

# Enable fake players.
EnableFakePlayers = True

# Enable chatting with fake players.
FakePlayerChat = True

# Enable shots usage for fake players.
FakePlayerUseShots = True

# Reward PvP kills by killing fake players.
FakePlayerKillsRewardPvP = True

# Fake player kills apply karma rules.
FakePlayerUnflaggedKillsKarma = True

# Fake players can be attacked without PvP flagging.
FakePlayerAutoAttackable = False

# Aggressive AI fake players attack nearby monsters.
FakePlayerAggroMonsters = True

# Aggressive AI fake players attack nearby players.
FakePlayerAggroPlayers = False

# Aggressive AI fake players attack nearby fake players.
FakePlayerAggroFPC = False

# Fake players can drop items when killing monsters.
FakePlayerCanDropItems = False

# Fake players can pickup dropped items.
FakePlayerCanPickup = True

# ---------------------------------------------------------------------------
# Town fake players
# ---------------------------------------------------------------------------
# Peaceful fake players that come and go in the towns like players do. They
# arrive next to the gatekeeper, at a respawn point (Scroll of Escape) or log
# in somewhere, sometimes a whole party back from a hunt saying goodbye. Then
# each one has its own plan: warehouse, grocer, blacksmith, shops, masters and
# quest npcs, buffs from the Newbie/Adventurers' Guide or from a buffer of the
# town, talking with others in general chat, standing or sitting around, and
# finally a gatekeeper, the community board teleport or logging off. Someone
# new arrives a while later. Which npcs, where to stand, how long everything
# takes and how they type is random and differs per fake player, so they don't
# repeat the same pattern. A few sit in private stores selling materials (see
# FakeTownPlayersStores), newbies ask around for a little adena, and they turn
# to players walking by and sometimes say hello. The npcs and walkable spots
# are found in each town itself (no coordinates to maintain). They look like
# characters of a level that fits the town (class, gear and enchant from
# data/FakePlayerPvp.xml), can be whispered (FakePlayerChat) and can't be
# attacked.
# //faketown shows them per town and what the targeted one is doing.
# Requires EnableFakePlayers = True.

# Enable town fake players.
FakeTownPlayersEnabled = True

# How many fake players are in each town on average (see
# FakeTownPlayersPopulationVariation).
FakeTownPlayersPerTown = 12

# Towns, as map region names (data/mapregion) with the level range of their
# fake players and, optionally, the race most of them are (starting villages).
# Format: region:minLevel-maxLevel[:RACE],...
FakeTownPlayersTowns = talking_island_town:1-20:HUMAN,elf_town:1-20:ELF,darkelf_town:1-20:DARK_ELF,orc_town:1-20:ORC,dwarf_town:1-20:DWARF,kamael_town:1-20:KAMAEL,gludin_town:10-30,gludio_castle_town:15-40,dion_castle_town:20-45,floran_town:20-45,giran_castle_town:30-65,heiness_town:40-70,oren_castle_town:40-70,hunter_town:45-75,aden_town:55-85,godard_town:60-85,rune_town:60-85,town_of_schuttgart:60-85

# How far (in game units) a fake player strolls from where it stands when it
# just walks around a bit.
FakeTownPlayersWanderRange = 500

# Chance (in %) that a fake player of a town with a race is of that race.
FakeTownPlayersRaceChance = 60

# Fake players talk in general chat: a few standing together, someone asking a
# buffer for buffs, now and then someone looking for a party or selling
# something. Only players close by see it, like the general chat of players.
FakeTownPlayersChat = True

# How often they talk, in % (100 = default, 50 = half as often, 0 = never).
FakeTownPlayersChatRate = 100

# Buffers (prophets, elders, shillien elders, warcryers, swordsingers,
# bladedancers) that stay in each town whose level range reaches 40, sit near
# the gatekeeper and buff the fake players that ask. 0 = none.
FakeTownPlayersBuffers = 1

# How much the number of fake players of a town drifts up and down over time,
# in % of FakeTownPlayersPerTown (0 = always the same number).
FakeTownPlayersPopulationVariation = 25

# How long they stay in town, in % (100 = default: a quick stop for buffs takes
# a couple of minutes, a player hanging around up to 45, an AFK one more).
FakeTownPlayersStayScale = 100

# Fake players sitting in a private store in each town (on top of
# FakeTownPlayersPerTown), selling 1-3 kinds of crafting materials, 1-50 of
# each, worth more the higher their level, at 1.5 to 5 times the reference
# price of the item. Players can buy from them like from any private store;
# the items are created when bought. 0 = no stores.
FakeTownPlayersStores = 3

# Chance (in %) that a fake player store also sells a rare find (enchant
# scrolls, life stones, attribute stones, codex...), at the same 1.5 to 5 times.
FakeTownPlayersStoreRareChance = 12

# Low level fake players now and then walk up to someone (a player or another
# fake player) and ask for a little adena.
FakeTownPlayersBeggars = True
