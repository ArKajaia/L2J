# ---------------------------------------------------------------------------
# Team vs Team (TvT)
# ---------------------------------------------------------------------------
# Every TvTSchedule the TvT Event Manager opens registration (in Giran, see
# TvTManagerLocations) for TvTRegistrationTime minutes, on a map picked by
# chance among TvTMaps (data/maps). Then every level bracket with registered
# players gets its own instance (copy) of that map's place: Blue spawns on
# one side, Red on the other, TvTTeamSize against TvTTeamSize.
#  - A party always plays in one team. A party whose members are in different
#    brackets is broken up: each member goes to the instance of their own
#    bracket (members of the same bracket stay together).
#  - Real players are spread evenly between the teams. The free places of
#    each team are filled with fake players of the bracket's levels: a party
#    of players gets fake players up to TvTPartySize (the roles it lacks: a
#    tank, a healer, an archer...), and the rest of the team are parties of
#    fake players that fight together (they call targets, heal, buff and
#    resurrect each other).
#  - Faction rules for the teams: the other team is attacked without Ctrl,
#    the own team can't be hurt even with Ctrl, no kill gives karma or drops
#    items, and everyone shows a blue or red circle and name color. Killing
#    an enemy (a player or a fake player) is a PvP for the killer, here as in
#    the Deathmatch, Conquest and Race Wars.
#  - The dead come back at their base after TvTRespawnDelay seconds (there is
#    no To Village button: it took players out of the match). Each kill
#    gives the killer a random Sealed Cache (TvTKillRewards). After
#    TvTFightTime minutes the team with the most kills wins, and every player
#    of it gets TvTWinReward. The three best players of the whole winning
#    team (all its parties together) get TvTTopRewards too.
# Fake players need EnableFakePlayers = True in FakePlayers.ini and
# FakePvpEnabled = True in FakePlayerPvp.ini. Without them a bracket only runs
# with enough real players for both teams (TvTMinPlayers).

# Enable the event.
# Default: True
TvTEnabled = True

# When registration opens, as a schedule pattern: minutes hours day-of-month
# month day-of-week. Default: every 2 hours, on the hour. Not used while the
# event rotation is on (EventRotation.ini): the events take turns there.
# Default: 0 */2 * * *
TvTSchedule = 0 */2 * * *

# Minutes registration stays open.
# Default: 10
TvTRegistrationTime = 10

# Seconds between the teleport and the start of the fight: buffs, getting
# ready. Nobody leaves their base meanwhile.
# Default: 60
TvTPrepTime = 60

# Minutes of fighting.
# Default: 20
TvTFightTime = 20

# Places per team (real players and fake players).
# Default: 20
TvTTeamSize = 20

# Size of the parties of a team. A party of players smaller than this gets
# fake players up to it (a bigger one stays as it is), and the rest of the
# team are parties of fake players of this size.
# Default: 7
TvTPartySize = 7

# Fewest real players a bracket needs to run. With fake players a single
# player is enough. Without fake players at least 2 are needed (one a side).
# Default: 1
TvTMinPlayers = 1

# The level brackets, lowest level-highest level, separated by ;
# A player of a level outside every bracket can't register.
# Default: 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85
TvTBrackets = 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85

# The maps a registration picks from, by id (the file names in data/maps),
# separated by , One is picked by chance, and all the matches of that
# registration play on it. Empty: any map ticked for Team vs Team with bases
# for both teams. The event maps are shared by TvT, Conquest and Deathmatch:
# a map is ticked for the events that may use it and holds each one's
# points (TvT: the bases of each team), with one fence round the field, one
# edge on the radar and one set of doors. GMs make and edit them on the map
# page (//tvt map) or in game (//tvt set, //tvt show).
# Default: (empty)
TvTMaps =

# Distance from a spawn point that counts as a base: everyone spawns within
# TvTSpawnRadius of it; during the preparation nobody leaves the first one,
# and a base is safe: nobody standing in their own base can hurt anyone or be
# hurt, so a team can't camp the other's base or shoot out of its own.
# During the fight whoever walks into an enemy base is stunned there until it
# dies, and the base's team may kill it from inside its base.
# Default: 150
TvTSpawnRadius = 150
# Default: 700
TvTBaseRadius = 700

# Players coming this close to the edge of an enemy base are warned on screen
# that it stuns them. Fake players turn back. 0: no warning.
# Default: 500
TvTBaseWarningDistance = 500

# Seconds before the dead come back at a base. They come back in waves: the
# ones of a team that die within a few seconds of each other come back
# together, at the same spawn point. Players and fake players coming back
# can't be hurt for TvTSpawnProtection seconds, or until they hurt someone
# (0: no protection).
# Default: 10
TvTRespawnDelay = 10
# Default: 15
TvTSpawnProtection = 15

# Reward of the killer for each kill (real players only): one item, picked
# by chance. itemId,count,chance;itemId,count,chance... (chances add up to 100).
# Default: Sealed Cache Common 80%, Rare 17%, Epic 3%.
# Default: 6492,1,80;6499,1,17;6509,1,3
TvTKillRewards = 6492,1,80;6499,1,17;6509,1,3

# Reward of every player of the winning team: itemId,count;itemId,count...
# A tie rewards nobody.
# Default: 10 Champion Medals
# Default: 6393,10
TvTWinReward = 6393,10

# Extra reward of the best players of the whole winning team, Blue or Red,
# counted across all its parties (real players only, most kills first, fewer
# deaths first on a tie, at least one kill): Crystal Scrolls of the grade
# they compete in (their expertise: D, C, B, A, or S for S, S80 and S84).
# One entry per place, first place first:
# weapon,count;armor,count;... Empty for none. A tie rewards nobody.
# Default: 1st place 1 Crystal Scroll: Enchant Weapon, 2nd place 2 Crystal
# Scroll: Enchant Armor, 3rd place 1 Crystal Scroll: Enchant Armor.
# Default: weapon,1;armor,2;armor,1
TvTTopRewards = weapon,1;armor,2;armor,1

# Where the TvT Event Manager stands during registration: x,y,z,heading;...
# Default: Giran
# Default: 83425,148585,-3406,32938
TvTManagerLocations = 83425,148585,-3406,32938

# Name colors of the teams, written like the client and the faction system
# write them: BBGGRR (blue first, red last).
# Default: FF9F7F
TvTBlueNameColor = FF9F7F
# Default: 5F5FFF
TvTRedNameColor = 5F5FFF

# TvT Event buff template: on the Community Board's Buff Templates page every
# player has a "TvT Event" template, filled from the buffs below and from the
# player's own class buffs. The event gives its buffs, then full HP, CP and
# MP, when the player enters a match and every time the player comes back at
# the base. It can't be used outside the event.
# Default: True
TvTBuffTemplate = True

# The buffs a TvT Event template may hold besides the player's own:
# skillId or skillId,level separated by ; (no level: the highest one).
# Default: the usual buffer buffs, dances and songs.
# Default: 1204;1068;1040;1036;1035;1045;1048;1086;1085;1062;1077;1240;1242;1268;1059;1303;1078;1087;1397;1032;1073;1044;1182;1191;1189;1033;1392;1393;271;272;273;274;275;310;264;265;266;267;268;269;304;349;363;364
TvTBuffs = 1204;1068;1040;1036;1035;1045;1048;1086;1085;1062;1077;1240;1242;1268;1059;1303;1078;1087;1397;1032;1073;1044;1182;1191;1189;1033;1392;1393;271;272;273;274;275;310;264;265;266;267;268;269;304;349;363;364

# ---------------------------------------------------------------------------
# Deathmatch
# ---------------------------------------------------------------------------
# Every one for themselves, on the event maps ticked for Deathmatch
# (data/maps, the same maps as TvT and Conquest), registered for at the
# TvT Event Manager like TvT (in turn with TvT and Conquest, see
# EventRotation.ini; //tvt dm open opens it by hand). The level brackets,
# TvTRegistrationTime, TvTPrepTime, TvTSpawnProtection, TvTKillRewards and
# the TvT Event buff template are the TvT ones.
#  - A map has its own Deathmatch spawn points, placed by GMs on the map
#    page (//tvt map dm; its Scatter button puts open ground spots on the
#    field) or in game (//tvt set <map> dm new). Everyone spawns at one of
#    them picked by chance, as far from the other fighters as a few tries
#    find, and before the fight doesn't leave it. The dead come back at
#    another one DeathmatchRespawnDelay seconds after dying.
#  - Everyone else is attacked without Ctrl; a party plays as its members
#    alone. No kill gives karma. The free places are filled with fake players
#    (damage dealers, each on its own) of the bracket's levels.
#  - After DeathmatchFightTime minutes the most kills wins (a tie for the
#    first place: no winner). The players are ranked among themselves (the
#    fake players left out): the best gets DeathmatchWinReward, and the
#    places DeathmatchTopRewards (players with a kill or more).

# Enable the Deathmatch.
# Default: True
DeathmatchEnabled = True

# Fighters per match, players and fake players. More players than that in a
# bracket play several matches.
# Default: 20
DeathmatchSize = 20

# Minutes of fighting.
# Default: 20
DeathmatchFightTime = 20

# Seconds before the dead come back (each on its own, at a spot picked by
# chance).
# Default: 10
DeathmatchRespawnDelay = 10

# The maps a Deathmatch registration picks from, by id (data/maps), separated
# by , Empty: any map ticked for Deathmatch with at least 2 spawn points.
# Default: (empty)
DeathmatchMaps =

# Reward of the best player: itemId,count;itemId,count... A tie for the
# first place rewards nobody.
# Default: 10 Champion Medals
# Default: 6393,10
DeathmatchWinReward = 6393,10

# Extra reward of the best players, first place first: Crystal Scrolls of
# their grade, weapon,count;armor,count;... (see TvTTopRewards). Empty for
# none.
# Default: weapon,1;armor,2;armor,1
DeathmatchTopRewards = weapon,1;armor,2;armor,1

# Name color of the Deathmatch fighters (BBGGRR).
# Default: FFFFFF
DeathmatchNameColor = FFFFFF

# ---------------------------------------------------------------------------
# Passive Deathmatch
# ---------------------------------------------------------------------------
# A second kind of Deathmatch, registered for at the TvT Event Manager like
# the other one (in the rotation as PassiveDeathmatch, see EventRotation.ini;
# //tvt pdm open opens it by hand). It plays like the Deathmatch above, with
# its size, fight time, respawn delay, rewards and name color, but:
#  - Everyone fights with a blank passive tree: their own allocation stops
#    applying (stats, keystones and the skills it grants) for the match.
#  - Each kill (of a player or a fake player) lets the killer pick 1 of
#    PassiveDeathmatchChoices passives picked by chance among the strong
#    nodes of the tree (PassiveDeathmatchNodeTypes): the more one kills, the
#    stronger one gets. Fake players pick too, at once, by the weights their
#    class grows its own tree with (keys of its role and build, gear, the
#    FakePvpKeystones lists), each with a style and jitter of its own; by
#    chance when nothing offered is of use to them.
#  - No window opens in the middle of a fight: a kill blinks the tutorial ?
#    icon, which opens the pick window when clicked. The window opens by
#    itself when the player dies with picks waiting, and again after each
#    pick while another one waits. The ? blinks again on respawn, and
#    .dmpick opens the window any time.
#  - A pick that isn't made waits: closing the window, dying or killing again
#    loses nothing. Picks queue up.
#  - The event tree only exists in memory while the player is in the match:
#    it is never saved, can't be parked in a template, and the player's own
#    tree (which can't be changed meanwhile) comes back as it was when the
#    match ends, the player leaves or logs off, or the server restarts.

# Enable the Passive Deathmatch.
# Default: True
PassiveDeathmatchEnabled = True

# The maps a Passive Deathmatch registration picks from, by id (data/maps),
# separated by , Empty: the DeathmatchMaps ones.
# Default: (empty)
PassiveDeathmatchMaps =

# How many passives a kill offers to pick 1 from (1-5).
# Default: 3
PassiveDeathmatchChoices = 3

# The kinds of passive tree nodes offered, separated by , (NOTABLE,
# KEYSTONE, MASTER, SMALL). Nodes that grant a skill are never offered.
# Default: NOTABLE,KEYSTONE
PassiveDeathmatchNodeTypes = NOTABLE,KEYSTONE

# Nodes with any of these effects are never offered (loot and PvE-only
# bonuses, useless in a PvP match), separated by ,
# Default: DROP_RATE_PCT,SPOIL_RATE_PCT,ADENA_RATE_PCT,EXP_RATE_PCT,SP_RATE_PCT,PVE_PDMG_PCT,PVE_MDMG_PCT,PVE_BOW_DMG_PCT
PassiveDeathmatchExcludedEffects = DROP_RATE_PCT,SPOIL_RATE_PCT,ADENA_RATE_PCT,EXP_RATE_PCT,SP_RATE_PCT,PVE_PDMG_PCT,PVE_MDMG_PCT,PVE_BOW_DMG_PCT
