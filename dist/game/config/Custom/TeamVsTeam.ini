# ---------------------------------------------------------------------------
# Team vs Team (TvT)
# ---------------------------------------------------------------------------
# Every TvTSchedule the TvT Event Manager opens registration (in Giran, see
# TvTManagerLocations) for TvTRegistrationTime minutes. Then every level
# bracket with registered players gets its own instance of the Ruins of
# Despair: Blue spawns on one side, Red on the other, TvTTeamSize against
# TvTTeamSize.
#  - A party always plays in one team. A party whose members are in different
#    brackets is broken up: each member goes to the instance of their own
#    bracket (members of the same bracket stay together).
#  - Real players are spread evenly between the teams. The free places of
#    each team are filled with fake players of the bracket's levels: a party
#    of players gets fake players up to TvTPartySize (the roles it lacks: a
#    tank, a healer, an archer...), and the rest of the team are parties of
#    fake players that fight together (they call targets, heal, buff and
#    resurrect each other).
#  - Faction rules for the teams: the other team is attacked without Ctrl,
#    the own team can't be hurt even with Ctrl, no kill gives karma or drops
#    items, and everyone shows a blue or red circle and name color.
#  - The dead come back at their base after TvTRespawnDelay seconds (there is
#    no To Village button: it took players out of the match). Each kill
#    gives the killer a random Sealed Cache (TvTKillRewards). After
#    TvTFightTime minutes the team with the most kills wins, and every player
#    of it gets TvTWinReward.
# Fake players need EnableFakePlayers = True in FakePlayers.ini and
# FakePvpEnabled = True in FakePlayerPvp.ini. Without them a bracket only runs
# with enough real players for both teams (TvTMinPlayers).

# Enable the event.
# Default: True
TvTEnabled = True

# When registration opens, as a schedule pattern: minutes hours day-of-month
# month day-of-week. Default: every 2 hours, on the hour.
# Default: 0 */2 * * *
TvTSchedule = 0 */2 * * *

# Minutes registration stays open.
# Default: 10
TvTRegistrationTime = 10

# Seconds between the teleport and the start of the fight: buffs, getting
# ready. Nobody leaves their base meanwhile.
# Default: 60
TvTPrepTime = 60

# Minutes of fighting.
# Default: 20
TvTFightTime = 20

# Places per team (real players and fake players).
# Default: 20
TvTTeamSize = 20

# Size of the parties of a team. A party of players smaller than this gets
# fake players up to it (a bigger one stays as it is), and the rest of the
# team are parties of fake players of this size.
# Default: 7
TvTPartySize = 7

# Fewest real players a bracket needs to run. With fake players a single
# player is enough. Without fake players at least 2 are needed (one a side).
# Default: 1
TvTMinPlayers = 1

# The level brackets, lowest level-highest level, separated by ;
# A player of a level outside every bracket can't register.
# Default: 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85
TvTBrackets = 41-45;46-50;51-55;56-60;61-65;66-70;71-75;76-78;79-81;82-84;85-85

# The spawn points of the teams: x,y,z,heading;x,y,z,heading... A team starts
# at its first one. Its dead come back in waves at one of them, picked by
# chance for each wave, so the other team can't wait for them at one spot.
# Each one is a base of its team (see TvTBaseRadius).
# Default: in the walled bowl of the Ruins of Despair (the sunken ruins south
# of the Gludio teleport), each team on its own half of the ring wall, as far
# from the other as the bowl allows (at least 8,100 on foot): Blue at the
# North Gate, the north wall and the north-west wall, Red just inside the
# South Gate, the south wall and the south-east wall. The two starts are as
# far from the middle on foot (Red outside its gate came strung out through
# it, and later).
# Default: -17200,147000,-3704,46757;-19800,146600,-3736,52784;-21600,145400,-3760,57879
TvTBlueBase = -17200,147000,-3704,46757;-19800,146600,-3736,52784;-21600,145400,-3760,57879
# Default: -20200,138700,-3896,11380;-16400,138400,-3792,20956;-14600,139400,-3792,25627
TvTRedBase = -20200,138700,-3896,11380;-16400,138400,-3792,20956;-14600,139400,-3792,25627

# Distance from a spawn point that counts as a base: everyone spawns within
# TvTSpawnRadius of it; during the preparation nobody leaves the first one,
# and a base is safe: nobody standing in their own base can hurt anyone or be
# hurt, so a team can't camp the other's base or shoot out of its own.
# During the fight whoever walks into an enemy base is stunned there until it
# dies, and the base's team may kill it from inside its base.
# Default: 150
TvTSpawnRadius = 150
# Default: 700
TvTBaseRadius = 700

# Players coming this close to the edge of an enemy base are warned on screen
# that it stuns them. Fake players turn back. 0: no warning.
# Default: 500
TvTBaseWarningDistance = 500

# A fence round the field that nobody gets through, players or fake players:
# middle x,y and radius along x,y of an ellipse (radii at least 500). It must
# hold every spawn point with its base. The default closes the ring wall of
# the Ruins of Despair (open on all sides) with every base at least 860 inside.
# Empty: no fence.
# Default: -17800,142600,5900,5300
TvTBarrier = -17800,142600,5900,5300

# The edge of the battlefield the players' radar shows when there is no
# TvTBarrier (the radar then shows the fence): minX,minY,maxX,maxY.
# Only drawn, nobody is held inside it. Empty: the box around every spawn
# point of both teams, 2000 wider on each side.
# Default: (empty)
TvTArea =

# Seconds before the dead come back at a base. They come back in waves: the
# ones of a team that die within a few seconds of each other come back
# together, at the same spawn point. Players and fake players coming back
# can't be hurt for TvTSpawnProtection seconds, or until they hurt someone
# (0: no protection).
# Default: 10
TvTRespawnDelay = 10
# Default: 15
TvTSpawnProtection = 15

# Reward of the killer for each kill (real players only): one item, picked
# by chance. itemId,count,chance;itemId,count,chance... (chances add up to 100).
# Default: Sealed Cache Common 80%, Rare 17%, Epic 3%.
# Default: 6492,1,80;6499,1,17;6509,1,3
TvTKillRewards = 6492,1,80;6499,1,17;6509,1,3

# Reward of every player of the winning team: itemId,count;itemId,count...
# A tie rewards nobody.
# Default: 10 Champion Medals
# Default: 6393,10
TvTWinReward = 6393,10

# Where the TvT Event Manager stands during registration: x,y,z,heading;...
# Default: Giran
# Default: 83425,148585,-3406,32938
TvTManagerLocations = 83425,148585,-3406,32938

# Name colors of the teams, written like the client and the faction system
# write them: BBGGRR (blue first, red last).
# Default: FF9F7F
TvTBlueNameColor = FF9F7F
# Default: 5F5FFF
TvTRedNameColor = 5F5FFF

# TvT Event buff template: on the Community Board's Buff Templates page every
# player has a "TvT Event" template, filled from the buffs below and from the
# player's own class buffs. The event gives its buffs, then full HP, CP and
# MP, when the player enters a match and every time the player comes back at
# the base. It can't be used outside the event.
# Default: True
TvTBuffTemplate = True

# The buffs a TvT Event template may hold besides the player's own:
# skillId or skillId,level separated by ; (no level: the highest one).
# Default: the usual buffer buffs, dances and songs.
# Default: 1204;1068;1040;1036;1035;1045;1048;1086;1085;1062;1077;1240;1242;1268;1059;1303;1078;1087;1397;1032;1073;1044;1182;1191;1189;1033;1392;1393;271;272;273;274;275;310;264;265;266;267;268;269;304;349;363;364
TvTBuffs = 1204;1068;1040;1036;1035;1045;1048;1086;1085;1062;1077;1240;1242;1268;1059;1303;1078;1087;1397;1032;1073;1044;1182;1191;1189;1033;1392;1393;271;272;273;274;275;310;264;265;266;267;268;269;304;349;363;364
