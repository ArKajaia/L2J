# Reuse multipliers of some skills for some classes, for players and roaming
# fake players alike: classes:skills*multiplier, groups separated by ";".
# Classes by id or name, skills by id.
# The tanks' self-heals take twice as long to come back (Divine Heal, Holy
# Blessing, Elemental Heal for the Elven knights; docs/class-balance-85.md).
# The top five of the level 85 matrix wait longer for their stuns (Shield Stun,
# Hammer Crush, Stun Attack, Armor Crush, Shock Blast, Shoulder Charge: x1.5)
# and the Doombringer for Disarm (x2). Hell Knight's Judgment comes back half as
# often (x2), Maestro's Golem Punch (the golem's) and Rush Impact x1.5.
