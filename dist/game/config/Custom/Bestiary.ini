# ---------------------------------------------------------------------------
# Bestiary
# ---------------------------------------------------------------------------
# Every monster a player kills goes into the bestiary, a collection on the web
# page of the passive tree server (".bestiary" sends the link). The bestiary is
# the account's: all its characters add to the same one and have its bonuses.
# Monsters never killed show as a dark silhouette with their level and where
# they live, so the page doubles as a list of what is still left to find.
#
# An entry goes through four tiers as the account kills more of that monster,
# and each tier shows more about it:
#   Discovered - name, portrait, level, race, HP and MP, EXP and SP, where it lives
#   Studied    - combat stats, elements, skills
#   Mastered   - drops and spoils, with their chances at the server's rates
#   Legendary  - a gold frame
#
# Bonuses:
#   Drops      - each tier makes the monster's items drop more often (a higher
#                chance, never an extra roll), see BestiaryDropBonus.
#   Region EXP - the monsters of a region (a folder of the spawn files, as the
#                page's Hunting Grounds tab groups them) give more EXP the more
#                of them the account found and the higher their tiers, see
#                BestiaryRegionExpBonus.
#
# Kills are counted in memory and written in batches (table account_bestiary,
# created at startup), at logout, and at shutdown. A bestiary kept per
# character before (table character_bestiary) is added up into the accounts at
# the first start.
#
# Each monster has a profile page (click it in the collection). With the
# monsters' 3D models taken from your client (client/Bestiary/README.txt), the
# page shows the model, which can be turned around, and //bestiary opens the
# bake page that makes the portraits of the collection. Monsters not found yet
# show as their black silhouette.
# ---------------------------------------------------------------------------

# Enable the bestiary.
# Default: True
BestiaryEnabled = True

# Kills a monster needs to reach each tier: Discovered, Studied, Mastered,
# Legendary (all of the account's characters together), each more than the
# one before: 1,2,3,4 shows everything after four kills.
# Default: 1,50,200,1000
BestiaryTiers = 1,50,200,1000

# The same for raid bosses and grand bosses.
# Default: 1,3,5,10
BestiaryBossTiers = 1,3,5,10

# Show the names of monsters the account has not killed yet.
# Default: False
BestiaryShowUndiscoveredNames = False

# Show where monsters the account has not killed yet live (the hunting grounds
# and the map), as a hint of where to look.
# Default: True
BestiaryShowUndiscoveredAreas = True

# A kill also counts for the party members near the monster (the party range),
# so healers and buffers fill their bestiary too. It counts once per account.
# Default: True
BestiaryPartyCredit = True

# Tell the player in chat when they discover a monster.
# Default: True
BestiaryDiscoveryMessages = True

# Tell the player in chat when an entry reaches a new tier.
# Default: True
BestiaryTierMessages = True

# Also show discoveries and new tiers on screen.
# Default: True
BestiaryScreenMessages = True

# Set off a firework when an entry reaches Studied or Mastered, and a Large
# Firework when it becomes Legendary (seen by the players around).
# Default: True
BestiaryFireworks = True

# The npc types that make up the collection: the monsters of these types that
# are spawned in the world (spawn files, raid bosses, grand bosses). Monsters of
# other types, or only met in instances and quests, are still counted when
# killed, and show as "found elsewhere" without counting toward completion.
# Default: Monster,RaidBoss,GrandBoss,FeedableBeast,Chest,RiftInvader
BestiaryTypes = Monster,RaidBoss,GrandBoss,FeedableBeast,Chest,RiftInvader

# Npc ids left out of the collection (comma separated).
# Default:
BestiaryExcludedNpcIds =

# Npc ids added to the collection although they are not spawned in the world
# (instance or quest monsters you want collected, comma separated).
# Default:
BestiaryExtraNpcIds =

# How often (seconds) the kills that changed are written to the database.
# Default: 60
BestiaryStoreInterval = 60

# How often (minutes) the server-wide numbers are counted again: kills of each
# monster, hunters who found it, who found it first, and the ranking.
# Default: 10
BestiaryServerStatsInterval = 10

# How many hunters the ranking shows (5-100). Each hunter is an account, shown
# by its highest character; accounts with a game master are left out.
# Default: 20
BestiaryRankingSize = 20

# ---------------------------------------------------------------------------
# Bonuses
# ---------------------------------------------------------------------------

# How much more often (percent) a monster's items drop at each tier of its
# entry: Discovered, Studied, Mastered, Legendary. It multiplies the chance of
# each item (not adena or herbs, nor spoils), like the server's drop rates: 25
# makes a 10% item drop 12.5% of the time. The bonus is the account's of the
# player whose drop it is: the top damage dealer, or the leader of the party
# that did the most damage. Use 0,0,0,0 for none.
# Default: 0,10,25,50
BestiaryDropBonus = 0,10,25,50

# The same for raid bosses and grand bosses.
# Default: 0,5,10,20
BestiaryBossDropBonus = 0,5,10,20

# How much more EXP (percent) the monsters of a region give when every monster
# of the region is at a tier: Discovered, Studied, Mastered, Legendary. Each
# monster counts for its share: with 40 monsters in a region, one Discovered
# adds 100/40 = 2.5%. So with the default, a region all Discovered gives twice
# the EXP and all Legendary four times as much, and a region half Discovered
# gives 1.5 times as much. The region's raid and grand bosses count too, at
# their own tiers. It multiplies the EXP of each player from the monster (in a
# party, each member's share with their own account's bonus); SP stays as it
# is. Use 0,0,0,0 for none.
# Default: 100,167,233,300
BestiaryRegionExpBonus = 100,167,233,300
