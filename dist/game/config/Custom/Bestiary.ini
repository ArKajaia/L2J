# ---------------------------------------------------------------------------
# Bestiary
# ---------------------------------------------------------------------------
# Every monster a character kills goes into its bestiary, a collection on the
# web page of the passive tree server (".bestiary" sends the link). Monsters
# never killed show as a dark silhouette with their level and where they live,
# so the page doubles as a list of what is still left to find.
#
# An entry goes through four tiers as the character kills more of that monster,
# and each tier shows more about it:
#   Discovered - name, portrait, level, race, HP and MP, EXP and SP, where it lives
#   Studied    - combat stats, elements, skills
#   Mastered   - drops and spoils, with their chances at the server's rates
#   Legendary  - a gold frame (the tier future rewards will build on)
#
# Kills are counted in memory and written in batches (table character_bestiary,
# created at startup), at logout, and at shutdown.
# ---------------------------------------------------------------------------

# Enable the bestiary.
# Default: True
BestiaryEnabled = True

# Kills a monster needs to reach each tier: Discovered, Studied, Mastered,
# Legendary. Use 1,1,1,1 to show everything on the first kill.
# Default: 1,50,200,1000
BestiaryTiers = 1,50,200,1000

# The same for raid bosses and grand bosses.
# Default: 1,3,5,10
BestiaryBossTiers = 1,3,5,10

# Show the names of monsters a character has not killed yet.
# Default: False
BestiaryShowUndiscoveredNames = False

# Show where monsters a character has not killed yet live (the hunting grounds
# and the map), as a hint of where to look.
# Default: True
BestiaryShowUndiscoveredAreas = True

# A kill also counts for the party members near the monster (the party range),
# so healers and buffers fill their bestiary too.
# Default: True
BestiaryPartyCredit = True

# Tell the player in chat when they discover a monster.
# Default: True
BestiaryDiscoveryMessages = True

# Tell the player in chat when an entry reaches a new tier.
# Default: True
BestiaryTierMessages = True

# Also show discoveries and new tiers on screen.
# Default: True
BestiaryScreenMessages = True

# Set off a firework when an entry reaches Studied or Mastered, and a Large
# Firework when it becomes Legendary (seen by the players around).
# Default: True
BestiaryFireworks = True

# The npc types that make up the collection: the monsters of these types that
# are spawned in the world (spawn files, raid bosses, grand bosses). Monsters of
# other types, or only met in instances and quests, are still counted when
# killed, and show as "found elsewhere" without counting toward completion.
# Default: Monster,RaidBoss,GrandBoss,FeedableBeast,Chest,RiftInvader
BestiaryTypes = Monster,RaidBoss,GrandBoss,FeedableBeast,Chest,RiftInvader

# Npc ids left out of the collection (comma separated).
# Default:
BestiaryExcludedNpcIds =

# Npc ids added to the collection although they are not spawned in the world
# (instance or quest monsters you want collected, comma separated).
# Default:
BestiaryExtraNpcIds =

# How often (seconds) the kills that changed are written to the database.
# Default: 60
BestiaryStoreInterval = 60

# How often (minutes) the server-wide numbers are counted again: kills of each
# monster, hunters who found it, who found it first, and the ranking.
# Default: 10
BestiaryServerStatsInterval = 10

# How many hunters the ranking shows (5-100).
# Default: 20
BestiaryRankingSize = 20
