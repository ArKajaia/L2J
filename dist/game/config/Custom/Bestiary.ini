# ---------------------------------------------------------------------------
# Bestiary
# ---------------------------------------------------------------------------
# Every monster a player kills goes into the bestiary, a collection on the web
# page of the passive tree server (".bestiary" sends the link). The bestiary is
# the account's: all its characters add to the same one and have its bonuses.
# Monsters never killed show as a dark silhouette with their level and where
# they live, so the page doubles as a list of what is still left to find.
#
# An entry goes through four tiers as the account kills more of that monster,
# and each tier shows more about it:
#   Discovered - name, portrait, level, race, HP and MP, EXP and SP, where it lives
#   Studied    - combat stats, elements, skills
#   Mastered   - drops and spoils, with their chances at the server's rates
#   Legendary  - a gold frame
#
# Bonuses:
#   Drops      - each tier makes the monster's items drop more often (a higher
#                chance, never an extra roll), see BestiaryDropBonus.
#   Region EXP - the monsters of a region (a folder of the spawn files, as the
#                page's Hunting Grounds tab groups them) give more EXP the more
#                of them the account found and the higher their tiers, see
#                BestiaryRegionExpBonus.
#   Slayer     - the account deals more damage to the monsters of a race and
#                takes less from them, the more of that race it found and the
#                higher their tiers, see BestiarySlayerDamageBonus.
#
# Bounties: every day each account gets a few monsters to hunt near its level.
# Their kills count more while the bounty is open, and finishing one pays.
#
# Each entry also remembers the rare forms of the monster the account killed
# (Champion, Mage, Infused, Resonant: the systems that are enabled) and its
# fastest kill. Raid and grand boss kills go into a log on the server (table
# bestiary_boss_kills) that their profile pages show.
#
# In game: ".bestiary bounties" lists the day's bounties, ".bestiary track
# <name>" points the radar at the nearest one of a monster (".bestiary untrack"
# clears it), and the Community Board has a Bestiary page (_bbsbestiary).
# Profile pages have a Track button while the character is in the game, and
# show at Studied how the monster fights: aggro and help ranges, the weapons
# that hurt it more or less, the debuffs it resists.
#
# Kills are counted in memory and written in batches (table account_bestiary,
# created at startup and given the columns it lacks), at logout, and at
# shutdown. Bounties are kept in account_bestiary_bounty. A bestiary kept per
# character before (table character_bestiary) is added up into the accounts at
# the first start.
#
# Each monster has a profile page (click it in the collection). With the
# monsters' 3D models taken from your client (client/Bestiary/README.txt), the
# page shows the model, which can be turned around, and //bestiary opens the
# bake page that makes the portraits of the collection. Monsters not found yet
# show as their black silhouette.
# ---------------------------------------------------------------------------

# Enable the bestiary.
# Default: True
BestiaryEnabled = True

# Kills a monster needs to reach each tier: Discovered, Studied, Mastered,
# Legendary (all of the account's characters together), each more than the
# one before: 1,2,3,4 shows everything after four kills.
# Default: 1,50,200,1000
BestiaryTiers = 1,50,200,1000

# The same for raid bosses and grand bosses.
# Default: 1,3,5,10
BestiaryBossTiers = 1,3,5,10

# Show the names of monsters the account has not killed yet.
# Default: False
BestiaryShowUndiscoveredNames = False

# Show where monsters the account has not killed yet live (the hunting grounds
# and the map), as a hint of where to look.
# Default: True
BestiaryShowUndiscoveredAreas = True

# A kill also counts for the party members near the monster (the party range),
# so healers and buffers fill their bestiary too. It counts once per account.
# Default: True
BestiaryPartyCredit = True

# Tell the player in chat when they discover a monster.
# Default: True
BestiaryDiscoveryMessages = True

# Tell the player in chat when an entry reaches a new tier.
# Default: True
BestiaryTierMessages = True

# Also show discoveries and new tiers on screen.
# Default: True
BestiaryScreenMessages = True

# Set off a firework when an entry reaches Studied or Mastered, and a Large
# Firework when it becomes Legendary (seen by the players around).
# Default: True
BestiaryFireworks = True

# The npc types that make up the collection: the monsters of these types that
# are spawned in the world (spawn files, raid bosses, grand bosses). Monsters of
# other types, or only met in instances and quests, are still counted when
# killed, and show as "found elsewhere" without counting toward completion.
# Default: Monster,RaidBoss,GrandBoss,FeedableBeast,Chest,RiftInvader
BestiaryTypes = Monster,RaidBoss,GrandBoss,FeedableBeast,Chest,RiftInvader

# Npc ids left out of the collection (comma separated).
# Default:
BestiaryExcludedNpcIds =

# Npc ids added to the collection although they are not spawned in the world
# (instance or quest monsters you want collected, comma separated).
# Default:
BestiaryExtraNpcIds =

# How often (seconds) the kills that changed are written to the database.
# Default: 60
BestiaryStoreInterval = 60

# How often (minutes) the server-wide numbers are counted again: kills of each
# monster, hunters who found it, who found it first, and the ranking.
# Default: 10
BestiaryServerStatsInterval = 10

# How many hunters the ranking shows (5-100). Each hunter is an account, shown
# by its highest character; accounts with a game master are left out.
# Default: 20
BestiaryRankingSize = 20

# ---------------------------------------------------------------------------
# Bonuses
# ---------------------------------------------------------------------------

# How much more often (percent) a monster's items drop at each tier of its
# entry: Discovered, Studied, Mastered, Legendary. It multiplies the chance of
# each item (not adena or herbs, nor spoils), like the server's drop rates: 25
# makes a 10% item drop 12.5% of the time. The bonus is the account's of the
# player whose drop it is: the top damage dealer, or the leader of the party
# that did the most damage. Use 0,0,0,0 for none.
# Default: 0,10,25,50
BestiaryDropBonus = 0,10,25,50

# The same for raid bosses and grand bosses.
# Default: 0,5,10,20
BestiaryBossDropBonus = 0,5,10,20

# How much more EXP (percent) the monsters of a region give when every monster
# of the region is at a tier: Discovered, Studied, Mastered, Legendary. Each
# monster counts for its share: with 40 monsters in a region, one Discovered
# adds 100/40 = 2.5%. So with the default, a region all Discovered gives twice
# the EXP and all Legendary four times as much, and a region half Discovered
# gives 1.5 times as much. The region's raid and grand bosses count too, at
# their own tiers. It multiplies the EXP of each player from the monster (in a
# party, each member's share with their own account's bonus); SP stays as it
# is. Use 0,0,0,0 for none.
# Default: 100,167,233,300
BestiaryRegionExpBonus = 100,133,166,200

# How much more damage (percent) an account deals to the monsters of a race
# when every monster of that race in the collection is at a tier: Discovered,
# Studied, Mastered, Legendary. Each monster counts for its share, as with the
# region EXP: with 200 undead, one Legendary undead adds 10/200 = 0.05%. It
# works for the account's characters and their summons and cubics, against
# every monster of the race, raid bosses too. Use 0,0,0,0 for none.
# Default: 2,4,7,10
BestiarySlayerDamageBonus = 2,4,7,10

# The same for how much less damage (percent) they take from the monsters of
# the race (at most 50).
# Default: 1,2,3,5
BestiarySlayerDefenseBonus = 1,2,3,5

# Races with fewer monsters than this in the collection give no slayer bonus
# (a race of three would be done in an evening).
# Default: 10
BestiarySlayerMinMonsters = 10

# ---------------------------------------------------------------------------
# Bounties
# ---------------------------------------------------------------------------

# Give each account a few monsters to hunt every day. They are picked when a
# character of the account logs in or makes a kill, among the plain monsters
# of the collection that respawn near that character's level, the ones the
# account has the least of first (Legendary entries only when nothing else is
# near).
# Default: True
BestiaryBountyEnabled = True

# How many bounties a day (1-6).
# Default: 3
BestiaryBountyCount = 1

# How many of its monster a bounty asks for.
# Default: 30
BestiaryBountyKills = 20

# How far (levels) from the character's level the bounties' monsters are. With
# too few monsters near, the range doubles until there are enough.
# Default: 5
BestiaryBountyLevelRange = 5

# While a bounty is open, each kill of its monster counts this many times in
# the bestiary (1-10), so its tiers come sooner. 1 for none.
# Default: 2
BestiaryBountyKillMultiplier = 1

# The hour (server time, 0-23) the day's bounties change.
# Default: 6
BestiaryBountyResetHour = 6

# Adena a finished bounty pays, per level of its monster (a level 60 monster
# pays 120,000 with the default). The reward goes to the character whose kill
# finished it. 0 for none.
# Default: 2000
BestiaryBountyAdenaPerLevel = 10000

# Items a finished bounty pays too, as id,count;id,count. Empty for none.
# Default:
BestiaryBountyRewardItems =

# ---------------------------------------------------------------------------
# Rare forms and records
# ---------------------------------------------------------------------------

# Tell the player when they kill a rare form of a monster for the first time
# (in chat, and on screen with BestiaryScreenMessages).
# Default: True
BestiaryVariantMessages = True

# How many of the last kills of each raid and grand boss its profile page
# shows (0-50). 0 keeps no log.
# Default: 10
BestiaryBossLogSize = 10

# ---------------------------------------------------------------------------
# Observed drops
# ---------------------------------------------------------------------------

# Count what really comes out of each monster's drops and spoil across the
# server: every kill whose drops are rolled for a player, every spoiled kill,
# and each item that came out of them. Profile pages (at Mastered) show the
# actual rate of each item next to its chance, and the amount one kill gives
# on average next to what the chance and amounts expect. The counts include everyone's
# bonuses (premium, champions, the bestiary's) and level penalties; Lucky Loot
# jackpot rolls are left out. They are kept in memory and written with the
# kills (table bestiary_drop_stats, about one row per item a monster dropped).
# Default: True
BestiaryDropStatsEnabled = True

# Below this many kills (or spoiled kills) of a monster, its actual rates are
# shown dimmed as too few to trust.
# Default: 100
BestiaryDropStatsMinKills = 20

# ---------------------------------------------------------------------------
# Farming for crafting goals
# ---------------------------------------------------------------------------

# Show where to farm what a crafting goal still misses: the Crafting Goals tab
# of the web page, and "Where to Farm" in the Crafting Goals tracker (.craft,
# _bbscraft). Each missing resource lists the monsters that drop it (or spoil
# it, for a character who knows Spoil), best first by how many one kill gives:
# the chance and amounts at the server's rates, the account's drop bonus on
# that monster, and the lower chance of monsters far below the character's
# level. Only monsters the account found (Discovered or above) are named, and
# no raid or grand boss; the others that drop it are only counted. The hunting
# grounds that give the most of what is missing come first. Needs the crafting
# goals (CraftingGoals.ini) to be enabled too.
# Default: True
BestiaryFarmingEnabled = True

# How many levels above the character a monster may be to be recommended
# (0-20).
# Default: 5
BestiaryFarmingLevelsAbove = 5

# ---------------------------------------------------------------------------
# Map
# ---------------------------------------------------------------------------

# The profile pages show where a monster spawns on a map that can be dragged
# and zoomed (mouse wheel, pinch, or the + and - buttons). With the client's
# world map saved as data/html/custom/bestiary/textures/worldmap.png (see
# client/Bestiary/README.txt), the map is that picture. Without it, the map is
# the land drawn from the spawn points.
#
# Where the picture's corners are in the world: left,top,right,bottom (world
# x and y of its top left and bottom right corners). The default is the whole
# world of the geodata (tiles 11-26 by 10-26, 32768 units each). If the towns
# do not sit on their places in the picture, crop it or change these.
# Default: -294912,-262144,229376,294912
BestiaryMapImageBounds = -294912,-262144,229376,294912
