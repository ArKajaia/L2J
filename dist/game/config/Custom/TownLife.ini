# =============================================================
# Town Life
# =============================================================
# Makes the towns feel lived in. Npcs of the town go about their day and
# follow the day/night cycle (see NightCycle.ini; one game day is 4 real
# hours, 1 game minute = 10 real seconds):
#   Day   - townsfolk stroll the streets and stop for a chat, porters carry
#           crates between the warehouse and the shops, guards walk patrols,
#           children play tag in the square, a town crier shouts the news,
#           fishermen sit at the harbors and dock workers unload the ships.
#   Dusk  - the children are called home first, then the townsfolk and
#           workers walk into a house and are gone for the night. The
#           lamplighter makes his round. Some retail npcs with nothing to
#           sell or teach (TownLife.xml) go home too.
#   Night - night watchmen walk the streets with the hour, and a crowd
#           gathers at the tavern until the Witching Hour.
#   Dawn  - everybody comes back from the house they went into and goes
#           back to their day.
# Npcs only think while a player is near, so empty towns cost nothing.
# The towns, their squares, taverns and harbors are in data/TownLife.xml.
# GMs see what each town is doing with //townlife.

# Enable/disable the whole feature.
TownLifeEnabled = True

# Scales every count below (0.5 = half as many npcs in every town).
TownLifePopulation = 1.0

# -------------------------------------------------------------
# Daytime
# -------------------------------------------------------------
# Townsfolk walking the streets of a town (a "small" town in
# TownLife.xml gets half, a "large" one half again as many).
TownLifeWanderers = 10

# Workers: porters between the warehouse and the shops, errand runners,
# a street sweeper.
TownLifeWorkers = 5

# Guards walking patrols in pairs: number of pairs per town. The guards
# standing at their posts stay where they are.
TownLifePatrols = 1

# Children playing tag in the square, in the towns marked children="true"
# in TownLife.xml.
TownLifeChildrenEnabled = True
TownLifeChildren = 3

# -------------------------------------------------------------
# Day and night
# -------------------------------------------------------------
# At dusk the town life npcs walk into a house and come back at dawn.
# False keeps them out all night.
TownLifeGoHome = True

# The retail npcs listed in TownLife.xml (<homebound>) go home at dusk
# and come back at dawn too. Only npcs with nothing to sell, teach or
# give a quest for are listed.
TownLifeRetailGoHome = True

# The lamplighter walks the streets at dusk.
TownLifeLamplighter = True

# Night watchmen walking the streets at night, calling the hour.
TownLifeNightWatch = 2

# A crowd outside the tavern at night, until the Witching Hour.
TownLifeTavernCrowd = 4

# -------------------------------------------------------------
# Ambience
# -------------------------------------------------------------
# A town crier in the square shouts the news of the server: raid bosses
# that rose or fell, the next sieges, tonight's Omen, the heroes.
TownLifeCrier = True
# Real minutes between two cries.
TownLifeCrierInterval = 4
# How far a cry is heard.
TownLifeCrierRange = 2500

# Townsfolk stop to talk to each other, and greet players walking by.
TownLifeChatter = True
TownLifeGreetPlayers = True
# Percent chance that a town life npc greets a player walking close by
# (each npc greets the same player at most once every few minutes).
TownLifeGreetChance = 25

# Fishermen at the harbors from dawn until dusk, dock workers by day.
TownLifeHarborEnabled = True
TownLifeFishermen = 4
TownLifeDockWorkers = 8

# -------------------------------------------------------------
# Extras
# -------------------------------------------------------------
# Now and then a child runs up to a player and asks for a sweet. Talking
# to a child gives one (for adena), once a day per character, and the
# child gives a little thank-you gift.
TownLifeKidsTreats = False
TownLifeTreatPrice = 500
# Gifts: itemId,count;itemId,count... one of them at random.
# Default: Firework, Large Firework, 3 Star Shards.
TownLifeTreatGifts = 6406,1;6407,1;6403,3

# One day a week is festival day in every town: banners and a bonfire in
# the square, more townsfolk and children, the crier tells of the
# festival, and fireworks go up over the square at dusk.
TownLifeFestival = True
# MONDAY ... SUNDAY (server time).
TownLifeFestivalDay = SATURDAY
# How many more town life npcs on festival day (1.5 = half again as many).
TownLifeFestivalPopulation = 2.0
