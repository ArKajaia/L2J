# =============================================================
# Performers
# =============================================================
# Glittering Medals (CustomBuffSystem.ini) teach every class the
# songs and dances, so the Swordsinger and Bladedancer lines get
# what a medal can't give:
#
#  - Performances: toggles that keep an aura going for as long as
#    the performer has MP. One at a time.
#      Swordsinger line, on the party within 900:
#        Ballad of the Bulwark  P. Def. and M. Def. +8/10/12%
#        Hymn of Renewal        HP regen +20/30/40%, MP regen
#                               +10/15/20%, heals received +5/8/10%
#        Anthem of Valor        P. Atk. and M. Atk. +6/8/10%
#      Bladedancer line:
#        Dance of Ruin          enemies within 400: P. Def. and
#                               M. Def. -8/10/12%
#        Dance of Torment       enemies within 400: Atk. Spd. and
#                               Casting Spd. -8/10/12%, Speed
#                               -10/15/20%
#        Dance of Frenzy        party within 900: Atk. Spd. and
#                               Casting Spd. +6/8/10%
#    They stack with every retail buff and medal song.
#  - Stances: a self toggle with an on-hit trigger.
#      Battle Hymn (Swordsinger line): P. Def. +5%, attacks may
#        heal the party (Healing Verse).
#      Blade Waltz (Bladedancer line): Atk. Spd. +8%, Evasion +3,
#        dual sword attacks may slash the enemies around the target
#        (Whirling Edge).
#  - Finales at level 79: Sanctuary Chorus (Sword Muse) and Danse
#    Macabre (Spectral Dancer).
#  - Virtuoso (below): their songs and dances last longer and
#    singing one more doesn't cost them extra MP.
#
# The skills are in data/stats/skills/custom/performer_skills.xml
# and in the class skill trees (learned from the Grand Masters);
# their numbers are changed there. The client needs the rows in
# client/Performers to show their names and icons.
#
# Everything follows the active class: a Swordsinger or Bladedancer
# subclass counts, an elf or dark elf on another subclass doesn't.
# Fake players of the two lines (Battle Bard, War Dancer, Sword Muse,
# Spectral Dancer in data/FakePlayerPvp.xml) perform like players.
#
# Settings with two values are for the 2nd and 3rd class:
#   Swordsinger / Bladedancer, Sword Muse / Spectral Dancer.
# =============================================================

# Turns Virtuoso off when False. The skills stay in the skill trees
# (take them out of the trees to remove them).
# Default: True
PerformersEnabled = True

# -------------------------------------------------------------
# Virtuoso
# -------------------------------------------------------------
# How much longer a song or dance cast by a performer lasts (the
# whole party gets the longer one). 2.0 = a 2 minute dance lasts
# 4 minutes. A medal-learned song cast by anyone else is unchanged.
# Default: 1.5,2.0
DanceDurationMultiplier = 1.5,2.0

# A performer doesn't pay the extra MP for a song or dance while
# others are in effect (Player.ini DanceConsumeAdditionalMP).
# Default: True
NoDanceStackingMpCost = True

# -------------------------------------------------------------
# Performances
# -------------------------------------------------------------
# Dance of Ruin and Dance of Torment also reach players the
# performer could attack without forcing it (flagged, PK, clan war,
# siege, arena, duel, Olympiad), never the performer's own party,
# clan or alliance. False: monsters only.
# Default: True
HexAffectsPlayers = True
