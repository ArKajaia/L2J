# ---------------------------------------------------------------------------
# Radar Zones
# ---------------------------------------------------------------------------
# Zones drawn on the client's radar (the minimap in the corner): an area with
# a translucent fill and a border, under the party and target marks. It needs
# the project client (L2Source), which understands the EX2_RADAR_ZONE packets
# (client/RadarZones/README.txt). Cuboid and cylinder zones are drawn; polygon
# zones are sent but not drawn by the client yet.
# ---------------------------------------------------------------------------

# Send radar zones to clients at all.
# Default: True
RadarZonesEnabled = True

# Show the active rotating hotzones on the radar.
# Default: True
RadarZonesHotzones = True
