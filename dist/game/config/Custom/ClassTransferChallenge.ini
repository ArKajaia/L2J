# =============================================================
# Alternative Class Transfer Challenges
# =============================================================
# The Class Master NPCs (900001/900002/900003) offer a short, solo,
# instanced trial for each class transfer tier. Clearing the trial
# unlocks the Class Master transfer for that tier. The retail
# village-master quest route is not affected.
#
# The trials themselves (objectives, monsters, omens, twists and
# rewards) are defined in data/ClassTransferChallenges/*.xml.

# Enable/disable the whole feature. When disabled the Class Masters
# behave exactly as before (level-gated transfer only).
EnableAlternativeClassTransferChallenges = True

# Allow new trials to be started. Trials already in progress continue.
ChallengeEntryEnabled = True

# Require a cleared trial before the Class Master performs the transfer.
# When False the trial can still be run, but the transfer does not need it.
ChallengeRequiredForTransfer = True

# Time limit (seconds) for trials that do not set their own duration.
ChallengeDefaultDuration = 1200

# Seconds a disconnected player's trial is kept alive. Logging back in
# within this time resumes the trial. The trial timer keeps running.
ChallengeDisconnectGracePeriod = 180

# What happens when the player's HP reaches zero inside a trial:
#   REVIVE - no real death (no XP loss, no drops, no "To Village"): the
#            player is knocked out, then returned to the trial entrance
#            with full HP/MP and all progress kept.
#   FAIL   - the player dies normally and the trial fails.
ChallengeDeathBehavior = REVIVE

# Seconds a knocked-out player stays down before returning to the entrance.
ChallengeKnockoutDelay = 3

# Seconds of invulnerability after returning to the entrance.
ChallengeReviveInvulnerability = 5

# Allow starting the same trial again after failing it.
ChallengeAllowRestart = True

# Failed attempts allowed per tier before the trial is locked for that
# class (0 = unlimited). Clearing the trial resets the counter.
ChallengeMaximumAttempts = 0

# Seconds to wait before retrying after a failed attempt (0 = none).
ChallengeRetryCooldown = 0

# Allow servitors/pets inside trials. Summoner classes rely on them.
ChallengeAllowSummons = True

# Roll a Hot Zone modifier ("Omen") for every attempt, from the trial's
# omen pool. It applies to the whole trial instance.
ChallengeOmensEnabled = True

# Enable random trial twists (such as a rival fake player invading).
ChallengeTwistsEnabled = True

# Grant the rewards defined by each trial (Arena currency, Sealed Cache...).
ChallengeRewardsEnabled = True

# Log every counted kill and progress step (debug).
ChallengeLogging = False
