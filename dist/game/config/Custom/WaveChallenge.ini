# =============================================================
# Wave Challenge (open world)
# =============================================================
# A regular open-world monster has a small chance on spawn to become a
# multi-wave challenge, borrowing the Survival Arena challenger's rules:
# every time it is "killed" before its last wave it instead heals to
# full, gains virtual levels and grows stronger (compounding, like the
# arena). Defeating the final wave pays out Dragon coins, gives boosted
# XP/SP and drops no adena (all other normal drops still happen).
#
# Coin reward: the monster's level at the end of the final wave is
# converted into an equivalent arena wave:
#     arenaWave = (finalLevel - WaveChallengeCoinLevelOffset) / WaveChallengeCoinLevelDivisor
# and pays exactly what the Survival Arena pays for reaching that wave
# (ArenaBaseCurrencyPerWave / ArenaEscalationFactor / ArenaMilestone* /
# ArenaRewardBonusPercent in Rates.ini). Example: final level 44 ->
# (44 - 40) / 2 = arena wave 2 -> same coins as a wave 2 arena run.
# The coins are split evenly between every player who damaged it.

# Enable/disable the whole feature.
WaveChallengeEnabled = True

# Chance (%) for an eligible monster to become a wave challenge each
# time it spawns. Decimals are allowed (0.5 = one in 200 spawns).
WaveChallengeSpawnChance = 1.0

# Only monsters within this (real) level range can become a challenge.
WaveChallengeMinLevel = 40
WaveChallengeMaxLevel = 99

# Allow challenges to roll inside instances.
WaveChallengeAllowInInstances = False

# Allow champion monsters to also become wave challenges.
WaveChallengeAllowChampions = False

# Monster IDs that can never become a wave challenge (comma-separated).
WaveChallengeExcludedNpcIds = 

# Number of waves. The reward is paid when the last wave is defeated.
WaveChallengeWaveCount = 3

# Per-wave growth in percent, compounding (wave 1 = base stats).
# Defaults mirror the Survival Arena values in Rates.ini.
# HP
WaveChallengeStatGrowthPerWave = 8
# P.Atk / M.Atk (attack speed grows by the square root of this)
WaveChallengeOffenseGrowthPerWave = 13
# P.Def / M.Def
WaveChallengeDefenseGrowthPerWave = 7

# Virtual levels gained per wave (a 3-wave challenge ends +4 levels
# above its real level with the default of 2).
WaveChallengeLevelGrowthPerWave = 2

# Upper limit for the virtual level.
WaveChallengeMaxVirtualLevel = 90

# Re-roll the monster's random passive skills at the new virtual level
# every wave, like the arena challenger does.
WaveChallengeRerollPassivesPerWave = True

# Also apply the arena challenger buff package (ArenaBuffSkillIds /
# ArenaBuffSkillLevels in Rates.ini) when the challenge starts and every wave.
WaveChallengeApplyArenaBuffs = False

# Reset the challenge back to wave 1 (full HP, base stats) whenever the
# monster loses all its attackers or walks back home.
WaveChallengeResetOnLeash = True

# XP / SP multipliers for the final kill, on top of your normal rates.
WaveChallengeXpMultiplier = 5.0
WaveChallengeSpMultiplier = 5.0

# Remove adena from the final kill's drops.
WaveChallengeNoAdena = True

# Reward item (3481 = Gold Dragon, the Survival Arena currency).
WaveChallengeCoinItemId = 3481

# arenaWave = (finalLevel - Offset) / Divisor
WaveChallengeCoinLevelOffset = 40
WaveChallengeCoinLevelDivisor = 2

# Lowest arena wave the reward can be based on, so a challenge always pays something.
WaveChallengeMinArenaWave = 1

# Prefix shown in the monster's name plate. The first %d is the current
# wave, the second the total wave count.
WaveChallengeTitleTag = [Wave %d/%d]
