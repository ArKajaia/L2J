# ---------------------------------------------------------------------------
# Adventurer's Guide
# ---------------------------------------------------------------------------
# A tutorial for this server's own systems, in the style of the retail
# Tutorial quest: when something new becomes available (a level is reached,
# a new kind of monster is met, a Champion Medal is found...) the tutorial
# question mark blinks with the tutorial sound, and clicking it opens the
# lesson in the tutorial window. Lessons cover the class transfers (the
# classic quests and the Class Master trials), every monster variant, the
# Notice Board and the dynamic quests, hidden quests, the Survival Arena,
# learning buffs with Champion Medals, the Community Board and more.
#
# Each lesson comes once per character. Every lesson already unlocked can be
# read again in the Guidebook: .guide, or "Adventurer's Guide" on the
# Community Board (_bbsguide).
#
# The monster lessons follow the levels of their own feature (for example
# InfusedMinLevel in InfusedMonsters.ini): a lesson comes when its monsters
# start to appear for the character, or the first time the character kills
# one, whichever is first. A disabled feature has no lesson.
#
# With the retail tutorial on (DisableTutorial = False in Player.ini) the
# 1st and 2nd class transfer lessons are left to it (its popups name the
# Class Master too), so they don't come twice.
# ---------------------------------------------------------------------------

# Enable the Adventurer's Guide.
# Default: True
AdventurersGuideEnabled = True

# Open the welcome lesson in the tutorial window the first time a character
# enters the world with the guide on (new and existing characters alike).
# Default: True
AdventurersGuideWelcome = True

# Also tell in the chat window which lesson a new question mark holds.
# Default: True
AdventurersGuideChatNotice = True

# How many lessons can wait as question marks at once. Older ones stay in the
# Guidebook.
# Default: 3
AdventurersGuideMaxQuestionMarks = 3

# Levels of the lessons that don't follow a feature's own level.
# The Community Board and its pages.
# Default: 3
AdventurersGuideCommunityBoardLevel = 3

# Monster archetypes, random passive skills and rage (also the first kill of
# a raging monster).
# Default: 5
AdventurersGuideMonsterTraitsLevel = 5

# Learning buffs with Champion Medals and Buff Templates (also the first
# Champion Medal found).
# Default: 15
AdventurersGuideBuffsLevel = 15

# Rotating hot zones (also the first kill in an active hot zone).
# Default: 12
AdventurersGuideHotZonesLevel = 12

# The Survival Arena (also the first talk with the Arena Master).
# Default: 20
AdventurersGuideArenaLevel = 20

# Treasure chests and mimics (also the first mimic killed).
# Default: 25
AdventurersGuideTreasureChestsLevel = 25

# The Night Cycle: comes at the first nightfall seen from this level on.
# Default: 20
AdventurersGuideNightLevel = 20
