# ---------------------------------------------------------------------------
# Adventurer's Guide
# ---------------------------------------------------------------------------
# A tutorial for this server's own systems, in the style of the retail
# Tutorial quest: the tutorial question mark blinks with the tutorial sound,
# and clicking it opens the lesson in the tutorial window, opened by a line
# that says what just happened ("You have slain a Champion monster, ...!").
#
# Every lesson has a minimum level and never comes below it. Most lessons
# wait for the moment the player may have a question:
#   - the first kill of a Champion, Mage, Thief, Infused, Resonant, mimic,
#     Hotzone Menace or a monster glowing with passive skills;
#   - a monster flying into a rage, a Wave Challenge rising for its next
#     wave, a Resonant soul fleeing, a treasure chest vanishing or a mimic's
#     curse (for everyone fighting it);
#   - the first death to a monster (Nemesis), a new Bestiary entry, the
#     first Champion Medal or Sealed Cache carried, a Luck stack, a jackpot,
#     nightfall, a herald's offer, a quest taken, a hidden quest messenger.
# The monster lessons' minimum level is the one of their own feature (for
# example InfusedMinLevel in InfusedMonsters.ini).
# A few lessons are announced as soon as their level is reached: the
# Community Board, the Passive Tree, the class transfers, the Notice Board
# and the Survival Arena. Talking to the Arena Master, a Notice Board or the
# Hotzone Teleporter, or using a Champion Medal, opens their lesson at once
# (from its level).
#
# Each lesson comes once per character. Every lesson already given can be
# read again in the Guidebook: .guide, or "Adventurer's Guide" on the
# Community Board (_bbsguide). A disabled feature has no lesson.
#
# With the retail tutorial on (DisableTutorial = False in Player.ini) the
# 1st and 2nd class transfer lessons are left to it (its popups name the
# Class Master too), so they don't come twice.
# ---------------------------------------------------------------------------

# Enable the Adventurer's Guide.
# Default: True
AdventurersGuideEnabled = True

# Open the welcome lesson in the tutorial window the first time a character
# enters the world with the guide on (new and existing characters alike).
# Default: True
AdventurersGuideWelcome = True

# Also tell in the chat window which lesson a new question mark holds.
# Default: True
AdventurersGuideChatNotice = True

# How many lessons can wait as question marks at once. Older ones stay in the
# Guidebook.
# Default: 3
AdventurersGuideMaxQuestionMarks = 3

# Minimum levels of the lessons that don't follow a feature's own level.
# The Community Board and its pages (announced).
# Default: 3
AdventurersGuideCommunityBoardLevel = 3

# The Bestiary (at a new Bestiary entry).
# Default: 3
AdventurersGuideBestiaryLevel = 3

# Archetypes and passive skills (the first kill of a monster glowing with
# them), Monster Rage (a monster raging) and Nemesis (the first death to a
# monster).
# Default: 5
AdventurersGuideMonsterTraitsLevel = 5

# Learning buffs with Champion Medals and Buff Templates (the first Champion
# Medal carried or used).
# Default: 10
AdventurersGuideBuffsLevel = 10

# Luck, jackpots and Sealed Caches (a Luck stack, a jackpot, the first cache
# carried).
# Default: 10
AdventurersGuideLuckLevel = 10

# Rotating hot zones (the first kill in an active hot zone or of a Hotzone
# Menace, or a talk with the Hotzone Teleporter).
# Default: 12
AdventurersGuideHotZonesLevel = 12

# The Survival Arena (announced, or a talk with the Arena Master). It is
# meant for characters of this level and above.
# Default: 40
AdventurersGuideArenaLevel = 40

# Treasure chests and mimics (a chest vanishing, a mimic's curse or kill).
# Default: 25
AdventurersGuideTreasureChestsLevel = 25

# The Night Cycle (dusk or nightfall, or logging in at night).
# Default: 20
AdventurersGuideNightLevel = 20
