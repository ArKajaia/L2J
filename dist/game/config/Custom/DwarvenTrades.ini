# =============================================================
# Dwarven Trades
# =============================================================
# The passive tree lets any character take Spoil, Sweeper Festival,
# Crystallize and Dwarven Craft. These settings give the dwarven
# classes what the tree doesn't, so spoiling and crafting stay a
# dwarf's trade:
#
#  - Spoilers (Scavenger, Bounty Hunter, Fortune Seeker): their Spoil
#    skills always land, and the monsters they spoil give more when
#    swept, whoever kills them.
#  - Crafters (Artisan, Warsmith, Maestro): a better success rate on
#    recipes below 100%, more masterworks, and a chance to make twice
#    as many stackable items (shots, arrows, potions, materials). This
#    works in their private workshops too, so customers gain from it.
#  - Every dwarven class gets more crystals from Crystallize, and the
#    crafters more still.
#  - The tree's Dwarven Craft is the only way for other classes (and
#    the Scavenger line) to craft: it gives Create Item at the
#    character's level, but no higher than TreeCreateItemMaxLevel, so
#    B grade and up can only be crafted by Artisans, Warsmiths and
#    Maestros.
#  - In combat (see Combat below): their stuns land more often,
#    spoilers hit the monsters they spoiled harder and heal by sweeping,
#    crafters field stronger golems and draw more from enchanted gear.
#
# Everything follows the active class: a dwarven subclass counts, a
# dwarf playing a non-dwarven subclass doesn't. Fortune Seeker and
# Maestro fake players (data/FakePlayerPvp.xml) get the combat
# settings below like players.
#
# Settings with three values are for the 1st, 2nd and 3rd class:
#   spoilers: Scavenger, Bounty Hunter, Fortune Seeker
#   crafters: Artisan, Warsmith, Maestro
# (the Dwarven Fighter, before the 1st class transfer, gets none of them).

DwarvenTradesEnabled = True

# -------------------------------------------------------------
# Spoil
# -------------------------------------------------------------
# Spoil, Spoil Festival, Spoil Crush and Spoil Bomb cast by a dwarven
# spoiler never miss. Spoil from the passive tree can still miss.
SpoilAlwaysLands = True

# The chance of every sweep item is multiplied by this, when the monster
# was spoiled by a dwarven spoiler. Stacks with the server rates,
# premium and the passive tree's spoil bonuses.
SpoilChanceMultiplier = 1.25,1.5,1.75

# The amount of every sweep item is multiplied by this.
SpoilAmountMultiplier = 1.0,1.2,1.4

# -------------------------------------------------------------
# Craft
# -------------------------------------------------------------
# Added to the success rate (%) of recipes below 100%, so a 60% recipe
# succeeds 75% of the time for a Maestro with the defaults.
CraftSuccessBonus = 5,10,15

# The masterwork chance is multiplied by this.
CraftMasterworkMultiplier = 1.25,1.5,2.0

# Chance (%) that crafting a stackable item makes twice as many.
CraftDoubleChance = 5,10,15

# -------------------------------------------------------------
# Crystallize
# -------------------------------------------------------------
# Extra crystals (%) for every dwarven class, the Dwarven Fighter too.
CrystallizeBonus = 20

# Extra crystals (%) for crafters, on top of CrystallizeBonus.
CrafterCrystallizeBonus = 10,20,30

# -------------------------------------------------------------
# Passive tree
# -------------------------------------------------------------
# The tree's Dwarven Craft node is the only source of dwarven crafting
# for every class but the Artisan line: Create Item is not in their
# class skill trees. The node gives the recipe book and Create Item at
# the character's level (2 at 20, 3 at 28, 4 at 36, 5 at 43 ...), up to
# the level below. It raises a lower Create Item of the character's own
# (a Bounty Hunter's level 1) and gives that back when the node goes.
# Refunding the node ends the crafting, but the recipe book is kept and
# comes back with the node.
#
# The highest Create Item level the node gives:
# Recipe levels, roughly: 1 no grade, 2-4 D, 4-6 C, 6-7 B, 7-8 A,
# 8-9 S and S80, 10 S84. 5 = D and most of C grade (B grade and up
# stay with dwarves). 10 = everything (dwarves keep only the bonuses).
TreeCreateItemMaxLevel = 5

# =============================================================
# Combat
# =============================================================
# Dwarves fight with blunts, polearms, stuns and golems. These make
# that count, and tie the fighting to the trade.

# -------------------------------------------------------------
# Skullcrusher (both lines)
# -------------------------------------------------------------
# The landing chance of their stun skills (Stun Attack, Hammer Crush,
# Rush Impact ...) is multiplied by this. The skill's own highest
# chance still caps it.
SkullcrusherChanceMultiplier = 1.1,1.2,1.3

# -------------------------------------------------------------
# Spoilers
# -------------------------------------------------------------
# Plunderer's Mark: extra damage (%) of their attacks and physical
# skills against a monster they spoiled themselves.
PlunderDamageBonus = 8,12,16

# Spoils of War: % of max HP and MP restored for every corpse they
# sweep with loot on it (Sweeper Festival can sweep up to 10 at once).
SpoilsOfWarRestore = 2,3,4

# -------------------------------------------------------------
# Crafters
# -------------------------------------------------------------
# Golem Engineering: extra P.Atk, M.Atk, P.Def, M.Def and max HP (%)
# of their servitors (Mechanic and Siege Golems, the cannons, Big Boom).
# Stacks with the passive tree's summon nodes.
GolemBonus = 10,20,30

# Forged Gear: every enchant level above ForgedSafeEnchant on their
# weapon gives this much P.Atk (%) ...
ForgedWeaponBonus = 0.5,0.75,1.0

# ... and every enchant level above ForgedSafeEnchant on each piece of
# armour (helmet, chest, legs, gloves, boots, shield) gives this much
# P.Def (%). A Maestro in five +10 pieces gets 35 x 0.2 = +7%.
ForgedArmorBonus = 0.1,0.15,0.2

# Enchant levels up to this don't count.
ForgedSafeEnchant = 3

# The most Forged Gear can add, separately to P.Atk and to P.Def (%).
ForgedMaxBonus = 15
