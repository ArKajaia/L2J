# =============================================================
# Dwarven Trades
# =============================================================
# The passive tree lets any character take Spoil, Sweeper Festival,
# Crystallize and Dwarven Craft. These settings give the dwarven
# classes what the tree doesn't, so spoiling and crafting stay a
# dwarf's trade:
#
#  - Spoilers (Scavenger, Bounty Hunter, Fortune Seeker): their Spoil
#    skills always land, and the monsters they spoil give more when
#    swept, whoever kills them.
#  - Crafters (Artisan, Warsmith, Maestro): a better success rate on
#    recipes below 100%, more masterworks, and a chance to make twice
#    as many stackable items (shots, arrows, potions, materials). This
#    works in their private workshops too, so customers gain from it.
#  - Every dwarven class gets more crystals from Crystallize, and the
#    crafters more still.
#  - The tree's Dwarven Craft gives Create Item at the character's
#    level, but no higher than TreeCreateItemMaxLevel, so B grade and
#    up can only be crafted by dwarves.
#
# Everything follows the active class: a dwarven subclass counts, a
# dwarf playing a non-dwarven subclass doesn't.
#
# Settings with three values are for the 1st, 2nd and 3rd class:
#   spoilers: Scavenger, Bounty Hunter, Fortune Seeker
#   crafters: Artisan, Warsmith, Maestro
# (the Dwarven Fighter, before the 1st class transfer, gets none of them).

DwarvenTradesEnabled = True

# -------------------------------------------------------------
# Spoil
# -------------------------------------------------------------
# Spoil, Spoil Festival, Spoil Crush and Spoil Bomb cast by a dwarven
# spoiler never miss. Spoil from the passive tree can still miss.
SpoilAlwaysLands = True

# The chance of every sweep item is multiplied by this, when the monster
# was spoiled by a dwarven spoiler. Stacks with the server rates,
# premium and the passive tree's spoil bonuses.
SpoilChanceMultiplier = 1.25,1.5,1.75

# The amount of every sweep item is multiplied by this.
SpoilAmountMultiplier = 1.0,1.2,1.4

# -------------------------------------------------------------
# Craft
# -------------------------------------------------------------
# Added to the success rate (%) of recipes below 100%, so a 60% recipe
# succeeds 75% of the time for a Maestro with the defaults.
CraftSuccessBonus = 5,10,15

# The masterwork chance is multiplied by this.
CraftMasterworkMultiplier = 1.25,1.5,2.0

# Chance (%) that crafting a stackable item makes twice as many.
CraftDoubleChance = 5,10,15

# -------------------------------------------------------------
# Crystallize
# -------------------------------------------------------------
# Extra crystals (%) for every dwarven class, the Dwarven Fighter too.
CrystallizeBonus = 20

# Extra crystals (%) for crafters, on top of CrystallizeBonus.
CrafterCrystallizeBonus = 10,20,30

# -------------------------------------------------------------
# Passive tree
# -------------------------------------------------------------
# The highest Create Item level the tree's Dwarven Craft node gives.
# It follows the character's level like a dwarf's own Create Item
# (2 at 20, 3 at 28, 4 at 36, 5 at 43 ...) and stops here.
# Recipe levels, roughly: 1 no grade, 2-4 D, 4-6 C, 6-7 B, 7-8 A,
# 8-9 S and S80, 10 S84. 5 = D and most of C grade (B grade and up
# stay with dwarves). 10 = everything (dwarves keep only the bonuses).
TreeCreateItemMaxLevel = 5
