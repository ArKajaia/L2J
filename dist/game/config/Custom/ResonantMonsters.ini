# =============================================================
# Resonant Monsters
# =============================================================
# A regular open-world monster has a small chance on spawn to become
# Resonant: its soul hums with power, shown in its name plate as
# [Resonant] and by a visual effect.
#
# Killing it raises the soul crystal of the killer and of every party
# member within AltPartyRange (Player.ini) of it by one stage, with
# ResonantChance % chance, without having to use the crystal on it
# first. The retail rules of the quest Enhance Your Weapon still apply:
#  - the quest must be started,
#  - the player must carry exactly one soul crystal (two or more
#    resonate with each other and fail, as in retail),
#  - the crystal only grows up to the stage the Resonant monster's
#    level allows: what the regular monsters of that level could raise
#    (with the retail data up to stage 1 at level 40, 4 at 50, 7 at 60
#    and 9 from 63 on), or the ResonantRaidStages below if higher
#    (stage 10 from level 76, 11 from level 80: a stage 11 crystal grows
#    to stage 12).
# The normal soul crystal roll of the quest doesn't happen on top, so a
# crystal never grows twice from one kill.
#
# Raid tier: a Resonant monster that raises stage 10 or higher (the
# stages retail only gives on raid bosses) is a raid boss strength
# fight. Its HP, P.Atk, M.Atk, P.Def and M.Def are raised to
# ResonantRaidStrengthPercent % of the median raid boss within 2 levels
# of it (measured on the real raid bosses, with NpcStatMultipliers.ini
# and the NPC.ini Raid*Multiplier values), never lowered. Its name
# plate shows ResonantRaidTitleTag.
#
# The first time it drops to ResonantFleeAtHpPercent % HP its soul
# flees: it runs from the players for ResonantFleeTime seconds
# (ResonantRaidFleeTime at the raid tier) and, if it is still alive by
# then, it vanishes (and respawns as an ordinary monster later). Root,
# slow and stun it to catch it.
#
# Fake players join the fight: each time its HP drops past one of
# ResonantFakeJoinAtHpPercent, a fake player of about its level turns
# up nearby and runs in. Nobody is told whose side it is on:
#  - a helper (ResonantFakeHelperChance %) joins the party of the
#    player who has hurt the monster most, fights it with the party and
#    leaves the party after the fight. Its kills (and its servitor's)
#    count for the party. A helper that dies doesn't come back to the
#    party from town, and a helper never takes kill-steal revenge.
#  - a rival wants the soul for itself: it fights the monster and the
#    players in its way. If it lands the killing blow the soul is gone.
#    Killing a rival is never a PK and pays ResonantRivalKillCoins hot
#    zone coins and a Sealed Cache.
# A helper becomes a rival if the party has no room (9 members, or
# FakePartyMaxFakes fake players) or if the party leader is not at the
# fight (farther than FakePartyLeashRange from the monster). Joiners
# need FakePvpEnabled and room under FakePvpMaxAlive (FakePlayerPvp.ini,
# 0 = no limit), and helpers FakePartyEnabled (FakeParty.ini).
# If the players give up (none of them within 2000 of the monster for
# about 30 seconds), the joiners go their way as after the fight, and
# the HP percents the monster is still above call new joiners on the
# next attempt.
#
# Resonant monsters never overlap with Thieves, Mages, Infused
# monsters, wave challenges, arena challengers or hotzone minibosses.
# Scripted spawns that never respawn (boss guards, quest monsters) never
# become Resonant, since a soul that fled would be gone for good. A
# monster that raises soul crystal stages above the Resonant cap of its
# level never becomes Resonant either, so it keeps its own roll (the
# Tyrannosaurus' stages 10 and 11 are covered from level 80).
# The hot zone modifier SOUL_TIDE makes them 5 times as common; a hot
# zone below ResonantMinLevel never rolls it.

# Enable/disable the whole feature.
ResonantEnabled = True

# Chance (%) for an eligible monster to become Resonant, rolled every
# time it spawns or respawns - the same way champions are rolled.
# Decimals are allowed (0.5 = one in 200 spawns).
ResonantSpawnChance = 1.0

# After a spawn point produces a Resonant monster, its next this-many
# spawns can't become Resonant. 0 = no cooldown.
ResonantRespawnCooldown = 1

# Only monsters within this (real) level range can become Resonant.
# Regular monsters below level 40 raise no soul crystal, so they never
# become Resonant whatever this says.
ResonantMinLevel = 40
ResonantMaxLevel = 85

# Allow Resonant monsters to roll inside instances.
ResonantAllowInInstances = False

# Allow champion monsters to also become Resonant.
ResonantAllowChampions = False

# Monster IDs that can never become Resonant (comma-separated).
ResonantExcludedNpcIds =

# Max HP multiplier (below the raid tier; at the raid tier the higher of
# this and the raid strength HP multiplier).
ResonantHpMultiplier = 2.0

# Chance (%) that a valid crystal of stage 9 or lower grows. The retail
# regular monsters have 9% (times SoulCrystalChanceMultiplier in
# Player.ini) and only for the player who lands the last hit after
# using the crystal on it.
ResonantChance = 100

# Chance (%) that a valid crystal of stage 10 or higher grows. Retail
# raid bosses give these stages with 3-20% chance, to one random party
# member or to the whole party (100% on some epic bosses, see
# data/LevelUpCrystalData.xml).
ResonantRaidStageChance = 100

# Highest crystal stage that can still grow, whatever the level
# (11 = up to stage 12).
ResonantMaxCrystalStage = 11

# Raid tier stages: from this monster level on, crystals up to this
# stage grow (level:stage, comma-separated), on top of what the regular
# monsters of the level raise. 76:10,80:11 = stage 10 grows to 11 from
# level 76, stage 11 grows to 12 from level 80. Empty = none.
ResonantRaidStages = 76:10,80:11

# Raid tier strength, in percent of the median raid boss of its level.
# 0 = no raid strength (only ResonantHpMultiplier).
ResonantRaidStrengthPercent = 50

# Prefix shown in a raid tier Resonant monster's name plate.
ResonantRaidTitleTag = [Resonant Boss]

# Its soul flees the first time its HP drops to this percent.
# 0 = it never flees.
ResonantFleeAtHpPercent = 25

# How long (seconds) the fleeing soul runs before it vanishes, below
# and at the raid tier.
ResonantFleeTime = 20
ResonantRaidFleeTime = 40

# HP percents at which a fake player joins the fight (comma-separated,
# one fake player each). Empty = none.
ResonantFakeJoinAtHpPercent = 70,30

# Chance (%) that a joiner is a helper; otherwise it is a rival.
ResonantFakeHelperChance = 50

# Chance (%) that a rival opens on the player who has hurt the monster
# most instead of on the monster.
ResonantRivalAttackPlayerChance = 30

# What killing a rival pays: hot zone coins (the arena currency item)
# and, if True, a Sealed Cache (with the Sealed Cache level rule of
# LuckyLoot.ini).
ResonantRivalKillCoins = 300
ResonantRivalKillCache = True

# Seconds after the fight (the monster died, fled or was removed, or the
# players gave up) before the joiners go their way: a helper leaves the
# party, and both hunt nearby for a while and then log off. One still
# fighting (a player, or the party's next monster) finishes that first,
# for up to 10 more waits of this long (at least 10 seconds each).
ResonantFakeLeaveDelay = 30

# Tell a player without a soul crystal (or without the quest) why
# nothing happened.
ResonantHint = True

# Visual effect shown on a Resonant monster (an AbnormalVisualEffect
# name, see model/skill/AbnormalVisualEffect.java). NONE = no effect.
# Default: the Arcane Shield aura, which follows the monster when its
# soul flees (MAGIC_SQUARE would stay on the ground where it started).
ResonantVisualEffect = MP_SHIELD

# Prefix shown in the monster's name plate.
ResonantTitleTag = [Resonant]
