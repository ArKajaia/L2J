# =============================================================
# Lucky Loot
# =============================================================
# Three loot features that share one "Luck" counter per player:
#
#  1. Lucky Streak: every monster you kill has a chance to add a Luck
#     stack, which raises your drop chance. The higher your Luck, the
#     harder the next stack is to get. Dying resets it to 0, and so
#     does logging out. Your stacks show as a prefix in your title
#     (display only - your real title is never changed or saved).
#  2. Jackpot: from Luck 1 upwards every kill has a chance to re-roll
#     the monster's drop table (10x loot). The chance grows with your
#     Luck, and hitting a jackpot resets your Luck to 0.
#  3. Sealed Cache: any kill has a small chance to also drop a
#     Common, Rare or Epic cache full of Dragon Coins and random
#     crafting materials. Double-click it to open it. Luck raises
#     this chance too.
#
# Only kills that would normally give XP/SP count, so NPC-on-NPC
# kills, fake players etc. can't trigger any of this.

# -------------------------------------------------------------
# Lucky Streak
# -------------------------------------------------------------
LuckEnabled = True

# Highest number of Luck stacks a player can hold.
LuckMaxStacks = 50

# Drop chance bonus (%) per stack. With the defaults, 20 stacks = +40%.
# Multiplies the normal kill drop chance (not spoil, not raids).
LuckDropBonusPerStack = 2.0

# Chance (%) that a kill adds a Luck stack. It slides linearly from
# LuckGainChanceAtZero (when you have 0 stacks) down to
# LuckGainChanceAtMax (when you are one stack below LuckMaxStacks), so
# every stack is a bit harder to get than the one before.
# Set both to the same value for a flat chance, or both to 100 for
# the old "every kill adds a stack" behaviour.
LuckGainChanceAtZero = 30.0
LuckGainChanceAtMax = 20.0

# Kills of monsters more than this many levels BELOW the player give
# no stack, so farming grey monsters doesn't build Luck.
# Set to -1 to disable the check.
LuckMaxLevelDifference = 8

# Show the stacks in front of the player's title.
LuckTitleEnabled = True

# %d is replaced by the stack count.
LuckTitleFormat = [Luck %d]

# Send a chat message every 5 stacks (5/10/15/20...) and when the
# maximum is reached.
LuckMilestoneMessage = True

# -------------------------------------------------------------
# Jackpot
# -------------------------------------------------------------
JackpotEnabled = True

# Chance (%) per kill. There is no jackpot at Luck 0. The chance grows
# linearly from JackpotChanceAtMinLuck at Luck 1 to
# JackpotChanceAtMaxLuck at LuckMaxStacks.
# With the defaults that is exactly 0.05% per stack:
# Luck 1 = 0.05%, Luck 10 = 0.5%, Luck 20 = 1%.
JackpotChanceAtMinLuck = 0.05
JackpotChanceAtMaxLuck = 2.5

# How many times the drop table is rolled on a jackpot, including the
# normal roll (10 = 10x loot).
JackpotDropRolls = 10

# Reset the player's Luck to 0 after a jackpot. The jackpot kill itself
# also can't add a new stack.
JackpotResetsLuck = True

# Announce jackpots to every online player.
JackpotAnnounce = True

# Monsters below this level can't give a jackpot.
JackpotMinLevel = 20

# -------------------------------------------------------------
# Sealed Cache
# -------------------------------------------------------------
SealedCacheEnabled = True

# Base chance (%) per kill that a cache drops.
SealedCacheChance = 0.4

# Relative bonus (%) to the cache chance per Luck stack.
# With the defaults, 20 stacks = +40%.
SealedCacheChanceBonusPerStack = 2.0

# Monsters below this level never drop a cache.
SealedCacheMinLevel = 10

# No cache drops from monsters more than this many levels BELOW the
# player. Set to -1 to disable the check.
SealedCacheMaxLevelDifference = 8

# The cache items. The defaults reuse the High Five fishing treasure
# chests (no client patch needed); their contents are defined in
# data/stats/items/custom/06400-06499.xml and 06500-06599.xml:
#   Common: 1,000-5,000 Dragon Coins + basic crafting materials,
#           D-Grade crystals and gemstones, soul and spirit ore
#   Rare:   3,000-15,000 Dragon Coins + crafted materials, ores,
#           C/B crystals and gemstones, maestro parts
#   Epic:   5,000-50,000 Dragon Coins + key materials, molds, A/S
#           crystals and gemstones, S80 materials
# Materials are picked at random - rarer materials have a lower chance.
#
# Every cache also has a very small chance of a treasure, and the
# rarer it is, the better it is (listed chance per cache opened):
#   Common: Enchant Armor/Weapon D (1% / 0.5%) and C (0.2% / 0.1%),
#           Blessed Enchant Armor/Weapon C (0.04% / 0.02%),
#           Giant's Codex (0.005%), Top-Grade Life Stone 76 (0.002%)
#   Rare:   Enchant Armor/Weapon C (1% / 0.5%) and B (0.3% / 0.15%),
#           attribute stones (0.02% each), Blessed Enchant Armor/Weapon
#           B (0.04% / 0.02%), Giant's Codex (0.01%), Top-Grade Life
#           Stone 76 (0.005%), Ring of Queen Ant, Ring of Core and
#           Earring of Orfen (0.001% each)
#   Epic:   Enchant Armor/Weapon A (1% / 0.5%) and S (0.3% / 0.15%),
#           Giant's Codex (0.05%), Blessed Enchant Armor S (0.04%),
#           attribute crystals (0.02% each), Blessed Enchant Weapon S
#           (0.02%), Giant's Codex - Mastery (0.01%), Top-Grade Life
#           Stone 82 (0.005%), Earring of Zaken and Necklace of
#           Frintezza (0.002% each), Ring of Baium, Earring of Antharas
#           and Necklace of Valakas (0.001% each)
# When too few materials hit, the cache rolls its table again, so the
# real treasure chances are about 5-15% above the listed ones.
# 6492 = Small Green Treasure Chest
SealedCacheCommonItemId = 6492
# 6499 = Blue Treasure Chest
SealedCacheRareItemId = 6499
# 6509 = Big Purple Treasure Chest
SealedCacheEpicItemId = 6509

# Relative weights used to pick which tier drops.
SealedCacheCommonWeight = 70
SealedCacheRareWeight = 25
SealedCacheEpicWeight = 5

# Raise the Rare and Epic weights with the monster's level, up to
# double at level 85 and above.
SealedCacheHighLevelBonus = True

# Tell the killer in chat when a cache drops, and when a Mage's
# guaranteed cache is skipped because of SealedCacheMaxLevelDifference.
SealedCacheMessage = False

# Opening a cache and finding something listed at this chance (%) or
# lower in the cache's table (see the item files above) counts as a
# treasure: the player gets a big on-screen message and a fanfare, so
# a lucky find isn't lost in the chat. 0 turns it off.
SealedCacheTreasureChance = 1.0

# A treasure listed at this chance (%) or lower is also announced to
# every online player. 0 turns it off.
SealedCacheAnnounceChance = 0.02
