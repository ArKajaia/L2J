# ---------------------------------------------------------------------------
# Fake player skill timing: how much each part of a skill's value counts
# ---------------------------------------------------------------------------
# Brain B fake players (and brain A once promoted) pick their skills by value
# instead of by chance (docs/superpowers/specs/2026-11-08-fake-player-skill-timing-design.md).
# Each line sets one weight of one role: ROLE.key = value. Roles: FIGHTER,
# TANK, DAGGER, ARCHER, MAGE. A key left out keeps its default. A line that
# starts with "B." (B.MAGE.risk = 0.9) only changes brain B, the experimental
# brain of the simulations: the self-play tuning (tools/simulation/
# tune_weights.py) tries its changes that way, on brain B against brain A.
#
# damage         - weight of damage per second (default 1.0)
# control        - weight of crowd control: land chance x time held x what
#                  that time is worth now (interrupting a cast, stopping a
#                  melee, holding the target for a burst) (default 1.0)
# setup          - weight of debuffs that raise later damage (default 0.6)
# cooldownCost   - weight of the cost of spending a long cooldown now
#                  (default 1.0)
# risk           - weight of the chance of being interrupted (default 1.0;
#                  1.3 for MAGE and ARCHER)
# raceMargin     - the kill race is won when time to kill is below this share
#                  of time to die: it then keeps attacking instead of reacting
#                  (default 0.75; 0.6 for TANK, which reacts more readily)
# burstReflexTtd - the burst reflex (a defensive skill) fires when time to die
#                  falls below this many seconds (default 3.0)
# noise          - how far values stray for an unskilled fake player (none
#                  for a skilled one) (default 0.35). An unskilled fake player
#                  also takes its second-best option 20% of the time.
# planDepth      - how many steps ahead a skilled fake player plans its burst
#                  and crowd control chains (default 3; 0 for none)

MAGE.risk = 1.3
ARCHER.risk = 1.3
TANK.raceMargin = 0.6
