# ---------------------------------------------------------------------------
# Village Under Siege
# ---------------------------------------------------------------------------
# One village after the other, the monsters of the hunting grounds around a
# starting village or a town attack its entrances (data/VillageSiege.xml).
#  - Each siege is for the characters of its own levels: the starting villages
#    (with Gludin, Gludio and Dion) up to VillageSiegeMaxPlayerLevel, the towns
#    (Hunters Village, Giran, Aden, Rune, Goddard, Schuttgart, Oren and Heine)
#    from level 40, 58, 62, 66 or 78 up to 85 (minDefenderLevel-maxDefenderLevel
#    in data/VillageSiege.xml). Only they hear of it, are invited and earn.
#  - Each entrance has a gate with HP (target it to see them). The defenders
#    and the village guards hold the line at the gate; the monsters fight them
#    first and, with nobody left in front of them, beat on the gate. At 0 HP
#    the gate falls and the monsters run into the streets, until it is raised
#    again. The siege goes on until its time is up.
#  - Three stages (Vanguard, Main Assault, Final Assault): every gate is kept
#    under constant pressure that grows with the stage, and great waves come on
#    top of it now and then.
#  - Defenders above the village's levels get monsters of their own level, so
#    nobody outgrows the siege.
#  - Fake players come to defend too (more when no player is there, so the
#    fighting goes on unwatched). The monsters can kill them and they leave
#    after a while.
#  - The defenders earn contribution points, paid in Defence Medals as they
#    earn them, more experience from the siege's monsters and a share of a
#    level at the end (a smaller one at the higher levels). They are invited
#    when a siege starts and can teleport there for free. The Defence Force
#    Board next to the gatekeeper of every village shows the schedule and the
#    rankings and exchanges the medals for gear up to C grade and for
#    decorations (hair accessories, hats, agathions and the Formal Wear) priced
#    for the veterans of the towns.
# Players see it with .siege; GMs with //villagesiege.

# Enable Village Under Siege.
VillageSiegeEnabled = True

# ---------------------------------------------------------------------------
# Schedule
# ---------------------------------------------------------------------------
# The villages (ids of data/VillageSiege.xml), besieged one after the other,
# over and over. A village may come more than once. The starting villages and
# the towns take turns, so there is one for the low and one for the high
# levels every other siege. Hunters Village, Giran and Aden (from level 40)
# come every other town, twice each, and between them the other towns, Rune
# (from 58) twice and opposite itself: from level 40 to 85 a siege is never
# more than 5 hours 20 minutes away. Gludin, Gludio and Dion (monsters 18-32)
# come every other village, twice each, between the race villages (8-12), so
# the 24 sieges of the rotation have a village and a town in turn. Two sieges
# in a row are always far apart on the map, and a village's two sieges half a
# rotation apart.
VillageSiegeOrder = talking_island,rune,dion,aden,dark_elven,goddard,gludin,giran,orc,oren,gludio,hunters,kamael,rune,dion,aden,elven,schuttgart,gludin,giran,dwarven,heine,gludio,hunters

# How long a siege lasts, and the rest before the next one (minutes). With
# the defaults a siege starts every 80 minutes, a siege of the starting
# villages and one of the towns every 2 hours 40 minutes, and the 24 sieges
# of VillageSiegeOrder take 32 hours: the villages that come twice are
# besieged every 16 hours, the others every 32, at another hour each time.
VillageSiegeDuration = 60
VillageSiegeBreak = 20

# The rotation is counted from this time of day on 1 January 2026 (server
# time, HH:mm): the first village of VillageSiegeOrder was besieged then, and
# a siege starts every VillageSiegeDuration + VillageSiegeBreak minutes since,
# so a restart picks the rotation up where it stands. The day of "today's"
# ranking also starts at this time.
VillageSiegeFirstStart = 07:00

# Announce a siege this many minutes before it starts (0 = no warning).
VillageSiegeWarning = 10

# After a restart, a siege whose time has come starts late if at least this
# many minutes of it are left.
VillageSiegeLateStartMinMinutes = 30

# Announce sieges, fallen gates and the best defenders.
VillageSiegeAnnounce = True

# Only to the characters up to this level (and the GMs): a siege is no
# business of the others. For the villages without defender levels of their
# own; the towns are announced to their defenders' levels.
VillageSiegeAnnounceMaxLevel = 40

# How the siege stands (its gates, the monsters slain, the defenders) is
# announced every this many minutes (0 = never).
VillageSiegeStatusAnnounceMinutes = 15

# When a siege starts, the characters of its levels who are not there get a
# window with what the defenders earn and a button to join.
VillageSiegeInvite = True

# The characters of the siege's levels can teleport to it for
# free from .siege or any Defence Force Board (like at a gatekeeper: not in a
# fight, the Olympiad, an instance...), to the gate with the fewest defenders,
# and go back where they were until 20 minutes after the siege.
VillageSiegeTeleport = True

# ---------------------------------------------------------------------------
# Who takes part
# ---------------------------------------------------------------------------
# The highest level of the defenders of the villages without defender levels
# of their own in data/VillageSiege.xml (the starting villages, Gludin, Gludio
# and Dion): characters above it earn no contribution there (they may still
# fight). The towns set theirs (up to 85).
VillageSiegeMaxPlayerLevel = 40

# A monster this many levels (or more) below a character gives it nothing.
VillageSiegeGreyLevelDifference = 12

# How far from the heart of the village (its gatekeeper) or an entrance a
# defender counts as being at the siege.
VillageSiegeAreaRange = 2000

# Monsters of the defenders' own level: for every defender at a gate above the
# village's levels (of the siege's defender levels), as many of the gate's
# monsters come at that defender's level (VillageSiegeScaleLevelsBelow under it
# to VillageSiegeScaleLevelsAbove over it), and the Warband Leaders and the
# Siege Lord at the level of the strongest. The rest are the village's own.
VillageSiegeScaleToDefenders = True
VillageSiegeScaleLevelsBelow = 3
VillageSiegeScaleLevelsAbove = 1

# ---------------------------------------------------------------------------
# Entrances
# ---------------------------------------------------------------------------
# The entrances are the roads the monsters of the hunting grounds around take
# into the village, unless data/VillageSiege.xml lists them.
# Most entrances of a village.
VillageSiegeMaxEntrances = 3

# Roads that cross into the village closer than this are one entrance.
VillageSiegeEntranceSpacing = 1500

# The hunting grounds within this range of the village send its monsters.
VillageSiegeSourceRange = 14000

# How far out on the road the waves form, and how far behind the gate the
# guards stand.
VillageSiegeRallyDistance = 2000
VillageSiegeGuardLineDistance = 120

# ---------------------------------------------------------------------------
# Waves
# ---------------------------------------------------------------------------
# The pressure on each gate: the monsters it should have on it at each stage
# (Vanguard, Main Assault, Final Assault - the first 30%, up to 70% and the
# rest of the siege), plus VillageSiegePressurePerDefender for every defender
# (players and fake players) there, at most VillageSiegePressureMax. While a
# gate has fewer, 2 to 4 more come up the road every
# VillageSiegeReinforceInterval seconds: there is always a fight.
VillageSiegePressure = 10,16,24
VillageSiegePressurePerDefender = 1.0
VillageSiegePressureMax = 45
VillageSiegeReinforceInterval = 5

# Great waves come on top of the pressure: seconds between two at a gate
# (min-max; 15% less in the Main Assault, 30% less in the Final Assault).
VillageSiegeWaveInterval = 90-150

# Monsters in a great wave: VillageSiegeWaveSize (half as many more in the
# Main Assault, twice as many in the Final Assault), plus 1 for every
# VillageSiegeWaveSizePerDefenders defenders at the entrance, at most
# VillageSiegeWaveSizeMax.
VillageSiegeWaveSize = 10
VillageSiegeWaveSizePerDefenders = 2
VillageSiegeWaveSizeMax = 30

# Most monsters of a siege alive at once.
VillageSiegeMaxMonsters = 150

# Chance (%) of a monster being a champion (twice that in the Main Assault,
# three times in the Final Assault).
VillageSiegeChampionChance = 8

# A Warband Leader (a tier 2 champion) marches with a wave every this many
# minutes (0 = never); the Siege Lord (tier 3) comes this many minutes before
# the end (0 = never).
VillageSiegeLeaderInterval = 20
VillageSiegeLordMinutes = 10

# The siege's monsters are of the levels set for the village in
# data/VillageSiege.xml (minLevel-maxLevel), the ones living nearest it. A
# village without levels takes this many levels either side of the average
# level of the monsters living around it.
VillageSiegeLevelWindow = 6

# ---------------------------------------------------------------------------
# Gates
# ---------------------------------------------------------------------------
# A gate's HP, and the HP each hit of a monster takes off it whatever its
# level (times 2 for a champion, 3 for a Warband Leader, 4 for the Siege
# Lord). With the defaults, 10 monsters beating on a gate bring it down in
# about 4 minutes.
VillageSiegeGateHp = 15000
VillageSiegeGateHitDamage = 10

# HP a gate is mended every second once no monster has hit it for 10 seconds.
VillageSiegeGateRepair = 5

# A fallen gate is raised again after this many minutes (0 = never), as soon
# as no monster is near it, at this % of its HP.
VillageSiegeGateRebuildMinutes = 5
VillageSiegeGateRebuildPercent = 30

# ---------------------------------------------------------------------------
# Guards
# ---------------------------------------------------------------------------
# The village's own guards are hidden for the siege (they would end every wave
# at once). Siege guards with their look hold a line just behind each gate,
# with the defenders: sturdy, but they hit softly, so the kills are the
# defenders'. The monsters fight them too, and once the guards and the
# defenders at a gate are down, they beat on the gate.
# Their level: the siege's level plus this.
VillageSiegeGuardLevelOffset = 4

# Guards on the line at each gate, and the seconds a fallen guard takes to
# come back.
VillageSiegeGuardsPerEntrance = 4
VillageSiegeGuardRespawn = 150

# Their stats: the median monster of their level times these.
VillageSiegeGuardHpMultiplier = 4.0
VillageSiegeGuardAttackMultiplier = 0.6
VillageSiegeGuardDefenceMultiplier = 1.5

# A guard only goes for monsters this close to its post.
VillageSiegeGuardAggroRange = 350

# The village's guards hidden: those within the farthest wave's distance from
# the heart of the village plus this.
VillageSiegeRetailGuardRange = 1500

# ---------------------------------------------------------------------------
# Fake defenders
# ---------------------------------------------------------------------------
# Fake players come to defend (they need FakePvpEnabled = True).
VillageSiegeFakeDefenders = True

# How many defend with no player at the siege, and with
# VillageSiegeFakeDefendersCrowd players or more (in between, in proportion).
# They come in small parties at the village's levels, half of them at the
# levels of the players there.
VillageSiegeFakeDefendersAlone = 24
VillageSiegeFakeDefendersCrowded = 12
VillageSiegeFakeDefendersCrowd = 20

# How long a fake defender stays (minutes, min-max; never past the end of the
# siege) before it reads its Scroll of Escape, and the seconds between two
# arrivals (min-max; quicker while fewer than half are there).
VillageSiegeFakeDefenderStay = 40-90
VillageSiegeFakeDefenderArrival = 8-25

# ---------------------------------------------------------------------------
# Contribution
# ---------------------------------------------------------------------------
# Points of a kill, shared by the damage each defender did to it (what the
# guards did is lost): a wave monster (times 1 + its champion tier), a Warband
# Leader and the Siege Lord.
VillageSiegeKillPoints = 10
VillageSiegeLeaderPoints = 100
VillageSiegeLordPoints = 300

# Points for healing another defender a whole HP bar (in proportion).
VillageSiegeHealPoints = 10

# Points for every minute in which a defender fought (hit a monster that
# isn't grey for it, or healed a defender).
VillageSiegeActivePoints = 5

# The defenders still fighting in the last VillageSiegeEndBonusMinutes get
# this much more of their points at the end (%), halved if a gate fell.
VillageSiegeEndBonusPercent = 30
VillageSiegeEndBonusMinutes = 15

# Only one character per computer earns medals in a siege (the others are
# still ranked).
VillageSiegeOnePerComputer = True

# ---------------------------------------------------------------------------
# Experience
# ---------------------------------------------------------------------------
# The siege's monsters give this much more experience and SP (%) to the
# characters up to VillageSiegeMaxPlayerLevel.
VillageSiegeExpBonus = 50

# At the end of a siege, the defenders who fought at least
# VillageSiegeRewardMinMinutes minutes get this % of the experience of their
# level (and a tenth of it in SP) for VillageSiegeRewardFullMinutes minutes of
# fighting, less for less. Each time a gate fell takes off a share, never more
# than half (with 3 gates, a fall takes off a sixth).
VillageSiegeRewardExpPercent = 30
VillageSiegeRewardFullMinutes = 30
VillageSiegeRewardMinMinutes = 5

# Above VillageSiegeRewardExpFullLevel the share of a level is halved every
# VillageSiegeRewardExpHalvingLevels levels (0 = never): a level takes far
# more fighting up there. With the defaults 30% up to level 40, 15% at 50,
# 7.5% at 60, 3.75% at 70 and 1.9% at 80 - about as many kills of monsters of
# the defender's level (150 to 180 of them) from level 40 to 75.
VillageSiegeRewardExpFullLevel = 40
VillageSiegeRewardExpHalvingLevels = 10

# ---------------------------------------------------------------------------
# Defence Medals
# ---------------------------------------------------------------------------
# The medal (4674 is the retail Medal of Honor, renamed; client rows in
# client/Currencies).
VillageSiegeMedalItemId = 4674

# What a point pays: its points times the level of the monster it was earned
# on (for healing and the minutes of fighting, the defender's level) times
# VillageSiegeMedalRate medals. The defenders above a village's levels fight
# monsters of their own level (VillageSiegeScaleToDefenders), so the stronger
# the defender, the more they earn, in any village. The end bonus pays as many
# more medals as points (%). 1 = points x level exactly.
# An hour of fighting is VillageSiegeExpectedPointsPerHour points (a good
# fighter makes 3000-4000). With the defaults it pays about 750 medals against
# monsters of level 10, 1500 at level 20, 2250 at level 30 and 3000 at level 40.
# //villagesiege shows the medals an hour of each village at its own level, and
# //villagesiege stats the points an hour of each defender of the siege going
# on, to tune VillageSiegeExpectedPointsPerHour.
VillageSiegeMedalRate = 0.025
VillageSiegeExpectedPointsPerHour = 3000

# The exchange of gear (data/multisell/custom/900600-900608) asks a medal for
# every 1000 adena of an item's shop price, rounded up: a D-grade weapon costs
# 315 to 1387 medals, a C-grade one 1505 to 4714. The board tells the defenders
# so with this (the lists don't change with it).
# The decorations (900609 hair accessories, 900610 hats, 900611 agathions and
# the Formal Wear) have no stats and are priced for the veterans: 78,000 to
# 234,000 medals, 10 to 30 sieges of a level 80 defender (6,000 medals for the
# hour of fighting and 1,800 of end bonus). The board shows each defender how
# many sieges that is at their level.
VillageSiegeAdenaPerMedal = 1000

# How many lines the rankings of the board show, and how many of the best
# defenders the end of a siege announces.
VillageSiegeRankingSize = 20
VillageSiegeAnnounceTop = 3
