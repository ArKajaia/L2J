# ---------------------------------------------------------------------------
# Village Under Siege
# ---------------------------------------------------------------------------
# Once a day, one village after the other, the monsters of the hunting grounds
# around a starting village attack its entrances (data/VillageSiege.xml).
#  - Each entrance has a gate standard. Monsters next to it wear the gate down;
#    at 0% the gate falls and the monsters run into the streets, where the
#    village guards wait behind the gate. The siege goes on until its time is up.
#  - Fake players come to defend too (more when no player is there, so the
#    fighting goes on unwatched). The monsters can kill them and they leave
#    after a while.
#  - Defenders up to VillageSiegeMaxPlayerLevel earn contribution points, paid
#    in Defence Medals as they earn them. The Defence Force Board next to the
#    gatekeeper of every village shows the schedule and the rankings and
#    exchanges the medals for gear up to C grade.
# Players see it with .siege; GMs with //villagesiege.

# Enable Village Under Siege.
VillageSiegeEnabled = True

# ---------------------------------------------------------------------------
# Schedule
# ---------------------------------------------------------------------------
# The villages (ids of data/VillageSiege.xml), besieged one after the other.
VillageSiegeOrder = talking_island,elven,dark_elven,orc,dwarven,kamael,gludin,gludio,dion

# Shift the order by one village every day, so a village isn't always
# besieged at the same hour.
VillageSiegeRotateOrder = True

# When the first siege of the day starts (server time, HH:mm).
VillageSiegeFirstStart = 07:00

# How long a siege lasts, and the break before the next one (minutes).
# Only the sieges that fit in 24 hours are held: with the defaults 9 villages
# take 9 x (120 + 40) = 24 hours.
VillageSiegeDuration = 120
VillageSiegeBreak = 40

# Announce a siege this many minutes before it starts (0 = no warning).
VillageSiegeWarning = 10

# After a restart, a siege whose time has come starts late if at least this
# many minutes of it are left.
VillageSiegeLateStartMinMinutes = 30

# Announce sieges, fallen gates and the best defenders to everyone.
VillageSiegeAnnounce = True

# ---------------------------------------------------------------------------
# Who takes part
# ---------------------------------------------------------------------------
# Characters above this level earn no contribution (they may still fight).
VillageSiegeMaxPlayerLevel = 39

# A monster this many levels (or more) below a character gives it nothing.
VillageSiegeGreyLevelDifference = 10

# How far from the heart of the village (its gatekeeper) or an entrance a
# defender counts as being at the siege.
VillageSiegeAreaRange = 2000

# ---------------------------------------------------------------------------
# Entrances
# ---------------------------------------------------------------------------
# The entrances are the roads the monsters of the hunting grounds around take
# into the village, unless data/VillageSiege.xml lists them.
# Most entrances of a village.
VillageSiegeMaxEntrances = 3

# Roads that cross into the village closer than this are one entrance.
VillageSiegeEntranceSpacing = 1200

# The hunting grounds within this range of the village send its monsters.
VillageSiegeSourceRange = 14000

# How far out on the road the waves form, and how far behind the gate the
# guards stand.
VillageSiegeRallyDistance = 1100
VillageSiegeGuardLineDistance = 300

# ---------------------------------------------------------------------------
# Waves
# ---------------------------------------------------------------------------
# Seconds between two waves at an entrance (min-max).
VillageSiegeWaveInterval = 60-90

# Monsters in a wave: VillageSiegeWaveSize, plus 1 for every
# VillageSiegeWaveSizePerDefenders defenders (players and fake players) at
# the entrance, at most VillageSiegeWaveSizeMax.
VillageSiegeWaveSize = 3
VillageSiegeWaveSizePerDefenders = 2
VillageSiegeWaveSizeMax = 10

# Most monsters of a siege alive at once.
VillageSiegeMaxMonsters = 60

# Chance (%) of a wave's monster being a champion.
VillageSiegeChampionChance = 8

# A Warband Leader (a tier 2 champion) marches with a wave every this many
# minutes (0 = never); the Siege Lord (tier 3) comes this many minutes before
# the end (0 = never).
VillageSiegeLeaderInterval = 20
VillageSiegeLordMinutes = 10

# The monsters are the ones living around the village, within this many
# levels of the siege's level (the average level of the monsters around it,
# or the level set in data/VillageSiege.xml).
VillageSiegeLevelWindow = 6

# ---------------------------------------------------------------------------
# Gates
# ---------------------------------------------------------------------------
# A gate's strength, how much each monster within VillageSiegeGateDrainRange
# of its standard takes off every second, and how much it is mended every
# second while no monster is at it.
VillageSiegeGateMeter = 2400
VillageSiegeGateDrain = 1
VillageSiegeGateDrainRange = 250
VillageSiegeGateRepair = 2

# ---------------------------------------------------------------------------
# Guards
# ---------------------------------------------------------------------------
# The village's own guards are hidden for the siege (they would end every wave
# at once). Siege guards with their look stand on a line behind each gate.
# Their level: the siege's level plus this.
VillageSiegeGuardLevelOffset = 10

# Guards on the line behind each gate. A fallen guard comes back in 90 seconds.
VillageSiegeGuardsPerEntrance = 4

# Their stats: the median monster of their level times these.
VillageSiegeGuardHpMultiplier = 3.0
VillageSiegeGuardAttackMultiplier = 1.2
VillageSiegeGuardDefenceMultiplier = 1.5

# A guard only goes for monsters this close to its post.
VillageSiegeGuardAggroRange = 450

# The village's guards hidden: those within the farthest wave's distance from
# the heart of the village plus this.
VillageSiegeRetailGuardRange = 1500

# ---------------------------------------------------------------------------
# Fake defenders
# ---------------------------------------------------------------------------
# Fake players come to defend (they need FakePvpEnabled = True).
VillageSiegeFakeDefenders = True

# How many defend with no player at the siege, and with
# VillageSiegeFakeDefendersCrowd players or more (in between, in proportion).
VillageSiegeFakeDefendersAlone = 8
VillageSiegeFakeDefendersCrowded = 3
VillageSiegeFakeDefendersCrowd = 10

# How long a fake defender stays (minutes, min-max) before it reads its
# Scroll of Escape, and the seconds between two arrivals (min-max).
VillageSiegeFakeDefenderStay = 10-25
VillageSiegeFakeDefenderArrival = 20-90

# ---------------------------------------------------------------------------
# Contribution
# ---------------------------------------------------------------------------
# Points of a kill, shared by the damage each defender did to it (what the
# guards did is lost): a wave monster (times 1 + its champion tier), a Warband
# Leader and the Siege Lord.
VillageSiegeKillPoints = 10
VillageSiegeLeaderPoints = 100
VillageSiegeLordPoints = 300

# Points for healing another defender a whole HP bar (in proportion).
VillageSiegeHealPoints = 10

# Points for every minute in which a defender fought (hit a monster that
# isn't grey for it, or healed a defender).
VillageSiegeActivePoints = 5

# The defenders still fighting in the last VillageSiegeEndBonusMinutes get
# this much more of their points at the end (%), halved if a gate fell.
VillageSiegeEndBonusPercent = 30
VillageSiegeEndBonusMinutes = 15

# Only one character per computer earns medals in a siege (the others are
# still ranked).
VillageSiegeOnePerComputer = True

# ---------------------------------------------------------------------------
# Defence Medals
# ---------------------------------------------------------------------------
# The medal (4674 is the retail Medal of Honor, renamed; client rows in
# client/Currencies).
VillageSiegeMedalItemId = 4674

# What the medals are worth: the exchange (data/multisell/custom/900600-900608)
# asks a medal for every VillageSiegeAdenaPerMedal adena of an item's shop
# price, and a defender fighting VillageSiegeHoursPerReferenceItem hours in a
# village earns its referenceItem (data/VillageSiege.xml), counting
# VillageSiegeExpectedPointsPerHour points an hour. With the defaults, three
# hours buy a Falchion in a race village, a Two-Handed Sword in Gludin and
# Gludio, and a Homunkulus's Sword in Dion - or two or three armor parts.
# //villagesiege stats shows the points an hour of each defender of the siege
# going on, to tune VillageSiegeExpectedPointsPerHour.
VillageSiegeAdenaPerMedal = 1000
VillageSiegeHoursPerReferenceItem = 3
VillageSiegeExpectedPointsPerHour = 2000

# How many lines the rankings of the board show, and how many of the best
# defenders the end of a siege announces.
VillageSiegeRankingSize = 20
VillageSiegeAnnounceTop = 3
