# ---------------------------------------------------------------------------
# Clans of fake players
# ---------------------------------------------------------------------------
# Clans run by fake players. They are real clans: in the clan list and the
# database, with a level, a crest, reputation, clan wars and alliances, a
# leader and a member count (their members are no characters, so the clan
# window of a player never lists them). Fake players (town, farming and party
# ones) are sometimes members: they show the clan name, crest and alliance
# over their heads and a random title.
#  - Players can declare a clan war on them (Clan window > Clan War > Declare,
#    by clan name). The clan declares war back after a while, and its members
#    then attack the players of that clan when they meet them outside town.
#    Kills in a war that both clans declared give no karma and move clan
#    reputation, like a war between players. When the players stop their war,
#    the clan stops its own too.
#  - A clan whose members a players' clan keeps killing declares war on it.
#  - An alliance leader invites one of them into the alliance by targeting one
#    of its members and inviting it (/allyinvite): the member takes it to its
#    leader, and the clan answers after a few seconds.
#  - A fake player that isn't in a clan can be invited into a player's clan
#    (target it and invite it to the clan): it may accept, and from then on it
#    is a member for good, kept in the database (fake_clan_members) with its
#    name, class, looks and title. It logs off and on again like a player:
#    offline it shows in the clan window as an offline member, and it logs in
#    later on a hunting ground of its level. Every day cycle it may leave the
#    clan, or gain a level; at the levels of FakeClanMemberRerollLevels its
#    gear and passive tree are rolled again (between them it keeps the same
#    ones, also after a restart). It can be dismissed from the clan window.
#  - A clan with an academy can invite a fake player of level 40 or below
#    that has no 2nd class yet into the academy (the academy invite of the
#    clan window). It never leaves on its own and gains a level every day
#    cycle (not FakeClanMemberLevelUpChance); like a player of the academy it
#    doesn't fight in the clan's wars. At its 2nd class (level 40) it
#    graduates: it leaves the clan, which earns CompleteAcademyMinPoints to
#    CompleteAcademyMaxPoints reputation (Feature.ini) by the level it joined
#    the academy at, like for a player graduate.
#    Such members don't count toward clan level or member requirements.
# A clan of fake players is marked in the database by a leader id equal to
# its clan id. Its leader is kept in the global_variables table
# (FAKE_CLAN_<clan id>). //fakeclans shows them.
# Requires EnableFakePlayers = True in FakePlayers.ini.

# Enable the clans of fake players.
FakeClansEnabled = True

# The clans: names separated by commas, 2-16 letters and digits each. A clan is
# made once, the first time the server starts with its name here, and kept
# after (removing a name keeps the clan, its members just don't join it
# anymore). A clan of players already using a name isn't touched.
# Each clan gets a crest of its own. To give one your own crest, put a 16x12
# picture (like the one a player uploads) in data/fakeclans/<clan name>.bmp or
# .png, or the crest data itself in data/fakeclans/<clan name>.dds (256 bytes
# at most); it replaces the drawn one at the next start.
FakeClanNames = Valhalla,IronLegion,Nightshade,DragonGuard,SilverWolves,CrimsonDawn,Eclipse,Phoenix,Sovereign

# Clans at war with each other, both having declared it: pairs of names from
# FakeClanNames, Name1:Name2, separated by semicolons. Their members fight each
# other when they meet on the hunting grounds.
FakeClanWars = IronLegion:CrimsonDawn

# Level of a new clan: random between these (3-11).
FakeClanLevelMin = 4
FakeClanLevelMax = 8

# Member count of a new clan (shown in the alliance window and the war
# requirements): random between these.
FakeClanMembersMin = 18
FakeClanMembersMax = 40

# Chance (in %) a new fake player is a member of one of the clans.
FakeClanMemberChance = 35

# Chance (in %) a fake player that comes with another one (a party back from a
# hunt in town, a hunting party) is in the same clan.
FakeClanSameClanChance = 70

# Titles of the members, separated by commas (16 characters at most each). A
# member gets one at random, with FakeClanTitleChance %; others have no title.
# Fake players that aren't in a clan have no title.
FakeClanTitles = Officer,Elite,Veteran,Recruit,Guardian,Knight,Captain,Sentinel,Vanguard,Raider,Warlord,Champion,Rookie,Shadow,Hunter,Defender,Striker,Healer,Treasurer,Scout,Crusader,Avenger,Marshal,Squire,Lieutenant,Commander,Herald,Warden,Right Hand,War Chief
FakeClanTitleChance = 80

# Chance (in %) a member attacks a player (or a fake player) of a clan its clan
# is at war with, both having declared it, when it sees them outside town; and
# the most levels above it they may be.
FakeClanWarAttackChance = 70
FakeClanWarMaxLevelAbove = 5

# Chance (in %) a clan declares war back on a players' clan that declared war
# on it, and how long it takes (seconds, random between min and max). It
# stops its war after the same time when the players stop theirs.
FakeClanWarReplyChance = 100
FakeClanWarReplyDelayMin = 30
FakeClanWarReplyDelayMax = 300

# A clan declares war on a players' clan (level 3 or more, enough members to be
# at war) whose members killed this many of its members within
# FakeClanWarGrudgeTime minutes. 0 = never.
FakeClanWarGrudgeKills = 5
FakeClanWarGrudgeTime = 60

# Chance (in %) a clan accepts an alliance invite. The answer is kept for 10
# minutes, asking again doesn't change it.
FakeClanAllyAcceptChance = 80

# Chance (in %) a fake player that isn't in a clan accepts an invite into a
# player's clan (kept for 10 minutes), and the most fake players one clan can
# have as members. 0 = only the clan's own member limit (players and fake
# players together, by clan level).
FakeClanInviteAcceptChance = 60
FakeClanMaxRecruits = 0

# Members of players' clans (fake players invited into a clan):
# Hours of one day cycle. At each cycle every member rolls once to leave the
# clan (FakeClanMemberLeaveChance %) and, if it stays, once to gain a level
# (FakeClanMemberLevelUpChance %, up to 85); one in a clan academy gains a
# level every cycle instead. Cycles missed while the server was down are
# rolled at the next start (30 at most).
FakeClanMemberCycleHours = 24
FakeClanMemberLeaveChance = 5
FakeClanMemberLevelUpChance = 5

# Reaching one of these levels rolls the member's gear and passive tree again
# (the class line and name never change; it still takes its 1st, 2nd and 3rd
# class at 20, 40 and 76). A level up to any other level keeps them.
FakeClanMemberRerollLevels = 20,40,52,61,76,80,82,84

# Minutes a member stays offline after logging off, random between these.
# Online it hunts like any roaming fake player and logs off after
# FakePvpLifetime (FakePlayerPvp.ini).
FakeClanMemberOfflineMin = 30
FakeClanMemberOfflineMax = 240

# A member logs in on a hunting ground where fake players come (a monster's
# spot, see FakePlayerPvp.ini) whose level is at most this many levels away
# from its own.
FakeClanMemberLoginLevelRange = 5

# ---------------------------------------------------------------------------
# Castles of fake clans
# ---------------------------------------------------------------------------
# A castle without a lord is taken by one of the clans of FakeClanNames that
# has no castle yet (one castle per clan: with 9 castles, 9 names are needed
# to hold them all). The clan holds it like a players' clan: its crest is on
# the castle npcs, it sets the tax rate, players can siege it (the attackers
# fight the castle's npc guards, doors and towers) and a players' clan that
# engraves the artifact takes the castle for good. A castle left without a
# lord (a siege that ended in a draw, a clan that was disbanded) is taken
# again after FakeClanCastleTakeDelay minutes; never during its siege or a
# territory war.
# The lord runs the manor of its castle (seeds and crops, see below) on its
# own: every period it sells all seeds of the castle and buys all its crops,
# at a price of its own each day, without taking the cost from the treasury.
# The crops it buys are used up (they don't go to the clan warehouse), and it
# spends what the castle earns (taxes, seeds): its treasury stays empty, like
# that of a castle without a lord, so taking it gives no treasury. When
# players take the castle, its manor stays as the lord left it for the
# current and next period, then the new lord sets it.
# Turning this off gives the castles of fake clans back to the npcs at the
# next start. //fakeclans shows the castles.

# Enable the castles of fake clans.
FakeClanCastles = True

# The castles they hold, by id: 1 Gludio, 2 Dion, 3 Giran, 4 Oren, 5 Aden,
# 6 Innadril, 7 Goddard, 8 Rune, 9 Schuttgart.
FakeClanCastleIds = 1,2,3,4,5,6,7,8,9

# Minutes a castle stays without a lord before a clan takes it (at the server
# start it is taken right away).
FakeClanCastleTakeDelay = 30

# Tax rate (%) of their castles, at most the limit of the Seal of Strife
# (5, 15 or 25).
FakeClanCastleTaxPercent = 10

# True: in a siege of their castle the npc guards of the castle defend it,
# like a castle without a lord. False: like a players' castle, only the
# mercenaries the lord placed (fake clans place none).
FakeClanCastleNpcGuards = True

# Chance (in %) the lord accepts a players' clan that registers to defend its
# castle (decided 1-10 minutes after the registration; a clan refused stays
# waiting for approval and doesn't defend).
FakeClanCastleDefenderAcceptChance = 80

# Manor of their castles.
# Seeds on sale each period: % of the seed's limit (0-100).
FakeClanManorSeedAmount = 100
# Price of a seed: % of its base price, random between min and max for each
# seed every period (60-1000, the range a lord can set).
FakeClanManorSeedPriceMin = 100
FakeClanManorSeedPriceMax = 130
# Crops bought each period: % of the crop's limit (0-100).
FakeClanManorCropAmount = 100
# Price paid for a crop: % of its base price, random between min and max for
# each crop every period (60-1000).
FakeClanManorCropPriceMin = 100
FakeClanManorCropPriceMax = 150
# What a crop is exchanged for: 1 or 2 (the two rewards of the crop), 0 for
# one of them at random for each crop every period.
FakeClanManorCropReward = 0
# Every this many minutes the seeds sold and the crops bought in the current
# period are refilled to the amounts of the period. 0 = only at the period
# change (each day at AltManorRefreshTime, General.ini).
FakeClanManorRefillMinutes = 60
