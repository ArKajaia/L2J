# ---------------------------------------------------------------------------
# Buff Templates (self-buff service)
# ---------------------------------------------------------------------------
# Players build templates out of buffs from their OWN class skill tree and
# re-apply a whole template from the Community Board instead of casting each
# buff by hand. No buff is ever granted that the player could not cast:
# every use re-checks that the skill is known, charges its MP and items,
# respects (and starts) its reuse delay and skips it if its cast conditions
# fail. Templates are stored per character.
# Only buffs listed in Player.ini SkillDurationList can be used, so
# EnableModifySkillDuration must be True there or no buff qualifies.

# Enable buff templates.
# Default: True
CommunityEnableBuffTemplates = True

# Number of template slots per character (1-10).
# Default: 3
CommunityBuffTemplateSlots = 3

# Maximum buffs in one template (1-48).
# Default: 24
CommunityBuffTemplateMaxBuffs = 48

# Price for each template use, paid in CommunityCurrencyId.
# Default: 0 (free)
CommunityBuffTemplatePrice = 0

# Seconds a character must wait between two template uses (minimum 1).
# Default: 5
CommunityBuffTemplateCooldown = 1

# Allow template use only inside peace zones.
# Default: True
CommunityBuffTemplatePeaceOnly = True

# Effect handlers a skill may contain to be accepted in a template.
# A skill is rejected if ANY of its effects is not listed here, which keeps
# heals, summons, invincibility (Celestial Shield), Ultimate Defense, Noblesse
# Blessing, Salvation, stealth, transformations etc. out of templates.
# DispelBySlot/BlockAbnormalSlot are needed by the "Improved ..." buffs and
# Chant of Combat, which replace the smaller buffs they combine.
# Names are the <effect name="..."> values of the skill XML.
# Default: Buff,MaxHp,MaxCp,AttackTrait,DefenceTrait,BlockAbnormalSlot,DispelBySlot,TriggerSkillByDamageReceived,HealOverTime
CommunityBuffTemplateAllowedEffects = Buff,MaxHp,MaxCp,AttackTrait,DefenceTrait,BlockAbnormalSlot,DispelBySlot,TriggerSkillByDamageReceived,HealOverTime

# Skill ids that can never be added to a template, even when they pass every
# other check.
# Usage: SkillId1,SkillId2...
# Default: (empty)
CommunityBuffTemplateForbiddenSkills =
