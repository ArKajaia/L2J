<html><title>Hidden Quests</title><body>
<center>
<table width=270><tr>
<td width=45><button value="Main" action="bypass admin_admin" width=45 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
<td width=180><center>Hidden Quests</center></td>
<td width=45><button value="Back" action="bypass admin_html custom_menu.htm" width=45 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
</tr></table><br>
<font color="A0A0A0">Each quest has a secret condition. Status lists them all.</font><br><table width=270 border=0 bgcolor="444444">
<tr><td width=100>Player:</td><td width=170><edit var="hqname" width=150 height=15></td></tr>
<tr><td width=100>Quest id:</td><td width=170><edit var="hqid" width=150 height=15></td></tr>
</table><br1><table width=270><tr>
<td><button value="Status" action="bypass -h admin_hiddenquest $hqname" width=65 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
<td><button value="Trigger" action="bypass -h admin_hiddenquest_trigger $hqid $hqname" width=65 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
<td><button value="Send" action="bypass -h admin_hiddenquest_send $hqid $hqname" width=65 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
<td><button value="Complete" action="bypass -h admin_hiddenquest_complete $hqname" width=65 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
</tr></table><table width=270><tr>
<td><button value="Abort" action="bypass -h admin_hiddenquest_abort $hqname" width=65 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
<td><button value="Reset id" action="bypass -h admin_hiddenquest_reset $hqid $hqname" width=65 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
<td><button value="Reset All" action="bypass -h admin_hiddenquest_reset all $hqname" width=65 height=21 back="L2UI_CT1.Button_DF_Down" fore="L2UI_CT1.Button_DF"></td>
</tr></table>
</center></body></html>
