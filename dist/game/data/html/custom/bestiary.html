function renderSlayer() {
	const d = state.data;
	const dmg = d.slayerDamage || [], def = d.slayerDefense || [];
	const last = d.tierNames.length - 1;
	document.getElementById("slayer-intro").innerHTML = `The more monsters of a race you find and the higher their tiers, the harder you hit that race and the less it hurts you. Each monster counts for its share of the race: when every one is ${esc(d.tierNames[0])} you deal <b>+${dmg[0]}%</b> damage and take <b>-${def[0]}%</b>, up to <b>+${dmg[last]}%</b> and <b>-${def[last]}%</b> when all are ${esc(d.tierNames[last])}. Races with fewer than ${fmt(d.slayerMin)} monsters give no bonus. It works for all your characters, and their summons.`;
	const list = (d.slayer || []).slice().sort((a, b) => b.dmg - a.dmg || b.n - a.n);
	let html = "";
	for (const s of list) {
		const p = { id: 0, g: s.f ? 1 : 0, r: s.r, t: 0, e: -1 };
		html += `<div class="race" data-race="${esc(s.r)}" title="Show the ${esc(RACE_NAME[s.r] || s.r)} of the collection">${portrait(p)}<div><div class="n">${esc(RACE_NAME[s.r] || s.r)}<small>${fmt(s.f)} / ${fmt(s.n)} found</small></div><div class="pb"><i style="width:${(dmg[last] ? s.dmg / dmg[last] * 100 : 0).toFixed(1)}%"></i></div><div class="b">Damage <b>+${s.dmg.toFixed(2)}%</b> &middot; damage taken <b>-${s.def.toFixed(2)}%</b> <span style="color:#55524a">of +${dmg[last]}% / -${def[last]}%</span></div></div></div>`;
	}
	document.getElementById("races").innerHTML = html || `<div class="empty">No race has enough monsters for a bonus.</div>`;
	const counted = new Set(list.map(s => s.r));
	const others = [...new Set(d.monsters.map(m => m.r))].filter(r => !counted.has(r)).map(r => RACE_NAME[r] || r).sort();
	document.getElementById("races-off").textContent = others.length ? "Too few to count: " + others.join(", ") + "." : "";
}

function showRace(race) {
	state.filters = { q: "", region: -1, area: -1, min: "", max: "", status: "all", kind: "all", race: race, sort: "level" };
	syncFilterInputs();
	switchTab("collection");
	renderCollection();
	window.scrollTo(0, 0);
}

// ---------------------------------------------------------------------------------------------
// Hall of hunters
// ---------------------------------------------------------------------------------------------

async function renderHunters() {
	const box = document.getElementById("hunters");
	if (!state.hunters) {
		box.innerHTML = `<div class="loading">Counting the hunters...</div>`;
		const res = await apiFetch("ranking");
		if (!res.ok) { box.innerHTML = `<div class="empty">The ranking could not be read.</div>`; return; }
		state.hunters = await res.json();
	}
	const h = state.hunters;
	if (!h.top.length) {
		box.innerHTML = `<div class="empty">No hunter is ranked yet. The ranking is counted every few minutes.</div>`;
		return;
	}
	const row = x => `<tr class="${x.me ? "me" : ""}"><td class="rank">${x.rank}</td><td>${esc(x.name)}<div class="cls">Lv. ${x.level} ${esc(x.cls)}</div></td><td class="found">${fmt(x.found)} <span class="cls">/ ${fmt(h.total)}</span><div class="pb"><i style="width:${(h.total ? x.found / h.total * 100 : 0).toFixed(1)}%"></i></div></td><td>${fmtShort(x.kills)}</td></tr>`;
	let html = `<div class="hunters"><table><tr><th>#</th><th>Hunter</th><th>Monsters found</th><th>Kills</th></tr>${h.top.map(row).join("")}`;
	if (h.me) html += `<tr><td colspan="4" style="text-align:center;color:var(--dim)">&middot; &middot; &middot;</td></tr>` + row(h.me);
	html += `</table></div><p class="note">${fmt(h.hunters)} hunters &middot; each one an account, shown by its highest character &middot; counted ${ago(h.time)}</p>`;
	box.innerHTML = html;
}

// ---------------------------------------------------------------------------------------------
// One monster
// ---------------------------------------------------------------------------------------------

/** The monsters around the open one, in the order the collection shows them. */
function neighbours(id) {
	let list = state.lastList.includes(id) ? state.lastList : state.data.monsters.slice().sort((a, b) => a.l - b.l || (a.n || "~").localeCompare(b.n || "~")).map(m => m.id);
	if (!list.includes(id)) list = [id];
	const i = list.indexOf(id);
	return { prev: i > 0 ? list[i - 1] : 0, next: i < list.length - 1 ? list[i + 1] : 0 };
}

/**
 * Opens a monster's profile page.
 * @param id the monster
 * @param push add it to the browser history (false when coming back through it)
 */
async function openProfile(id, push) {
	const summary = state.byId.get(id);
	if (!summary) return;
	if (state.tab !== "profile") {
		state.returnTab = state.tab;
		state.returnScroll = window.scrollY;
	}
	if (push) {
		try { history.pushState({ monster: id }, "", "?monster=" + id); } catch (e) { /* not essential */ }
	}
	state.detailId = id;
	state.detailWorld = false;
	disposeViewer();
	switchTab("profile");
	window.scrollTo(0, 0);
	document.getElementById("profile").innerHTML = navBar(summary) + `<div class="loading">Reading...</div>`;
	const [res] = await Promise.all([apiFetch("monster?id=" + id), loadMap()]);
	if (state.detailId !== id) return;
	if (!res.ok) {
		document.querySelector("#profile .loading").textContent = res.status === 401 ? "This link has expired. Type .bestiary in game for a new one." : "This monster could not be read.";
		return;
	}
	state.detail = await res.json();
	renderProfile();
}

/** Back to where the profile was opened from. */
function closeProfile() {
	state.detailId = 0;
	disposeViewer();
	switchTab(state.returnTab === "profile" ? "collection" : state.returnTab);
	window.scrollTo(0, state.returnScroll);
}

function disposeViewer() {
	if (state.viewer) {
		state.viewer.dispose();
		state.viewer = null;
	}
}

function navBar(m) {
	const n = neighbours(m.id);
	const name = id => { const x = state.byId.get(id); return x ? displayName(x) : ""; };
	const area = m.a && m.a.length ? state.data.areas[m.a[0]] : null;
	return `<div class="p-nav"><button id="p-back">&larr; ${state.returnTab === "collection" || state.returnTab === "profile" ? "Collection" : document.querySelector(`.tab[data-view="${state.returnTab}"]`).textContent.trim()}</button>`
		+ (area ? `<span class="crumb">${esc(state.data.regions[area.r])} &middot; ${esc(area.n)}</span>` : "")
		+ `<span class="step"><button id="p-prev" ${n.prev ? `data-go="${n.prev}"` : "disabled"} title="Previous (left arrow)">&lsaquo; ${esc(n.prev ? name(n.prev) : "")}</button><button id="p-next" ${n.next ? `data-go="${n.next}"` : "disabled"} title="Next (right arrow)">${esc(n.next ? name(n.next) : "")} &rsaquo;</button></span></div>`;
}

function lockedBox(m, tier, what) {
	const need = m.tiers[tier - 1];
	const left = need - m.kills;
	return `<div class="locked"><svg><use href="#i-lock"/></svg><div>Reach <b style="color:${TIER_COLOR[tier]}">${esc(state.data.tierNames[tier - 1])}</b> to learn ${what}: kill <b>${fmt(left)}</b> more (${fmt(m.kills)} / ${fmt(need)}).</div></div>`;
}

function renderProfile() {
	const m = state.detail;
	const summary = state.byId.get(m.id);
	const tierNames = state.data.tierNames;
	const p = { id: m.id, g: m.tier, r: m.r, t: m.t, e: m.attackElement, img: m.img, k: m.k, n: m.n, a: m.a };
	let html = navBar(Object.assign({}, summary, { a: m.a }));

	// Hero: the monster on its stage, and who it is.
	html += `<div class="p-hero"><div class="p-stage" id="p-stage">${stageFallback(p)}`;
	html += `<span class="badge">${m.tier > 0 ? esc(tierNames[m.tier - 1]) : "Not found yet"}</span></div>`;
	html += `<div class="p-info"><h2>${esc(m.n || "? ? ?")}</h2>`;
	if (m.title && KIND_NAME.indexOf(m.title) < 0) html += `<div class="title">${esc(m.title)}</div>`;
	html += `<div class="tags"><span class="tag">Lv. ${m.l}</span>`;
	if (m.tier > 0) html += `<span class="tag">${esc(RACE_NAME[m.r] || m.r)}</span>`;
	if (m.t > 0) html += `<span class="tag gold">${KIND_NAME[m.t]}</span>`;
	if (m.tier > 0) html += m.aggressive ? `<span class="tag red">Aggressive</span>` : `<span class="tag green">Passive</span>`;
	if (!m.inCollection) html += `<span class="tag">Found elsewhere</span>`;
	const bounty = state.bounty.get(m.id);
	if (bounty) html += `<span class="tag gold" title="Today's bounty: its kills count &times;${state.data.bountyMult} until done">${bounty.k >= bounty.goal ? "Bounty done" : `Bounty ${fmt(bounty.k)} / ${fmt(bounty.goal)}`}</span>`;
	if (m.inCollection && canTrack(m)) html += trackButton(m.id);
	html += `</div><div class="track">`;
	for (let g = 1; g <= 4; g++) {
		const from = g === 1 ? 0 : m.tiers[g - 2];
		const fill = Math.max(0, Math.min(1, (m.kills - from) / (m.tiers[g - 1] - from)));
		const bonus = m.dropBonuses ? m.dropBonuses[g - 1] : 0;
		html += `<div class="step${m.tier >= g ? " on" : ""}"><div class="pip"><i style="width:${(fill * 100).toFixed(1)}%;background:${TIER_COLOR[g]}"></i></div><div class="lbl">${esc(tierNames[g - 1])}<small>${fmt(m.tiers[g - 1])}${bonus ? ` &middot; drops +${bonus}%` : ""}</small></div></div>`;
	}
	html += `</div><div class="d-kills">`;
	if (m.kills) html += `<b>${fmt(m.kills)}</b> killed &middot; first ${fmtDate(m.first)} &middot; last ${ago(m.last)}`;
	else html += `Not found yet: kill one to add it to your bestiary.`;
	html += `</div>`;
	if (m.tier >= 1) {
		html += `<div class="kv">` + kv("HP", fmt(m.hp)) + kv("MP", fmt(m.mp)) + kv("Attack", WEAPON_NAME[m.weapon] || m.weapon || "-") + kv("EXP", fmt(m.exp)) + kv("SP", fmt(m.sp));
		if (m.respawn && m.respawn[1] > 0) html += kv("Respawn", m.respawn[0] === m.respawn[1] ? fmtDelay(m.respawn[0]) : fmtDelay(m.respawn[0]) + " - " + fmtDelay(m.respawn[1]));
		else if (m.spawns !== undefined) html += kv("Respawn", "-");
		html += kv("Drop bonus", m.dropBonus ? "+" + m.dropBonus + "%" : "None yet");
		if (m.best) html += `<div title="Your account's fastest kill, from the first hit${m.bestBy ? ", by " + esc(m.bestBy) : ""}"><div class="k">Fastest kill</div><div class="v">${fmtFight(m.best)}</div></div>`;
		const slayer = (state.data.slayer || []).find(s => s.r === m.r);
		if (slayer && slayer.dmg > 0) html += `<div title="Against every ${esc(RACE_NAME[m.r] || m.r)}: damage dealt +${slayer.dmg.toFixed(2)}%, damage taken -${slayer.def.toFixed(2)}%"><div class="k">${esc(RACE_NAME[m.r] || m.r)} slayer</div><div class="v">+${slayer.dmg.toFixed(1)}%</div></div>`;
		const region = regionExpOf(m);
		if (region) html += `<div title="EXP of the monsters of ${esc(region.name)} for your account"><div class="k">EXP in ${esc(region.name)}</div><div class="v">${fmtMult(region.exp)}</div></div>`;
		html += `</div>`;
	}
	html += serverLine(m) + `</div></div>`;

	// Left: combat and size. Right: drops.
	html += `<div class="p-grid"><div class="p-card"><div class="section"><h4>Combat</h4>`;
	if (m.tier >= 2) {
		const s = m.stats;
		html += `<div class="kv">` + kv("P. Atk.", fmt(s.pAtk)) + kv("M. Atk.", fmt(s.mAtk)) + kv("Atk. Spd.", fmt(s.pAtkSpd)) + kv("P. Def.", fmt(s.pDef)) + kv("M. Def.", fmt(s.mDef)) + kv("Cast Spd.", fmt(s.mAtkSpd));
		html += (s.accuracy ? kv("Accuracy", fmt(s.accuracy)) : "") + (s.evasion ? kv("Evasion", fmt(s.evasion)) : "") + kv("Critical", fmt(s.critical)) + kv("Speed", fmt(s.run)) + kv("Range", fmt(s.range)) + `</div>`;
		html += tactics(m);
		html += `<div class="sub-h">Elements</div><div class="server-line">Attacks with ${m.attackElement >= 0 ? `<b style="color:${elementColor(m.attackElement)}">${ELEMENTS[m.attackElement]} ${m.attackElementValue}</b>` : "no element"}</div>`;
		html += elementBars(m.defenseElements);
		html += `<div class="sub-h">Skills <span style="color:var(--dim);letter-spacing:0">${m.skills.length || ""}</span></div>`;
		html += m.skills.length ? `<div class="skills">${m.skills.map(k => `<span class="skill${k.p ? " p" : ""}${k.d ? " d" : ""}" title="${k.p ? "Passive" : k.d ? "Debuff" : "Active"}">${esc(k.n)} <small>${k.lv}</small></span>`).join("")}</div>` : `<div class="server-line">No skills.</div>`;
	} else html += lockedBox(m, 2, "its combat stats, elements and skills");
	html += `</div>`;
	if (m.tier >= 1) html += `<div class="section"><h4>Size${m.live ? "" : `<span class="hint">template base values</span>`}</h4>${sizeComparison(m)}</div>`;
	if (m.tier >= 1 && m.t === 0 && state.data.forms.length) html += `<div class="section"><h4>Rare forms<span class="hint">${state.data.forms.filter(f => m.v & f.b).length} of ${state.data.forms.length} killed</span></h4><div class="forms-row">${state.data.forms.map(f => `<span class="form${m.v & f.b ? " on" : ""}" style="${m.v & f.b ? `border-color:${FORM_COLOR[f.b]};color:${FORM_COLOR[f.b]}` : ""}">${m.v & f.b ? "&#10003; " : ""}${esc(f.n)}</span>`).join("")}</div></div>`;
	html += `</div><div class="p-card"><div class="section"><h4>Drops &amp; Spoils${m.tier >= 3 ? `<span class="hint">at the server's rates${m.dropBonus ? `, items +${m.dropBonus}% with your bestiary` : ""}</span>` : ""}</h4>`;
	if (m.tier >= 3) {
		const seen = m.observed;
		html += dropTable(m.drops, "Drops", seen ? seen.drops : -1, seen ? seen.min : 0, "kill") + dropTable(m.spoils, "Spoil", seen ? seen.spoils : -1, seen ? seen.min : 0, "spoiled kill");
		if (seen) html += `<div class="size-note">Actual: in how many kills each item really came out across the server. Per kill: how many of it one kill gives on average, with what the chance and amounts expect below (green or red when it is a quarter off). Both count everyone's bonuses (premium, champions, the bestiary's own) and level penalties, not Lucky Loot jackpots.</div>`;
		if (!m.drops.length && !m.spoils.length) html += `<div class="server-line">It drops nothing.</div>`;
	} else html += lockedBox(m, 3, "its drops and spoils");
	html += `</div></div></div>`;

	// The last kills of a boss across the server.
	if (m.bossKills) {
		html += `<div class="p-card p-wide"><div class="section"><h4>Kill log<span class="hint">the last kills on the server</span></h4>`;
		if (m.bossKills.length) {
			html += `<table class="boss-log"><tr><th>When</th><th>Slain by</th><th class="c">Party</th><th class="c">Fight</th></tr>`;
			for (const k of m.bossKills) html += `<tr><td>${fmtDate(k.at)} <span class="clan">${ago(k.at)}</span></td><td>${esc(k.by)}${k.clan ? ` <span class="clan">${esc(k.clan)}</span>` : ""}</td><td class="c">${k.p > 1 ? fmt(k.p) : "Solo"}</td><td class="c">${k.d ? fmtFight(k.d) : "-"}</td></tr>`;
			html += `</table>`;
		} else html += `<div class="server-line">No kill recorded yet.</div>`;
		html += `</div></div>`;
	}

	// Habitat, across the whole width.
	if (m.a || m.points) {
		html += `<div class="p-card p-wide"><div class="section"><h4>Habitat${m.spawns !== undefined ? `<span class="hint">${fmt(m.spawns)} in the world</span>` : ""}</h4>`;
		if (m.a && m.a.length) html += `<div class="areas">${m.a.map(a => `<button data-area="${a}">${esc(state.data.areas[a].n)} <span style="color:var(--dim)">&middot; ${esc(state.data.regions[state.data.areas[a].r])}</span></button>`).join("")}</div>`;
		if (m.points && m.points.length) html += mapHtml(m);
		html += `</div></div>`;
	}

	document.getElementById("profile").innerHTML = html;
	drawMap();
	if (m.m) showModel(m);
}

/** The region the monster's EXP bonus comes from (the best one, for a monster living in two), or null. */
function regionExpOf(m) {
	const d = state.data;
	if (!d.regionExp || !m.a || !(d.regionExpBonus || []).some(b => b > 0)) return null;
	let best = null;
	for (const a of m.a) {
		const r = d.areas[a] ? d.areas[a].r : -1;
		if (r >= 0 && (!best || d.regionExp[r] > best.exp)) best = { name: d.regions[r], exp: d.regionExp[r] };
	}
	return best;
}

/** What the stage shows until (or instead of) the 3D model: the portrait, or the drawing of its race. */
function stageFallback(p) {
	if (p.img) return `<img class="big${p.g === 0 ? " sil" : ""}" src="${portraitUrl(p)}" alt="">` + (p.g === 0 ? `<div class="mystery">?</div>` : "");
	return portrait(p);
}

/** Puts the 3D model on the stage; a monster not found yet is its black silhouette. */
async function showModel(m) {
	const stage = document.getElementById("p-stage");
	try {
		if (!state.models) state.models = import("/bestiary/lib/bestiary-models.js");
		const models = await state.models;
		if (!models.webglAvailable() || state.detailId !== m.id) return;
		const holder = document.createElement("div");
		holder.style.cssText = "position:absolute;inset:0";
		stage.appendChild(holder);
		const viewer = await models.createViewer(holder, m.id, { silhouette: m.tier === 0 });
		if (!viewer) { holder.remove(); return; }
		if (state.detailId !== m.id) { viewer.dispose(); return; }
		disposeViewer();
		state.viewer = viewer;
		for (const el of stage.querySelectorAll(".big, .portrait")) el.remove();
		stage.insertAdjacentHTML("beforeend", `<div class="note">Drag to turn &middot; wheel to zoom</div>` + (m.tier === 0 ? `<div class="mystery">?</div>` : ""));
	} catch (e) {
		// No WebGL, or the model failed: the portrait stays.
		console.warn("bestiary: 3D model not shown", e);
	}
}

function serverLine(m) {
	if (!m.server) return "";
	const s = m.server;
	let html = `<div class="server-line">`;
	if (s.found) {
		html += `<b>${fmt(s.kills)}</b> killed across the server by <b>${fmt(s.found)}</b> hunter${s.found === 1 ? "" : "s"}`;
		if (s.hunters) html += ` (found by ${Math.max(1, Math.round(s.found / s.hunters * 100))}% of hunters)`;
		html += `.`;
		if (s.firstBy) html += `<br>First found by <b>${esc(s.firstBy)}</b> on ${fmtDate(s.firstAt)}.`;
		if (s.best) html += `<br>Fastest kill on the server: <b>${fmtFight(s.best)}</b>.`;
	} else html += s.time ? `No hunter had found it at the last count.` : `The server numbers are being counted.`;
	if (s.time) html += `<br><span style="color:var(--dim);font-size:11px">Counted ${ago(s.time)}.</span>`;
	return html + `</div>`;
}

/** How it fights and what to hit it with: from its template and its passive skills. */
function tactics(m) {
	const t = m.tactics;
	if (!t) return "";
	const tags = [];
	tags.push(t.aggro ? `<span class="tag red">Attacks on sight <b>${fmt(t.aggro)}</b></span>` : `<span class="tag green">Attacks only when hit</span>`);
	if (t.help) tags.push(`<span class="tag" title="Others of its kind join the fight">Calls for help <b>${fmt(t.help)}</b></span>`);
	if (!t.moves) tags.push(`<span class="tag">Doesn't move</span>`);
	else if (!t.walks) tags.push(`<span class="tag">Stays put</span>`);
	if (t.ai && AI_NAME[t.ai]) tags.push(`<span class="tag">${AI_NAME[t.ai]}</span>`);
	// The element it defends worst against, when it stands out from the others.
	const def = m.defenseElements || [];
	if (def.length === 6) {
		const low = Math.min(...def), high = Math.max(...def);
		if (high - low >= 20) {
			const e = def.indexOf(low);
			tags.push(`<span class="tag weak" title="Its lowest elemental defense">Hit it with <b style="color:${ELEMENT_COLOR[e]}">${ELEMENTS[e]}</b></span>`);
		}
	}
	for (const w of t.weapons || []) tags.push(`<span class="tag ${w.v > 0 ? "weak" : "strong"}" title="Damage of ${esc(TRAIT_NAME[w.t] || w.t)} against it">${esc(TRAIT_NAME[w.t] || w.t)} <b>${w.v > 0 ? "+" : ""}${w.v}%</b></span>`);
	for (const r of t.resists || []) tags.push(r.immune ? `<span class="tag strong">Immune to ${esc(TRAIT_NAME[r.t] || r.t)}</span>` : `<span class="tag ${r.v < 0 ? "weak" : "strong"}" title="${r.v < 0 ? "Weak to" : "Resists"} ${esc(TRAIT_NAME[r.t] || r.t)}">${esc(TRAIT_NAME[r.t] || r.t)} <b>${r.v > 0 ? "resists " + r.v : "weak " + (-r.v)}%</b></span>`);
	return `<div class="sub-h">Tactics</div><div class="tactics">${tags.join("")}</div>`;
}

function kv(k, v) { return `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`; }

function elementBars(values) {
	const max = Math.max(100, ...values.map(v => Math.abs(v)));
	let html = `<div class="elements">`;
	values.forEach((v, i) => {
		const h = Math.min(100, Math.abs(v) / max * 100);
		html += `<div class="el"><div class="bar${v < 0 ? " neg" : ""}"><i style="height:${h.toFixed(0)}%;background:${ELEMENT_COLOR[i]}"></i></div><div class="val">${v > 0 ? "+" : ""}${v}</div>${ELEMENTS[i]}</div>`;
	});
	return html + `</div><div class="size-note">Defense against each element (negative is a weakness).</div>`;
}

/**
 * A table of drops or spoils: the chance from the lists, and how often each really came out.
 * @param rolls how many kills had them rolled across the server, -1 when nothing is counted
 * @param min the kills below which the actual rates are too few to trust
 * @param what "kill" or "spoiled kill", for the tooltips
 */
function dropTable(list, title, rolls, min, what) {
	if (!list || !list.length) return "";
	const sorted = list.slice().sort((a, b) => (a.x ? 1 : 0) - (b.x ? 1 : 0) || (b.x ? (b.on || 0) - (a.on || 0) : b.c - a.c));
	const counted = rolls >= 0;
	const few = counted && rolls < min;
	// An item listed twice (in two groups) has its count on one row only.
	const countedItems = new Set(list.filter(d => d.on).map(d => d.i));
	let html = `<div class="sub-h">${title}${counted ? ` <span style="color:var(--dim);letter-spacing:0;text-transform:none">&middot; actual from ${fmt(rolls)} ${what}${rolls === 1 ? "" : "s"}${few ? ", too few to trust yet" : ""}</span>` : ""}</div>`;
	html += `<table class="drops"><tr><th>Item</th><th class="c">Amount</th><th class="c">Chance</th>${counted ? `<th class="c">Actual</th>` : ""}<th class="c" title="How many of the item one kill gives on average">Per kill</th></tr>`;
	for (const d of sorted) {
		const grade = d.g && d.g !== "NONE" ? `<span class="grade ${d.g}">${d.g}</span>` : `<span class="grade">&ndash;</span>`;
		const amount = d.x ? (d.on ? fmt(Math.round(d.oa / d.on)) : "-") : d.mn === d.mx ? fmt(d.mn) : fmt(d.mn) + "-" + fmt(d.mx);
		const chance = d.x ? `<span title="Not in its drop list: it came from an event or another system">&ndash;</span>` : fmtChance(d.c) + (d.b ? `<span class="up" title="With your bestiary's drop bonus">&#9650;</span>` : "");
		// Per kill: what one kill gives on average, really (all the amounts over all the kills) and as the chance and amounts expect.
		const expected = d.x ? null : Math.min(100, d.c) / 100 * (d.mn + d.mx) / 2;
		const shared = !d.on && countedItems.has(d.i);
		let perKill;
		if (counted && rolls && !shared && (d.on || !d.x)) {
			const real = (d.oa || 0) / rolls;
			const ratio = expected ? real / expected : 0;
			const off = !few && expected && (ratio > 1.25 || ratio < 0.8);
			perKill = `<td class="c${few ? " few" : ""}" title="${fmt(d.oa || 0)} over ${fmt(rolls)} ${what}s${expected !== null ? ", expected " + fmtPerKill(expected) : ""}"><span${off ? ` style="color:${ratio > 1 ? "#8fe39a" : "#ff9b90"}"` : ""}>${fmtPerKill(real)}</span>${expected !== null ? `<small class="exp">exp. ${fmtPerKill(expected)}</small>` : ""}</td>`;
		} else {
			perKill = `<td class="c" title="As the chance and amounts expect">${shared ? "&uarr;" : expected !== null ? `<span style="color:var(--dim)">${fmtPerKill(expected)}</span>` : "-"}</td>`;
		}
		let actual = "";
		if (counted) {
			if (!d.on && countedItems.has(d.i)) actual = `<td class="c" style="color:var(--dim)">&uarr;</td>`;
			else if (!rolls) actual = `<td class="c" style="color:var(--dim)">-</td>`;
			else {
				const on = d.on || 0;
				const tip = `Came out of ${fmt(on)} of ${fmt(rolls)} ${what}s` + (on ? `, ${fmt(d.oa)} in all (${fmt(Math.round(d.oa / on))} each time)` : "");
				actual = `<td class="c${few ? " few" : ""}" title="${tip}">${on ? fmtChance(on / rolls * 100) : "0%"}</td>`;
			}
		}
		html += `<tr class="k-${d.k}${d.x ? " extra" : ""}"><td>${grade}${esc(d.n)}${d.gr ? `<span class="grp" title="Only one item of a group drops at a time">group ${d.gr}</span>` : ""}</td><td class="c">${amount}</td><td class="c">${chance}</td>${actual}${perKill}</tr>`;
	}
	return html + `</table>`;
}

/** The monster's height next to a human's. */
function sizeComparison(m) {
	if (!m.height) return "";
	const ratio = m.height / HUMAN_HEIGHT;
	const maxPx = 96;
	const scale = maxPx / Math.max(HUMAN_HEIGHT, m.height);
	const humanPx = Math.max(10, HUMAN_HEIGHT * scale);
	const monsterPx = Math.max(10, m.height * scale);
	const symbol = RACE_SYMBOL[m.r] || "ETC";
	const color = m.tier >= 2 ? elementColor(m.attackElement) : "var(--none)";
	let note = ratio >= 1.15 ? `${ratio.toFixed(ratio >= 10 ? 0 : 1)} times as tall as a human` : ratio <= 0.85 ? `${Math.round(ratio * 100)}% of a human's height` : `about as tall as a human`;
	return `<div class="size"><div class="fig"><svg width="${(humanPx / 3).toFixed(0)}" height="${humanPx.toFixed(0)}" viewBox="0 0 20 60" preserveAspectRatio="none" style="color:#6f6a5e"><use href="#i-human"/></svg><span>Human</span></div><div class="fig"><svg width="${monsterPx.toFixed(0)}" height="${monsterPx.toFixed(0)}" viewBox="0 0 100 100" style="color:${color};--eye:#0b0b0f"><use href="#r-${symbol}"/></svg><span>${esc(m.n || "?")}</span></div></div><div class="size-note">${note} (height ${fmt(m.height)}, width ${fmt(m.radius * 2)}).</div>`;
}

/** The narrowest the map zooms in to (world units across). */
const MAP_MIN_WIDTH = 6000;

/** The part of the world the map shows: the client's world map, or else all the land and the towns. */
function mapWorld() {
	const image = state.map && state.map.image;
	if (image) return image.b.slice();
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	const cell = state.map ? state.map.cell : 4096;
	for (const c of state.map ? state.map.land : []) { minX = Math.min(minX, c[0] * cell); minY = Math.min(minY, c[1] * cell); maxX = Math.max(maxX, (c[0] + 1) * cell); maxY = Math.max(maxY, (c[1] + 1) * cell); }
	for (const t of TOWNS) { minX = Math.min(minX, t[1]); minY = Math.min(minY, t[2]); maxX = Math.max(maxX, t[1]); maxY = Math.max(maxY, t[2]); }
	return [minX, minY, maxX, maxY];
}

/** A 4:3 view around a box of the world, with a margin, at least `least` units across. */
function fitView(minX, minY, maxX, maxY, margin, least) {
	let w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
	const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
	w = Math.max(w * margin, h * margin * 4 / 3, least);
	h = w * 3 / 4;
	return { x: cx - w / 2, y: cy - h / 2, w, h };
}

/** The view around the monster's spawn points. */
function monsterView(m) {
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	for (const p of m.points) { minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]); maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]); }
	return fitView(minX, minY, maxX, maxY, 1.25, 60000);
}

function worldView() {
	const b = mapWorld();
	return fitView(b[0], b[1], b[2], b[3], 1.02, 60000);
}

/** Keeps the middle of the view on the world and its width between MAP_MIN_WIDTH and a bit more than the world. */
function clampView(v) {
	const b = mapWorld(), most = worldView().w * 1.5;
	const w = Math.min(Math.max(v.w, MAP_MIN_WIDTH), most), h = w * 3 / 4;
	const cx = Math.min(Math.max(v.x + v.w / 2, b[0]), b[2]), cy = Math.min(Math.max(v.y + v.h / 2, b[1]), b[3]);
	return { x: cx - w / 2, y: cy - h / 2, w, h };
}

/** The map of the profile: the picture (or the land) once, then drawMap() sets the view and draws the towns and spawn points for it. */
function mapHtml(m) {
	state.mapView = state.detailWorld ? worldView() : monsterView(m);
	return `<div class="map" id="d-map">${mapSvg(m)}<div class="tools"><button data-zoom="1" title="Zoom in">+</button><button data-zoom="-1" title="Zoom out">&minus;</button><button id="d-world">${state.detailWorld ? "This monster" : "Whole world"}</button></div></div>`;
}

/** Where the monster spawns: on the client's world map, or on the land of every spawn point of the collection. */
function mapSvg(m) {
	const v = state.mapView;
	let svg = `<svg viewBox="${v.x.toFixed(0)} ${v.y.toFixed(0)} ${v.w.toFixed(0)} ${v.h.toFixed(0)}" preserveAspectRatio="xMidYMid meet">`;
	const image = state.map && state.map.image;
	if (image) {
		const b = image.b;
		svg += `<image href="${esc(image.url)}" x="${b[0]}" y="${b[1]}" width="${b[2] - b[0]}" height="${b[3] - b[1]}" preserveAspectRatio="none"/>`;
	} else {
		const land = state.map ? state.map.land : [];
		const cell = state.map ? state.map.cell : 4096;
		let maxN = 1;
		for (const c of land) maxN = Math.max(maxN, c[2]);
		svg += `<defs><filter id="land-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${(cell * 0.55).toFixed(0)}"/></filter></defs>`;
		svg += `<g fill="#d9b64c" filter="url(#land-soft)">`;
		for (const c of land) {
			const a = 0.12 + 0.3 * Math.min(1, Math.sqrt(c[2] / maxN) * 2);
			svg += `<rect x="${c[0] * cell}" y="${c[1] * cell}" width="${cell}" height="${cell}" opacity="${a.toFixed(3)}"/>`;
		}
		svg += `</g>`;
	}
	const color = m.tier >= 2 ? elementColor(m.attackElement) : "#ff7a45";
	return svg + `<g class="towns"></g><g class="pts" fill="${color}"></g></svg>`;
}

/** Sets the map to state.mapView, with the towns and spawn points sized for it (the same size on screen at every zoom). */
function drawMap() {
	state.mapFrame = 0;
	const svg = document.querySelector("#d-map svg");
	if (!svg || !state.detail || !state.detail.points) return;
	const v = state.mapView;
	svg.setAttribute("viewBox", `${v.x.toFixed(0)} ${v.y.toFixed(0)} ${v.w.toFixed(0)} ${v.h.toFixed(0)}`);
	const inView = (x, y, pad) => x >= v.x - pad && x <= v.x + v.w + pad && y >= v.y - pad && y <= v.y + v.h + pad;
	const font = v.w / 34;
	let towns = "";
	for (const t of TOWNS) {
		if (!inView(t[1], t[2], v.w * 0.05)) continue;
		towns += `<g><rect x="${t[1] - font * 0.3}" y="${t[2] - font * 0.3}" width="${font * 0.6}" height="${font * 0.6}" transform="rotate(45 ${t[1]} ${t[2]})" fill="#f0e6c8"/><text x="${t[1] + font * 0.7}" y="${t[2] + font * 0.35}" font-size="${font.toFixed(0)}" fill="#c9c2ad" font-family="Georgia, serif" paint-order="stroke" stroke="#08080b" stroke-width="${(font / 5).toFixed(0)}">${esc(t[0])}</text></g>`;
	}
	svg.querySelector(".towns").innerHTML = towns;
	const r = v.w / 150;
	let pts = "";
	for (const p of state.detail.points) {
		if (inView(p[0], p[1], r * 3)) pts += `<circle cx="${p[0]}" cy="${p[1]}" r="${(r * 2.6).toFixed(0)}" opacity="0.18"/><circle cx="${p[0]}" cy="${p[1]}" r="${r.toFixed(0)}"/>`;
	}
	svg.querySelector(".pts").innerHTML = pts;
}

function scheduleMap() {
	if (!state.mapFrame) state.mapFrame = requestAnimationFrame(drawMap);
}

/** The world point under a point of the screen. */
function mapPoint(svg, clientX, clientY) {
	const rect = svg.getBoundingClientRect(), v = state.mapView;
	return { x: v.x + (clientX - rect.left) / rect.width * v.w, y: v.y + (clientY - rect.top) / rect.height * v.h };
}

/** Zooms by `factor` (below 1 zooms in) keeping the world point (x, y) where it is on screen, by default the middle. */
function zoomMap(factor, x, y) {
	const v = state.mapView;
	if (x === undefined) { x = v.x + v.w / 2; y = v.y + v.h / 2; }
	const w = Math.min(Math.max(v.w * factor, MAP_MIN_WIDTH), worldView().w * 1.5), k = w / v.w;
	state.mapView = clampView({ x: x - (x - v.x) * k, y: y - (y - v.y) * k, w, h: w * 3 / 4 });
	scheduleMap();
}

/** Dragging the map with a mouse or a finger, and pinching it with two. */
const mapDrag = { pointers: new Map(), last: null };

function mapGesture() {
	const ps = [...mapDrag.pointers.values()];
	if (!ps.length) return null;
	const cx = ps.reduce((a, p) => a + p.x, 0) / ps.length, cy = ps.reduce((a, p) => a + p.y, 0) / ps.length;
	return { n: ps.length, cx, cy, d: ps.length > 1 ? Math.hypot(ps[0].x - ps[1].x, ps[0].y - ps[1].y) : 0 };
}

function initMapControls() {
	document.addEventListener("pointerdown", e => {
		const svg = e.target.closest && e.target.closest("#d-map svg");
		if (!svg || (e.pointerType === "mouse" && e.button !== 0)) return;
		svg.setPointerCapture(e.pointerId);
		mapDrag.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
		mapDrag.last = mapGesture();
		svg.classList.add("dragging");
		e.preventDefault();
	});
	document.addEventListener("pointermove", e => {
		if (!mapDrag.pointers.has(e.pointerId)) return;
		const svg = document.querySelector("#d-map svg");
		mapDrag.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
		const g = mapGesture(), last = mapDrag.last;
		mapDrag.last = g;
		if (!svg || !last || g.n !== last.n) return;
		const v = state.mapView, scale = v.w / svg.getBoundingClientRect().width;
		state.mapView = clampView({ x: v.x - (g.cx - last.cx) * scale, y: v.y - (g.cy - last.cy) * scale, w: v.w, h: v.h });
		if (g.n > 1 && last.d > 0 && g.d > 0) {
			const p = mapPoint(svg, g.cx, g.cy);
			zoomMap(last.d / g.d, p.x, p.y);
		}
		scheduleMap();
	});
	const release = e => {
		if (!mapDrag.pointers.delete(e.pointerId)) return;
		mapDrag.last = mapGesture();
		if (!mapDrag.pointers.size) {
			const svg = document.querySelector("#d-map svg");
			if (svg) svg.classList.remove("dragging");
		}
	};
	document.addEventListener("pointerup", release);
	document.addEventListener("pointercancel", release);
	document.addEventListener("wheel", e => {
		const svg = e.target.closest && e.target.closest("#d-map svg");
		if (!svg) return;
		e.preventDefault();
		const p = mapPoint(svg, e.clientX, e.clientY);
		zoomMap(Math.exp(Math.max(-1, Math.min(1, e.deltaY * (e.deltaMode ? 0.05 : 0.0015)))), p.x, p.y);
	}, { passive: false });
	document.addEventListener("dblclick", e => {
		const svg = e.target.closest && e.target.closest("#d-map svg");
		if (!svg) return;
		const p = mapPoint(svg, e.clientX, e.clientY);
		zoomMap(e.shiftKey ? 2 : 0.5, p.x, p.y);
	});
}

// ---------------------------------------------------------------------------------------------
// Tabs and events
// ---------------------------------------------------------------------------------------------

function switchTab(view) {
	if (view !== "profile" && state.tab === "profile") disposeViewer();
	state.tab = view;
	for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b.dataset.view === view);
	for (const v of document.querySelectorAll(".view")) v.classList.toggle("active", v.id === "view-" + view);
	if (view === "grounds") renderGrounds();
	else if (view === "slayer") renderSlayer();
	else if (view === "farming") renderFarming();
	else if (view === "hunters") renderHunters();
	else if (view === "elsewhere") document.getElementById("elsewhere").innerHTML = state.data.elsewhere.slice().sort((a, b) => a.l - b.l).map(card).join("");
}

function bindEvents() {
	initMapControls();
	document.getElementById("tabs").addEventListener("click", e => {
		const b = e.target.closest(".tab");
		if (b && b.dataset.view === "farming") state.farming = null;
		if (b) { state.detailId = 0; if (history.state && history.state.monster) { try { history.pushState({}, "", window.location.pathname); } catch (x) { /* not essential */ } } switchTab(b.dataset.view); }
	});
	document.addEventListener("click", e => {
		const tracked = e.target.closest("[data-track]");
		if (tracked) { track(Number(tracked.dataset.track), tracked); return; }
		const race = e.target.closest("[data-race]");
		if (race) { showRace(race.dataset.race); return; }
		const go = e.target.closest("[data-go]");
		if (go) { openProfile(Number(go.dataset.go), true); return; }
		if (e.target.closest("#p-back")) { goBack(); return; }
		if (e.target.closest("#farm-refresh")) { state.farming = null; renderFarming(); return; }
		const target = e.target.closest("[data-id]");
		if (target) { openProfile(Number(target.dataset.id), true); return; }
		const area = e.target.closest("[data-area]");
		if (area) { showArea(Number(area.dataset.area)); return; }
		const zoom = e.target.closest("#d-map [data-zoom]");
		if (zoom) { zoomMap(Number(zoom.dataset.zoom) > 0 ? 0.6 : 1 / 0.6); return; }
		const world = e.target.closest("#d-world");
		if (world) {
			state.detailWorld = !state.detailWorld;
			state.mapView = state.detailWorld ? worldView() : monsterView(state.detail);
			world.textContent = state.detailWorld ? "This monster" : "Whole world";
			scheduleMap();
		}
	});
	document.addEventListener("change", e => {
		if (e.target.id === "farm-spoil") { state.farmSpoil = e.target.checked; state.farming = null; renderFarming(); }
	});
	document.addEventListener("keydown", e => {
		if (state.tab !== "profile" || e.target.closest("input, select, textarea")) return;
		if (e.key === "Escape") goBack();
		else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
			const button = document.getElementById(e.key === "ArrowLeft" ? "p-prev" : "p-next");
			if (button && button.dataset.go) openProfile(Number(button.dataset.go), true);
		}
	});
	// The browser's back and forward buttons go through the profiles opened.
	window.addEventListener("popstate", () => {
		const id = Number(new URLSearchParams(window.location.search).get("monster") || 0);
		if (id && state.byId.has(id)) openProfile(id, false);
		else if (state.tab === "profile") closeProfile();
	});
}

/** Back from a profile: through the history when the page added to it, else straight to the list. */
function goBack() {
	if (history.state && history.state.monster) history.back();
	else closeProfile();
}

(async function main() {
	const params = new URLSearchParams(window.location.search);
	state.token = params.get("token") || recalledToken();
	const monster = Number(params.get("monster") || 0);
	if (params.has("token")) {
		// Out of the address bar, so it doesn't end up in history, bookmarks or a copied link.
		params.delete("token");
		const rest = params.toString();
		try { history.replaceState(null, "", window.location.pathname + (rest ? "?" + rest : "")); } catch (e) { /* not essential */ }
	}
	if (!state.token) { showGate(); return; }
	let ok = false;
	try { ok = await load(); } catch (e) { showGate("The bestiary could not be reached. Try again in a moment."); return; }
	if (!ok) return;
	rememberToken(state.token);
	document.getElementById("loading").style.display = "none";
	renderHeader();
	if (window.matchMedia && window.matchMedia("(max-width: 860px)").matches) document.getElementById("filters").open = false;
	setupFilters();
	bindEvents();
	renderCollection();
	if (monster && state.byId.has(monster)) {
		try { history.replaceState({}, "", window.location.pathname); history.pushState({ monster: monster }, "", "?monster=" + monster); } catch (e) { /* not essential */ }
		openProfile(monster, false);
	}
})();
</script>
</body>
</html>
