<style>
	:root {
		--bg: #08080b; --bg2: #14141a; --panel: rgba(20,20,26,0.94); --panel2: #101015;
		--gold: #d9b64c; --cream: #f0e6c8; --muted: #8a7a55; --line: #7a5c1e; --text: #c9c2ad; --dim: #6f6a5e;
		--t1: #8fa3b5; --t2: #4aa8ff; --t3: #b07cff; --t4: #f2c94c;
		--fire: #ff7a45; --water: #4aa8ff; --wind: #6fdc8c; --earth: #c49a5a; --holy: #ffe28a; --dark: #b07cff; --none: #d8cfb6;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; padding: 0; min-height: 100%; }
	body {
		background: radial-gradient(ellipse at top, #17171f 0%, var(--bg) 70%) fixed;
		color: var(--text); font-family: Georgia, 'Times New Roman', serif; font-size: 14px;
	}
	button, input, select { font-family: inherit; font-size: 13px; }
	a { color: var(--gold); }

	/* Header */
	.top { position: sticky; top: 0; z-index: 20; background: linear-gradient(180deg, rgba(12,12,16,0.98), rgba(12,12,16,0.9)); border-bottom: 1px solid #2a2418; }
	.top-inner { max-width: 1500px; margin: 0 auto; padding: 12px 16px 0; }
	.title-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
	.mark { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--gold); display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, rgba(217,182,76,0.2), transparent 70%); flex: none; }
	.mark svg { width: 26px; height: 26px; color: var(--gold); }
	.title h1 { margin: 0; font-size: 19px; letter-spacing: 4px; color: var(--cream); text-transform: uppercase; font-weight: normal; }
	.title .who { margin-top: 3px; font-size: 12px; color: #9fa8b0; }
	.title .who b { color: var(--gold); font-weight: normal; }
	.summary { margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
	.ring { position: relative; width: 58px; height: 58px; flex: none; }
	.ring svg { width: 58px; height: 58px; transform: rotate(-90deg); }
	.ring .pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--cream); }
	.stat { background: var(--panel2); border: 1px solid #2c2618; border-radius: 6px; padding: 6px 12px; min-width: 86px; }
	.stat .label { font-size: 9px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
	.stat .value { font-size: 17px; color: var(--cream); margin-top: 1px; white-space: nowrap; }
	.stat .value small { font-size: 11px; color: var(--dim); }
	.tiers { display: flex; gap: 6px; }
	.tier-chip { border-radius: 6px; padding: 6px 9px; background: var(--panel2); border: 1px solid #2c2618; text-align: center; min-width: 62px; }
	.tier-chip .label { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; }
	.tier-chip .value { font-size: 16px; color: var(--cream); }
	.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
	.tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--muted); padding: 8px 16px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; font-size: 12px; border-radius: 6px 6px 0 0; white-space: nowrap; }
	.tab:hover { color: var(--cream); }
	.tab.active { color: var(--gold); border-color: #3a301c; background: rgba(217,182,76,0.06); }
	.tab .badge { color: var(--dim); font-size: 11px; margin-left: 4px; }

	main { max-width: 1500px; margin: 0 auto; padding: 16px; }
	.view { display: none; }
	.view.active { display: block; }

	/* Collection */
	.collection { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 18px; align-items: start; }
	.collection > * { min-width: 0; }
	.filters { position: sticky; top: 150px; background: var(--panel); border: 1px solid #2c2618; border-radius: 8px; padding: 12px; }
	.filters summary { display: none; }
	.filters label { display: block; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 10px 0 4px; }
	.filters label:first-child { margin-top: 0; }
	.filters input, .filters select { width: 100%; background: #0d0d10; color: var(--cream); border: 1px solid #3a3a42; border-radius: 4px; padding: 6px 8px; }
	.filters input:focus, .filters select:focus { outline: none; border-color: var(--gold); }
	.filters .row { display: flex; gap: 6px; align-items: center; }
	.filters .row span { color: var(--dim); }
	.filters .reset { margin-top: 12px; width: 100%; background: #1d1d24; border: 1px solid #3a3a42; color: var(--text); border-radius: 4px; padding: 6px; cursor: pointer; }
	.filters .reset:hover { border-color: var(--gold); color: var(--cream); }
	.filters .count { margin-top: 10px; font-size: 12px; color: var(--dim); text-align: center; }

	.near { margin-bottom: 16px; }
	.near h3, .group h3 { margin: 0 0 8px; font-weight: normal; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); display: flex; align-items: baseline; gap: 10px; }
	.near-list { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
	.near-item { display: flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid #2c2618; border-radius: 6px; padding: 6px 10px 6px 6px; cursor: pointer; flex: none; }
	.near-item:hover { border-color: var(--gold); }
	.near-item .portrait { width: 38px; height: 38px; }
	.near-item .n { font-size: 12px; color: var(--cream); white-space: nowrap; }
	.near-item .s { font-size: 11px; color: var(--dim); }

	.group { margin-bottom: 22px; content-visibility: auto; contain-intrinsic-size: auto 400px; }
	.group h3 { flex-wrap: wrap; }
	.group h3 .region { color: var(--dim); font-size: 11px; }
	.group h3 .done { margin-left: auto; color: var(--text); letter-spacing: 0; text-transform: none; font-size: 12px; }
	.group h3 .done.full { color: var(--t4); }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
	.card { position: relative; background: linear-gradient(180deg, #16161c, #0f0f13); border: 1px solid #26262e; border-radius: 8px; padding: 10px 8px 8px; text-align: center; cursor: pointer; transition: transform 0.12s, border-color 0.12s; }
	.card:hover { transform: translateY(-2px); border-color: var(--gold); }
	.card.g0 { border-style: dashed; border-color: #2a2a30; background: #0c0c0f; }
	.card.g1 { border-color: #3c4652; }
	.card.g2 { border-color: #24506f; }
	.card.g3 { border-color: #4f3a6e; }
	.card.g4 { border-color: #8a7020; box-shadow: 0 0 14px rgba(242,201,76,0.25); }
	.card .portrait { width: 84px; height: 84px; margin: 0 auto 6px; }
	.card .name { font-size: 12.5px; color: var(--cream); line-height: 1.25; min-height: 31px; display: flex; align-items: center; justify-content: center; }
	.card.g0 .name { color: #55524a; letter-spacing: 3px; }
	.card .meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
	.card .bar { height: 4px; background: #1d1d24; border-radius: 2px; margin-top: 7px; overflow: hidden; }
	.card .bar i { display: block; height: 100%; border-radius: 2px; }
	.card .count { font-size: 10.5px; color: var(--dim); margin-top: 3px; }
	.card .crown { position: absolute; top: 6px; left: 7px; width: 16px; height: 16px; }
	.card .aggro { position: absolute; top: 6px; right: 7px; width: 13px; height: 13px; color: #d0574a; }
	.empty { color: var(--dim); text-align: center; padding: 40px; }

	/* Portraits */
	.portrait { position: relative; border-radius: 50%; overflow: hidden; background: radial-gradient(circle at 50% 38%, var(--glow, #2a2a32) 0%, #0c0c10 72%); border: 2px solid var(--ring, #2a2a30); }
	.portrait svg { width: 100%; height: 100%; display: block; }
	.portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }
	.portrait .q { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #4a463c; font-size: 30px; }
	.g4 .portrait, .portrait.g4 { box-shadow: 0 0 10px rgba(242,201,76,0.5), inset 0 0 8px rgba(242,201,76,0.35); }

	/* Grounds */
	.regions { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 14px; align-items: start; }
	.region-box { background: var(--panel); border: 1px solid #2c2618; border-radius: 8px; padding: 12px 14px; }
	.region-box h2 { margin: 0 0 4px; font-weight: normal; font-size: 16px; color: var(--cream); letter-spacing: 1px; display: flex; align-items: baseline; }
	.region-box h2 span { margin-left: auto; font-size: 12px; color: var(--text); }
	.region-box .sub { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
	.ground { display: grid; grid-template-columns: 1fr 74px 52px; align-items: center; gap: 8px; padding: 5px 4px; border-radius: 4px; cursor: pointer; font-size: 13px; }
	.ground:hover { background: rgba(217,182,76,0.07); }
	.ground .n { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.ground .n small { color: var(--dim); margin-left: 4px; }
	.ground .pb { height: 5px; background: #1d1d24; border-radius: 3px; overflow: hidden; }
	.ground .pb i { display: block; height: 100%; background: var(--gold); }
	.ground .v { text-align: right; font-size: 12px; color: var(--dim); }
	.ground.full .v { color: var(--t4); }
	.bigbar { height: 6px; background: #1d1d24; border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
	.bigbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--line), var(--gold)); }
	.bonus-intro { max-width: 860px; margin: 0 auto 14px; background: var(--panel); border: 1px solid #2c2618; border-radius: 8px; padding: 10px 14px; font-size: 12.5px; line-height: 1.6; color: var(--text); }
	.bonus-intro:empty { display: none; }
	.bonus-intro b { color: var(--cream); font-weight: normal; }
	.region-box .exp { display: flex; align-items: center; gap: 8px; margin: -2px 0 10px; font-size: 11px; color: var(--dim); }
	.region-box .exp b { color: var(--t4); font-weight: normal; font-size: 14px; }
	.region-box .exp .pb { flex: 1; height: 4px; background: #1d1d24; border-radius: 2px; overflow: hidden; }
	.region-box .exp .pb i { display: block; height: 100%; background: var(--t4); }
	.drops .up { color: var(--t4); font-size: 9px; margin-left: 3px; }

	/* Hunters */
	.hunters { max-width: 860px; margin: 0 auto; background: var(--panel); border: 1px solid #2c2618; border-radius: 8px; padding: 6px 0; }
	.hunters table { width: 100%; border-collapse: collapse; }
	.hunters th { text-align: left; font-weight: normal; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid #2c2618; }
	.hunters td { padding: 8px 12px; border-bottom: 1px solid #1b1b20; font-size: 13px; }
	.hunters tr.me td { background: rgba(217,182,76,0.08); color: var(--cream); }
	.hunters td.rank { width: 44px; color: var(--muted); }
	.hunters tr:nth-child(2) td.rank, .hunters tr:nth-child(3) td.rank, .hunters tr:nth-child(4) td.rank { color: var(--t4); }
	.hunters td.found { width: 220px; }
	.hunters .pb { height: 5px; background: #1d1d24; border-radius: 3px; overflow: hidden; margin-top: 3px; }
	.hunters .pb i { display: block; height: 100%; background: var(--gold); }
	.hunters .cls { color: var(--dim); font-size: 12px; }
	.note { text-align: center; color: var(--dim); font-size: 12px; margin: 10px; }

	/* Profile page */
	.profile { max-width: 1180px; margin: 0 auto; }
	.p-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
	.p-nav button { background: #15151b; border: 1px solid #3a3a42; color: var(--text); border-radius: 5px; padding: 6px 12px; cursor: pointer; font-size: 12.5px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.p-nav button:hover:not(:disabled) { border-color: var(--gold); color: var(--cream); }
	.p-nav button:disabled { opacity: 0.35; cursor: default; }
	.p-nav .crumb { color: var(--dim); font-size: 12px; }
	.p-nav .step { margin-left: auto; display: flex; gap: 6px; }
	.p-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 18px; background: linear-gradient(180deg, #15151b, #0d0d11); border: 1px solid #2c2618; border-radius: 10px; overflow: hidden; }
	.p-stage { position: relative; min-height: 440px; background: radial-gradient(ellipse at 50% 42%, var(--glow, #262630) 0%, #0b0b0f 70%); border-right: 1px solid #241f14; display: flex; align-items: center; justify-content: center; }
	.p-stage canvas { position: absolute; inset: 0; cursor: grab; touch-action: none; }
	.p-stage canvas:active { cursor: grabbing; }
	.p-stage .portrait { width: 260px; height: 260px; border-width: 3px; }
	.p-stage .big { max-width: 86%; max-height: 400px; object-fit: contain; }
	.p-stage .big.sil, .portrait img.sil { filter: brightness(0) invert(0.16) drop-shadow(0 0 1.5px rgba(217,182,76,0.5)); }
	.p-stage .note { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 11px; color: #55524a; pointer-events: none; }
	.p-stage .badge { position: absolute; top: 12px; left: 12px; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--dim); }
	.p-stage .mystery { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 64px; color: rgba(217,182,76,0.18); pointer-events: none; }
	.p-info { padding: 22px 22px 18px 4px; }
	.p-info h2 { margin: 0; font-weight: normal; color: var(--cream); font-size: 28px; letter-spacing: 1px; }
	.p-info .title { color: var(--gold); font-size: 14px; margin-top: 3px; }
	.p-info .tags { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
	.p-info .track { margin: 18px 0 6px; max-width: none; }
	.p-info .kv { margin-top: 14px; }
	.p-info .server-line { margin-top: 14px; }
	.p-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
	.p-card { background: var(--panel); border: 1px solid #2c2618; border-radius: 10px; overflow: hidden; }
	.p-card .section:last-child { border-bottom: none; }
	.p-wide { margin-top: 18px; }
	.portrait img { padding: 4%; }
	.tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; border: 1px solid #3a3a42; color: var(--text); background: #121217; }
	.tag.red { border-color: #6a2a22; color: #ff9b90; }
	.tag.gold { border-color: #6a5420; color: var(--t4); }
	.tag.green { border-color: #24502f; color: #8fe39a; }
	.track { display: flex; gap: 4px; margin: 14px auto 4px; max-width: 420px; }
	.track .step { flex: 1; text-align: center; }
	.track .pip { height: 6px; border-radius: 3px; background: #1d1d24; overflow: hidden; }
	.track .pip i { display: block; height: 100%; }
	.track .lbl { font-size: 10px; margin-top: 4px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); }
	.track .lbl small { display: block; letter-spacing: 0; text-transform: none; font-size: 10px; color: #55524a; }
	.track .step.on .lbl { color: var(--cream); }
	.d-kills { font-size: 12.5px; color: var(--dim); margin-top: 6px; }
	.d-kills b { color: var(--cream); font-weight: normal; }
	.section { padding: 14px 20px; border-bottom: 1px solid #1c1a14; }
	.section h4 { margin: 0 0 10px; font-weight: normal; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
	.section h4 .hint { margin-left: auto; letter-spacing: 0; text-transform: none; font-size: 11px; color: #55524a; }
	.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
	.kv > div { background: #111116; border: 1px solid #1f1f26; border-radius: 5px; padding: 6px 8px; }
	.kv .k { font-size: 9.5px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
	.kv .v { font-size: 14px; color: var(--cream); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.locked { display: flex; align-items: center; gap: 12px; background: repeating-linear-gradient(45deg, #101014, #101014 8px, #121217 8px, #121217 16px); border: 1px dashed #2f2f37; border-radius: 6px; padding: 14px; color: var(--dim); font-size: 13px; }
	.locked svg { width: 22px; height: 22px; color: #55524a; flex: none; }
	.locked b { color: var(--text); font-weight: normal; }
	.elements { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
	.el { text-align: center; font-size: 10px; color: var(--dim); }
	.el .bar { height: 46px; background: #111116; border: 1px solid #1f1f26; border-radius: 4px; position: relative; overflow: hidden; margin-bottom: 3px; }
	.el .bar i { position: absolute; left: 0; right: 0; bottom: 0; }
	.el .bar.neg i { top: 0; bottom: auto; opacity: 0.6; }
	.el .val { color: var(--cream); font-size: 12px; }
	.skills { display: flex; flex-wrap: wrap; gap: 6px; }
	.skill { font-size: 12px; padding: 4px 9px; border-radius: 4px; background: #121217; border: 1px solid #2a2a32; color: var(--text); }
	.skill.p { color: var(--dim); border-style: dashed; }
	.skill.d { border-color: #4f3a6e; color: #cfb4ff; }
	.skill small { color: var(--dim); }
	.drops { width: 100%; border-collapse: collapse; font-size: 12.5px; }
	.drops th { font-weight: normal; text-align: left; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--dim); padding: 0 6px 5px; }
	.drops td { padding: 5px 6px; border-top: 1px solid #1a1a20; }
	.drops td.c, .drops th.c { text-align: right; white-space: nowrap; }
	.drops .grp { font-size: 10px; color: #55524a; margin-left: 4px; }
	.grade { display: inline-block; min-width: 26px; text-align: center; font-size: 10px; padding: 1px 4px; border-radius: 3px; border: 1px solid #333; color: var(--dim); margin-right: 6px; }
	.grade.D { color: #b7d6b0; border-color: #3b5236; } .grade.C { color: #9fd2ff; border-color: #2b4a66; } .grade.B { color: #f7d27a; border-color: #66532b; }
	.grade.A { color: #ffa86b; border-color: #6b3f22; } .grade.S, .grade.S80, .grade.S84 { color: #ff8f8f; border-color: #6b2828; }
	.k-weapon td:nth-child(1) { color: var(--cream); }
	.sub-h { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin: 12px 0 4px; }
	.areas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
	.areas button { font-size: 12px; padding: 3px 10px; border-radius: 12px; border: 1px solid #3a301c; background: #15130e; color: var(--gold); cursor: pointer; }
	.areas button:hover { background: #221d12; }
	.map { position: relative; border: 1px solid #241f14; border-radius: 6px; overflow: hidden; background: radial-gradient(ellipse at center, #0f1013, #070709); }
	.map svg { width: 100%; height: auto; display: block; }
	.map .tools { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
	.map .tools button { background: rgba(12,12,16,0.85); border: 1px solid #3a3a42; color: var(--text); border-radius: 4px; font-size: 11px; padding: 3px 8px; cursor: pointer; }
	.map .tools button:hover { border-color: var(--gold); }
	.size { display: flex; align-items: flex-end; gap: 18px; height: 110px; padding: 0 10px; border-bottom: 1px solid #2a2a32; }
	.size .fig { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
	.size .fig svg { display: block; }
	.size .fig span { font-size: 10px; color: var(--dim); margin-top: 3px; }
	.size-note { font-size: 12px; color: var(--dim); margin-top: 6px; }
	.server-line { font-size: 12.5px; color: var(--text); line-height: 1.6; }
	.server-line b { color: var(--cream); font-weight: normal; }
	.loading { padding: 60px; text-align: center; color: var(--dim); }

	/* Overlay when there is no valid link */
	.gate { position: fixed; inset: 0; z-index: 100; display: none; align-items: center; justify-content: center; background: rgba(8,8,11,0.96); }
	.gate.open { display: flex; }
	.gate .box { max-width: 420px; text-align: center; border: 1px solid var(--line); border-radius: 10px; padding: 28px; background: var(--panel); }
	.gate h2 { margin: 0 0 10px; font-weight: normal; color: var(--cream); letter-spacing: 3px; text-transform: uppercase; font-size: 17px; }
	.gate p { color: var(--text); line-height: 1.5; }
	.gate code { color: var(--gold); font-size: 15px; }

	@media (max-width: 860px) {
		.collection { grid-template-columns: minmax(0, 1fr); }
		.filters { position: static; }
		.filters summary { display: block; cursor: pointer; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; font-size: 12px; }
		.filters[open] summary { margin-bottom: 10px; }
		.title-row .summary { gap: 6px; }

const state = {
	token: null, data: null, byId: new Map(), areaMonsters: [], tab: "collection",
	filters: { q: "", region: -1, area: -1, min: "", max: "", status: "all", kind: "all", race: "all", sort: "ground" },
	map: null, mapPromise: null, hunters: null, detailId: 0, detailWorld: false, detail: null,
	lastList: [], returnTab: "collection", returnScroll: 0, viewer: null, models: null
};

// ---------------------------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------------------------

function esc(text) {
	return String(text == null ? "" : text).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
}
function fmt(n) { return Number(n || 0).toLocaleString("en-US"); }
/** 2 reads "x2", 1.4167 reads "x1.42". */
function fmtMult(x) { return "&times;" + Number(x || 1).toFixed(2).replace(/\.?0+$/, ""); }
function fmtShort(n) {
	n = Number(n || 0);
	if (n >= 1e9) return (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + "B";
	if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
	if (n >= 1e4) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "K";
	return fmt(n);
}
function fmtChance(c) {
	if (c >= 99.995) return "100%";
	if (c >= 10) return c.toFixed(1) + "%";
	if (c >= 1) return c.toFixed(2) + "%";
	if (c >= 0.01) return c.toFixed(3) + "%";
	return c.toFixed(4) + "%";
}
function fmtDelay(ms) {
	const s = Math.round(ms / 1000);
	if (s < 120) return s + " s";
	if (s < 7200) return Math.round(s / 60) + " min";
	const h = s / 3600;
	return (h < 48 ? (Math.round(h * 10) / 10) + " h" : Math.round(h / 24) + " days");
}
function fmtDate(ms) {
	if (!ms) return "";
	const d = new Date(ms);
	return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}
function ago(ms) {
	if (!ms) return "";
	const m = Math.round((Date.now() - ms) / 60000);
	if (m < 1) return "just now";
	if (m < 60) return m + " min ago";
	if (m < 2880) return Math.round(m / 60) + " h ago";
	return Math.round(m / 1440) + " days ago";
}
function tiersOf(m) { return m.t > 0 ? state.data.bossTiers : state.data.tiers; }
/** @return {kills needed for the next tier, or 0 when Legendary} */
function nextTierKills(m) { const tiers = tiersOf(m); const g = m.g || 0; return g < tiers.length ? tiers[g] : 0; }
/** How far into the current tier the entry is, 0..1. */
function tierProgress(m) {
	const tiers = tiersOf(m); const g = m.g || 0; const k = m.k || 0;
	if (g >= tiers.length) return 1;
	const from = g === 0 ? 0 : tiers[g - 1];
	return Math.max(0, Math.min(1, (k - from) / (tiers[g] - from)));
}
function displayName(m) { return m.n ? m.n : "? ? ?"; }
function elementColor(e) { return e >= 0 && e < 6 ? ELEMENT_COLOR[e] : "var(--none)"; }

/** A monster's portrait: its picture when there is one, otherwise the silhouette of its race. */
function portrait(m, extraClass) {
	const g = m.g || 0;
	const cls = "portrait g" + g + (extraClass ? " " + extraClass : "");
	const ring = TIER_COLOR[g];
	if (m.img) {
		return `<div class="${cls}" style="--ring:${ring}"><img src="${portraitUrl(m)}" alt="" loading="lazy"${g === 0 ? ` class="sil"` : ""}>${g === 0 ? `<div class="q">?</div>` : ""}</div>`;
	}
	const symbol = RACE_SYMBOL[m.r] || "ETC";
	if (g === 0) {
		return `<div class="${cls}" style="--ring:${ring};--glow:#17171c"><svg viewBox="0 0 100 100" style="color:#1f1f26;--eye:#0b0b0e"><use href="#r-${symbol}"/></svg><div class="q">?</div></div>`;
	}
	const color = g >= 2 ? elementColor(m.e) : "var(--none)";
	const glow = g >= 4 ? "rgba(242,201,76,0.35)" : g >= 2 && m.e >= 0 ? "color-mix(in srgb, " + color + " 30%, transparent)" : "#2a2a32";
	const eye = m.t > 0 ? "#ff5a4a" : g >= 2 ? "#0b0b0f" : "#0b0b0f";
	return `<div class="${cls}" style="--ring:${ring};--glow:${glow}"><svg viewBox="0 0 100 100" style="color:${color};--eye:${eye}"><use href="#r-${symbol}"/></svg></div>`;
}

function portraitUrl(m) { return `/bestiary/img?id=${m.id}&v=${m.img}`; }

function apiFetch(path) {
	return fetch("/api/bestiary/" + path, { headers: { "Authorization": "Bearer " + state.token } });
}
function rememberToken(token) {
	try { if (token) sessionStorage.setItem("bestiaryToken", token); else sessionStorage.removeItem("bestiaryToken"); } catch (e) { /* storage blocked */ }
}
function recalledToken() {
	try { return sessionStorage.getItem("bestiaryToken"); } catch (e) { return null; }
}
function showGate(text) {
	document.getElementById("loading").style.display = "none";
	if (text) document.getElementById("gate-text").innerHTML = text;
	document.getElementById("gate").classList.add("open");
}

// ---------------------------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------------------------

async function load() {
	const res = await apiFetch("collection");
	if (res.status === 401) {
		rememberToken(null);
		showGate("This link has expired. Type <code>.bestiary</code> in game for a new one.");
		return false;
	}
	if (!res.ok) {
		showGate("The bestiary could not be opened (" + res.status + "). Try again in a moment.");
		return false;
	}
	const data = await res.json();
	state.data = data;
	state.byId = new Map();
	for (const m of data.monsters) state.byId.set(m.id, m);
	for (const m of data.elsewhere) { m.elsewhere = true; state.byId.set(m.id, m); }
	state.areaMonsters = data.areas.map(() => []);
	for (const m of data.monsters) for (const a of (m.a || [])) if (state.areaMonsters[a]) state.areaMonsters[a].push(m);
	return true;
}

async function loadMap() {
	if (!state.mapPromise) {
		state.mapPromise = fetch("/api/bestiary/map").then(r => r.ok ? r.json() : null).then(map => { state.map = map; return map; }).catch(() => null);
	}
	return state.mapPromise;
}

// ---------------------------------------------------------------------------------------------
// Header
// ---------------------------------------------------------------------------------------------

function renderHeader() {
	const d = state.data;
	const me = d.me;
	document.getElementById("who").innerHTML = `<b>${esc(me.name)}</b>` + (me.online ? ` &middot; Lv. ${me.level} ${esc(me.cls || "")}` : " &middot; offline") + ` &middot; <span title="Every character of your account adds to this bestiary and has its bonuses">account bestiary</span>`;
	const pct = d.total ? d.found / d.total : 0;
	const counts = [0, 0, 0, 0, 0];
	for (const m of d.monsters) counts[m.g || 0]++;
	const r = 25, c = 2 * Math.PI * r;
	let html = `<div class="ring" title="${fmt(d.found)} of ${fmt(d.total)} monsters found"><svg viewBox="0 0 58 58"><circle cx="29" cy="29" r="${r}" fill="none" stroke="#1d1d24" stroke-width="5"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--gold)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${(pct * c).toFixed(1)} ${c.toFixed(1)}"/></svg><div class="pct">${Math.floor(pct * 100)}%</div></div>`;
	html += `<div class="stat"><div class="label">Found</div><div class="value">${fmt(d.found)} <small>/ ${fmt(d.total)}</small></div></div>`;
	html += `<div class="stat"><div class="label">Kills</div><div class="value">${fmtShort(d.kills)}</div></div>`;
	html += `<div class="stat"><div class="label">Rank</div><div class="value">${d.rank ? "#" + fmt(d.rank) + ` <small>of ${fmt(d.hunters)}</small>` : "&mdash;"}</div></div>`;
	html += `<div class="tiers">`;
	for (let g = 1; g <= 4; g++) {
		html += `<div class="tier-chip" style="border-color:color-mix(in srgb, ${TIER_COLOR[g]} 35%, #2c2618)"><div class="label" style="color:${TIER_COLOR[g]}">${esc(d.tierNames[g - 1])}</div><div class="value">${fmt(counts.slice(g).reduce((a, b) => a + b, 0))}</div></div>`;
	}
	html += `</div>`;
	document.getElementById("summary").innerHTML = html;
	const tab = document.getElementById("tab-elsewhere");
	tab.style.display = d.elsewhere.length ? "" : "none";
	document.getElementById("elsewhere-count").textContent = d.elsewhere.length || "";
}

// ---------------------------------------------------------------------------------------------
// Collection
// ---------------------------------------------------------------------------------------------

function setupFilters() {
	const d = state.data;
	const region = document.getElementById("f-region");
	d.regions.forEach((name, i) => region.insertAdjacentHTML("beforeend", `<option value="${i}">${esc(name)}</option>`));
	const races = [...new Set(d.monsters.map(m => m.r))].sort((a, b) => (RACE_NAME[a] || a).localeCompare(RACE_NAME[b] || b));
	const race = document.getElementById("f-race");
	races.forEach(r => race.insertAdjacentHTML("beforeend", `<option value="${esc(r)}">${esc(RACE_NAME[r] || r)}</option>`));
	fillAreas();

	const bind = (id, key, event) => document.getElementById(id).addEventListener(event || "change", e => {
		state.filters[key] = e.target.value;
		if (key === "region") { state.filters.area = -1; fillAreas(); }
		renderCollection();
	});
	bind("f-q", "q", "input");
	bind("f-region", "region");
	bind("f-area", "area");
	bind("f-min", "min", "input");
	bind("f-max", "max", "input");
	bind("f-status", "status");
	bind("f-kind", "kind");
	bind("f-race", "race");
	bind("f-sort", "sort");
	document.getElementById("f-reset").addEventListener("click", () => {
		state.filters = { q: "", region: -1, area: -1, min: "", max: "", status: "all", kind: "all", race: "all", sort: state.filters.sort };
		syncFilterInputs();
		renderCollection();
	});
}

function fillAreas() {
	const d = state.data;
	const select = document.getElementById("f-area");
	const region = Number(state.filters.region);
	let html = `<option value="-1">Every hunting ground</option>`;
	const areas = d.areas.filter(a => (region < 0 || a.r === region) && state.areaMonsters[a.id].length).sort((a, b) => a.r - b.r || a.lv - b.lv);
	for (const a of areas) html += `<option value="${a.id}">${esc(a.n)}${region < 0 ? " (" + esc(d.regions[a.r]) + ")" : ""}</option>`;
	select.innerHTML = html;
	select.value = String(state.filters.area);
}

function syncFilterInputs() {
	const f = state.filters;
	document.getElementById("f-q").value = f.q;
	document.getElementById("f-region").value = String(f.region);
	fillAreas();
	document.getElementById("f-min").value = f.min;
	document.getElementById("f-max").value = f.max;
	document.getElementById("f-status").value = f.status;
	document.getElementById("f-kind").value = f.kind;
	document.getElementById("f-race").value = f.race;
	document.getElementById("f-sort").value = f.sort;
}

function matches(m) {
	const f = state.filters;
	const g = m.g || 0;
	if (f.q) {
		if (!m.n || m.n.toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
	}
	if (Number(f.area) >= 0) { if (!(m.a || []).includes(Number(f.area))) return false; }
	else if (Number(f.region) >= 0) { if (!(m.a || []).some(a => state.data.areas[a].r === Number(f.region))) return false; }
	if (f.min && m.l < Number(f.min)) return false;
	if (f.max && m.l > Number(f.max)) return false;
	switch (f.status) {
		case "missing": if (g > 0) return false; break;
		case "found": if (g === 0) return false; break;
		case "next": if (g === 0 || g >= 4) return false; break;
		case "all": break;
		default: if (g !== Number(f.status.substring(1))) return false;
	}
	if (f.kind === "ag") { if (!m.ag) return false; }
	else if (f.kind !== "all" && m.t !== Number(f.kind)) return false;
	if (f.race !== "all" && m.r !== f.race) return false;
	return true;
}

function card(m) {
	const g = m.g || 0;
	const next = nextTierKills(m);
	const meta = `Lv. ${m.l}` + (g > 0 ? " &middot; " + esc(RACE_NAME[m.r] || m.r) : "");
	const count = g === 0 ? "Not found yet" : next ? `${fmt(m.k)} / ${fmt(next)}` : `${fmt(m.k)} kills`;
	const crown = m.t > 0 ? `<svg class="crown" style="color:${m.t === 2 ? "#ff6b5a" : "var(--t4)"}"><use href="#i-crown"/></svg>` : "";
	const aggro = m.ag ? `<svg class="aggro" title="Aggressive"><use href="#i-fang"/></svg>` : "";
	return `<div class="card g${g}" data-id="${m.id}" title="${esc(m.n || "Not found yet")}">${crown}${aggro}${portrait(m)}<div class="name">${esc(displayName(m))}</div><div class="meta">${meta}</div><div class="bar"><i style="width:${(tierProgress(m) * 100).toFixed(1)}%;background:${TIER_COLOR[Math.min(4, g + 1)]}"></i></div><div class="count">${count}</div></div>`;
}

function sortMonsters(list) {
	const s = state.filters.sort;
	const byName = (a, b) => (a.n || "~").localeCompare(b.n || "~");
	if (s === "level" || s === "ground") list.sort((a, b) => a.l - b.l || byName(a, b));
	else if (s === "name") list.sort(byName);
	else if (s === "kills") list.sort((a, b) => (b.k || 0) - (a.k || 0) || a.l - b.l);
	else if (s === "recent") list.sort((a, b) => (b.f || 0) - (a.f || 0) || a.l - b.l);
	else if (s === "close") list.sort((a, b) => remaining(a) - remaining(b) || a.l - b.l);
	return list;
}
/** Kills left to the next tier, for "closest"; Legendary entries go last. */
function remaining(m) { const next = nextTierKills(m); return next ? next - (m.k || 0) : Number.MAX_SAFE_INTEGER; }

function renderCollection() {
	const d = state.data;
	const list = d.monsters.filter(matches);
	const box = document.getElementById("cards");
	document.getElementById("f-count").textContent = `${fmt(list.length)} monster${list.length === 1 ? "" : "s"} shown, ${fmt(list.filter(m => m.g).length)} found`;
	renderNear();
	if (!list.length) {
		box.innerHTML = `<div class="empty">No monster matches these filters.</div>`;
		return;
	}
	let html = "";
	if (state.filters.sort === "ground") {
		const shown = new Set(list.map(m => m.id));
		const areaFilter = Number(state.filters.area);
		const regionFilter = Number(state.filters.region);
		const order = d.areas.filter(a => (areaFilter < 0 || a.id === areaFilter) && (regionFilter < 0 || a.r === regionFilter))
			.sort((a, b) => a.r - b.r || a.lv - b.lv || a.n.localeCompare(b.n));
		for (const area of order) {
			const all = state.areaMonsters[area.id];
			const inArea = sortMonsters(all.filter(m => shown.has(m.id)));
			if (!inArea.length) continue;
			const found = all.filter(m => m.g).length;
			html += `<div class="group"><h3>${esc(area.n)} <span class="region">${esc(d.regions[area.r])} &middot; avg. Lv. ${area.lv}</span><span class="done${found === all.length ? " full" : ""}">${found} / ${all.length} found</span></h3><div class="grid">${inArea.map(card).join("")}</div></div>`;
		}
	} else {
		html = `<div class="grid">${sortMonsters(list).slice(0, 600).map(card).join("")}</div>`;
		if (list.length > 600) html += `<p class="note">The first 600 are shown. Narrow the filters to see the rest.</p>`;
	}
	box.innerHTML = html;
	const seen = new Set();
	state.lastList = [];
	for (const el of box.querySelectorAll(".card[data-id]")) {
		const id = Number(el.dataset.id);
		if (!seen.has(id)) { seen.add(id); state.lastList.push(id); }
	}
}

/** "Almost there": the entries with the fewest kills left to their next tier. */
function renderNear() {
	const list = state.data.monsters.filter(m => m.g > 0 && m.g < 4).sort((a, b) => remaining(a) - remaining(b)).slice(0, 8);
	const box = document.getElementById("near");
	if (!list.length) { box.innerHTML = ""; return; }
	let html = `<h3>Almost there</h3><div class="near-list">`;
	for (const m of list) {
		html += `<div class="near-item" data-id="${m.id}">${portrait(m)}<div><div class="n">${esc(m.n)}</div><div class="s">${fmt(remaining(m))} more to <span style="color:${TIER_COLOR[m.g + 1]}">${esc(state.data.tierNames[m.g])}</span></div></div></div>`;
	}
	box.innerHTML = html + `</div>`;
}

// ---------------------------------------------------------------------------------------------
// Hunting grounds
// ---------------------------------------------------------------------------------------------

/** What the bonuses are, from the server's settings. */
function bonusIntro() {
	const d = state.data;
	const tierList = bonus => bonus.map((b, i) => b > 0 ? `${esc(d.tierNames[i])} <b>+${b}%</b>` : "").filter(x => x).join(", ");
	let html = `Your bestiary is your account's: every character adds to it and has its bonuses.`;
	const exp = d.regionExpBonus || [];
	if (exp.some(b => b > 0)) {
		html += ` The monsters of a region give more EXP the more of them you found and the higher their tiers: <b>${fmtMult(1 + exp[0] / 100)}</b> when all of them are ${esc(d.tierNames[0])}, up to <b>${fmtMult(1 + exp[exp.length - 1] / 100)}</b> when all are ${esc(d.tierNames[exp.length - 1])}.`;
	}
	const drops = tierList(d.dropBonus || []), bossDrops = tierList(d.bossDropBonus || []);
	if (drops || bossDrops) html += ` Each monster also drops its items more often as its tier rises: ${drops || "none"}${bossDrops !== drops ? ` (raid and grand bosses: ${bossDrops || "none"})` : ""}.`;
	return html;
}

function renderGrounds() {
	const d = state.data;
	const expBonus = d.regionExpBonus || [];
	const maxExp = 1 + Math.max(0, ...expBonus) / 100;
	document.getElementById("bonus-intro").innerHTML = bonusIntro();
	let html = "";
	d.regions.forEach((name, r) => {
		const areas = d.areas.filter(a => a.r === r && state.areaMonsters[a.id].length).sort((a, b) => a.lv - b.lv || a.n.localeCompare(b.n));
		if (!areas.length) return;
		const unique = new Map();
		for (const a of areas) for (const m of state.areaMonsters[a.id]) unique.set(m.id, m);
		const all = [...unique.values()];
		const found = all.filter(m => m.g).length;
		const legendary = all.filter(m => m.g >= 4).length;
		html += `<div class="region-box"><h2>${esc(name)}<span>${found} / ${all.length}</span></h2><div class="sub">${areas.length} hunting ground${areas.length === 1 ? "" : "s"} &middot; ${legendary} legendary</div><div class="bigbar"><i style="width:${(found / all.length * 100).toFixed(1)}%"></i></div>`;
		if (maxExp > 1) {
			const exp = d.regionExp ? d.regionExp[r] : 1;
			html += `<div class="exp" title="EXP of the monsters of ${esc(name)} for your account, out of ${fmtMult(maxExp)}">EXP <b>${fmtMult(exp)}</b><div class="pb"><i style="width:${((exp - 1) / (maxExp - 1) * 100).toFixed(1)}%"></i></div>${fmtMult(maxExp)}</div>`;
		}
		for (const a of areas) {
			const ms = state.areaMonsters[a.id];
			const f = ms.filter(m => m.g).length;
			html += `<div class="ground${f === ms.length ? " full" : ""}" data-area="${a.id}" data-region="${r}"><div class="n">${esc(a.n)}<small>Lv. ${a.lv}</small></div><div class="pb"><i style="width:${(f / ms.length * 100).toFixed(1)}%"></i></div><div class="v">${f} / ${ms.length}</div></div>`;
		}
		html += `</div>`;
	});
	document.getElementById("regions").innerHTML = html;
}

function showArea(areaId) {
	const area = state.data.areas[areaId];
	if (!area) return;
	state.filters = { q: "", region: area.r, area: areaId, min: "", max: "", status: "all", kind: "all", race: "all", sort: "ground" };
	syncFilterInputs();
	state.detailId = 0;
	if (history.state && history.state.monster) { try { history.pushState({}, "", window.location.pathname); } catch (e) { /* not essential */ } }
	switchTab("collection");
	renderCollection();
	window.scrollTo(0, 0);
}

// ---------------------------------------------------------------------------------------------
// Hall of hunters
// ---------------------------------------------------------------------------------------------

async function renderHunters() {
	const box = document.getElementById("hunters");
	if (!state.hunters) {
		box.innerHTML = `<div class="loading">Counting the hunters...</div>`;
		const res = await apiFetch("ranking");
		if (!res.ok) { box.innerHTML = `<div class="empty">The ranking could not be read.</div>`; return; }
		state.hunters = await res.json();
	}
	const h = state.hunters;
	if (!h.top.length) {
		box.innerHTML = `<div class="empty">No hunter is ranked yet. The ranking is counted every few minutes.</div>`;
		return;
	}
	const row = x => `<tr class="${x.me ? "me" : ""}"><td class="rank">${x.rank}</td><td>${esc(x.name)}<div class="cls">Lv. ${x.level} ${esc(x.cls)}</div></td><td class="found">${fmt(x.found)} <span class="cls">/ ${fmt(h.total)}</span><div class="pb"><i style="width:${(h.total ? x.found / h.total * 100 : 0).toFixed(1)}%"></i></div></td><td>${fmtShort(x.kills)}</td></tr>`;
	let html = `<div class="hunters"><table><tr><th>#</th><th>Hunter</th><th>Monsters found</th><th>Kills</th></tr>${h.top.map(row).join("")}`;
	if (h.me) html += `<tr><td colspan="4" style="text-align:center;color:var(--dim)">&middot; &middot; &middot;</td></tr>` + row(h.me);
	html += `</table></div><p class="note">${fmt(h.hunters)} hunters &middot; each one an account, shown by its highest character &middot; counted ${ago(h.time)}</p>`;
	box.innerHTML = html;
}

// ---------------------------------------------------------------------------------------------
// One monster
// ---------------------------------------------------------------------------------------------

/** The monsters around the open one, in the order the collection shows them. */
function neighbours(id) {
	let list = state.lastList.includes(id) ? state.lastList : state.data.monsters.slice().sort((a, b) => a.l - b.l || (a.n || "~").localeCompare(b.n || "~")).map(m => m.id);
	if (!list.includes(id)) list = [id];
	const i = list.indexOf(id);
	return { prev: i > 0 ? list[i - 1] : 0, next: i < list.length - 1 ? list[i + 1] : 0 };
}

/**
 * Opens a monster's profile page.
 * @param id the monster
 * @param push add it to the browser history (false when coming back through it)
 */
async function openProfile(id, push) {
	const summary = state.byId.get(id);
	if (!summary) return;
	if (state.tab !== "profile") {
		state.returnTab = state.tab;
		state.returnScroll = window.scrollY;
	}
	if (push) {
		try { history.pushState({ monster: id }, "", "?monster=" + id); } catch (e) { /* not essential */ }
	}
	state.detailId = id;
	state.detailWorld = false;
	disposeViewer();
	switchTab("profile");
	window.scrollTo(0, 0);
	document.getElementById("profile").innerHTML = navBar(summary) + `<div class="loading">Reading...</div>`;
	const [res] = await Promise.all([apiFetch("monster?id=" + id), loadMap()]);
	if (state.detailId !== id) return;
	if (!res.ok) {
		document.querySelector("#profile .loading").textContent = res.status === 401 ? "This link has expired. Type .bestiary in game for a new one." : "This monster could not be read.";
		return;
	}
	state.detail = await res.json();
	renderProfile();
}

/** Back to where the profile was opened from. */
function closeProfile() {
	state.detailId = 0;
	disposeViewer();
	switchTab(state.returnTab === "profile" ? "collection" : state.returnTab);
	window.scrollTo(0, state.returnScroll);
}

function disposeViewer() {
	if (state.viewer) {
		state.viewer.dispose();
		state.viewer = null;
	}
}

function navBar(m) {
	const n = neighbours(m.id);
	const name = id => { const x = state.byId.get(id); return x ? displayName(x) : ""; };
	const area = m.a && m.a.length ? state.data.areas[m.a[0]] : null;
	return `<div class="p-nav"><button id="p-back">&larr; ${state.returnTab === "collection" || state.returnTab === "profile" ? "Collection" : document.querySelector(`.tab[data-view="${state.returnTab}"]`).textContent.trim()}</button>`
		+ (area ? `<span class="crumb">${esc(state.data.regions[area.r])} &middot; ${esc(area.n)}</span>` : "")
		+ `<span class="step"><button id="p-prev" ${n.prev ? `data-go="${n.prev}"` : "disabled"} title="Previous (left arrow)">&lsaquo; ${esc(n.prev ? name(n.prev) : "")}</button><button id="p-next" ${n.next ? `data-go="${n.next}"` : "disabled"} title="Next (right arrow)">${esc(n.next ? name(n.next) : "")} &rsaquo;</button></span></div>`;
}

function lockedBox(m, tier, what) {
	const need = m.tiers[tier - 1];
	const left = need - m.kills;
	return `<div class="locked"><svg><use href="#i-lock"/></svg><div>Reach <b style="color:${TIER_COLOR[tier]}">${esc(state.data.tierNames[tier - 1])}</b> to learn ${what}: kill <b>${fmt(left)}</b> more (${fmt(m.kills)} / ${fmt(need)}).</div></div>`;
}

function renderProfile() {
	const m = state.detail;
	const summary = state.byId.get(m.id);
	const tierNames = state.data.tierNames;
	const p = { id: m.id, g: m.tier, r: m.r, t: m.t, e: m.attackElement, img: m.img, n: m.n, a: m.a };
	let html = navBar(Object.assign({}, summary, { a: m.a }));

	// Hero: the monster on its stage, and who it is.
	const glow = m.tier >= 4 ? "rgba(242,201,76,0.3)" : m.tier >= 2 && m.attackElement >= 0 ? `color-mix(in srgb, ${elementColor(m.attackElement)} 26%, #0b0b0f)` : "#262630";
	html += `<div class="p-hero"><div class="p-stage" id="p-stage" style="--glow:${glow}">${stageFallback(p)}`;
	html += `<span class="badge">${m.tier > 0 ? esc(tierNames[m.tier - 1]) : "Not found yet"}</span></div>`;
	html += `<div class="p-info"><h2>${esc(m.n || "? ? ?")}</h2>`;
	if (m.title && KIND_NAME.indexOf(m.title) < 0) html += `<div class="title">${esc(m.title)}</div>`;
	html += `<div class="tags"><span class="tag">Lv. ${m.l}</span>`;
	if (m.tier > 0) html += `<span class="tag">${esc(RACE_NAME[m.r] || m.r)}</span>`;
	if (m.t > 0) html += `<span class="tag gold">${KIND_NAME[m.t]}</span>`;
	if (m.tier > 0) html += m.aggressive ? `<span class="tag red">Aggressive</span>` : `<span class="tag green">Passive</span>`;
	if (!m.inCollection) html += `<span class="tag">Found elsewhere</span>`;
	html += `</div><div class="track">`;
	for (let g = 1; g <= 4; g++) {
		const from = g === 1 ? 0 : m.tiers[g - 2];
		const fill = Math.max(0, Math.min(1, (m.kills - from) / (m.tiers[g - 1] - from)));
		const bonus = m.dropBonuses ? m.dropBonuses[g - 1] : 0;
		html += `<div class="step${m.tier >= g ? " on" : ""}"><div class="pip"><i style="width:${(fill * 100).toFixed(1)}%;background:${TIER_COLOR[g]}"></i></div><div class="lbl">${esc(tierNames[g - 1])}<small>${fmt(m.tiers[g - 1])}${bonus ? ` &middot; drops +${bonus}%` : ""}</small></div></div>`;
	}
	html += `</div><div class="d-kills">`;
	if (m.kills) html += `<b>${fmt(m.kills)}</b> killed &middot; first ${fmtDate(m.first)} &middot; last ${ago(m.last)}`;
	else html += `Not found yet: kill one to add it to your bestiary.`;
	html += `</div>`;
	if (m.tier >= 1) {
		html += `<div class="kv">` + kv("HP", fmt(m.hp)) + kv("MP", fmt(m.mp)) + kv("Attack", WEAPON_NAME[m.weapon] || m.weapon || "-") + kv("EXP", fmt(m.exp)) + kv("SP", fmt(m.sp));
		if (m.respawn && m.respawn[1] > 0) html += kv("Respawn", m.respawn[0] === m.respawn[1] ? fmtDelay(m.respawn[0]) : fmtDelay(m.respawn[0]) + " - " + fmtDelay(m.respawn[1]));
		else if (m.spawns !== undefined) html += kv("Respawn", "-");
		html += kv("Drop bonus", m.dropBonus ? "+" + m.dropBonus + "%" : "None yet");
		const region = regionExpOf(m);
		if (region) html += `<div title="EXP of the monsters of ${esc(region.name)} for your account"><div class="k">EXP in ${esc(region.name)}</div><div class="v">${fmtMult(region.exp)}</div></div>`;
		html += `</div>`;
	}
	html += serverLine(m) + `</div></div>`;

	// Left: combat and size. Right: drops.
	html += `<div class="p-grid"><div class="p-card"><div class="section"><h4>Combat</h4>`;
	if (m.tier >= 2) {
		const s = m.stats;
		html += `<div class="kv">` + kv("P. Atk.", fmt(s.pAtk)) + kv("M. Atk.", fmt(s.mAtk)) + kv("Atk. Spd.", fmt(s.pAtkSpd)) + kv("P. Def.", fmt(s.pDef)) + kv("M. Def.", fmt(s.mDef)) + kv("Cast Spd.", fmt(s.mAtkSpd));
		html += (s.accuracy ? kv("Accuracy", fmt(s.accuracy)) : "") + (s.evasion ? kv("Evasion", fmt(s.evasion)) : "") + kv("Critical", fmt(s.critical)) + kv("Speed", fmt(s.run)) + kv("Range", fmt(s.range)) + `</div>`;
		html += `<div class="sub-h">Elements</div><div class="server-line">Attacks with ${m.attackElement >= 0 ? `<b style="color:${elementColor(m.attackElement)}">${ELEMENTS[m.attackElement]} ${m.attackElementValue}</b>` : "no element"}</div>`;
		html += elementBars(m.defenseElements);
		html += `<div class="sub-h">Skills <span style="color:var(--dim);letter-spacing:0">${m.skills.length || ""}</span></div>`;
		html += m.skills.length ? `<div class="skills">${m.skills.map(k => `<span class="skill${k.p ? " p" : ""}${k.d ? " d" : ""}" title="${k.p ? "Passive" : k.d ? "Debuff" : "Active"}">${esc(k.n)} <small>${k.lv}</small></span>`).join("")}</div>` : `<div class="server-line">No skills.</div>`;
	} else html += lockedBox(m, 2, "its combat stats, elements and skills");
	html += `</div>`;
	if (m.tier >= 1) html += `<div class="section"><h4>Size${m.live ? "" : `<span class="hint">template base values</span>`}</h4>${sizeComparison(m)}</div>`;
	html += `</div><div class="p-card"><div class="section"><h4>Drops &amp; Spoils${m.tier >= 3 ? `<span class="hint">at the server's rates${m.dropBonus ? `, items +${m.dropBonus}% with your bestiary` : ""}</span>` : ""}</h4>`;
	if (m.tier >= 3) {
		html += dropTable(m.drops, "Drops") + dropTable(m.spoils, "Spoil");
		if (!m.drops.length && !m.spoils.length) html += `<div class="server-line">It drops nothing.</div>`;
	} else html += lockedBox(m, 3, "its drops and spoils");
	html += `</div></div></div>`;

	// Habitat, across the whole width.
	if (m.a || m.points) {
		html += `<div class="p-card p-wide"><div class="section"><h4>Habitat${m.spawns !== undefined ? `<span class="hint">${fmt(m.spawns)} in the world</span>` : ""}</h4>`;
		if (m.a && m.a.length) html += `<div class="areas">${m.a.map(a => `<button data-area="${a}">${esc(state.data.areas[a].n)} <span style="color:var(--dim)">&middot; ${esc(state.data.regions[state.data.areas[a].r])}</span></button>`).join("")}</div>`;
		if (m.points && m.points.length) html += `<div class="map" id="d-map">${mapSvg(m)}<div class="tools"><button id="d-world">${state.detailWorld ? "Zoom in" : "Whole world"}</button></div></div>`;
		html += `</div></div>`;
	}

	document.getElementById("profile").innerHTML = html;
	if (m.m) showModel(m);
}

/** The region the monster's EXP bonus comes from (the best one, for a monster living in two), or null. */
function regionExpOf(m) {
	const d = state.data;
	if (!d.regionExp || !m.a || !(d.regionExpBonus || []).some(b => b > 0)) return null;
	let best = null;
	for (const a of m.a) {
		const r = d.areas[a] ? d.areas[a].r : -1;
		if (r >= 0 && (!best || d.regionExp[r] > best.exp)) best = { name: d.regions[r], exp: d.regionExp[r] };
	}
	return best;
}

/** What the stage shows until (or instead of) the 3D model: the portrait, or the drawing of its race. */
function stageFallback(p) {
	if (p.img) return `<img class="big${p.g === 0 ? " sil" : ""}" src="${portraitUrl(p)}" alt="">` + (p.g === 0 ? `<div class="mystery">?</div>` : "");
	return portrait(p);
}

/** Puts the 3D model on the stage; a monster not found yet is its black silhouette. */
async function showModel(m) {
	const stage = document.getElementById("p-stage");
	try {
		if (!state.models) state.models = import("/bestiary/lib/bestiary-models.js");
		const models = await state.models;
		if (!models.webglAvailable() || state.detailId !== m.id) return;
		const holder = document.createElement("div");
		holder.style.cssText = "position:absolute;inset:0";
		stage.appendChild(holder);
		const viewer = await models.createViewer(holder, m.id, { silhouette: m.tier === 0 });
		if (!viewer) { holder.remove(); return; }
		if (state.detailId !== m.id) { viewer.dispose(); return; }
		disposeViewer();
		state.viewer = viewer;
		for (const el of stage.querySelectorAll(".big, .portrait")) el.remove();
		stage.insertAdjacentHTML("beforeend", `<div class="note">Drag to turn &middot; wheel to zoom</div>` + (m.tier === 0 ? `<div class="mystery">?</div>` : ""));
	} catch (e) {
		// No WebGL, or the model failed: the portrait stays.
		console.warn("bestiary: 3D model not shown", e);
	}
}

function serverLine(m) {
	if (!m.server) return "";
	const s = m.server;
	let html = `<div class="server-line">`;
	if (s.found) {
		html += `<b>${fmt(s.kills)}</b> killed across the server by <b>${fmt(s.found)}</b> hunter${s.found === 1 ? "" : "s"}`;
		if (s.hunters) html += ` (found by ${Math.max(1, Math.round(s.found / s.hunters * 100))}% of hunters)`;
		html += `.`;
		if (s.firstBy) html += `<br>First found by <b>${esc(s.firstBy)}</b> on ${fmtDate(s.firstAt)}.`;
	} else html += s.time ? `No hunter had found it at the last count.` : `The server numbers are being counted.`;
	if (s.time) html += `<br><span style="color:var(--dim);font-size:11px">Counted ${ago(s.time)}.</span>`;
	return html + `</div>`;
}

function kv(k, v) { return `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`; }

function elementBars(values) {
	const max = Math.max(100, ...values.map(v => Math.abs(v)));
	let html = `<div class="elements">`;
	values.forEach((v, i) => {
		const h = Math.min(100, Math.abs(v) / max * 100);
		html += `<div class="el"><div class="bar${v < 0 ? " neg" : ""}"><i style="height:${h.toFixed(0)}%;background:${ELEMENT_COLOR[i]}"></i></div><div class="val">${v > 0 ? "+" : ""}${v}</div>${ELEMENTS[i]}</div>`;
	});
	return html + `</div><div class="size-note">Defense against each element (negative is a weakness).</div>`;
}

function dropTable(list, title) {
	if (!list || !list.length) return "";
	const sorted = list.slice().sort((a, b) => b.c - a.c);
	let html = `<div class="sub-h">${title}</div><table class="drops"><tr><th>Item</th><th class="c">Amount</th><th class="c">Chance</th></tr>`;
	for (const d of sorted) {
		const grade = d.g && d.g !== "NONE" ? `<span class="grade ${d.g}">${d.g}</span>` : `<span class="grade">&ndash;</span>`;
		html += `<tr class="k-${d.k}"><td>${grade}${esc(d.n)}${d.gr ? `<span class="grp" title="Only one item of a group drops at a time">group ${d.gr}</span>` : ""}</td><td class="c">${d.mn === d.mx ? fmt(d.mn) : fmt(d.mn) + "-" + fmt(d.mx)}</td><td class="c">${fmtChance(d.c)}${d.b ? `<span class="up" title="With your bestiary's drop bonus">&#9650;</span>` : ""}</td></tr>`;
	}
	return html + `</table>`;
}

/** The monster's height next to a human's. */
function sizeComparison(m) {
	if (!m.height) return "";
	const ratio = m.height / HUMAN_HEIGHT;
	const maxPx = 96;
	const scale = maxPx / Math.max(HUMAN_HEIGHT, m.height);
	const humanPx = Math.max(10, HUMAN_HEIGHT * scale);
	const monsterPx = Math.max(10, m.height * scale);
	const symbol = RACE_SYMBOL[m.r] || "ETC";
	const color = m.tier >= 2 ? elementColor(m.attackElement) : "var(--none)";
	let note = ratio >= 1.15 ? `${ratio.toFixed(ratio >= 10 ? 0 : 1)} times as tall as a human` : ratio <= 0.85 ? `${Math.round(ratio * 100)}% of a human's height` : `about as tall as a human`;
	return `<div class="size"><div class="fig"><svg width="${(humanPx / 3).toFixed(0)}" height="${humanPx.toFixed(0)}" viewBox="0 0 20 60" preserveAspectRatio="none" style="color:#6f6a5e"><use href="#i-human"/></svg><span>Human</span></div><div class="fig"><svg width="${monsterPx.toFixed(0)}" height="${monsterPx.toFixed(0)}" viewBox="0 0 100 100" style="color:${color};--eye:#0b0b0f"><use href="#r-${symbol}"/></svg><span>${esc(m.n || "?")}</span></div></div><div class="size-note">${note} (height ${fmt(m.height)}, width ${fmt(m.radius * 2)}).</div>`;
}

/** Where the monster spawns, on the land of every spawn point of the collection, with the towns. */
function mapSvg(m) {
	const pts = m.points;
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	const land = state.map ? state.map.land : [];
	const cell = state.map ? state.map.cell : 4096;
	if (state.detailWorld) {
		for (const c of land) { minX = Math.min(minX, c[0] * cell); minY = Math.min(minY, c[1] * cell); maxX = Math.max(maxX, (c[0] + 1) * cell); maxY = Math.max(maxY, (c[1] + 1) * cell); }
		for (const t of TOWNS) { minX = Math.min(minX, t[1]); minY = Math.min(minY, t[2]); maxX = Math.max(maxX, t[1]); maxY = Math.max(maxY, t[2]); }
	}
	for (const p of pts) { minX = Math.min(minX, p[0]); minY = Math.min(minY, p[1]); maxX = Math.max(maxX, p[0]); maxY = Math.max(maxY, p[1]); }
	// At least 60,000 units across, 4:3, with a margin.
	let w = Math.max(maxX - minX, 1), h = Math.max(maxY - minY, 1);
	const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
	w = Math.max(w * 1.25, h * 1.25 * 4 / 3, 60000);
	h = w * 3 / 4;
	const x0 = cx - w / 2, y0 = cy - h / 2;
	const inView = (x, y, pad) => x >= x0 - pad && x <= x0 + w + pad && y >= y0 - pad && y <= y0 + h + pad;
	let maxN = 1;
	for (const c of land) maxN = Math.max(maxN, c[2]);
	let svg = `<svg viewBox="${x0.toFixed(0)} ${y0.toFixed(0)} ${w.toFixed(0)} ${h.toFixed(0)}" preserveAspectRatio="xMidYMid meet">`;
	svg += `<defs><filter id="land-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="${(cell * 0.55).toFixed(0)}"/></filter></defs>`;
	svg += `<g fill="#d9b64c" filter="url(#land-soft)">`;
	for (const c of land) {
		const x = c[0] * cell, y = c[1] * cell;
		if (!inView(x, y, cell)) continue;
		const a = 0.12 + 0.3 * Math.min(1, Math.sqrt(c[2] / maxN) * 2);
		svg += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" opacity="${a.toFixed(3)}"/>`;
	}
	svg += `</g>`;
	const font = w / 34;
	for (const t of TOWNS) {
		if (!inView(t[1], t[2], w * 0.05)) continue;
		svg += `<g><rect x="${t[1] - font * 0.3}" y="${t[2] - font * 0.3}" width="${font * 0.6}" height="${font * 0.6}" transform="rotate(45 ${t[1]} ${t[2]})" fill="#f0e6c8"/><text x="${t[1] + font * 0.7}" y="${t[2] + font * 0.35}" font-size="${font.toFixed(0)}" fill="#c9c2ad" font-family="Georgia, serif" paint-order="stroke" stroke="#08080b" stroke-width="${(font / 5).toFixed(0)}">${esc(t[0])}</text></g>`;
	}
	const color = m.tier >= 2 ? elementColor(m.attackElement) : "#ff7a45";
	const r = w / 150;
	svg += `<g fill="${color}">`;
	for (const p of pts) svg += `<circle cx="${p[0]}" cy="${p[1]}" r="${(r * 2.6).toFixed(0)}" opacity="0.18"/><circle cx="${p[0]}" cy="${p[1]}" r="${r.toFixed(0)}"/>`;
	svg += `</g></svg>`;
	return svg;
}

// ---------------------------------------------------------------------------------------------
// Tabs and events
// ---------------------------------------------------------------------------------------------

function switchTab(view) {
	if (view !== "profile" && state.tab === "profile") disposeViewer();
	state.tab = view;
	for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b.dataset.view === view);
	for (const v of document.querySelectorAll(".view")) v.classList.toggle("active", v.id === "view-" + view);
	if (view === "grounds") renderGrounds();
	else if (view === "hunters") renderHunters();
	else if (view === "elsewhere") document.getElementById("elsewhere").innerHTML = state.data.elsewhere.slice().sort((a, b) => a.l - b.l).map(card).join("");
}

function bindEvents() {
	document.getElementById("tabs").addEventListener("click", e => {
		const b = e.target.closest(".tab");
		if (b) { state.detailId = 0; if (history.state && history.state.monster) { try { history.pushState({}, "", window.location.pathname); } catch (x) { /* not essential */ } } switchTab(b.dataset.view); }
	});
	document.addEventListener("click", e => {
		const go = e.target.closest("[data-go]");
		if (go) { openProfile(Number(go.dataset.go), true); return; }
		if (e.target.closest("#p-back")) { goBack(); return; }
		const target = e.target.closest("[data-id]");
		if (target) { openProfile(Number(target.dataset.id), true); return; }
		const area = e.target.closest("[data-area]");
		if (area) { showArea(Number(area.dataset.area)); return; }
		if (e.target.closest("#d-world")) {
			state.detailWorld = !state.detailWorld;
			const map = document.getElementById("d-map");
			if (map) map.innerHTML = mapSvg(state.detail) + `<div class="tools"><button id="d-world">${state.detailWorld ? "Zoom in" : "Whole world"}</button></div>`;
		}
	});
	document.addEventListener("keydown", e => {
		if (state.tab !== "profile" || e.target.closest("input, select, textarea")) return;
		if (e.key === "Escape") goBack();
		else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
			const button = document.getElementById(e.key === "ArrowLeft" ? "p-prev" : "p-next");
			if (button && button.dataset.go) openProfile(Number(button.dataset.go), true);
		}
	});
	// The browser's back and forward buttons go through the profiles opened.
	window.addEventListener("popstate", () => {
		const id = Number(new URLSearchParams(window.location.search).get("monster") || 0);
		if (id && state.byId.has(id)) openProfile(id, false);
		else if (state.tab === "profile") closeProfile();
	});
}

/** Back from a profile: through the history when the page added to it, else straight to the list. */
function goBack() {
	if (history.state && history.state.monster) history.back();
	else closeProfile();
}

(async function main() {
	const params = new URLSearchParams(window.location.search);
	state.token = params.get("token") || recalledToken();
	const monster = Number(params.get("monster") || 0);
	if (params.has("token")) {
		// Out of the address bar, so it doesn't end up in history, bookmarks or a copied link.
		params.delete("token");
		const rest = params.toString();
		try { history.replaceState(null, "", window.location.pathname + (rest ? "?" + rest : "")); } catch (e) { /* not essential */ }
	}
	if (!state.token) { showGate(); return; }
	let ok = false;
	try { ok = await load(); } catch (e) { showGate("The bestiary could not be reached. Try again in a moment."); return; }
	if (!ok) return;
	rememberToken(state.token);
	document.getElementById("loading").style.display = "none";
	renderHeader();
	if (window.matchMedia && window.matchMedia("(max-width: 860px)").matches) document.getElementById("filters").open = false;
	setupFilters();
	bindEvents();
	renderCollection();
	if (monster && state.byId.has(monster)) {
		try { history.replaceState({}, "", window.location.pathname); history.pushState({ monster: monster }, "", "?monster=" + monster); } catch (e) { /* not essential */ }
		openProfile(monster, false);
	}
})();
</script>
</body>
</html>
