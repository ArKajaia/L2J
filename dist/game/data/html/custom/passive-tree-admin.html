		+ list.map(v => `<option value="${esc(v)}"${v === current ? " selected" : ""}>${esc(v)}</option>`).join("");
}
/** The planner's glyphs; without them (offline, folder without the planner), the icons the tree uses. */
function iconChoices() { return glyphs.length ? glyphs : usedIcons; }
function datalists() {
	return `<datalist id="dl-sectors">${sectors.map(s => `<option value="${esc(s)}">`).join("")}</datalist>`
		+ `<datalist id="dl-keys">${[...effectKeyUse.entries()].sort().map(([k, c]) => `<option value="${esc(k)}">${c} node(s)</option>`).join("")}</datalist>`;
}

function nodePane(n) {
	const isNew = !original.has(n.id);
	const fx = parseEffect(n.effect);
	const owners = allocations[n.id] || 0;
	const links = [...(adj.get(n.id) || [])].sort((a, b) => a - b);
	const unknownKeys = fx.rows.map(r => r.key.split("@")[0]).filter(k => k && (effectKeyUse.get(k) || 0) <= 1 && !capKeys.includes(k));
	const glyph = glyphFor(n);
	return `${datalists()}
	<h2>${esc(n.name || "(no name)")}</h2>
	<div class="sub">Node ${n.id} · ${esc(n.type)} · ${esc(n.file)}
		${isNew ? '<span class="pill" style="color:var(--added)">new</span>' : dirty.changed.has(n.id) ? '<span class="pill" style="color:var(--changed)">changed</span>' : ""}</div>
	<div class="note">${backend.offline ? "" : owners ? `Allocated on ${owners} character slot(s).` : "Nobody has allocated it."}${unreachable.has(n.id) ? ' <span class="note err">No starting point leads here.</span>' : ""}</div>

	<h3>Node</h3>
	<div class="grid2">
		<label class="field"><span>Id${isNew ? "" : " (fixed: players' allocations use it)"}</span><input type="number" data-f="id" value="${n.id}" ${isNew ? "" : "disabled"}></label>
		<label class="field"><span>Type</span><select data-f="type">${options(types, n.type)}</select></label>
		<label class="field wide"><span>Name</span><input type="text" data-f="name" value="${esc(n.name)}" maxlength="80"></label>
		<label class="field"><span>Sector</span><input type="text" data-f="sector" value="${esc(n.sector)}" list="dl-sectors" maxlength="40"></label>
		<label class="field"><span>File</span><select data-f="file">${options(files, n.file)}<option value="__new">New file...</option></select></label>
		<label class="field"><span>Cost (points)</span><input type="number" data-f="cost" value="${n.cost}" min="0" max="100"></label>
		<label class="field"><span>Tier</span><input type="number" data-f="tier" value="${n.tier}" min="0"></label>
	</div>

	<h3>Effects</h3>
	<div id="fx-rows">${fx.rows.map((r, i) => `<div class="fx-row"><input type="text" data-fx-key="${i}" value="${esc(r.key)}" list="dl-keys" placeholder="PATK_PCT"><input type="text" data-fx-val="${i}" value="${esc(r.val)}" placeholder="1.5"><button class="btn small" data-fx-del="${i}" title="Remove this effect">&times;</button></div>`).join("")}</div>
	<div class="row"><button class="btn small" data-act="fx-add">+ Add effect</button></div>
	<label class="field" style="margin-top:6px"><span>As text (KEY:value;KEY:value)</span><input type="text" data-f="effect" value="${esc(n.effect)}"></label>
	${fx.errors.map(e => `<div class="note err">${esc(e)}</div>`).join("")}
	${unknownKeys.length ? `<div class="note warn">Only this node uses ${esc([...new Set(unknownKeys)].join(", "))}: make sure the server knows the key, or it does nothing.</div>` : ""}
	<div class="note">Conditional: KEY@CONDITION, e.g. PDEF_PCT@HEAVY. Conditions: ${esc(conditions.join(", "))}.</div>

	<h3>Skill</h3>
	<div class="grid2">
		<label class="field"><span>Skill id (0 = none)</span><input type="number" data-f="skillId" value="${n.skillId}" min="0"></label>
		<label class="field"><span>Level (number or auto)</span><input type="text" data-f="skillLevel" value="${esc(n.skillId > 0 ? (n.skillLevel || "1") : "")}" ${n.skillId > 0 ? "" : "disabled"} placeholder="1 or auto"></label>
	</div>
	<div class="note" id="skill-info">${n.skillId > 0 ? "Looking up skill..." : "This node grants no skill."}</div>

	<h3>Look</h3>
	<div class="grid2">
		<label class="field"><span>Icon ${glyph ? `<svg class="icon-preview" viewBox="0 0 24 24"><use href="#icon-${esc(glyph)}"/></svg>` : ""}</span>
			<select data-f="icon">${options(iconChoices(), n.icon, "(by type / stat)")}${n.icon && !iconChoices().includes(n.icon) ? `<option value="${esc(n.icon)}" selected>${esc(n.icon)} (unknown)</option>` : ""}</select></label>
		<div></div>
		<label class="field wide"><span>Description (blank = made from the effects: "${esc(autoDescription(n.effect))}")</span><textarea data-f="description" maxlength="600">${esc(n.description)}</textarea></label>
	</div>

	<h3>Position</h3>
	<div class="grid2">
		<label class="field"><span>X</span><input type="number" step="0.1" data-f="x" value="${n.x}"></label>
		<label class="field"><span>Y</span><input type="number" step="0.1" data-f="y" value="${n.y}"></label>
		<label class="field"><span>Orbit centre X</span><input type="number" step="0.1" data-f="ox" value="${n.ox ?? ""}" placeholder="none"></label>
		<label class="field"><span>Orbit centre Y</span><input type="number" step="0.1" data-f="oy" value="${n.oy ?? ""}" placeholder="none"></label>
	</div>
	<div class="note">Links between nodes on the same circle (same orbit centre and distance) are drawn as arcs. Dragging a whole ring moves its centre too.</div>
	<div class="row">
		${n.ox !== null ? '<button class="btn small" data-act="snap-ring" title="Move this node onto its ring, at the distance of the other nodes on it">Snap onto ring</button><button class="btn small" data-act="select-ring">Select ring</button><button class="btn small" data-act="clear-orbit">Clear orbit</button>' : ""}
	</div>

async function lookupSkill(n) {
	const info = $("skill-info");
	if (!info || !n || n.skillId <= 0) return;
	const id = n.skillId;
	if (!skillCache.has(id)) skillCache.set(id, await backend.skill(id));
	const data = skillCache.get(id);
	const el = $("skill-info");
	if (!el || !selection.has(n.id)) return;
	if (data && data.unknown) { el.className = "note warn"; el.textContent = "Skills can't be checked: open the data folder (not passivetree) for that."; return; }
	if (!data) { el.className = "note err"; el.textContent = `Skill ${id} doesn't exist.`; return; }
	const level = n.skillLevel === "auto" ? "auto" : Number(n.skillLevel || 1);
	const bad = level !== "auto" && (!(level >= 1) || level > data.maxLevel);
	el.className = "note " + (bad ? "err" : "ok");
	el.textContent = `${data.name} (levels 1-${data.maxLevel}${data.passive ? ", passive" : ""})` + (bad ? ` - level ${n.skillLevel} doesn't exist` : level === "auto" ? " - the level follows the character level" : "");
}

/** Every field of the node pane: the change is one undo step. */
function onNodeField(n, field, raw) {
	const value = typeof raw === "string" ? raw.trim() : raw;
	switch (field) {
		case "id": {
			const id = Number(value);
			if (!Number.isInteger(id) || id <= 0) { showToast("The id must be a whole number above 0.", true); return renderInspector(); }
			if (id === n.id) return;
			if (byId.has(id)) { showToast(`Node ${id} already exists.`, true); return renderInspector(); }
			if (original.has(id)) { showToast(`Id ${id} belonged to a node you removed: players who had it would get this one. Pick another.`, true); return renderInspector(); }
			const old = n.id, neighbours = [...(adj.get(old) || [])];
			edit(`change id ${old} to ${id}`, [old, ...neighbours], () => {
				n.id = id;
				nodes.forEach(m => { m.requires = m.requires.map(r => r === old ? id : r); });
				return [id];
			});
			selection = new Set([id]);
			return selectionChanged();
		}
		case "type": {
			const neighbours = [...(adj.get(n.id) || [])];
			edit(`type of ${n.id}`, [n.id, ...neighbours], () => setType(n, value) ? undefined : false);
			return;
		}
		case "file":
			if (value === "__new") {
				const name = prompt("New file name (letters, digits, - and _), e.g. MySector.xml:", n.sector.replace(/[^A-Za-z0-9_-]/g, "") + ".xml");
				if (!name) return renderInspector();
				const fileName = /\.xml$/i.test(name) ? name : name + ".xml";
				if (!/^[A-Za-z0-9_-]{1,64}\.xml$/i.test(fileName)) { showToast("Use letters, digits, - and _ only.", true); return renderInspector(); }
				edit(`file of ${n.id}`, [n.id], () => { n.file = fileName; });
				return;
			}
			edit(`file of ${n.id}`, [n.id], () => { n.file = value; });
			return;
		case "cost": case "tier": case "skillId": {
			const v = value === "" ? 0 : Number(value);
			if (!Number.isInteger(v) || v < 0) { showToast(`The ${field} must be a whole number, 0 or more.`, true); return renderInspector(); }
			edit(`${field} of ${n.id}`, [n.id], () => {
				n[field] = v;
				if (field === "skillId") n.skillLevel = v > 0 ? (n.skillLevel || "1") : "";
			});
			return;
		}
		case "skillLevel": {
			const v = value.toLowerCase();
			if (v !== "auto" && !(Number.isInteger(Number(v)) && Number(v) >= 1)) { showToast('The level must be a number from 1, or "auto".', true); return renderInspector(); }
			edit(`skill level of ${n.id}`, [n.id], () => { n.skillLevel = v; });
			return;
		}
		case "x": case "y": {
			const v = Number(value);
			if (!isFinite(v) || value === "") { showToast("The position must be a number.", true); return renderInspector(); }
			edit(`move ${n.id}`, [n.id], () => { n[field] = round1(v); });
			return;
		}
		case "ox": case "oy": {
			if (value === "") { edit(`orbit of ${n.id}`, [n.id], () => { n.ox = null; n.oy = null; }); return; }
			const v = Number(value);
			if (!isFinite(v)) { showToast("The orbit centre must be a number.", true); return renderInspector(); }
			edit(`orbit of ${n.id}`, [n.id], () => {
				n[field] = round1(v);
				if (n.ox === null) n.ox = round1(n.x); // a centre needs both coordinates
				if (n.oy === null) n.oy = round1(n.y);
			});
			return;
		}
		default:
			edit(`${field} of ${n.id}`, [n.id], () => { n[field] = value; });
	}
}

function readEffectRows() {
	const rows = [];
	document.querySelectorAll("[data-fx-key]").forEach(input => {
		const i = input.dataset.fxKey;
		rows.push({ key: input.value.trim().toUpperCase(), val: document.querySelector(`[data-fx-val="${i}"]`).value.trim() });
	});
	return rows;
}

$("inspector").addEventListener("change", e => {
	const t = e.target;
	const n = selection.size === 1 ? byId.get([...selection][0]) : null;
	if (!n) return;
	// Applied once the focus has moved on (Tab), so the redrawn pane can put it back where it went.
	if (t.dataset.f) {
		const field = t.dataset.f, value = t.value;
		setTimeout(() => { if (byId.get(n.id) === n) onNodeField(n, field, value); }, 0);
	} else if (t.dataset.fxKey !== undefined || t.dataset.fxVal !== undefined) {
		const spec = effectSpec(readEffectRows());
		setTimeout(() => { if (byId.get(n.id) === n) edit(`effects of ${n.id}`, [n.id], () => { n.effect = spec; }); }, 0);
	}
});

$("inspector").addEventListener("click", e => {
	const t = e.target.closest("[data-act],[data-goto],[data-unlink],[data-fx-del]");
	if (!t) return;
	const n = selection.size === 1 ? byId.get([...selection][0]) : null;
	if (t.dataset.goto !== undefined) {
		const id = Number(t.dataset.goto);
		if (!byId.has(id)) return;
		selection = new Set([id]); selectedEdge = null;
		centreOn(byId.get(id)); selectionChanged();
		return;
	}
	if (t.dataset.unlink !== undefined && n) { toggleLink(n.id, Number(t.dataset.unlink)); return; }
	if (t.dataset.fxDel !== undefined && n) {
		const rows = readEffectRows();
		rows.splice(Number(t.dataset.fxDel), 1);
		edit(`effects of ${n.id}`, [n.id], () => { n.effect = effectSpec(rows); });
		return;
	}
	switch (t.dataset.act) {
		case "fx-add": {
			const box = $("fx-rows"), i = box.children.length;
			box.insertAdjacentHTML("beforeend", `<div class="fx-row"><input type="text" data-fx-key="${i}" list="dl-keys" placeholder="PATK_PCT"><input type="text" data-fx-val="${i}" placeholder="1.5"><button class="btn small" data-fx-del="${i}">&times;</button></div>`);
			box.querySelector(`[data-fx-key="${i}"]`).focus();
			return;
		}
		case "link-to": {
			const id = Number($("link-to").value);
			if (!byId.has(id)) { showToast(`There is no node ${$("link-to").value}.`, true); return; }
			if (linked(n.id, id)) { showToast("Already linked."); return; }
			edit(`link ${n.id} - ${id}`, [n.id, id], () => addLink(n.id, id) ? undefined : false);
			return;
		}
		case "snap-ring": {
			const mates = nodes.filter(m => m !== n && m.ox === n.ox && m.oy === n.oy).map(m => Math.hypot(m.x - m.ox, m.y - m.oy)).sort((a, b) => a - b);
			const r = mates.length ? mates[Math.floor(mates.length / 2)] : Math.hypot(n.x - n.ox, n.y - n.oy);
			const a = Math.atan2(n.y - n.oy, n.x - n.ox);
			edit(`snap ${n.id} onto its ring`, [n.id], () => { n.x = round1(n.ox + r * Math.cos(a)); n.y = round1(n.oy + r * Math.sin(a)); });
			return;
		}
		case "select-ring":
			selection = new Set(nodes.filter(m => m.ox === n.ox && m.oy === n.oy).map(m => m.id));
			selectionChanged();
			return;
		case "clear-orbit":
			edit(`orbit of ${n.id}`, [n.id], () => { n.ox = null; n.oy = null; });
			return;
		case "centre": centreOn(n); return;
		case "select-linked":
			[...selection].forEach(id => (adj.get(id) || []).forEach(o => selection.add(o)));
			selectionChanged();
			return;
		case "duplicate": duplicateSelection(); return;
		case "delete": deleteSelection(); return;
		case "unlink-edge": deleteSelection(); return;
		case "fit-sel": fitTo([...selection].map(id => byId.get(id)), 2); return;
		case "multi-apply": multiApply(); return;
		case "chain": {
			const ids = [...selection];
			const touched = ids.slice();
			edit(`link ${ids.length} nodes as a chain`, touched, () => {
				let any = false;
				for (let i = 1; i < ids.length; i++) if (!linked(ids[i - 1], ids[i]) && addLink(ids[i - 1], ids[i])) any = true;
				return any ? undefined : false;
			});
			return;
		}
		case "unlink-among": {
			const ids = [...selection], set = new Set(ids);
			edit(`unlink ${ids.length} nodes`, ids, () => {
				let any = false;
				ids.forEach(a => [...(adj.get(a) || [])].forEach(b => { if (set.has(b) && a < b) { removeLink(a, b); any = true; } }));
				return any ? undefined : false;
			});
			return;
		}
		case "discard":
			if (!confirm("Throw away every unsaved change and load the files again?")) return;
			dropDraft();
			loadTree();
			return;
		case "reload-files": reloadFiles(); return;
	}
});

function multiApply() {
	const ids = [...selection];
	const name = $("m-name").value.trim(), type = $("m-type").value, cost = $("m-cost").value.trim(), sector = $("m-sector").value.trim();
	const file = $("m-file").value, icon = $("m-icon").value, tier = $("m-tier").value.trim(), effect = $("m-effect").value.trim(), scale = $("m-scale").value.trim();
	if (effect && parseEffect(effect).errors.length) { showToast(parseEffect(effect).errors[0], true); return; }
	if (cost && !(Number.isInteger(Number(cost)) && Number(cost) >= 0)) { showToast("The cost must be a whole number, 0 or more.", true); return; }
	if (tier && !(Number.isInteger(Number(tier)) && Number(tier) >= 0)) { showToast("The tier must be a whole number, 0 or more.", true); return; }
	if (scale && !(Number(scale) > 0)) { showToast("The scale must be above 0.", true); return; }
	const touched = new Set(ids);
	if (type) ids.forEach(id => (adj.get(id) || []).forEach(o => touched.add(o)));
	edit(`edit ${ids.length} nodes`, [...touched], () => {
		let failed = 0;
		ids.forEach(id => {
			const n = byId.get(id);
			if (type && !setType(n, type)) failed++;
			if (name) n.name = name;
			if (cost) n.cost = Number(cost);
			if (tier) n.tier = Number(tier);
			if (sector) n.sector = sector;
			if (file) n.file = file;
			if (icon) n.icon = icon === "__none" ? "" : icon;
			if (effect) n.effect = effect;
			if (scale && n.effect && !parseEffect(n.effect).errors.length) {
				const f = Number(scale);
				n.effect = parseEffect(n.effect).rows.map(r => r.key + ":" + (Math.round(Number(r.val) * f * 1000) / 1000)).join(";");
			}
		});
		if (failed) showToast(`${failed} node(s) could not become ${type}.`, true);
	});
}

// ------------------------------------------------------------------ save
function openModal(html) { $("modal-box").innerHTML = html; $("modal").classList.add("open"); }
function closeModal() { $("modal").classList.remove("open"); }
$("modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

function resultHtml(d) {
	return (d.errors.length ? `<h3 style="color:var(--danger)">Must be fixed</h3><ul class="errors">${d.errors.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "")
		+ (d.warnings.length ? `<h3 style="color:var(--warn)">Good to know</h3><ul class="warnings">${d.warnings.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "")
		+ (d.changedFiles.length ? `<h3>Files</h3><ul>${d.changedFiles.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : "");
}

async function check(thenSave) {
	if (!hasChanges() && thenSave) { showToast("Nothing to save."); return; }
	if (issues.some(i => i.level === "err") && thenSave) {
		openModal(`<h2>Fix these first</h2><ul class="errors">${issues.filter(i => i.level === "err").slice(0, 30).map(i => `<li>${esc(i.text)}</li>`).join("")}</ul><div class="actions"><button class="btn" id="m-close">Close</button></div>`);
		$("m-close").onclick = closeModal;
		return;
	}
	openModal("<h2>Checking...</h2>");
	const d = await backend.save({ version, dryRun: true, nodes: nodes.map(toWire) });
	if (!d || !d.errors) { openModal(`<h2>Could not check</h2><p>${esc((d && d.error) || "No answer from the server.")}</p><div class="actions"><button class="btn" id="m-close">Close</button></div>`); $("m-close").onclick = closeModal; return; }
	const ok = !d.errors.length && d.changedFiles.length;
	openModal(`<h2>${d.errors.length ? (backend.offline ? "This tree can't be saved" : "The server refuses this tree") : ok ? (thenSave ? "Save these changes?" : "The tree is fine") : "Nothing to save"}</h2>
		${resultHtml(d)}
		${ok && thenSave ? `<p class="note">${esc(backend.saveNote)}</p>` : ""}
		<div class="actions"><button class="btn" id="m-close">${ok && thenSave ? "Cancel" : "Close"}</button>${ok && thenSave ? `<button class="btn primary" id="m-save">${esc(backend.saveButton)}</button>` : ""}</div>`);
	$("m-close").onclick = closeModal;
	if (ok && thenSave) $("m-save").onclick = doSave;
}

async function doSave() {
	openModal("<h2>Saving...</h2>");
	const d = await backend.save({ version, dryRun: false, nodes: nodes.map(toWire) });
	if (!d || !d.saved) {
		openModal(`<h2>Not saved</h2>${d && d.errors ? resultHtml(d) : `<p>${esc((d && d.error) || "No answer from the server.")}</p>`}<div class="actions"><button class="btn" id="m-close">Close</button></div>`);
		$("m-close").onclick = closeModal;
		return;
	}
	dropDraft();
	await loadTree();
	openModal(`<h2>${esc(backend.savedTitle)}</h2>${resultHtml({ errors: [], warnings: d.warnings, changedFiles: d.changedFiles })}<div class="actions"><button class="btn primary" id="m-close">OK</button></div>`);
	$("m-close").onclick = closeModal;
}

async function reloadFiles() {
	if (hasChanges() && !confirm("You have unsaved changes. Load the files again anyway? (Your changes stay in the browser draft until you save or throw them away.)")) return;
	const d = await backend.reload();
	if (d.error) { showToast(d.error, true); return; }
	if (await loadTree()) showToast(`Loaded ${nodes.length} nodes from the files.` + (backend.offline ? "" : " The live tree uses them now."));
}

// ------------------------------------------------------------------ keys
document.addEventListener("keydown", e => {
	if ($("modal").classList.contains("open")) { if (e.key === "Escape") closeModal(); return; }
	const ctrl = e.ctrlKey || e.metaKey;
	if (ctrl && e.key.toLowerCase() === "s") {
		e.preventDefault();
		if (typing()) document.activeElement.blur(); // its change lands first
		setTimeout(() => check(true), 20);
		return;
	}
	if (typing()) {
		if (e.key === "Enter" && document.activeElement.id === "search") {
			if (!search.matches.length) return;
			search.cursor = (search.cursor + (e.shiftKey ? -1 : 1) + search.matches.length) % search.matches.length;
			const n = byId.get(search.matches[search.cursor]);
			selection = new Set([n.id]); centreOn(n); selectionChanged();
		}
		if (e.key === "Escape") document.activeElement.blur();
		return;
	}
	if (ctrl && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); return; }
	if (ctrl && (e.key.toLowerCase() === "y" || (e.key.toLowerCase() === "z" && e.shiftKey))) { e.preventDefault(); redo(); return; }
	if (ctrl && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateSelection(); return; }
	if (ctrl) return;
	const step = e.shiftKey ? 10 : 1;
	switch (e.key) {
		case "v": case "V": setTool("select"); break;
		case "l": case "L": setTool("link"); break;
		case "n": case "N": setTool("add"); break;
		case "f": case "F": fitTo(nodes); break;
		case "Delete": case "Backspace": e.preventDefault(); deleteSelection(); break;
		case "Escape":
			if (linkSource !== null) { linkSource = null; $("link-preview").setAttribute("visibility", "hidden"); }
			else { selection.clear(); selectedEdge = null; }
			selectionChanged();
			break;
		case "ArrowLeft": e.preventDefault(); nudge(-step, 0); break;
		case "ArrowRight": e.preventDefault(); nudge(step, 0); break;
		case "ArrowUp": e.preventDefault(); nudge(0, -step); break;
		case "ArrowDown": e.preventDefault(); nudge(0, step); break;
		case "+": case "=": { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, ZOOM_STEP); break; }
		case "-": { const r = svg.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / ZOOM_STEP); break; }
	}
});

function setTool(t) {
	tool = t;
	linkSource = null;
	$("link-preview").setAttribute("visibility", "hidden");
	refreshClasses();
	renderToolbar();
}

window.addEventListener("beforeunload", e => {
	if (hasChanges()) { e.preventDefault(); e.returnValue = ""; }
});

// ------------------------------------------------------------------ start
(async function init() {
	const params = new URLSearchParams(window.location.search);
	try {
		if (params.has("admin")) sessionStorage.setItem(TOKEN_KEY, params.get("admin"));
		token = sessionStorage.getItem(TOKEN_KEY);
	} catch (e) { token = params.get("admin"); }
	if (params.has("admin")) {
		// keep the token out of the address bar, history and copied links
		params.delete("admin");
		const rest = params.toString();
		try { history.replaceState(null, "", window.location.pathname + (rest ? "?" + rest : "")); } catch (e) { /* not essential */ }
	}
	document.querySelectorAll("[data-tool]").forEach(b => b.addEventListener("click", () => setTool(b.dataset.tool)));
	$("undo").addEventListener("click", undo);
	$("redo").addEventListener("click", redo);
	$("fit").addEventListener("click", () => fitTo(nodes));
	$("check").addEventListener("click", () => check(false));
	$("save").addEventListener("click", () => check(true));
	$("show-ids").addEventListener("change", e => { showIds = e.target.checked; applyView(); });
	$("snap").addEventListener("change", e => { snapOn = e.target.checked; });
	let searchTimer = null;
	$("search").addEventListener("input", e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => applySearch(e.target.value), 150); });
	$("search-select").addEventListener("click", () => {
		selection = new Set(search.matches); selectedEdge = null;
		selectionChanged();
		fitTo(search.matches.map(id => byId.get(id)), 2);
	});
	$("open-folder").addEventListener("click", openFolder);
	$("folder-input").addEventListener("change", e => { if (e.target.files.length) startOffline(fileListSource(e.target.files)); });
	renderLegend();
	renderToolbar();

	if (!token) { showOfflineStart(); return; } // no //passivetree link: edit files on this computer
	await Promise.all([loadGlyphs("/passive-tree.html"), loadCaps()]);
	if (await loadTree()) {
		fitTo(nodes);
		offerDraft();
	}
})();
</script>
