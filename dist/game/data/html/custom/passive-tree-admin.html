<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passive Tree Editor</title>
<style>
	:root {
		--bg: #0b0b0f;
		--panel: #15151b;
		--panel-2: #1c1c24;
		--field: #101015;
		--line: #2e2e38;
		--text: #e6e1d3;
		--muted: #8f8b80;
		--gold: #d9b64c;
		--gold-dim: #7a5c1e;
		--danger: #e0645a;
		--ok: #6fcf7f;
		--warn: #e3b341;
		--accent: #5fa8ff;
		--changed: #f0a040;
		--added: #6fcf7f;
	}
	* { box-sizing: border-box; }
	html, body {
		margin: 0; height: 100%; overflow: hidden;
		background: var(--bg); color: var(--text);
		font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	}
	button, input, select, textarea { font: inherit; color: inherit; }
	#app { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: auto 1fr; height: 100%; }

	/* ---------------------------------------------------------- toolbar */
	#toolbar {
		grid-column: 1 / 3; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
		padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--gold-dim);
	}
	#toolbar h1 { margin: 0 6px 0 0; font: normal 15px Georgia, serif; letter-spacing: 2px; text-transform: uppercase; color: #f0e6c8; }
	#toolbar .who { color: var(--muted); font-size: 12px; margin-right: 6px; }
	.group { display: flex; align-items: center; gap: 4px; }
	.sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 2px; }
	.btn {
		background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
		padding: 5px 10px; cursor: pointer; white-space: nowrap; color: var(--text); text-decoration: none;
	}
	.btn:hover:not(:disabled) { border-color: var(--gold); }
	.btn:disabled { opacity: 0.4; cursor: default; }
	.btn.on { background: #2b2412; border-color: var(--gold); color: #f5dc8a; }
	.btn.primary { background: #3a2e10; border-color: var(--gold); color: #ffe39a; }
	.btn.danger { border-color: #6d2a25; color: #ff9b90; }
	.btn.danger:hover:not(:disabled) { border-color: var(--danger); }
	.btn.small { padding: 2px 7px; font-size: 12px; }
	.btn kbd { opacity: 0.55; font: 11px ui-monospace, monospace; margin-left: 4px; }
	#search { width: 190px; }
	#search-count { color: var(--muted); font-size: 12px; min-width: 52px; }
	#changes { font-size: 12px; color: var(--muted); }
	#changes.dirty { color: var(--changed); }
	label.toggle { display: flex; align-items: center; gap: 4px; color: var(--muted); cursor: pointer; }
	.spacer { flex: 1; }

	/* ---------------------------------------------------------- stage */
	#stage { position: relative; overflow: hidden; background: radial-gradient(circle at center, #14141a 0%, #08080b 100%); }
	#svg { width: 100%; height: 100%; display: block; cursor: default; touch-action: none; }
	#stage.panning #svg { cursor: grabbing; }
	#stage.tool-link #svg { cursor: crosshair; }
	#stage.tool-add #svg { cursor: copy; }
	#stage.dragging #rings { opacity: 0; }

	.ring-disc { fill: #141419; stroke: #3a3326; stroke-width: 2px; vector-effect: non-scaling-stroke; cursor: pointer; }
	.ring-disc:hover { stroke: var(--gold-dim); }
	.ring-track { fill: none; stroke: #24242c; stroke-width: 1.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
	.ring-centre { fill: #3a3326; pointer-events: none; }

	.edge { fill: none; stroke: #4a4a55; stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
	.edge.sel { stroke: var(--gold); stroke-width: 4px; }
	.edge.start { stroke: #8a7a55; }
	.edge-hit { fill: none; stroke: transparent; stroke-width: 12px; vector-effect: non-scaling-stroke; cursor: pointer; }
	#stage.tool-add .edge-hit, #stage.tool-link .edge-hit { pointer-events: none; }

	.node { cursor: pointer; }
	.node .hit { fill: transparent; }
	.node .body { stroke: #0a0a0d; stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
	.node .glyph { pointer-events: none; color: #101014; fill: #101014; }
	.node .halo { fill: none; stroke: none; stroke-width: 2.5px; vector-effect: non-scaling-stroke; pointer-events: none; }
	.node.changed .halo { stroke: var(--changed); stroke-dasharray: 4 3; }
	.node.added .halo { stroke: var(--added); stroke-dasharray: none; }
	.node.unreachable .body { stroke: var(--danger); stroke-width: 2px; }
	.node.match .halo { stroke: var(--accent); stroke-dasharray: none; stroke-width: 3px; }
	.node.sel .halo { stroke: #fff; stroke-dasharray: none; stroke-width: 3px; }
	.node.src .halo { stroke: var(--accent); stroke-width: 4px; stroke-dasharray: none; }
	.lbl, .idl {
		pointer-events: none; text-anchor: middle; fill: #cfc8b4;
		font-family: Georgia, serif; font-size: calc(var(--k, 1) * 11px);
		paint-order: stroke; stroke: #08080b; stroke-width: calc(var(--k, 1) * 3px); stroke-linejoin: round;
	}
	.idl { fill: #7fb5ff; font-family: ui-monospace, monospace; font-size: calc(var(--k, 1) * 10px); display: none; }
	#svg.show-ids .idl { display: inline; }
	#svg.z1 .lbl, #svg.z1 .idl { display: none; }
	#svg.z2 .lbl.minor { display: none; }
	#svg.z2 .idl { display: none; }
	.node.sel .lbl, .node.match .lbl { fill: #fff; display: inline !important; }

	#link-preview { stroke: var(--accent); stroke-width: 2px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
	#box { position: absolute; border: 1px dashed var(--accent); background: rgba(95,168,255,0.08); pointer-events: none; display: none; }

	#statusbar {
		position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 16px;
		padding: 4px 10px; font-size: 12px; color: var(--muted);
		background: rgba(10,10,14,0.85); border-top: 1px solid var(--line); pointer-events: none;
	}
	#statusbar .hint { color: #b9b29c; }
	#legend {
		position: absolute; left: 10px; top: 10px; padding: 8px 10px; font-size: 11px; color: var(--muted);
		background: rgba(14,14,18,0.85); border: 1px solid var(--line); border-radius: 6px; pointer-events: none;
	}
	#legend div { display: flex; align-items: center; gap: 6px; }
	#legend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; }

	/* ---------------------------------------------------------- inspector */
	#inspector { background: var(--panel); border-left: 1px solid var(--gold-dim); overflow-y: auto; padding: 12px 14px 40px; }
	#inspector h2 { margin: 0 0 2px; font: normal 16px Georgia, serif; color: #f0e6c8; }
	#inspector h3 { margin: 16px 0 6px; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); font-weight: 600; }
	#inspector .sub { color: var(--muted); font-size: 12px; }
	.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; }
	.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 8px; }
	.field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
	.field > span { font-size: 11px; color: var(--muted); }
	.field.wide { grid-column: 1 / -1; }
	input[type=text], input[type=number], input:not([type]), select, textarea {
		width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px;
	}
	input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
	input:disabled { opacity: 0.6; }
	textarea { resize: vertical; min-height: 54px; }
	.fx-row { display: grid; grid-template-columns: 1fr 74px 26px; gap: 4px; margin-bottom: 4px; }
	.fx-row.bad input { border-color: var(--danger); }
	.note { font-size: 12px; color: var(--muted); margin: 4px 0; }
	.note.warn { color: var(--warn); }
	.note.err { color: var(--danger); }
	.note.ok { color: var(--ok); }
	.links { list-style: none; margin: 0; padding: 0; }
	.links li { display: flex; align-items: center; gap: 6px; padding: 3px 0; border-bottom: 1px solid #202028; }
	.links li a { flex: 1; color: var(--text); cursor: pointer; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.links li a:hover { color: var(--gold); }
	.links li small { color: var(--muted); }
	.pill { display: inline-block; padding: 0 6px; border-radius: 9px; font-size: 11px; background: #23232c; color: var(--muted); }
	.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
	.issues { list-style: none; margin: 0; padding: 0; max-height: 260px; overflow-y: auto; }
	.issues li { padding: 3px 0; cursor: pointer; border-bottom: 1px solid #202028; }
	.issues li:hover { color: var(--gold); }
	.icon-preview { width: 22px; height: 22px; fill: var(--gold); color: var(--gold); vertical-align: middle; }
	table.keys { border-collapse: collapse; width: 100%; font-size: 12px; }
	table.keys td { padding: 2px 4px; border-bottom: 1px solid #202028; vertical-align: top; }
	table.keys td:first-child { white-space: nowrap; color: var(--gold); font-family: ui-monospace, monospace; font-size: 11px; }

	/* ---------------------------------------------------------- dialogs */
	#modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 20; }
	#modal.open { display: flex; }
	#modal .box {
		width: min(640px, calc(100% - 32px)); max-height: calc(100% - 64px); overflow-y: auto;
		background: var(--panel); border: 1px solid var(--gold-dim); border-radius: 8px; padding: 16px 18px;
		box-shadow: 0 10px 40px rgba(0,0,0,0.7);
	}
	#modal h2 { margin: 0 0 10px; font: normal 17px Georgia, serif; color: #f0e6c8; }
	#modal ul { margin: 4px 0 10px; padding-left: 18px; }
	#modal li { margin: 3px 0; }
	#modal .errors li { color: #ff9b90; }
	#modal .warnings li { color: #f2d48a; }
	#modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
	#toast {
		position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); z-index: 30; display: none;
		background: #1f2a1f; border: 1px solid var(--ok); color: #c8f0cc; padding: 8px 16px; border-radius: 6px;
	}
	#toast.error { background: #2a1512; border-color: var(--danger); color: #ffb3aa; }
	#banner { grid-column: 1 / 3; display: none; padding: 8px 12px; background: #3a1512; color: #ffb3aa; border-bottom: 1px solid var(--danger); }
	#banner.open { display: block; }
	#loading {
		position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
		padding: 20px; text-align: center; color: var(--muted); font-size: 15px; background: rgba(8,8,11,0.9);
	}
	#offline-start { max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
	#offline-start p { margin: 0; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="app">
	<header id="toolbar">
		<h1>Passive Tree Editor</h1>
		<span class="who" id="who"></span>
		<div class="group" role="group" aria-label="Tool">
			<button class="btn on" data-tool="select" title="Select and move nodes. Shift+click or Shift+drag adds to the selection. Alt+click a node links it to the selected one.">Select<kbd>V</kbd></button>
			<button class="btn" data-tool="link" title="Click a node, then click others to link or unlink them to it. Hold Shift to keep linking to the same node.">Link<kbd>L</kbd></button>
			<button class="btn" data-tool="add" title="Click empty space to add a node. It copies the selected node and links to it.">Add node<kbd>N</kbd></button>
		</div>
		<div class="sep"></div>
		<div class="group">
			<button class="btn" id="undo" title="Undo (Ctrl+Z)">Undo</button>
			<button class="btn" id="redo" title="Redo (Ctrl+Y)">Redo</button>
		</div>
		<div class="sep"></div>
		<div class="group">
			<input id="search" type="text" placeholder="Search name, id, effect, sector..." autocomplete="off">
			<span id="search-count"></span>
			<button class="btn small" id="search-select" title="Select every match">Select all</button>
		</div>
		<div class="sep"></div>
		<label class="toggle" title="Show node ids on the map"><input type="checkbox" id="show-ids"> IDs</label>
		<label class="toggle" title="Snap dragged and added nodes to a 10-unit grid"><input type="checkbox" id="snap"> Snap</label>
		<button class="btn small" id="fit" title="Fit the tree to the screen (F)">Fit</button>
		<div class="spacer"></div>
		<span id="changes">No changes</span>
		<button class="btn" id="check" title="Check the tree on the server without saving">Check</button>
		<button class="btn primary" id="save" title="Check, then save to the tree files and make it live (Ctrl+S)">Save...</button>
	</header>
	<div id="banner"></div>
	<main id="stage" class="tool-select">
		<svg id="svg" aria-label="Passive tree map">
			<defs id="defs"></defs>
			<g id="viewport">
				<g id="rings"></g>
				<g id="edges"></g>
				<g id="edge-hits"></g>
				<g id="nodes"></g>
				<line id="link-preview" x1="0" y1="0" x2="0" y2="0" visibility="hidden" />
			</g>
		</svg>
		<div id="box"></div>
		<div id="legend"></div>
		<div id="statusbar"><span id="st-pos">-</span><span id="st-sel"></span><span class="hint" id="st-hint"></span><span id="st-zoom"></span></div>
		<div id="loading">
			<div id="loading-text">Loading the tree...</div>
			<div id="offline-start" hidden>
				<button class="btn primary" id="open-folder">Open the tree folder...</button>
				<p class="note">Pick <b>dist/game/data</b> (or the folder above it): then saving also makes a backup, the map shows the planner's icons, and skills are checked. Picking <b>dist/game/data/passivetree</b> itself works too.</p>
				<p class="note warn" id="offline-support"></p>
				<input type="file" id="folder-input" webkitdirectory multiple hidden>
			</div>
		</div>
	</main>
	<aside id="inspector" aria-label="Inspector"></aside>
</div>
<div id="modal"><div class="box" id="modal-box"></div></div>
<div id="toast"></div>

<script>
"use strict";
// ===========================================================================
//  Passive tree editor for GMs (opened in-game with //passivetree).
//  Loads the tree exactly as data/passivetree/*.xml holds it, lets you move,
//  link, add, remove and edit nodes, and saves the whole tree back. The server
//  checks it, backs up the old files, writes the new ones and makes them live.
//
//  Without a //passivetree link (the page opened straight from disk, say) it
//  edits the tree files of a folder on this computer instead, without the game
//  server: it reads and writes them itself, the same way the server does.
// ===========================================================================
const API = "/api/passivetree/admin/";
const SVG_NS = "http://www.w3.org/2000/svg";
const DRAFT_KEY = "passiveTreeEditorDraft"; // + ":offline" for the files on this computer
const TOKEN_KEY = "passiveTreeAdminToken";
const UNDO_LIMIT = 300;
const MAX_RING_RADIUS = 150;   // wider shared circles are roads bending round the centre, not clusters
const SNAP = 10;
const DUPLICATE_OFFSET = 60;
const ZOOM_MIN = 0.03, ZOOM_MAX = 4, ZOOM_STEP = 1.15;

const TYPE_COLOR = {
	START: "#e8dcb8", SMALL: "#8a8a92", NOTABLE: "#d9b64c",
	KEYSTONE: "#c0392b", MASTER: "#8e44ad", ACTIVE_SKILL: "#2f8fd1", FUNCTION: "#2f8fd1"
};
const TYPE_RADIUS = { START: 20, SMALL: 8, NOTABLE: 16, KEYSTONE: 22, MASTER: 24, ACTIVE_SKILL: 17, FUNCTION: 17 };
const TYPE_GLYPH = { START: "flag", ACTIVE_SKILL: "bolt", FUNCTION: "gear", KEYSTONE: "star", MASTER: "star" };
const MAJOR_TYPES = new Set(["START", "NOTABLE", "KEYSTONE", "MASTER", "ACTIVE_SKILL", "FUNCTION"]);
const DEFAULT_COST = { START: 0, SMALL: 1, NOTABLE: 2, ACTIVE_SKILL: 2, FUNCTION: 2, KEYSTONE: 3, MASTER: 3 };
const EFFECT_KEY_RE = /^[A-Z][A-Z0-9_]*(@[A-Z]+)?$/;

// ------------------------------------------------------------------ state
let token = null;
let version = null;             // version of the files this editor is based on
let adminName = "";
let nodes = [];                 // in file order: the order matters for the saved files
let byId = new Map(), indexById = new Map();
let adj = new Map();            // id -> Set of linked ids, both directions
let original = new Map();       // id -> canonical text, as the files hold it
let types = [], conditions = [], allocations = {}, capKeys = [];
let files = [], sectors = [], effectKeyUse = new Map(), glyphs = [], usedIcons = [];
let selection = new Set();      // insertion order = the order nodes were picked
let selectedEdge = null;        // [a, b]
let tool = "select";
let linkSource = null;
let undoStack = [], redoStack = [];
let view = { s: 0.2, tx: 0, ty: 0 };
let showIds = false, snapOn = false;
let unreachable = new Set();
let issues = [];
let dirty = { changed: new Set(), added: new Set(), removed: [] };
let search = { q: "", matches: [], set: new Set(), cursor: -1 };
let skillCache = new Map();
let nodeEls = new Map();        // id -> <g>
let edgeEls = new Map();        // "a-b" -> {path, hit}
let drag = null;                // what the pointer is doing
let draftTimer = null;

const $ = id => document.getElementById(id);
const svg = $("svg"), viewport = $("viewport");

// ------------------------------------------------------------------ helpers
function esc(text) {
	return String(text ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function round1(v) { return Math.round(v * 10) / 10; }
function edgeKey(a, b) { return a < b ? a + "-" + b : b + "-" + a; }
function clone(n) { return JSON.parse(JSON.stringify(n)); }
function canon(n) {
	return JSON.stringify([n.id, n.file, n.name, n.sector, n.type, n.tier, n.cost, round1(n.x), round1(n.y),
		n.ox === null ? null : round1(n.ox), n.oy === null ? null : round1(n.oy), n.effect, n.skillId,
		n.skillId > 0 ? n.skillLevel : "", n.icon, n.description, n.requires]);
}
function svgEl(tag, attrs, parent) {
	const e = document.createElementNS(SVG_NS, tag);
	for (const k in attrs) e.setAttribute(k, attrs[k]);
	if (parent) parent.appendChild(e);
	return e;
}
function showToast(msg, isError) {
	const t = $("toast");
	t.textContent = msg; t.className = isError ? "error" : ""; t.style.display = "block";
	clearTimeout(showToast.timer);
	showToast.timer = setTimeout(() => { t.style.display = "none"; }, isError ? 4500 : 2500);
}
function showBanner(msg) {
	const b = $("banner");
	b.textContent = msg; b.classList.add("open");
}
function typing() {
	const a = document.activeElement;
	return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT");
}
function nodeLabel(n) { return n ? `${n.id} ${n.name}` : "?"; }

// ------------------------------------------------------------------ server
async function api(path, json) {
	const opts = { headers: { "Authorization": "Bearer " + token } };
	if (json !== undefined) {
		opts.method = "POST";
		opts.headers["Content-Type"] = "application/json";
		opts.body = JSON.stringify(json);
	}
	let res;
	try { res = await fetch(API + path, opts); }
	catch (e) { showToast("Connection error - is the game server running?", true); return { ok: false, status: 0, data: null }; }
	let data = null;
	try { data = await res.json(); } catch (e) { /* no body */ }
	if (res.status === 401 || res.status === 403) {
		showBanner((data && data.error ? data.error : "Not allowed.") + " Your unsaved changes are kept in this browser and offered again when you reopen the editor.");
	}
	return { ok: res.ok, status: res.status, data };
}

/** The planner page holds the icon glyphs: take its <symbol>s, so both pages always draw the same ones. */
function importGlyphs(html) {
	const doc = new DOMParser().parseFromString(html, "text/html");
	const defs = $("defs");
	defs.textContent = "";
	glyphs = [];
	doc.querySelectorAll("svg defs symbol").forEach(sym => {
		defs.appendChild(document.importNode(sym, true));
		if (sym.id.startsWith("icon-")) glyphs.push(sym.id.slice(5));
	});
	glyphs.sort();
}
async function loadGlyphs(url) {
	try {
		const res = await fetch(url);
		if (res.ok) importGlyphs(await res.text());
	} catch (e) {
		// nodes are drawn without glyphs
	}
}

async function loadCaps() {
	try {
		const res = await fetch("/api/passivetree/config");
		const data = await res.json();
		capKeys = Object.keys(data.caps || {});
	} catch (e) { capKeys = []; }
}

/** Loads the tree from the files. Keeps the view, and the selection where the nodes still exist. */
async function loadTree() {
	const d = await backend.tree();
	if (!d || d.error) {
		const message = (d && d.error) || "Could not load the tree.";
		if ($("loading").style.display !== "none") showOfflineStart(message);
		else showToast(message, true);
		return false;
	}
	version = d.version;
	adminName = d.admin;
	types = d.types || [];
	conditions = d.conditions || [];
	allocations = d.allocations || {};
	nodes = d.nodes.map(fromWire);
	original = new Map(nodes.map(n => [n.id, canon(n)]));
	undoStack = []; redoStack = [];
	selection = new Set([...selection].filter(id => nodes.some(n => n.id === id)));
	selectedEdge = null; linkSource = null;
	$("who").textContent = backend.offline ? adminName : "GM " + adminName;
	$("loading").style.display = "none";
	afterChange(false);
	return true;
}

function fromWire(n) {
	return {
		id: n.id, file: n.file, name: n.name, sector: n.sector, type: n.type, tier: n.tier, cost: n.cost,
		x: n.x, y: n.y, ox: n.ox === undefined ? null : n.ox, oy: n.oy === undefined ? null : n.oy,
		effect: n.effect || "", skillId: n.skillId || 0, skillLevel: n.skillLevel || "",
		icon: n.icon || "", description: n.description || "", requires: (n.requires || []).slice()
	};
}
function toWire(n) {
	const w = {
		id: n.id, file: n.file, name: n.name, sector: n.sector, type: n.type, tier: n.tier, cost: n.cost,
		x: round1(n.x), y: round1(n.y), effect: n.effect, skillId: n.skillId, skillLevel: n.skillId > 0 ? n.skillLevel : "",
		icon: n.icon, description: n.description, requires: n.requires
	};
	if (n.ox !== null && n.oy !== null) { w.ox = round1(n.ox); w.oy = round1(n.oy); }
	return w;
}

// ------------------------------------------------------------------ backends
/** The running game server, which //passivetree opens the editor for. */
const serverBackend = {
	offline: false,
	async tree() {
		const res = await api("tree");
		return res.ok && res.data ? res.data : { error: (res.data && res.data.error) || "Could not load the tree." };
	},
	async skill(id) {
		const res = await api("skill?id=" + encodeURIComponent(id));
		return res.ok ? res.data : null;
	},
	async save(body) {
		const res = await api("save", body);
		return res.data || { error: "No answer from the server." };
	},
	async reload() {
		const res = await api("reload", {});
		return res.ok && res.data ? res.data : { error: (res.data && res.data.error) || "Could not reload." };
	},
	saveNote: "The old files are backed up first. Online players get the new tree at once.",
	saveButton: "Save and make live",
	savedTitle: "Saved - the new tree is live",
	filesNote: "Saving checks the tree, copies the old files to data/passivetree_backup, writes data/passivetree/*.xml and makes the tree live: online players' trees are rebuilt at once.",
};

/** Tree files in a folder on this computer, no game server: see the offline part below. */
const offlineBackend = {
	offline: true,
	tree: () => readOfflineTree(),
	async skill(id) {
		const table = skillTable ? await skillTable : null;
		if (!table) return { unknown: true };
		const skill = table.get(Number(id));
		return skill ? { id, maxLevel: skill.maxLevel, name: skill.name, passive: false } : null;
	},
	save: body => saveOffline(body),
	reload: async () => ({ reloaded: true }),
	get saveNote() {
		if (!source.canWrite) return "This browser can't write into the folder: the changed files are downloaded, for you to put in data/passivetree.";
		return (source.hasData ? "The old files are copied to data/passivetree_backup first." : "No backup is made: open the data folder instead of passivetree to get one.")
			+ " The game server uses the new files after a restart, or at once with //passivetree_reload.";
	},
	get saveButton() { return source.canWrite ? "Save to the files" : "Download the changed files"; },
	get savedTitle() { return source.canWrite ? "Saved to the files" : "Changed files downloaded"; },
	get filesNote() {
		return (source.canWrite
			? `Saving checks the tree${source.hasData ? ", copies the old files to data/passivetree_backup" : ""} and writes the XML files of the folder you opened. The game server uses them after a restart, or at once with //passivetree_reload.`
			: "This browser can't write into the folder: saving downloads the changed files, to put in data/passivetree yourself (Chrome and Edge can save straight into the folder).")
			+ " Players' allocations are only known on the server, and " + (skillTable ? "skills are checked against data/stats/skills." : "skills can't be checked: open the data folder for that.");
	},
};
let backend = serverBackend;

// ------------------------------------------------------------------ offline: tree files on this computer
// The same reading, checks and writing as PassiveTreeEditor.java, so a save here writes exactly what the server would.
const NODE_TYPES = ["START", "SMALL", "NOTABLE", "KEYSTONE", "MASTER", "FUNCTION", "ACTIVE_SKILL"];
const CONDITION_TOKENS = ["HEAVY", "LIGHT", "ROBE", "NOARMOR", "SHIELD", "BOW", "DAGGER", "DUAL", "SWORD", "BLUNT", "POLE", "FIST", "LOWHP", "FULLHP", "NIGHT", "DAY"];
const LIST_LINE = '<list xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="../xsd/passivetree.xsd">';
const FILE_NAME_RE = /^[A-Za-z0-9_-]{1,64}\.xml$/i;
const ICON_RE = /^[a-z0-9-]{0,40}$/;
const NODE_COUNT_RE = /^(.*?: )\d+( nodes.*)$/s;
const MAX_BACKUPS = 30;
const LISTED = 8;

let source = null;         // where the files are read from and written to (folderSource or fileListSource)
let knownKeys = new Set(); // effect keys of the tree as opened, plus the capped ones: what the server is known to read
let skillTable = null;     // promise of Map skill id -> {name, maxLevel}, or null without the skill files

function showOfflineStart(message) {
	$("loading").style.display = "";
	$("loading-text").textContent = message || (location.protocol === "file:"
		? "Edit the passive tree files on this computer, without the game server."
		: "Open this editor in-game with //passivetree to edit the live tree, or edit tree files on this computer:");
	$("offline-start").hidden = false;
	$("offline-support").textContent = window.showDirectoryPicker ? "" : "This browser can't save into a folder: saving downloads the changed files instead. Chrome or Edge can save straight into the folder.";
}

async function openFolder() {
	if (!window.showDirectoryPicker) { $("folder-input").click(); return; }
	let picked;
	try {
		picked = await window.showDirectoryPicker({ id: "passivetree", mode: "readwrite" });
	} catch (e) {
		if (e.name === "SecurityError") $("folder-input").click(); // not allowed from this page: read the files and download changes instead
		else if (e.name !== "AbortError") showToast("Could not open the folder: " + e.message, true);
		return;
	}
	await startOffline(await folderSource(picked));
}

async function startOffline(src) {
	source = src;
	backend = offlineBackend;
	$("offline-start").hidden = true;
	$("loading-text").textContent = "Loading the tree...";
	const html = await source.dataText(["html", "custom", "passive-tree.html"]);
	if (html) importGlyphs(html);
	else await loadGlyphs("passive-tree.html"); // works when this page is served next to the planner
	capKeys = await readCaps();
	skillTable = null;
	if (await loadTree()) {
		skillTable = source.hasData ? readSkillTable().catch(() => null) : null; // 15 MB of skills: read in the background
		fitTo(nodes);
		offerDraft();
		renderInspector();
	}
}

async function subdir(handle, parts) {
	let dir = handle;
	for (const part of parts) {
		try { dir = await dir.getDirectoryHandle(part); } catch (e) { return null; }
	}
	return dir;
}
async function readHandleText(dir, parts) {
	const folder = await subdir(dir, parts.slice(0, -1));
	if (!folder) return null;
	try { return await (await (await folder.getFileHandle(parts[parts.length - 1])).getFile()).text(); } catch (e) { return null; }
}
async function xmlNames(dir) {
	const names = [];
	for await (const [name, handle] of dir.entries()) if (handle.kind === "file" && /\.xml$/i.test(name)) names.push(name);
	return names.sort();
}
async function writeHandleText(dir, name, text) {
	const writable = await (await dir.getFileHandle(name, { create: true })).createWritable();
	await writable.write(text);
	await writable.close();
}
function backupName() {
	const d = new Date(), p = (v, n) => String(v).padStart(n || 2, "0");
	return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}-${p(d.getMilliseconds(), 3)}`;
}

/** A folder picked with read and write access. It can be data/passivetree itself, or data, game, dist or the repository folder above it. */
async function folderSource(picked) {
	let data = (await subdir(picked, ["passivetree"])) ? picked : null, game = null;
	for (const path of [[], ["game"], ["dist", "game"]]) {
		if (data) break;
		const g = await subdir(picked, path), d = g && await subdir(g, ["data"]);
		if (d && await subdir(d, ["passivetree"])) { game = g; data = d; }
	}
	const tree = data ? await subdir(data, ["passivetree"]) : picked;
	return {
		label: picked.name,
		canWrite: true,
		hasData: !!data,
		async treeFiles() {
			const files = new Map();
			for (const name of await xmlNames(tree)) files.set(name, await readHandleText(tree, [name]));
			return files;
		},
		dataText: parts => (data ? readHandleText(data, parts) : Promise.resolve(null)),
		gameText: parts => (game ? readHandleText(game, parts) : Promise.resolve(null)),
		async skillTexts() {
			const texts = [];
			for (const parts of [["stats", "skills"], ["stats", "skills", "custom"]]) {
				const dir = data && await subdir(data, parts);
				if (dir) for (const name of await xmlNames(dir)) texts.push(await readHandleText(dir, [name]));
			}
			return texts;
		},
		write: (name, text) => writeHandleText(tree, name, text),
		remove: name => tree.removeEntry(name),
		/** Copies the files to data/passivetree_backup/<time>/ and drops the oldest backups past MAX_BACKUPS, like the server. */
		async backup(files) {
			if (!data) return null;
			const root = await data.getDirectoryHandle("passivetree_backup", { create: true });
			const name = backupName();
			const dir = await root.getDirectoryHandle(name, { create: true });
			for (const [file, text] of files) await writeHandleText(dir, file, text);
			const all = [];
			for await (const [entry, handle] of root.entries()) if (handle.kind === "directory") all.push(entry);
			all.sort();
			for (const old of all.slice(0, Math.max(0, all.length - MAX_BACKUPS))) {
				try { await root.removeEntry(old, { recursive: true }); } catch (e) { /* an old backup stays */ }
			}
			return "data/passivetree_backup/" + name;
		},
	};
}

/** Files picked in a browser that can't write to a folder: they are read, and a save downloads the changed ones. */
function fileListSource(fileList) {
	const all = [...fileList];
	const path = f => f.webkitRelativePath || f.name;
	const find = parts => all.find(f => path(f).endsWith("/" + parts.join("/")));
	const treeList = all.filter(f => { const p = path(f).split("/"); return /\.xml$/i.test(f.name) && p[p.length - 2] === "passivetree"; });
	let saved = null; // the tree as last downloaded: what a later save compares with
	return {
		label: all.length ? path(all[0]).split("/")[0] : "?",
		canWrite: false,
		hasData: !!find(["html", "custom", "passive-tree.html"]),
		async treeFiles() {
			if (saved) return new Map(saved);
			const files = new Map();
			for (const f of treeList.slice().sort((a, b) => (a.name < b.name ? -1 : a.name > b.name ? 1 : 0))) files.set(f.name, await f.text());
			return files;
		},
		async dataText(parts) { const f = find(parts); return f ? f.text() : null; },
		async gameText(parts) { const f = find(parts); return f ? f.text() : null; },
		skillTexts: () => Promise.all(all.filter(f => path(f).includes("/stats/skills/") && /\.xml$/i.test(f.name)).map(f => f.text())),
		commit(contents) { saved = new Map(contents); },
	};
}

function versionOf(files) {
	let h1 = 0x811c9dc5, h2 = 0x9747b28c;
	const feed = text => {
		for (let i = 0; i < text.length; i++) {
			const c = text.charCodeAt(i);
			h1 = Math.imul(h1 ^ c, 0x01000193);
			h2 = Math.imul(h2 ^ c, 0x5bd1e995);
			h2 ^= h2 >>> 15;
		}
	};
	[...files.keys()].sort().forEach(name => { feed(name); feed("\0"); feed(files.get(name)); feed("\0"); });
	return "local-" + (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

/** The nodes of one tree file, as the server's editor reads them (attributes left out stay empty, so they stay left out). */
function readTreeFile(name, text, out) {
	const doc = new DOMParser().parseFromString(text, "application/xml");
	const error = doc.getElementsByTagName("parsererror")[0];
	if (error) throw new Error(`${name} is not valid XML: ${error.textContent.trim().split("\n")[0]}`);
	for (const el of doc.documentElement.children) {
		if (el.nodeName.toLowerCase() !== "node") continue;
		const attr = key => el.getAttribute(key) ?? "";
		const has = key => el.hasAttribute(key);
		const int = (key, raw) => {
			const v = Number(String(raw ?? attr(key)).trim());
			if (!Number.isInteger(v)) throw new Error(`${name}: ${key}="${raw ?? attr(key)}" is not a whole number.`);
			return v;
		};
		const num = key => {
			const v = Number(attr(key));
			if (!Number.isFinite(v)) throw new Error(`${name}: ${key}="${attr(key)}" is not a number.`);
			return v;
		};
		const type = has("type") ? attr("type").trim().toUpperCase() : "SMALL";
		const skillId = has("skillId") ? int("skillId") : 0;
		const node = {
			id: int("id"), file: name, name: attr("name"), sector: attr("sector"), type,
			tier: has("tier") ? int("tier") : 0, cost: has("cost") ? int("cost") : (DEFAULT_COST[type] ?? 1),
			x: has("x") ? num("x") : 0, y: has("y") ? num("y") : 0,
		};
		if (has("orbitX") && has("orbitY")) { node.ox = num("orbitX"); node.oy = num("orbitY"); }
		node.effect = attr("effect");
		node.skillId = skillId;
		node.skillLevel = skillId > 0 ? (has("skillLevel") ? attr("skillLevel").trim() : "1") : "";
		node.icon = attr("icon");
		node.description = attr("description");
		node.requires = [...el.children].filter(c => c.nodeName.toLowerCase() === "requires").map(c => int("nodeId", c.getAttribute("nodeId")));
		out.push(node);
	}
}

/** The comment above <list>: the server keeps it, with the node count brought up to date. */
function headerOf(text) {
	const doc = new DOMParser().parseFromString(text, "application/xml");
	for (let n = doc.firstChild; n; n = n.nextSibling) {
		if (n.nodeType === Node.COMMENT_NODE) return n.nodeValue;
		if (n.nodeType === Node.ELEMENT_NODE) break;
	}
	return null;
}

async function readOfflineTree() {
	let files;
	try { files = await source.treeFiles(); } catch (e) { return { error: "Could not read the folder: " + e.message }; }
	const list = [];
	try { files.forEach((text, name) => readTreeFile(name, text, list)); } catch (e) { return { error: e.message }; }
	if (!list.length) return { error: `There are no passive tree files in "${source.label}". Pick dist/game/data, or dist/game/data/passivetree.` };
	knownKeys = new Set(capKeys);
	list.forEach(n => (n.effect || "").split(";").forEach(part => { const key = part.split(":")[0].trim(); if (key) knownKeys.add(key.split("@")[0]); }));
	return { version: versionOf(files), admin: "Offline: " + source.label, types: NODE_TYPES, conditions: CONDITION_TOKENS, allocations: {}, nodes: list };
}

/** Effect keys the ini caps (config/Custom/PassiveTree.ini), when the game folder was picked. */
async function readCaps() {
	const ini = await source.gameText(["config", "Custom", "PassiveTree.ini"]);
	const keys = [];
	if (ini) for (const m of ini.matchAll(/^\s*PassiveTreeCap\.([A-Za-z0-9_@]+)\s*=\s*(-?[\d.]+)/gm)) if (Number(m[2]) >= 0) keys.push(m[1]);
	return keys;
}

/** Skill id -> name and highest level, from data/stats/skills (custom too), like SkillData. */
async function readSkillTable() {
	const texts = await source.skillTexts();
	if (!texts.length) return null;
	const table = new Map();
	const decode = text => text.replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
	texts.forEach(text => {
		for (const m of text.matchAll(/<skill\s[^>]*>/g)) {
			const id = /\sid="(\d+)"/.exec(m[0]), levels = /\slevels="(\d+)"/.exec(m[0]), name = /\sname="([^"]*)"/.exec(m[0]);
			if (!id || !levels) continue;
			const known = table.get(Number(id[1]));
			const maxLevel = Math.max(known ? known.maxLevel : 0, Math.min(99, Number(levels[1])));
			table.set(Number(id[1]), { name: name ? decode(name[1]) : (known ? known.name : ""), maxLevel });
		}
	});
	return table;
}

function listed(items) {
	return items.length <= LISTED ? items.join(", ") : items.slice(0, LISTED).join(", ") + " and " + (items.length - LISTED) + " more";
}

/** The same checks as PassiveTreeEditor.check() on the server, with the same messages. */
function checkTree(list, before, skills, errors, warnings) {
	const ids = new Map();
	let uncheckedSkill = false;
	const beforeSkill = new Map(before.map(n => [n.id, n.skillId + "/" + n.skillLevel]));
	const checkText = (label, field, value, max, required) => {
		if (required && !value.trim()) errors.push(`${label}: the ${field} can't be empty.`);
		if (value.length > max) errors.push(`${label}: the ${field} is longer than ${max} characters.`);
		if (/[\x00-\x1f]/.test(value)) errors.push(`${label}: the ${field} has a line break or control character.`);
	};
	list.forEach(n => {
		const label = "Node " + n.id;
		if (!(Number.isInteger(n.id) && n.id > 0)) errors.push(label + ": the id must be above 0.");
		else if (ids.has(n.id)) errors.push(label + ": the id is used twice.");
		else ids.set(n.id, n);
		if (!FILE_NAME_RE.test(n.file)) errors.push(`${label}: the file "${n.file}" must be a plain name ending in .xml (letters, digits, - and _).`);
		checkText(label, "name", n.name, 80, true);
		checkText(label, "sector", n.sector, 40, true);
		checkText(label, "description", n.description, 600, false);
		const knownType = NODE_TYPES.includes(n.type);
		if (!knownType) errors.push(`${label}: unknown type "${n.type}".`);
		if (!Number.isInteger(n.cost) || n.cost < 0 || n.cost > 100) errors.push(`${label}: the cost must be 0-100.`);
		if (knownType && n.type !== "START" && n.cost === 0) warnings.push(`${label} (${n.name}) costs 0 points.`);
		if (!Number.isInteger(n.tier) || n.tier < 0) errors.push(`${label}: the tier can't be negative.`);
		if ([n.x, n.y, n.ox ?? 0, n.oy ?? 0].some(v => !Number.isFinite(v) || Math.abs(v) > 100000)) errors.push(`${label}: a position is out of range.`);
		if ((n.ox === null) !== (n.oy === null)) errors.push(`${label}: the orbit needs both X and Y.`);
		if (!ICON_RE.test(n.icon)) errors.push(`${label}: the icon must be a glyph name like "hammer".`);
		const fx = parseEffect(n.effect);
		fx.errors.forEach(e => errors.push(`${label}: ${e}`));
		if (!fx.errors.length) {
			[...new Set(fx.rows.map(r => r.key.split("@")[0]))].forEach(key => {
				if (!knownKeys.has(key)) warnings.push(`${label} (${n.name}): no other node uses the effect ${key}. Make sure the server knows it, or it does nothing.`);
			});
		}
		if (!Number.isInteger(n.skillId) || n.skillId < 0) errors.push(`${label}: the skill id can't be negative.`);
		else if (n.skillId === 0) n.skillLevel = "";
		else {
			if (!n.skillLevel) n.skillLevel = "1";
			const level = n.skillLevel === "auto" ? 1 : Number(n.skillLevel);
			if (n.skillLevel !== "auto" && !(Number.isInteger(level) && level >= 1)) errors.push(`${label}: the skill level must be 1 or more, or "auto".`);
			else if (skills) {
				const skill = skills.get(n.skillId);
				if (!skill) errors.push(`${label}: skill ${n.skillId} doesn't exist.`);
				else if (level > skill.maxLevel) errors.push(`${label}: skill ${n.skillId} only has levels 1-${skill.maxLevel}.`);
			} else if (beforeSkill.get(n.id) !== n.skillId + "/" + n.skillLevel) uncheckedSkill = true;
		}
	});
	if (uncheckedSkill) warnings.push("Skills were not checked: the skill files aren't in the folder you opened (open the data folder for that).");

	let hasStart = false;
	list.forEach(n => {
		if (n.type === "START") hasStart = true;
		n.requires.forEach(id => {
			const other = ids.get(id);
			if (!other && id !== n.id) errors.push(`Node ${n.id} is linked to node ${id}, which doesn't exist.`);
			else if (other && other !== n && n.type === "START" && other.type === "START") errors.push(`Nodes ${n.id} and ${id} are both starting points: two starting points can't be linked.`);
		});
	});
	if (!hasStart) errors.push("The tree needs at least one START node.");
	if (errors.length) return;

	const links = linkMap(list), reached = new Set(), queue = [];
	list.forEach(n => { if (n.type === "START") { reached.add(n.id); queue.push(n.id); } });
	while (queue.length) for (const next of links.get(queue.shift()) || []) if (!reached.has(next)) { reached.add(next); queue.push(next); }
	const unreachableNodes = list.filter(n => !reached.has(n.id)).map(n => `${n.id} (${n.name})`);
	if (unreachableNodes.length) warnings.push(`${unreachableNodes.length} node(s) can't be reached from any starting point, so nobody can take them: ${listed(unreachableNodes)}.`);
}

/** node id -> linked ids, both directions, like the server's links(). */
function linkMap(list) {
	const ids = new Set(list.map(n => n.id)), links = new Map();
	const add = (a, b) => { if (!links.has(a)) links.set(a, new Set()); links.get(a).add(b); };
	list.forEach(n => n.requires.forEach(other => { if (other !== n.id && ids.has(other)) { add(n.id, other); add(other, n.id); } }));
	return links;
}

/** Every link written both ways, START nodes listing none: the server's normalizeLinks(). */
function normalizeLinks(list) {
	const links = linkMap(list);
	list.forEach(n => {
		if (n.type === "START") { n.requires = []; return; }
		const neighbours = links.get(n.id) || new Set();
		const ordered = [];
		n.requires.forEach(id => { if (neighbours.has(id) && !ordered.includes(id)) ordered.push(id); });
		[...neighbours].sort((a, b) => a - b).forEach(id => { if (!ordered.includes(id)) ordered.push(id); });
		n.requires = ordered;
	});
}

/** One decimal, like the server's coordinate(). */
function coordinate(value) {
	const text = String(round1(value) + 0); // + 0 turns -0 into 0
	return text.includes(".") ? text : text + ".0";
}
function xmlAttr(name, value) {
	return " " + name + '="' + String(value).replace(/[\x00-\x1f]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") + '"';
}
/** A tree file in the generator's layout: the server's toXml(), character for character. */
function toXml(oldHeader, list) {
	let header = oldHeader;
	if (header === null) header = " " + (list.length ? list[0].sector : "Passive tree") + ": " + list.length + " nodes. x/y are authoritative layout coords. ";
	else {
		const m = NODE_COUNT_RE.exec(header);
		if (m) header = m[1] + list.length + m[2];
	}
	let xml = '<?xml version="1.0" encoding="UTF-8"?>\n<!--' + header.replace(/--/g, "- -") + "-->\n" + LIST_LINE + "\n";
	list.forEach(n => {
		xml += "\t<node" + xmlAttr("id", n.id) + xmlAttr("name", n.name) + xmlAttr("sector", n.sector) + xmlAttr("type", n.type)
			+ xmlAttr("tier", n.tier) + xmlAttr("cost", n.cost) + xmlAttr("x", coordinate(n.x)) + xmlAttr("y", coordinate(n.y));
		if (n.ox !== null && n.oy !== null) xml += xmlAttr("orbitX", coordinate(n.ox)) + xmlAttr("orbitY", coordinate(n.oy));
		if (n.effect) xml += xmlAttr("effect", n.effect);
		if (n.skillId > 0) xml += xmlAttr("skillId", n.skillId) + xmlAttr("skillLevel", n.skillLevel || "1");
		if (n.icon) xml += xmlAttr("icon", n.icon);
		if (n.description) xml += xmlAttr("description", n.description);
		if (!n.requires.length) { xml += " />\n"; return; }
		xml += ">\n" + n.requires.map(id => '\t\t<requires nodeId="' + id + '" />\n').join("") + "\t</node>\n";
	});
	return xml + "</list>";
}

function download(name, text) {
	const a = document.createElement("a");
	a.href = URL.createObjectURL(new Blob([text], { type: "application/xml" }));
	a.download = name;
	document.body.appendChild(a);
	a.click();
	a.remove();
	setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

/** The server's save(): refuse if the files changed since they were opened, check, then back up and write (or download) the changed files. */
async function saveOffline({ version: base, dryRun, nodes: wire }) {
	const errors = [], warnings = [];
	let current;
	try { current = await source.treeFiles(); } catch (e) { return { error: "Could not read the folder: " + e.message }; }
	const now = versionOf(current);
	const result = changed => ({ saved: false, dryRun, version: now, errors, warnings, changedFiles: changed || [] });
	if (now !== base) {
		errors.push("The tree files changed since you opened them (a save from the game server, another program or a hand edit). Load the files again to get them; your unsaved changes are kept in this browser as a draft.");
		return result();
	}

	const before = [];
	current.forEach((text, name) => readTreeFile(name, text, before));
	const list = wire.map(fromWire);
	checkTree(list, before, skillTable ? await skillTable : null, errors, warnings);
	if (errors.length) return result();
	normalizeLinks(list);

	// what players lose can only be counted on the server: say what kind of change this is
	const edges = nodeList => { const set = new Set(); linkMap(nodeList).forEach((others, a) => others.forEach(b => set.add(edgeKey(a, b)))); return set; };
	const newIds = new Set(list.map(n => n.id)), newEdges = edges(list);
	const removedNodes = before.filter(n => !newIds.has(n.id)).length;
	const removedLinks = [...edges(before)].filter(e => !newEdges.has(e)).length;
	if (removedNodes || removedLinks) {
		warnings.push(`This removes ${removedNodes} node(s) and ${removedLinks} link(s). Players' allocations can't be checked here: when the game server loads the new files, characters lose nodes that were removed or no longer connect to their starting point, and get those points back.`);
	}

	const byFile = new Map();
	list.forEach(n => { if (!byFile.has(n.file)) byFile.set(n.file, []); byFile.get(n.file).push(n); });
	const contents = new Map();
	[...byFile.keys()].sort().forEach(file => contents.set(file, toXml(current.has(file) ? headerOf(current.get(file)) : null, byFile.get(file))));
	const changed = [], writes = [], removed = [];
	contents.forEach((text, file) => { if (current.get(file) !== text) { changed.push(file); writes.push(file); } });
	current.forEach((_, file) => { if (!contents.has(file)) { removed.push(file); changed.push(file + " (removed: it has no nodes left)"); } });
	if (!changed.length) { warnings.push("Nothing changed."); return result(changed); }
	if (dryRun) return result(changed);

	if (!source.canWrite) {
		writes.forEach(file => download(file, contents.get(file)));
		source.commit(contents);
		warnings.push(`This browser can't write into the folder, so ${writes.length} changed file(s) were downloaded: put them in data/passivetree, replacing the old ones.`
			+ (removed.length ? ` Also delete ${removed.join(", ")} there.` : "") + " If only one file arrived, allow this page to download several files.");
		return { saved: true, dryRun: false, version: versionOf(contents), errors, warnings, changedFiles: changed };
	}

	let backup;
	try { backup = await source.backup(current); } catch (e) { errors.push("Could not make the backup, so nothing was saved: " + e.message); return result(changed); }
	try {
		for (const file of writes) await source.write(file, contents.get(file));
		for (const file of removed) await source.remove(file);
	} catch (e) {
		errors.push("Writing the files failed: " + e.message + (backup ? ` The old files are in ${backup}.` : ""));
		return result(changed);
	}
	warnings.push(backup ? `The old files are backed up in ${backup}.` : "No backup was made: open the data folder instead of passivetree to get one.");
	warnings.push("The game server uses the new tree after a restart, or at once with //passivetree_reload.");
	return { saved: true, dryRun: false, version: versionOf(await source.treeFiles()), errors, warnings, changedFiles: changed };
}

// ------------------------------------------------------------------ model
function reindex() {
	byId = new Map(); indexById = new Map(); adj = new Map();
	nodes.forEach((n, i) => { byId.set(n.id, n); indexById.set(n.id, i); adj.set(n.id, new Set()); });
	nodes.forEach(n => n.requires.forEach(p => {
		if (p === n.id || !byId.has(p)) return;
		adj.get(n.id).add(p);
		adj.get(p).add(n.id);
	}));
	files = [...new Set(nodes.map(n => n.file))].sort();
	usedIcons = [...new Set(nodes.map(n => n.icon).filter(Boolean))].sort();
	sectors = [...new Set(nodes.map(n => n.sector))].sort();
	effectKeyUse = new Map();
	nodes.forEach(n => parseEffect(n.effect).rows.forEach(r => {
		const base = r.key.split("@")[0];
		effectKeyUse.set(base, (effectKeyUse.get(base) || 0) + 1);
	}));
	capKeys.forEach(k => { if (!effectKeyUse.has(k)) effectKeyUse.set(k, 0); });
}

function computeDirty() {
	dirty = { changed: new Set(), added: new Set(), removed: [] };
	nodes.forEach(n => {
		if (!original.has(n.id)) dirty.added.add(n.id);
		else if (original.get(n.id) !== canon(n)) dirty.changed.add(n.id);
	});
	original.forEach((_, id) => { if (!byId.has(id)) dirty.removed.push(id); });
}
function hasChanges() { return dirty.changed.size + dirty.added.size + dirty.removed.length > 0; }

/** What the server will refuse or warn about, found here first so the map can show it. */
function computeIssues() {
	issues = [];
	const reached = new Set(), queue = [];
	nodes.forEach(n => { if (n.type === "START") { reached.add(n.id); queue.push(n.id); } });
	while (queue.length) {
		for (const next of adj.get(queue.shift()) || []) {
			if (!reached.has(next)) { reached.add(next); queue.push(next); }
		}
	}
	unreachable = new Set(nodes.filter(n => !reached.has(n.id)).map(n => n.id));
	if (!nodes.some(n => n.type === "START")) issues.push({ level: "err", text: "The tree has no START node." });
	nodes.forEach(n => {
		if (!n.name.trim()) issues.push({ id: n.id, level: "err", text: `${n.id}: no name` });
		if (!n.sector.trim()) issues.push({ id: n.id, level: "err", text: `${n.id} ${n.name}: no sector` });
		const fx = parseEffect(n.effect);
		if (fx.errors.length) issues.push({ id: n.id, level: "err", text: `${n.id} ${n.name}: ${fx.errors[0]}` });
		if (unreachable.has(n.id)) issues.push({ id: n.id, level: "warn", text: `${n.id} ${n.name}: no starting point leads here` });
	});
}

function parseEffect(spec) {
	const rows = [], errors = [];
	if (!spec) return { rows, errors };
	spec.split(";").forEach(part => {
		const bits = part.split(":");
		const key = (bits[0] || "").trim(), val = (bits[1] || "").trim();
		rows.push({ key, val });
		if (bits.length !== 2 || !EFFECT_KEY_RE.test(key)) { errors.push(`"${part}" is not like PATK_PCT:1.5`); return; }
		if (val === "" || !isFinite(Number(val))) { errors.push(`${key}: the value must be a number`); return; }
		const at = key.indexOf("@");
		if (at > 0) {
			const base = key.slice(0, at), cond = key.slice(at + 1);
			if (!conditions.includes(cond)) errors.push(`${key}: unknown condition ${cond}`);
			else if (/^(MAXHP|MAXMP|MAXCP|KS_)/.test(base)) errors.push(`${key}: HP, MP, CP and keystone keys can't be conditional`);
		}
	});
	return { rows, errors };
}
function effectSpec(rows) {
	return rows.filter(r => r.key.trim() !== "").map(r => r.key.trim() + ":" + r.val.trim()).join(";");
}
function autoDescription(spec) { return spec ? spec.replace(/;/g, ", ").replace(/:/g, " ") : ""; }

function linked(a, b) { return adj.has(a) && adj.get(a).has(b); }

/** Links two nodes both ways. A START node lists no links: its neighbours list it. */
function addLink(a, b) {
	const na = byId.get(a), nb = byId.get(b);
	if (!na || !nb || a === b) return false;
	if (na.type === "START" && nb.type === "START") { showToast("Two starting points can't be linked.", true); return false; }
	if (na.type !== "START" && !na.requires.includes(b)) na.requires.push(b);
	if (nb.type !== "START" && !nb.requires.includes(a)) nb.requires.push(a);
	adj.get(a).add(b); adj.get(b).add(a);
	return true;
}
function removeLink(a, b) {
	const na = byId.get(a), nb = byId.get(b);
	if (na) na.requires = na.requires.filter(x => x !== b);
	if (nb) nb.requires = nb.requires.filter(x => x !== a);
	if (adj.has(a)) adj.get(a).delete(b);
	if (adj.has(b)) adj.get(b).delete(a);
}
/** Changing to or from START moves the node's links between its own list and its neighbours' lists. */
function setType(n, type) {
	if (type === n.type) return true;
	const neighbours = [...(adj.get(n.id) || [])];
	if (type === "START") {
		const other = neighbours.map(id => byId.get(id)).find(m => m.type === "START");
		if (other) { showToast(`It is linked to the starting point ${nodeLabel(other)}: two starting points can't be linked.`, true); return false; }
		neighbours.forEach(id => { const m = byId.get(id); if (!m.requires.includes(n.id)) m.requires.push(n.id); });
		n.requires = [];
	} else if (n.type === "START") {
		n.requires = neighbours.slice().sort((a, b) => a - b);
	}
	if (n.cost === DEFAULT_COST[n.type]) n.cost = DEFAULT_COST[type];
	n.type = type;
	return true;
}

/** A free id: after the highest one of the file, never one the files had (a removed node's players would get the new node). */
function nextFreeId(file, taken) {
	let max = 0;
	nodes.forEach(n => { if (n.file === file && n.id > max) max = n.id; });
	if (!max) nodes.forEach(n => { if (n.id > max) max = n.id; });
	let id = max + 1;
	while (byId.has(id) || original.has(id) || (taken && taken.has(id))) id++;
	return id;
}

// ------------------------------------------------------------------ undo
function capture(ids) {
	return ids.map(id => ({ id, index: indexById.has(id) ? indexById.get(id) : -1, data: byId.has(id) ? clone(byId.get(id)) : null }));
}
function applyStates(states) {
	const removed = new Set(states.filter(s => !s.data).map(s => s.id));
	nodes = nodes.filter(n => !removed.has(n.id));
	const pos = new Map(nodes.map((n, i) => [n.id, i]));
	const inserts = [];
	states.forEach(s => {
		if (!s.data) return;
		if (pos.has(s.id)) nodes[pos.get(s.id)] = clone(s.data);
		else inserts.push(s);
	});
	inserts.sort((a, b) => a.index - b.index).forEach(s => nodes.splice(s.index < 0 ? nodes.length : Math.min(s.index, nodes.length), 0, clone(s.data)));
}
/**
 * One undoable change. {@code ids} are the nodes it may change; {@code fn} makes the change and returns the ids of nodes it
 * created, or false if it changed nothing.
 */
function edit(label, ids, fn) {
	const list = [...new Set(ids)];
	const before = capture(list);
	const created = fn();
	if (created === false) { afterChange(true); return false; }
	const extra = Array.isArray(created) ? created.filter(id => !list.includes(id)) : [];
	const all = list.concat(extra);
	reindex();
	const after = capture(all);
	const beforeAll = before.concat(extra.map(id => ({ id, index: -1, data: null })));
	if (JSON.stringify(beforeAll.map(s => s.data)) === JSON.stringify(after.map(s => s.data))) { afterChange(true); return false; }
	undoStack.push({ label, before: beforeAll, after });
	if (undoStack.length > UNDO_LIMIT) undoStack.shift();
	redoStack = [];
	afterChange(true);
	return true;
}
function undo() {
	const step = undoStack.pop();
	if (!step) return;
	applyStates(step.before);
	redoStack.push(step);
	afterChange(true);
	showToast("Undid: " + step.label);
}
function redo() {
	const step = redoStack.pop();
	if (!step) return;
	applyStates(step.after);
	undoStack.push(step);
	afterChange(true);
	showToast("Redid: " + step.label);
}

function afterChange(saveDraft) {
	reindex();
	computeDirty();
	computeIssues();
	selection = new Set([...selection].filter(id => byId.has(id)));
	if (selectedEdge && !linked(selectedEdge[0], selectedEdge[1])) selectedEdge = null;
	if (linkSource !== null && !byId.has(linkSource)) linkSource = null;
	renderSearch();
	render();
	renderInspector();
	renderToolbar();
	if (saveDraft) scheduleDraft();
}

/** After nodes only moved: redraw them, their links and the rings, without rebuilding the whole map. */
function afterMove(ids) {
	computeDirty();
	renderRings();
	movedOnMap(ids);
	refreshClasses();
	renderInspector();
	renderToolbar();
	scheduleDraft();
}
function pushUndo(label, before, after) {
	undoStack.push({ label, before, after });
	if (undoStack.length > UNDO_LIMIT) undoStack.shift();
	redoStack = [];
}

// ------------------------------------------------------------------ draft
function draftKey() { return DRAFT_KEY + (backend.offline ? ":offline" : ""); }
function scheduleDraft() {
	clearTimeout(draftTimer);
	draftTimer = setTimeout(() => {
		try {
			if (hasChanges()) localStorage.setItem(draftKey(), JSON.stringify({ version, savedAt: Date.now(), nodes: nodes.map(toWire) }));
			else localStorage.removeItem(draftKey());
		} catch (e) { /* storage blocked or full: the draft is only a convenience */ }
	}, 700);
}
function readDraft() {
	try { return JSON.parse(localStorage.getItem(draftKey()) || "null"); } catch (e) { return null; }
}
function dropDraft() {
	try { localStorage.removeItem(draftKey()); } catch (e) { /* nothing to drop */ }
}
function offerDraft() {
	const draft = readDraft();
	if (!draft || !Array.isArray(draft.nodes)) return;
	const sameBase = draft.version === version;
	openModal(`<h2>Restore unsaved changes?</h2>
		<p>This browser kept unsaved editor changes from ${esc(new Date(draft.savedAt).toLocaleString())}.</p>
		${sameBase ? "" : `<p class="note warn">The tree files have changed since then (another save or a hand edit). Restoring puts your draft over them: saving it would undo those changes.</p>`}
		<div class="actions"><button class="btn danger" id="draft-drop">Throw away</button><button class="btn" id="draft-later">Not now</button><button class="btn primary" id="draft-restore">Restore</button></div>`);
	$("draft-drop").onclick = () => { dropDraft(); closeModal(); };
	$("draft-later").onclick = closeModal;
	$("draft-restore").onclick = () => {
		closeModal();
		const ids = new Set(nodes.map(n => n.id).concat(draft.nodes.map(n => n.id)));
		edit("restore draft", [...ids], () => { nodes = draft.nodes.map(fromWire); });
		showToast("Draft restored.");
	};
}

// ------------------------------------------------------------------ render
function arcOrbit(na, nb) {
	if (na.ox !== null && na.ox === nb.ox && na.oy === nb.oy
		&& Math.abs(Math.hypot(na.x - na.ox, na.y - na.oy) - Math.hypot(nb.x - nb.ox, nb.y - nb.oy)) < 1) return [na.ox, na.oy];
	for (const [x, y] of [[na, nb], [nb, na]]) {
		if (x.ox !== null && (x.ox !== 0 || x.oy !== 0)
			&& Math.abs(Math.hypot(x.x - x.ox, x.y - x.oy) - Math.hypot(y.x - x.ox, y.y - x.oy)) < 1) return [x.ox, x.oy];
	}
	return null;
}
/** Same drawing as the planner: a link along a circle is an arc, the rest are straight. */
function edgePath(na, nb) {
	const o = arcOrbit(na, nb);
	if (o) {
		const r = Math.hypot(na.x - o[0], na.y - o[1]);
		let d = Math.atan2(nb.y - o[1], nb.x - o[0]) - Math.atan2(na.y - o[1], na.x - o[0]);
		d = Math.atan2(Math.sin(d), Math.cos(d));
		return `M${na.x},${na.y}A${r},${r} 0 0 ${d > 0 ? 1 : 0} ${nb.x},${nb.y}`;
	}
	return `M${na.x},${na.y}L${nb.x},${nb.y}`;
}
function glyphFor(n) {
	if (n.icon && glyphs.includes(n.icon)) return n.icon;
	const g = TYPE_GLYPH[n.type];
	return g && glyphs.includes(g) ? g : null;
}
/** Cluster rings: every orbit centre other than the tree centre whose circle is small enough to be a cluster. */
function ringsOf() {
	const rings = new Map();
	nodes.forEach(n => {
		if (n.ox === null || (n.ox === 0 && n.oy === 0)) return;
		const key = n.ox + "," + n.oy;
		const ring = rings.get(key) || { key, x: n.ox, y: n.oy, r: 0, ids: [] };
		ring.r = Math.max(ring.r, Math.hypot(n.x - n.ox, n.y - n.oy));
		ring.ids.push(n.id);
		rings.set(key, ring);
	});
	return [...rings.values()].filter(r => r.r > 0 && r.r <= MAX_RING_RADIUS);
}

function render() {
	const edges = $("edges"), hits = $("edge-hits"), nodeLayer = $("nodes");
	edges.textContent = ""; hits.textContent = ""; nodeLayer.textContent = "";
	nodeEls = new Map(); edgeEls = new Map();
	renderRings();

	adj.forEach((set, a) => set.forEach(b => {
		if (a > b) return;
		const na = byId.get(a), nb = byId.get(b);
		const d = edgePath(na, nb);
		const isSel = selectedEdge && edgeKey(selectedEdge[0], selectedEdge[1]) === edgeKey(a, b);
		const path = svgEl("path", { d, class: "edge" + (isSel ? " sel" : "") + (na.type === "START" || nb.type === "START" ? " start" : "") }, edges);
		const hit = svgEl("path", { d, class: "edge-hit", "data-a": a, "data-b": b }, hits);
		edgeEls.set(edgeKey(a, b), { path, hit });
	}));

	nodes.forEach(n => {
		const r = TYPE_RADIUS[n.type] || 8;
		const g = svgEl("g", { class: "node", "data-id": n.id, transform: `translate(${n.x},${n.y})` }, nodeLayer);
		svgEl("circle", { class: "hit", r: Math.max(r, 9 / view.s) }, g);
		svgEl("circle", { class: "halo", r: r + 5 }, g);
		svgEl("circle", { class: "body", r, fill: TYPE_COLOR[n.type] || "#888" }, g);
		const glyph = glyphFor(n);
		if (glyph && r >= 12) svgEl("use", { class: "glyph", href: "#icon-" + glyph, x: -r * 0.62, y: -r * 0.62, width: r * 1.24, height: r * 1.24 }, g);
		const label = svgEl("text", { class: "lbl" + (MAJOR_TYPES.has(n.type) ? "" : " minor"), y: r + 4, dy: "1em" }, g);
		label.textContent = n.name;
		const idLabel = svgEl("text", { class: "idl", y: -r - 4 }, g);
		idLabel.textContent = n.id;
		nodeEls.set(n.id, g);
	});
	refreshClasses();
	applyView();
}

function renderRings() {
	const rings = $("rings");
	rings.textContent = "";
	ringsOf().forEach(ring => {
		svgEl("circle", { class: "ring-disc", cx: ring.x, cy: ring.y, r: Math.max(8, ring.r - 24), "data-ring": ring.key }, rings);
		svgEl("circle", { class: "ring-track", cx: ring.x, cy: ring.y, r: ring.r }, rings);
	});
}

/** Selection, search, link source and change markers: classes only, no rebuild. */
function refreshClasses() {
	nodeEls.forEach((g, id) => {
		const c = g.classList;
		c.toggle("sel", selection.has(id));
		c.toggle("match", search.set.has(id));
		c.toggle("src", id === linkSource);
		c.toggle("changed", dirty.changed.has(id));
		c.toggle("added", dirty.added.has(id));
		c.toggle("unreachable", unreachable.has(id));
	});
	edgeEls.forEach(({ path }, key) => path.classList.toggle("sel", !!selectedEdge && edgeKey(selectedEdge[0], selectedEdge[1]) === key));
	$("st-sel").textContent = selection.size ? selection.size + " selected" : (selectedEdge ? "link " + selectedEdge.join(" - ") : "");
}

/** Moves the drawn nodes and their links during a drag, without rebuilding the map. */
function movedOnMap(ids) {
	const touched = new Set();
	ids.forEach(id => {
		const n = byId.get(id), g = nodeEls.get(id);
		if (g) g.setAttribute("transform", `translate(${n.x},${n.y})`);
		(adj.get(id) || []).forEach(o => touched.add(edgeKey(id, o)));
	});
	touched.forEach(key => {
		const el = edgeEls.get(key);
		if (!el) return;
		const [a, b] = key.split("-").map(Number);
		const d = edgePath(byId.get(a), byId.get(b));
		el.path.setAttribute("d", d); el.hit.setAttribute("d", d);
	});
}

function applyView() {
	viewport.setAttribute("transform", `translate(${view.tx},${view.ty}) scale(${view.s})`);
	viewport.style.setProperty("--k", 1 / view.s);
	svg.classList.toggle("z1", view.s < 0.22);
	svg.classList.toggle("z2", view.s >= 0.22 && view.s < 0.9);
	svg.classList.toggle("show-ids", showIds);
	$("st-zoom").textContent = Math.round(view.s * 100) + "%";
	clearTimeout(applyView.timer);
	applyView.timer = setTimeout(() => {
		// a node stays easy to hit when zoomed far out
		nodeEls.forEach((g, id) => {
			const n = byId.get(id);
			if (n) g.firstChild.setAttribute("r", Math.max(TYPE_RADIUS[n.type] || 8, 9 / view.s));
		});
	}, 120);
}

function renderToolbar() {
	const c = $("changes");
	const parts = [];
	if (dirty.changed.size) parts.push(dirty.changed.size + " changed");
	if (dirty.added.size) parts.push(dirty.added.size + " new");
	if (dirty.removed.length) parts.push(dirty.removed.length + " removed");
	c.textContent = parts.length ? parts.join(" · ") : "No changes";
	c.classList.toggle("dirty", parts.length > 0);
	$("undo").disabled = !undoStack.length;
	$("redo").disabled = !redoStack.length;
	$("undo").title = undoStack.length ? "Undo " + undoStack[undoStack.length - 1].label + " (Ctrl+Z)" : "Undo (Ctrl+Z)";
	$("redo").title = redoStack.length ? "Redo " + redoStack[redoStack.length - 1].label + " (Ctrl+Y)" : "Redo (Ctrl+Y)";
	document.querySelectorAll("[data-tool]").forEach(b => b.classList.toggle("on", b.dataset.tool === tool));
	const stage = $("stage");
	stage.classList.toggle("tool-select", tool === "select");
	stage.classList.toggle("tool-link", tool === "link");
	stage.classList.toggle("tool-add", tool === "add");
	$("st-hint").textContent = {
		select: "Drag nodes or a ring to move them · Shift+drag to box-select · Alt+click to link to the selected node · Del removes",
		link: linkSource === null ? "Click the node to link from" : "Click nodes to link or unlink them to " + nodeLabel(byId.get(linkSource)) + " · Shift keeps this node · Esc stops",
		add: selection.size === 1 ? "Click empty space: a copy of " + nodeLabel(byId.get([...selection][0])) + ", linked to it" : "Click empty space to add a node (select one first to copy it and link to it)",
	}[tool];
}

function renderLegend() {
	$("legend").innerHTML = Object.keys(TYPE_COLOR).map(t => `<div><i style="background:${TYPE_COLOR[t]}"></i>${t}</div>`).join("")
		+ `<div><i style="border:2px dashed var(--changed)"></i>changed</div><div><i style="border:2px solid var(--added)"></i>new</div><div><i style="border:2px solid var(--danger)"></i>unreachable</div>`;
}

// ------------------------------------------------------------------ view
function screenToWorld(sx, sy) { return { x: (sx - view.tx) / view.s, y: (sy - view.ty) / view.s }; }
function pointer(e) {
	const r = svg.getBoundingClientRect();
	return { sx: e.clientX - r.left, sy: e.clientY - r.top };
}
function zoomAt(sx, sy, factor) {
	const s = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, view.s * factor));
	const w = screenToWorld(sx, sy);
	view.s = s; view.tx = sx - w.x * s; view.ty = sy - w.y * s;
	applyView();
}
function fitTo(list, maxZoom) {
	if (!list.length) return;
	const r = svg.getBoundingClientRect();
	const xs = list.map(n => n.x), ys = list.map(n => n.y);
	const minX = Math.min(...xs) - 60, maxX = Math.max(...xs) + 60, minY = Math.min(...ys) - 60, maxY = Math.max(...ys) + 60;
	const s = Math.min(maxZoom || ZOOM_MAX, (r.width - 40) / Math.max(1, maxX - minX), (r.height - 60) / Math.max(1, maxY - minY));
	view.s = Math.max(ZOOM_MIN, s);
	view.tx = r.width / 2 - ((minX + maxX) / 2) * view.s;
	view.ty = (r.height - 24) / 2 - ((minY + maxY) / 2) * view.s;
	applyView();
}
function centreOn(n) {
	const r = svg.getBoundingClientRect();
	if (view.s < 0.6) view.s = 0.9;
	view.tx = r.width / 2 - n.x * view.s;
	view.ty = r.height / 2 - n.y * view.s;
	applyView();
}

// ------------------------------------------------------------------ pointer
function nodeIdOf(target) {
	const g = target.closest && target.closest(".node");
	return g ? Number(g.dataset.id) : null;
}
function snapped(v) { return snapOn ? Math.round(v / SNAP) * SNAP : v; }

svg.addEventListener("wheel", e => {
	e.preventDefault();
	const p = pointer(e);
	zoomAt(p.sx, p.sy, e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP);
}, { passive: false });

svg.addEventListener("pointerdown", e => {
	if (e.button !== 0 && e.button !== 1) return;
	const p = pointer(e), w = screenToWorld(p.sx, p.sy);
	const id = nodeIdOf(e.target);
	const ring = e.target.dataset && e.target.dataset.ring;
	const edgeA = e.target.dataset && e.target.dataset.a;
	svg.setPointerCapture(e.pointerId);

	if (e.button === 1) { startPan(p); return; }

	if (id !== null) {
		if (tool === "link") { linkClick(id, e.shiftKey); drag = { kind: "none" }; return; }
		if (tool === "select" && e.altKey && selection.size === 1 && !selection.has(id)) {
			toggleLink([...selection][0], id); drag = { kind: "none" }; return;
		}
		if (e.shiftKey) {
			if (selection.has(id)) selection.delete(id); else selection.add(id);
			selectedEdge = null; selectionChanged(); drag = { kind: "none" }; return;
		}
		if (!selection.has(id)) { selection = new Set([id]); selectedEdge = null; selectionChanged(); }
		if (tool === "add") { drag = { kind: "none" }; return; }
		startMove([...selection], w);
		drag.clicked = id;
		return;
	}
	if (ring && tool === "select") {
		const ids = ringsOf().find(r => r.key === ring)?.ids || [];
		if (e.shiftKey) ids.forEach(i => selection.add(i)); else selection = new Set(ids);
		selectedEdge = null; selectionChanged();
		startMove([...selection], w);
		return;
	}
	if (edgeA !== undefined && tool === "select") {
		selectedEdge = [Number(e.target.dataset.a), Number(e.target.dataset.b)];
		selection.clear(); selectionChanged(); drag = { kind: "none" }; return;
	}
	if (tool === "add") { addNodeAt(w); drag = { kind: "none" }; return; }
	if (tool === "select" && e.shiftKey) { drag = { kind: "box", x0: p.sx, y0: p.sy, x1: p.sx, y1: p.sy }; return; }
	startPan(p);
});

function startPan(p) {
	drag = { kind: "pan", sx: p.sx, sy: p.sy, tx: view.tx, ty: view.ty, moved: false };
	$("stage").classList.add("panning");
}

/** Dragging nodes also moves a ring's centre when the whole ring moves, so its links stay arcs. */
function startMove(ids, w) {
	const moving = new Set(ids);
	const ringCentres = new Set();
	const byCentre = new Map();
	nodes.forEach(n => { if (n.ox !== null) { const k = n.ox + "," + n.oy; (byCentre.get(k) || byCentre.set(k, []).get(k)).push(n.id); } });
	byCentre.forEach((members, k) => { if (members.every(m => moving.has(m)) && members.some(m => moving.has(m))) ringCentres.add(k); });
	drag = {
		kind: "move", ids, start: w, moved: false,
		from: new Map(ids.map(id => { const n = byId.get(id); return [id, { x: n.x, y: n.y, ox: n.ox, oy: n.oy, ring: n.ox !== null && ringCentres.has(n.ox + "," + n.oy) }]; })),
		before: capture(ids),
	};
}

svg.addEventListener("pointermove", e => {
	const p = pointer(e), w = screenToWorld(p.sx, p.sy);
	$("st-pos").textContent = `x ${Math.round(w.x)}  y ${Math.round(w.y)}`;
	if (tool === "link" && linkSource !== null && byId.has(linkSource)) {
		const s = byId.get(linkSource), line = $("link-preview");
		line.setAttribute("x1", s.x); line.setAttribute("y1", s.y); line.setAttribute("x2", w.x); line.setAttribute("y2", w.y);
		line.setAttribute("visibility", "visible");
	}
	if (!drag) return;
	if (drag.kind === "pan") {
		if (Math.abs(p.sx - drag.sx) + Math.abs(p.sy - drag.sy) > 3) drag.moved = true;
		view.tx = drag.tx + (p.sx - drag.sx); view.ty = drag.ty + (p.sy - drag.sy);
		applyView();
	} else if (drag.kind === "move") {
		let dx = w.x - drag.start.x, dy = w.y - drag.start.y;
		if (!drag.moved && Math.hypot(dx, dy) * view.s < 3) return;
		if (!drag.moved) { drag.moved = true; $("stage").classList.add("dragging"); }
		if (snapOn) {
			const first = drag.from.get(drag.ids[0]);
			dx = snapped(first.x + dx) - first.x; dy = snapped(first.y + dy) - first.y;
		}
		drag.ids.forEach(id => {
			const n = byId.get(id), f = drag.from.get(id);
			n.x = round1(f.x + dx); n.y = round1(f.y + dy);
			if (f.ring) { n.ox = round1(f.ox + dx); n.oy = round1(f.oy + dy); }
		});
		movedOnMap(drag.ids);
	} else if (drag.kind === "box") {
		drag.x1 = p.sx; drag.y1 = p.sy;
		const b = $("box");
		b.style.display = "block";
		b.style.left = Math.min(drag.x0, drag.x1) + "px"; b.style.top = Math.min(drag.y0, drag.y1) + "px";
		b.style.width = Math.abs(drag.x1 - drag.x0) + "px"; b.style.height = Math.abs(drag.y1 - drag.y0) + "px";
	}
});

svg.addEventListener("pointerup", e => {
	const d = drag;
	drag = null;
	$("stage").classList.remove("panning", "dragging");
	if (!d) return;
	if (d.kind === "pan" && !d.moved && tool !== "add") {
		// a click on empty space
		if (tool === "link") linkSource = null;
		selection.clear(); selectedEdge = null; selectionChanged();
	} else if (d.kind === "move" && d.moved) {
		pushUndo(d.ids.length === 1 ? "move " + nodeLabel(byId.get(d.ids[0])) : "move " + d.ids.length + " nodes", d.before, capture(d.ids));
		afterMove(d.ids);
	} else if (d.kind === "move" && d.clicked !== undefined && selection.size > 1) {
		selection = new Set([d.clicked]); selectedEdge = null; selectionChanged();
	} else if (d.kind === "box") {
		$("box").style.display = "none";
		const a = screenToWorld(Math.min(d.x0, d.x1), Math.min(d.y0, d.y1)), b = screenToWorld(Math.max(d.x0, d.x1), Math.max(d.y0, d.y1));
		nodes.forEach(n => { if (n.x >= a.x && n.x <= b.x && n.y >= a.y && n.y <= b.y) selection.add(n.id); });
		selectedEdge = null; selectionChanged();
	}
});
svg.addEventListener("pointerleave", () => { $("link-preview").setAttribute("visibility", "hidden"); });

function selectionChanged() {
	refreshClasses();
	renderInspector();
	renderToolbar();
}

// ------------------------------------------------------------------ actions
function toggleLink(a, b) {
	const na = byId.get(a), nb = byId.get(b);
	if (!na || !nb || a === b) return false;
	if (linked(a, b)) return edit(`unlink ${a} - ${b}`, [a, b], () => removeLink(a, b));
	return edit(`link ${a} - ${b}`, [a, b], () => addLink(a, b));
}
function linkClick(id, keepSource) {
	if (linkSource === null || !byId.has(linkSource)) {
		linkSource = id;
		refreshClasses(); renderToolbar();
		return;
	}
	if (id === linkSource) { linkSource = null; $("link-preview").setAttribute("visibility", "hidden"); refreshClasses(); renderToolbar(); return; }
	const source = linkSource;
	toggleLink(source, id);
	linkSource = keepSource ? source : id;
	selection = new Set([id]);
	refreshClasses(); renderInspector(); renderToolbar();
}

function addNodeAt(w) {
	const template = selection.size === 1 ? byId.get([...selection][0]) : null;
	let near = template;
	if (!near) {
		let best = Infinity;
		nodes.forEach(n => { const d = Math.hypot(n.x - w.x, n.y - w.y); if (d < best) { best = d; near = n; } });
	}
	const file = near ? near.file : "Custom.xml";
	const id = nextFreeId(file);
	const node = {
		id, file, name: template ? template.name : "New Node", sector: near ? near.sector : "Custom",
		type: template && template.type !== "START" ? template.type : "SMALL", tier: template ? template.tier : 0,
		cost: template && template.type !== "START" ? template.cost : 1,
		x: round1(snapped(w.x)), y: round1(snapped(w.y)), ox: null, oy: null,
		effect: template ? template.effect : "", skillId: 0, skillLevel: "", icon: template ? template.icon : "",
		description: template && !template.skillId ? template.description : "", requires: []
	};
	const ids = template ? [template.id] : [];
	edit("add " + id, ids, () => {
		nodes.push(node);
		byId.set(id, node); adj.set(id, new Set());
		if (template) addLink(template.id, id);
		return [id];
	});
	selection = new Set([id]);
	selectionChanged();
}

function deleteSelection() {
	if (selectedEdge && !selection.size) {
		const [a, b] = selectedEdge;
		edit(`unlink ${a} - ${b}`, [a, b], () => removeLink(a, b));
		selectedEdge = null; selectionChanged();
		return;
	}
	if (!selection.size) return;
	const ids = [...selection];
	const owners = ids.reduce((sum, id) => sum + (allocations[id] || 0), 0);
	if (owners && !confirm(`${owners} character slot(s) have ${ids.length === 1 ? "this node" : "these nodes"} allocated. When you save, they lose ${ids.length === 1 ? "it" : "them"} (and anything that only connects through ${ids.length === 1 ? "it" : "them"}) and get the points back.\n\nRemove anyway?`)) return;
	const touched = new Set(ids);
	ids.forEach(id => (adj.get(id) || []).forEach(o => touched.add(o)));
	edit(ids.length === 1 ? "remove " + nodeLabel(byId.get(ids[0])) : "remove " + ids.length + " nodes", [...touched], () => {
		const gone = new Set(ids);
		nodes = nodes.filter(n => !gone.has(n.id));
		nodes.forEach(n => { n.requires = n.requires.filter(r => !gone.has(r)); });
	});
	selection.clear();
	selectionChanged();
}

function duplicateSelection() {
	if (!selection.size) return;
	const ids = [...selection];
	const map = new Map(), taken = new Set();
	ids.forEach(id => { const nid = nextFreeId(byId.get(id).file, taken); taken.add(nid); map.set(id, nid); });
	edit("duplicate " + ids.length + " node(s)", [], () => {
		ids.forEach(id => {
			const src = byId.get(id), copy = clone(src);
			copy.id = map.get(id);
			copy.x = round1(src.x + DUPLICATE_OFFSET); copy.y = round1(src.y + DUPLICATE_OFFSET);
			if (copy.ox !== null) { copy.ox = round1(copy.ox + DUPLICATE_OFFSET); copy.oy = round1(copy.oy + DUPLICATE_OFFSET); }
			copy.requires = src.requires.filter(r => map.has(r)).map(r => map.get(r)); // links inside the copied group only
			nodes.push(copy);
		});
		return [...map.values()];
	});
	selection = new Set(map.values());
	selectionChanged();
	showToast("Duplicated " + ids.length + " node(s). Drag them where they belong.");
}

function nudge(dx, dy) {
	if (!selection.size) return;
	const ids = [...selection];
	const moving = new Set(ids);
	const whole = new Set();
	const byCentre = new Map();
	nodes.forEach(n => { if (n.ox !== null) { const k = n.ox + "," + n.oy; (byCentre.get(k) || byCentre.set(k, []).get(k)).push(n.id); } });
	byCentre.forEach((members, k) => { if (members.every(m => moving.has(m))) whole.add(k); });
	const before = capture(ids);
	ids.forEach(id => {
		const n = byId.get(id);
		const ring = n.ox !== null && whole.has(n.ox + "," + n.oy);
		n.x = round1(n.x + dx); n.y = round1(n.y + dy);
		if (ring) { n.ox = round1(n.ox + dx); n.oy = round1(n.oy + dy); }
	});
	pushUndo("nudge", before, capture(ids));
	afterMove(ids);
}

// ------------------------------------------------------------------ search
function nodeText(n) {
	return (n.id + " " + n.name + " " + n.sector + " " + n.effect + " " + n.icon + " " + n.type + " " + n.file + " " + n.description).toLowerCase();
}
function applySearch(q) {
	search.q = q.trim().toLowerCase();
	renderSearch();
	refreshClasses();
	if (search.matches.length && search.matches.length <= 3) centreOn(byId.get(search.matches[0]));
}
function renderSearch() {
	search.matches = [];
	if (search.q) {
		const terms = search.q.split(/\s+/);
		nodes.forEach(n => { const t = nodeText(n); if (terms.every(term => t.includes(term))) search.matches.push(n.id); });
	}
	search.set = new Set(search.matches);
	search.cursor = -1;
	$("search-count").textContent = search.q ? search.matches.length + " found" : "";
	$("search-select").disabled = !search.matches.length;
}

// ------------------------------------------------------------------ inspector
function focusKey(el) {
	if (!el || !el.closest || !el.closest("#inspector")) return null;
	if (el.dataset.f) return `[data-f="${el.dataset.f}"]`;
	if (el.dataset.fxKey !== undefined) return `[data-fx-key="${el.dataset.fxKey}"]`;
	if (el.dataset.fxVal !== undefined) return `[data-fx-val="${el.dataset.fxVal}"]`;
	return el.id ? "#" + el.id : null;
}
function renderInspector() {
	const box = $("inspector");
	const focused = focusKey(document.activeElement);
	const scroll = box.scrollTop;
	if (selection.size === 1) box.innerHTML = nodePane(byId.get([...selection][0]));
	else if (selection.size > 1) box.innerHTML = multiPane();
	else if (selectedEdge) box.innerHTML = edgePane();
	else box.innerHTML = overviewPane();
	box.scrollTop = scroll;
	if (focused) {
		const el = box.querySelector(focused);
		if (el && !el.disabled) el.focus();
	}
	if (selection.size === 1) lookupSkill(byId.get([...selection][0]));
}

function options(list, current, blankLabel) {
	return (blankLabel !== undefined ? `<option value="">${esc(blankLabel)}</option>` : "")
