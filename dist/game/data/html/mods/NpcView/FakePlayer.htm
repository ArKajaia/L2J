<html>
<head>
	<title>%name%</title>
</head>
<body>
<center>
<table width=410 cellpadding=0 cellspacing=0>
<tr>
	<td width=130 valign=top>
		<table width=130 cellpadding=0 cellspacing=2 bgcolor="111111">
			%paperdoll%
		</table>
	</td>
	<td width=12></td>
	<td width=268 valign=top>
		<table width=268 cellpadding=0 cellspacing=0 bgcolor="1A1A1A">
			<tr><td height=8></td></tr>
			<tr><td align=center><font name="hs12" color="FFFFFF">%name%</font></td></tr>
			<tr><td height=6></td></tr>
			<tr><td align=center><font color="A0A0A0">Lv.</font> <font color="E6C35C">%level%</font></td></tr>
			<tr><td height=2></td></tr>
			<tr><td align=center><font color="A0A0A0">Class</font> <font color="FFFFFF">%class%</font></td></tr>
			<tr><td height=8></td></tr>
		</table>
		<br>
		<table width=268 cellpadding=3 cellspacing=0 bgcolor="111111">
			<tr><td><font color="LEVEL">Stats</font></td></tr>
		</table>
		<table width=268 cellpadding=3 cellspacing=0>
			<tr>
				<td width=44><font color="A0A0A0">STR</font></td><td width=45 align=right>%str%</td>
				<td width=44><font color="A0A0A0">&nbsp;DEX</font></td><td width=45 align=right>%dex%</td>
				<td width=44><font color="A0A0A0">&nbsp;CON</font></td><td width=45 align=right>%con%</td>
			</tr>
			<tr>
				<td width=44><font color="A0A0A0">INT</font></td><td width=45 align=right>%int%</td>
				<td width=44><font color="A0A0A0">&nbsp;WIT</font></td><td width=45 align=right>%wit%</td>
				<td width=44><font color="A0A0A0">&nbsp;MEN</font></td><td width=45 align=right>%men%</td>
			</tr>
		</table>
		<br>
		<center><button value="Refresh" action="bypass NpcViewMod fakeview %objectId%" width=90 height=25 back="L2UI_CT1.Button_DF_Calculator_Down" fore="L2UI_CT1.Button_DF_Calculator"></center>
	</td>
</tr>
</table>
<br>
<table width=410 cellpadding=3 cellspacing=0 bgcolor="111111">
	<tr><td><font color="LEVEL">Equipment</font></td></tr>
</table>
<table width=410 cellpadding=2 cellspacing=0>
	%equipment%
</table>
</center>
</body>
</html>
